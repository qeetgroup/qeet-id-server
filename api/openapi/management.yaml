  /v1/users/bulk/import:
    post:
      operationId: post_v1_users_bulk_import
      summary: Import users from an IdP export (Auth0 / Cognito / Azure AD B2C)
      description: >
        Migration tooling for teams leaving another identity provider: the
        request body is that vendor's own raw user-export file, converted to
        the same shape POST /v1/users/bulk accepts and run through the
        identical per-row partial-success pipeline. No vendor exports a
        portable password hash, so every imported row lands with no password
        credential — passkey, magic link, OTP, or an admin-triggered reset
        are how an imported user first signs in.
      tags:
