post:
  operationId: previewRetention
  summary: Preview ripe users
  tags:
    - Data Retention
  parameters:
    - $ref: ../../../shared/parameters/OrganizationID.yaml
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  description: >-
    Reports how many deleted users the retention policy would purge now, without
    purging them. Requires policy.read.
  responses:
    "201":
      description: Created
      content:
        application/json:
          schema:
            type: object
            required:
              - deleted_users_days
              - ripe_deleted_users
            properties:
              deleted_users_days:
                type: integer
              ripe_deleted_users:
                type: integer
    "400":
      $ref: ../../../shared/responses/BadRequest.yaml
    "401":
      $ref: ../../../shared/responses/Unauthorized.yaml
    "403":
      $ref: ../../../shared/responses/Forbidden.yaml
    "404":
      $ref: ../../../shared/responses/NotFound.yaml
    "422":
      $ref: ../../../shared/responses/Unprocessable.yaml
    "429":
      $ref: ../../../shared/responses/TooManyRequests.yaml
