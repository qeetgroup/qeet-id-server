post:
  operationId: confirmTotpEnrollment
  summary: Confirm TOTP enrollment
  tags:
    - MFA
  security:
    - bearerAuth: []
  requestBody:
    required: false
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/confirmEnrollInput.yaml
  description: >-
    Completes adding an authenticator app with a code from it, and returns the
    recovery codes. The account holder is emailed that it happened, with what to
    do if it wasn't them.
  responses:
    '201':
      description: Created
      headers:
        Cache-Control:
          $ref: ../../../shared/headers/NoStoreCacheControl.yaml
        Pragma:
          $ref: ../../../shared/headers/NoStorePragma.yaml
      content:
        application/json:
          schema:
            type: object
            required:
              - recovery_codes
              - warning
            properties:
              recovery_codes:
                type: array
                items:
                  type: string
              warning:
                type: string
    '401':
      $ref: ../../../shared/responses/Unauthorized.yaml
    '403':
      $ref: ../../../shared/responses/Forbidden.yaml
    '404':
      $ref: ../../../shared/responses/NotFound.yaml
    '422':
      $ref: ../../../shared/responses/Unprocessable.yaml
    '429':
      $ref: ../../../shared/responses/TooManyRequests.yaml
    '503':
      $ref: ../../../shared/responses/Overloaded.yaml
