post:
  operationId: startTotpEnrollment
  summary: Start TOTP enrollment
  tags:
    - MFA
  security:
    - bearerAuth: []
  requestBody:
    required: false
    content:
      application/json:
        schema:
          type: object
          additionalProperties: false
          properties:
            account:
              type:
                - string
                - "null"
              description: >-
                The account name the authenticator app shows; the signed-in
                subject when omitted.
  description: >-
    Starts setting up an authenticator app and returns its secret. While the
    account holds a confirmed app, this needs a step-up of the calling session
    (403 step_up_required otherwise), and the new app waits beside the confirmed
    one: the confirmed app keeps working until a code from the new one confirms
    it at /v1/mfa/totp/enroll/confirm, and a setup not confirmed within 30
    minutes is ignored. A first setup needs no step-up.
  responses:
    "200":
      description: OK
      headers:
        Cache-Control:
          $ref: ../../../shared/headers/NoStoreCacheControl.yaml
        Pragma:
          $ref: ../../../shared/headers/NoStorePragma.yaml
      content:
        application/json:
          schema:
            type: object
            properties:
              secret:
                type: string
              provisioning_url:
                type: string
              replacing:
                type: boolean
                description: >-
                  The account holds a confirmed app, which keeps working until
                  this one is confirmed.
    "400":
      $ref: ../../../shared/responses/BadRequest.yaml
    "401":
      $ref: ../../../shared/responses/Unauthorized.yaml
    "403":
      $ref: ../../../shared/responses/Forbidden.yaml
    "404":
      $ref: ../../../shared/responses/NotFound.yaml
    "413":
      $ref: ../../../shared/responses/PayloadTooLarge.yaml
    "422":
      $ref: ../../../shared/responses/Unprocessable.yaml
    "429":
      $ref: ../../../shared/responses/TooManyRequests.yaml
