get:
  operationId: listWebhookDeliveries
  description: >-
    Lists recent delivery attempts for a webhook, including status and response
    codes, for debugging failures. Retry a failed one with the retry-delivery
    endpoint. While the organization's plan does not include webhooks (one that
    has lapsed since the webhook was set up), deliveries are dead-lettered
    unsent, with error "not sent: the organization's plan does not include
    webhooks"; once paid again they can be retried.
  summary: List deliveries
  tags:
    - Webhooks
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    - name: cursor
      in: query
      required: false
      description: The previous page's next_cursor.
      schema:
        type: string
    - name: status
      in: query
      required: false
      description: delivered, pending (not tried yet), retrying or dead (given up).
      schema:
        type: string
        enum:
          - delivered
          - pending
          - retrying
          - dead
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  responses:
    "200":
      description: A page of deliveries, newest first
      content:
        application/json:
          schema:
            type: object
            properties:
              items:
                type: array
                items:
                  $ref: ../../components/schemas/WebhookDelivery.yaml
              next_cursor:
                type: string
                description: Present when there is another page.
    "400":
      $ref: ../../../shared/responses/BadRequest.yaml
    "401":
      $ref: ../../../shared/responses/Unauthorized.yaml
    "403":
      $ref: ../../../shared/responses/Forbidden.yaml
