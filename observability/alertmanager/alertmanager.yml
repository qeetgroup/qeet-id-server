# Alertmanager for the local stack: every alert is emailed to Mailpit (http://localhost:8025), grouped
# per alert and repeated every 4h while it fires. Production routes to the on-call tool instead.
route:
  receiver: mailpit
  group_by: [alertname, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: mailpit
    email_configs:
      - to: oncall@qeet.local
        from: alertmanager@qeet.local
        smarthost: mailpit:1025
        require_tls: false
        send_resolved: true

inhibit_rules:
  # While the target is down, its other alerts say nothing new.
  - source_matchers: [alertname = QeetIdTargetDown]
    target_matchers: [severity = warning]
