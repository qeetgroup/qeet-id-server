        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: post_v1_tenants_ByTenantID_oidc_resources
      summary: Register a resource
      description: 'Registers a resource: identifier is an absolute URI without a fragment (422 oidc.resource_invalid), unique on the platform (409 oidc.resource_exists) and not on a domain another organization has verified (409 oidc.resource_domain_taken); server_client_id, optional, must be one of the organisation''s applications. Audited as oidc.resource_registered. Every organization''s tokens share one issuer, so a resource server should also check the token''s tenant_id claim is its own organization.'
      tags:
        - OIDC
      parameters:
        - name: tenantID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - identifier
              properties:
                identifier:
                  type: string
                  format: uri
                name:
                  type: string
                server_client_id:
                  type: string
      responses:
        '201':
          description: Registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OIDCResource'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
