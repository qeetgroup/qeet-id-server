  /v1/tenants/{tenantID}/saml/{id}/group-mappings:
    get:
      operationId: get_v1_tenants_ByTenantID_saml_ById_group_mappings
      summary: List group mappings
      description: 'Lists the group mappings of an inbound SAML connection in the tenant. Each maps a group the connection''s IdP asserts (idp_group, compared ignoring case) to one of the organisation''s groups. At every sign-in through the connection the person joins the groups their asserted groups reach, through these mappings or as the external id of a group SCIM provisioned, and leaves the groups the connection''s sign-ins put them in that they no longer reach; the groups are read from the connection''s groups_attribute. A membership an administrator or SCIM made is never changed, and a group whose roles carry the owner role or an administrative permission (user.write, role.write, group.write, connection.write, policy.write or tenant.write) is never joined: sign-in takes out anyone it put there. Requires connection.read; an unknown connection, or another organisation''s, answers 404.'
      tags:
        - SAML
      parameters:
        - name: tenantID
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        '200':
          description: The connection's group mappings
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/SSOGroupMapping'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
