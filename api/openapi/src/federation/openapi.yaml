openapi: 3.1.0
info:
  title: Qeet ID — Federation API (OIDC/SAML/SCIM/LDAP/Social)
  version: 0.2.0
  description: >-
    OAuth 2.0 / OIDC provider, social login, SAML, LDAP, and SCIM for Qeet ID.


    ## Start here


    Qeet ID federates in both directions — know which role applies:


    - **Qeet ID → your app:** OIDC provider and SAML **Identity Provider**.

    - **External IdP → Qeet ID:** SAML **Service Provider**, **OpenID Connect
    relying party** for an organization's own provider, **LDAP** client, and
    **OAuth client** for social logins.

    - **External IdP → Qeet ID (provisioning):** **SCIM** server.


    ## One OAuth token endpoint


    `POST /v1/oauth/token`, which discovery advertises as the `token_endpoint`,
    serves every grant, chosen by `grant_type`: authorization_code,
    refresh_token, device_code, token-exchange and CIBA for applications, and
    client_credentials for service principals and AI agents.


    ## Path prefixes


    Discovery (`/.well-known/*`), `/oauth/revoke`, `/oauth/introspect`,
    `/scim/v2/*`, `/saml/*`, and `/ldap/*` are mounted at the **root**, not
    under `/v1`. Interactive OAuth endpoints (`/v1/oauth/*`) are under `/v1`.


    ## Authentication


    Auth modes: `bearerAuth` (user/service JWT), `apiKeyAuth` (`Authorization:
    ApiKey <key>` — legacy scheme), `scimBearer` (per-organization SCIM token),
    `clientCredentials` (OAuth M2M), and `ssoCookie` (hosted-login SSO session).
    CSRF protection applies only to cookie sessions (`ssoCookie`): requests
    authorised by `bearerAuth` or `apiKeyAuth` bypass it, as do the
    token endpoint (POST /v1/oauth/token) and the directory
    sign-in (POST /ldap/{id}/authenticate), which carry their credentials in the
    request. Basic credentials do not bypass it. A request that fails the check
    is refused with 403 `csrf_failed`.


    The responses of the token endpoint, device and back-channel
    authorization, the consent decision (an authorization code), directory
    sign-in, social, SAML and OpenID Connect connection code exchange, the SAML
    IdP's sign-on page (a signed assertion), and of the operations returning a
    new client secret, service-principal credential, SCIM token or admin-portal
    link, are sent with `Cache-Control: no-store` and `Pragma: no-cache`.


    Every response carries an `X-Request-Id` header naming the request; quote it
    when reporting a problem. An error body repeats it as `error.request_id`.
    A path with an encoded slash or backslash (`%2F`, `%5C`) is refused with
    400 `bad_request`.


    ## Related APIs


    - **Authentication & Access API** — login, passkeys, MFA, authorization

    - **Identity Management API** — organizations, users, groups, invitations

    - **Developer API** — API keys, agents, webhooks, vaults

    - **Operations API** — audit, analytics, billing


    ## Contract maintenance


    This document covers routes mounted by internal/bootstrap/router.go.
    internal/bootstrap/openapi_coverage_test.go walks the production mount
    helpers and fails when a mounted operation is undocumented, a documented
    operation is stale, or API-auth security declarations disagree with runtime
    classification.
servers:
  - url: https://api.id.qeet.in
    description: Production
  - url: http://localhost:4001
    description: Local (make dev)
tags:
  - name: OIDC
    description: >-
      OpenID Connect / OAuth 2.0 provider: discovery, authorize, token,
      userinfo, clients, grants, revocation, introspection, RP-initiated logout,
      and machine-to-machine service principals.
  - name: Social
    description: Social/OAuth identity-provider login and account linking.
  - name: SAML
    description: >-
      SAML 2.0 SSO — Qeet as Service Provider (consuming external IdPs) and as
      Identity Provider (serving downstream SPs).
  - name: OIDC Connections
    description: >-
      An organization's own OpenID Connect identity provider (Microsoft Entra
      ID, Okta, Google Workspace and the like), with Qeet as the relying party:
      connection management and the browser sign-in.
  - name: LDAP
    description: LDAP / Active Directory connection management and bind authentication.
  - name: Directory
    description: Organization-scoped directory connection inventory and synchronization metadata.
  - name: SCIM
    description: >-
      SCIM 2.0 user/group provisioning (per-organization bearer token presented by the
      IdP) plus organization-admin token management. The /scim/v2 surface returns the
      RFC 7644 error envelope, not the standard Qeet error shape. Every /scim/v2
      request needs an organization whose plan includes SCIM, not only the
      token's issue: a token issued on a plan that has since lapsed is answered
      403 in that envelope.
  - name: Admin Portal
    description: >-
      A unique, time-limited, capability-scoped link an organization admin can hand to
      their own IT admin — no Qeet ID account required — to configure the
      organization's SAML connection and test it, roll its SCIM token, or verify its
      domains directly.
