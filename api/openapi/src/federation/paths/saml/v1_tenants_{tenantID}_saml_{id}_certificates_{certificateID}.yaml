delete:
  operationId: removeSamlCertificate
  summary: Remove IdP certificate
  description: >-
    Stops the connection trusting one of its IdP signing certificates, such as
    the old one once the IdP has rolled over to its next. The connection's last
    certificate can't be removed (409 saml.certificate_last); idp_certificate
    becomes the oldest one left. Audited; another organisation's connection
    answers 404.
  tags:
    - SAML
  parameters:
    - $ref: ../../../shared/parameters/TenantID.yaml
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: certificateID
      in: path
      required: true
      schema:
        type: string
        format: uuid
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  responses:
    '204':
      description: Certificate removed
    '400':
      $ref: ../../../shared/responses/BadRequest.yaml
    '401':
      $ref: ../../../shared/responses/Unauthorized.yaml
    '403':
      $ref: ../../../shared/responses/Forbidden.yaml
    '404':
      $ref: ../../../shared/responses/NotFound.yaml
    '409':
      $ref: ../../../shared/responses/Conflict.yaml
