get:
  operationId: endSession
  description: >-
    Performs OpenID Connect RP-initiated logout: ends the hosted-login SSO
    session behind the qe_ls cookie and what it started — the refresh grants
    applications received through it are revoked and its unredeemed
    authorization codes can no longer be redeemed — and clears the cookie. Only
    the cookie identifies the session to end; without it nothing is ended. The
    sign-out is recorded in the audit log (auth.signed_out), naming client_id
    when it is a registered application. When the client supplies a registered
    post_logout_redirect_uri the browser is redirected there with any provided
    state; otherwise the hosted logged-out page is shown. Other browsers and API
    sessions are unaffected. Advertised as end_session_endpoint in discovery; a
    POST variant exists at the same path for relying parties that submit the
    request as a form. A sign-out must carry an id_token_hint (one of our ID
    tokens, expired or not, issued to client_id and naming this session and
    person; another session's is refused with 400 invalid_request) or a
    logout_confirmation ticket: without either, the browser is sent to the
    hosted login's /sign-out page to confirm, with a ticket that brings it back,
    so a plain link or image can't sign anyone out. Every application that holds
    a code or grant from the ended session is told: a signed logout token
    (OpenID Connect Back-Channel Logout 1.0, with sid) is POSTed to its
    backchannel_logout_uri and retried with backoff, a final failure audited as
    oidc.backchannel_logout_failed; its frontchannel_logout_uri (with iss and
    sid) is given to the hosted signed-out page, which then continues to the
    post_logout_redirect_uri through /v1/oauth/logout/continue. Audited as
    oidc.sign_out_notified.
  summary: RP-initiated logout
  tags:
    - OIDC
  parameters:
    - in: query
      name: client_id
      description: >-
        The application asking for the sign-out. Required for
        post_logout_redirect_uri to be honoured, and recorded with the sign-out
        when registered.
      schema:
        type: string
    - in: query
      name: id_token_hint
      schema:
        type: string
    - in: query
      name: post_logout_redirect_uri
      schema:
        type: string
        format: uri
    - in: query
      name: state
      schema:
        type: string
  security:
    - ssoCookie: []
  responses:
    '302':
      description: Redirect to post_logout_redirect_uri
    '400':
      $ref: ../../../shared/responses/BadRequest.yaml
post:
  operationId: endSessionWithPost
  description: >-
    Identical to GET /v1/oauth/logout for relying parties that issue the logout
    request as a POST: it ends the hosted-login SSO session and the application
    grants and unredeemed codes it started, clears the cookie, then redirects to
    a registered post_logout_redirect_uri with state when supplied, or to the
    hosted logged-out page. Advertised as end_session_endpoint in discovery.
  summary: RP-initiated logout
  tags:
    - OIDC
  parameters:
    - in: query
      name: client_id
      description: >-
        The application asking for the sign-out. Required for
        post_logout_redirect_uri to be honoured, and recorded with the sign-out
        when registered.
      schema:
        type: string
    - in: query
      name: id_token_hint
      schema:
        type: string
    - in: query
      name: post_logout_redirect_uri
      schema:
        type: string
        format: uri
    - in: query
      name: state
      schema:
        type: string
  security:
    - ssoCookie: []
  requestBody:
    required: false
    content:
      application/x-www-form-urlencoded:
        schema:
          type: object
          properties:
            id_token_hint:
              type: string
            post_logout_redirect_uri:
              type: string
            client_id:
              type: string
            state:
              type: string
            logout_confirmation:
              type: string
  responses:
    '302':
      description: Redirect to post_logout_redirect_uri
    '400':
      $ref: ../../../shared/responses/BadRequest.yaml
