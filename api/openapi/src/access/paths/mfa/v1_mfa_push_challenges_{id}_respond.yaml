post:
  operationId: respondToPushChallenge
  description: >-
    Records the user's approval or denial of a push-MFA challenge, called by the
    enrolled device rather than the browser. It is authenticated by the
    device_token issued at registration together with the matching user_id, not
    a session credential, which is why no bearer token is required. Once
    recorded, the polling sign-in surface observes the outcome through the
    challenge-status call and proceeds or fails accordingly. An approval must
    carry the number shown where the request was asked for (the sign-in screen,
    or the step-up prompt); with another number the request is denied and the
    call answers 403 mfa.push_number_mismatch.
  summary: Approve or deny a push-MFA challenge
  tags:
    - MFA
  security: []
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: false
          required:
            - user_id
            - device_token
            - approved
          properties:
            user_id:
              type: string
              format: uuid
            device_token:
              type: string
              minLength: 1
            approved:
              type: boolean
            number:
              type:
                - integer
                - "null"
              minimum: 10
              maximum: 99
              description: >-
                The number shown where the request was asked for; required to
                approve.
  responses:
    "200":
      description: Challenge response recorded
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                enum:
                  - approved
                  - denied
    "400":
      $ref: ../../../shared/responses/BadRequest.yaml
    "401":
      $ref: ../../../shared/responses/Unauthorized.yaml
    "403":
      $ref: ../../../shared/responses/Forbidden.yaml
    "404":
      $ref: ../../../shared/responses/NotFound.yaml
    "413":
      $ref: ../../../shared/responses/PayloadTooLarge.yaml
    "429":
      $ref: ../../../shared/responses/TooManyRequests.yaml
