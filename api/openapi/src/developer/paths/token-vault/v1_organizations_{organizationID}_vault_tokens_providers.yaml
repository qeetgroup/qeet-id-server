post:
  operationId: registerTokenVaultProvider
  description: >-
    Registers a third-party OAuth provider so the Token Vault can store and
    transparently refresh users' access tokens for it. provider, client_id and
    client_secret are required (422 validation_failed, naming each field);
    authorize_url and token_url must be public http or https URLs (422
    tokenvault.provider_authorize_url_invalid and
    tokenvault.provider_token_url_invalid). Registering an existing provider
    again updates it, but while anyone is connected through it its
    authorize_url, token_url and client_id can't change (409
    tokenvault.provider_in_use), so their refresh tokens only ever go to the
    endpoint that issued them; the secret and scopes can. Delete the provider
    to disconnect everyone first.
  summary: Register a Token Vault OAuth2 provider
  tags:
    - Token Vault
  parameters:
    - $ref: ../../../shared/parameters/OrganizationID.yaml
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - provider
            - client_id
            - client_secret
            - authorize_url
            - token_url
          properties:
            provider:
              type: string
              description: >-
                A short key naming the third-party service, e.g. "slack",
                "github", "google", or any custom name.
            client_id:
              type: string
            client_secret:
              type: string
            authorize_url:
              type: string
              format: uri
            token_url:
              type: string
              format: uri
            scopes:
              type: string
    description: >-
      Registers (or updates) the OAuth2 endpoints + client credentials for one
      third-party provider, organization-wide.
  responses:
    '201':
      description: Created
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/TokenvaultProvider.yaml
    '401':
      $ref: ../../../shared/responses/Unauthorized.yaml
    '403':
      $ref: ../../../shared/responses/Forbidden.yaml
    '409':
      $ref: ../../../shared/responses/Conflict.yaml
    '422':
      $ref: ../../../shared/responses/Unprocessable.yaml
    '429':
      $ref: ../../../shared/responses/TooManyRequests.yaml
get:
  operationId: listTokenVaultProviders
  summary: List Token Vault providers
  tags:
    - Token Vault
  parameters:
    - $ref: ../../../shared/parameters/OrganizationID.yaml
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  description: Client secrets are never included in the response.
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            required:
              - items
            properties:
              truncated:
                $ref: ../../../shared/schemas/Truncated.yaml
              items:
                type: array
                items:
                  $ref: ../../components/schemas/TokenvaultProvider.yaml
    '401':
      $ref: ../../../shared/responses/Unauthorized.yaml
    '403':
      $ref: ../../../shared/responses/Forbidden.yaml
    '429':
      $ref: ../../../shared/responses/TooManyRequests.yaml
