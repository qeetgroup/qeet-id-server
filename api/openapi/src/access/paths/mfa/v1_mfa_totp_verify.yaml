post:
  operationId: verifyTotp
  summary: Verify TOTP
  tags:
    - MFA
  security:
    - bearerAuth: []
  requestBody:
    required: false
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/verifyInput.yaml
  description: >-
    Verifies a code from the caller's authenticator app, or a recovery code,
    stepping up the session.
  responses:
    "200":
      description: Created
      content:
        application/json:
          schema:
            type: object
            required:
              - verified
            properties:
              verified:
                type: boolean
    "400":
      $ref: ../../../shared/responses/BadRequest.yaml
    "401":
      $ref: ../../../shared/responses/Unauthorized.yaml
    "403":
      $ref: ../../../shared/responses/Forbidden.yaml
    "404":
      $ref: ../../../shared/responses/NotFound.yaml
    "413":
      $ref: ../../../shared/responses/PayloadTooLarge.yaml
    "422":
      $ref: ../../../shared/responses/Unprocessable.yaml
    "429":
      $ref: ../../../shared/responses/TooManyRequests.yaml
    "503":
      $ref: ../../../shared/responses/Overloaded.yaml
