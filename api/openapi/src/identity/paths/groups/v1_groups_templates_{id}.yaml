delete:
  operationId: deleteGroupTemplate
  summary: Delete a group template
  tags:
    - Groups
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  description: Removes the template. Groups already created from it are untouched.
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  responses:
    "204":
      description: OK
    "400":
      $ref: ../../../shared/responses/BadRequest.yaml
    "401":
      $ref: ../../../shared/responses/Unauthorized.yaml
    "403":
      $ref: ../../../shared/responses/Forbidden.yaml
    "404":
      $ref: ../../../shared/responses/NotFound.yaml
    "422":
      $ref: ../../../shared/responses/Unprocessable.yaml
    "429":
      $ref: ../../../shared/responses/TooManyRequests.yaml
