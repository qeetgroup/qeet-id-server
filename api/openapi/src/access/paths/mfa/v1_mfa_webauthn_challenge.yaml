post:
  operationId: challengeWebauthnFactor
  summary: WebAuthn 2FA challenge
  tags:
    - MFA
  security:
    - bearerAuth: []
  description: >-
    Starts a WebAuthn assertion ceremony over the authenticated user's existing
    passkey credentials, used as a second factor (no token is issued).
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            required:
              - publicKey
              - session_id
            properties:
              publicKey:
                $ref: ../../components/schemas/PublicKeyCredentialRequestOptions.yaml
              session_id:
                type: string
                format: uuid
    "401":
      $ref: ../../../shared/responses/Unauthorized.yaml
    "403":
      $ref: ../../../shared/responses/Forbidden.yaml
    "404":
      $ref: ../../../shared/responses/NotFound.yaml
    "422":
      $ref: ../../../shared/responses/Unprocessable.yaml
    "429":
      $ref: ../../../shared/responses/TooManyRequests.yaml
    "501":
      description: WebAuthn second factor not enabled
