get:
  operationId: listSuspendedUsers
  summary: List suspended users and review metrics
  description: >-
    Requires user.read. Tenant scope comes only from the authenticated
    principal. Includes owned accounts and tenant members; private suspension
    metadata is masked for accounts owned elsewhere, with can_manage=false.
    Historical unknown timestamps and risk are not inferred.
  tags:
    - Users
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  parameters:
    - name: q
      in: query
      schema:
        type: string
        maxLength: 200
    - name: reason
      in: query
      schema:
        type: string
    - name: source
      in: query
      schema:
        type: string
    - name: team
      in: query
      schema:
        type: string
        maxLength: 200
    - name: risk
      in: query
      schema:
        type: string
        enum:
          - unknown
          - low
          - medium
          - high
    - name: review
      in: query
      schema:
        type: string
        enum:
          - pending
          - reviewed
          - external
    - name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    - $ref: ../../../shared/parameters/Cursor.yaml
  responses:
    '200':
      description: >-
        Suspended users with scoped summary, reason/risk breakdowns and review
        queue
      content:
        application/json:
          schema:
            type: object
            properties:
              next_cursor:
                $ref: ../../../shared/schemas/NextCursor.yaml
              items:
                type: array
                items:
                  $ref: ../../components/schemas/SuspendedDirectoryUser.yaml
              total:
                type: integer
              limit:
                type: integer
              summary:
                type: object
                properties:
                  total:
                    type: integer
                  high_risk:
                    type: integer
                  policy:
                    type: integer
                  manual:
                    type: integer
                  pending:
                    type: integer
              reasons:
                type: array
                items:
                  type: object
                  properties:
                    key:
                      type: string
                    count:
                      type: integer
              risks:
                type: array
                items:
                  type: object
                  properties:
                    key:
                      type: string
                    count:
                      type: integer
              queue:
                type: array
                items:
                  $ref: ../../components/schemas/SuspendedDirectoryUser.yaml
              teams:
                type: array
                items:
                  type: string
    '400':
      description: Invalid filters
    '401':
      description: Authentication and tenant required
    '403':
      description: Missing user.read
