        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                note:
                  type:
                    - string
                    - "null"
                  maxLength: 500
                  description: Optional, up to 500 characters; the requester sees it.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Approved
          content:
