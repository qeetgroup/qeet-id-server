post:
  operationId: acceptInvite
  summary: Accept invite (public)
  tags:
    - Invites
  security: []
  requestBody:
    required: false
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/AcceptInput.yaml
  description: >-
    Creates the invited account and signs it in. Its address is not verified by
    this: the account proves it later with a code or link sent to it (its
    invitations inbox stays closed until then). The response is a token pair,
    or, where the organisation requires a second factor, the sign-in's challenge
    instead (mfa_required, mfa_token and, for an account with no factor yet,
    enrollment_required), met as at sign-in. Where the inviting organisation has
    password sign-in switched off, accepting with a password is refused with 403
    auth.method_disabled and nothing is created. An address on a domain another
    organisation has verified gets no new account here (409
    user.domain_managed_elsewhere): that organisation creates it, and the
    invitee then signs in and accepts as themselves.
  responses:
    '200':
      description: A token pair, or the second-factor challenge to complete first.
      headers:
        Cache-Control:
          $ref: ../../../shared/headers/NoStoreCacheControl.yaml
        Pragma:
          $ref: ../../../shared/headers/NoStorePragma.yaml
      content:
        application/json:
          schema:
            oneOf:
              - $ref: ../../../shared/schemas/TokenPair.yaml
              - $ref: ../../../shared/schemas/MFAChallenge.yaml
    '404':
      $ref: ../../../shared/responses/NotFound.yaml
    '422':
      $ref: ../../../shared/responses/Unprocessable.yaml
    '429':
      $ref: ../../../shared/responses/TooManyRequests.yaml
    '503':
      $ref: ../../../shared/responses/Overloaded.yaml
