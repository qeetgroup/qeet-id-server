        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: patch_v1_tenants_ByTenantID_oidc_clients_ById
      description: 'Applies a partial update to an OIDC client in the tenant; omitted fields are left unchanged. Changes are confined to the tenant in the path and are audited. Use the rotate-secret endpoint to change the client secret, which this endpoint does not accept or return. The edited client is held to the same rules as registration: supported grant types, valid redirect URIs, and no token exchange or CIBA for a public client. pkce_exempt_until sets (a date-time) or clears (null) a confidential application''s exemption from sending a PKCE code_challenge; it must end in the future and within 90 days, else 422 oidc.pkce_exemption_invalid, and a public application can''t have one.'
      summary: Update OIDC client
      tags:
        - OIDC
      parameters:
        - name: tenantID
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      security:
        - bearerAuth: []
        - apiKeyAuth: []
