post:
  operationId: cancelOrganizationDeletion
  description: >-
    Calls off the organization's scheduled deletion and returns the organization, audited as
    organization.deletion_cancelled. Requires organization.delete, and only a person who
    owns the organization may (403 organization.owner_only otherwise); 409
    organization.deletion_not_scheduled when none is.
  summary: Cancel organization deletion
  tags:
    - Organizations
  parameters:
    - $ref: ../../../shared/parameters/OrganizationID.yaml
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  responses:
    "200":
      description: Deletion cancelled
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/Organization.yaml
    "401":
      $ref: ../../../shared/responses/Unauthorized.yaml
    "403":
      $ref: ../../../shared/responses/Forbidden.yaml
    "404":
      $ref: ../../../shared/responses/NotFound.yaml
    "409":
      $ref: ../../../shared/responses/Conflict.yaml
