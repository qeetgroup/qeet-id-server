post:
  operationId: decommissionAgent
  summary: Decommission agent
  description: >-
    Permanently retire an agent (terminal). It can no longer mint tokens and is
    excluded from listings.
  tags:
    - Agents
  parameters:
    - $ref: ../../../shared/parameters/OrganizationID.yaml
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  responses:
    "200":
      description: New lifecycle status
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/AgentStatus.yaml
    "401":
      $ref: ../../../shared/responses/Unauthorized.yaml
    "403":
      $ref: ../../../shared/responses/Forbidden.yaml
    "404":
      $ref: ../../../shared/responses/NotFound.yaml
    "409":
      $ref: ../../../shared/responses/Conflict.yaml
