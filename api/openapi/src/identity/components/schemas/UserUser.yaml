type: object
required:
  - avatar_url
  - created_at
  - display_name
  - email
  - email_verified_at
  - id
  - metadata
  - phone
  - phone_verified_at
  - status
  - organization_id
  - updated_at
properties:
  avatar_url:
    type:
      - string
      - "null"
  created_at:
    type: string
    format: date-time
  display_name:
    type:
      - string
      - "null"
  email:
    type: string
  email_verified_at:
    type:
      - string
      - "null"
    format: date-time
  groups_count:
    type: integer
  id:
    type: string
    format: uuid
  last_seen_at:
    type: string
    format: date-time
  last_seen_ip:
    type: string
  metadata:
    type: object
    additionalProperties: true
  mfa_enabled:
    type: boolean
  phone:
    type:
      - string
      - "null"
  phone_verified_at:
    type:
      - string
      - "null"
    format: date-time
  roles:
    type: array
    items:
      type: string
  status:
    type: string
  organization_id:
    type: string
    format: uuid
  updated_at:
    type: string
    format: date-time
