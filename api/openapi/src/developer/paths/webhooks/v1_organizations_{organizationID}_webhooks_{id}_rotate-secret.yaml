post:
  operationId: rotateWebhookSecret
  summary: Rotate webhook secret
  tags:
    - Webhooks
  parameters:
    - $ref: ../../../shared/parameters/OrganizationID.yaml
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  description: >-
    Replaces the subscription's signing secret and returns the new one, shown
    only in this answer. The old secret goes on signing deliveries alongside the
    new one until previous_secret_expires_at (24 hours), so the receiver can
    switch without missing one; rotating again within that time ends the older
    secret's at once. Audited as webhook.secret_rotated. Requires webhook.write.
    Needs a recent step-up.
  responses:
    '200':
      description: OK
      headers:
        Cache-Control:
          $ref: ../../../shared/headers/NoStoreCacheControl.yaml
        Pragma:
          $ref: ../../../shared/headers/NoStorePragma.yaml
      content:
        application/json:
          schema:
            type: object
            required:
              - previous_secret_expires_at
              - secret
            properties:
              previous_secret_expires_at:
                type: string
                format: date-time
              secret:
                type: string
    '400':
      $ref: ../../../shared/responses/BadRequest.yaml
    '401':
      $ref: ../../../shared/responses/Unauthorized.yaml
    '403':
      $ref: ../../../shared/responses/Forbidden.yaml
    '404':
      $ref: ../../../shared/responses/NotFound.yaml
    '429':
      $ref: ../../../shared/responses/TooManyRequests.yaml
