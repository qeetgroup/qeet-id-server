post:
  operationId: suspendAgent
  summary: Suspend agent
  description: >-
    Move an agent to `suspended` (reversible). Its tokens are denied at authz
    within one request cycle.
  tags:
    - Agents
  parameters:
    - $ref: ../../../shared/parameters/TenantID.yaml
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  responses:
    '200':
      description: New lifecycle status
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/AgentStatus.yaml
    '401':
      $ref: ../../../shared/responses/Unauthorized.yaml
    '403':
      $ref: ../../../shared/responses/Forbidden.yaml
    '404':
      $ref: ../../../shared/responses/NotFound.yaml
    '409':
      $ref: ../../../shared/responses/Conflict.yaml
