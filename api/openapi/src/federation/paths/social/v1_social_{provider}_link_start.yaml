post:
  operationId: startSocialLink
  summary: Begin linking a provider to my account
  description: >-
    Authenticated "connect this provider" ceremony. Returns the provider
    authorize URL for the browser to navigate to. The callback never creates or
    switches accounts, and attaches nothing itself: it sends the browser back to
    the account page (/account/security) with a one-time link_code and the
    provider, and the identity is attached only when the account that began the
    link completes it at POST /v1/social/link/complete.
  tags:
    - Social
  parameters:
    - name: provider
      in: path
      required: true
      schema:
        type: string
  security:
    - bearerAuth: []
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              authorize_url:
                type: string
            required:
              - authorize_url
    '401':
      $ref: ../../../shared/responses/Unauthorized.yaml
    '404':
      $ref: ../../../shared/responses/NotFound.yaml
    '429':
      $ref: ../../../shared/responses/TooManyRequests.yaml
