delete:
  operationId: deleteScimGroup
  description: >-
    Deletes a provisioned group by id for the organization identified by the SCIM
    bearer token, with Qeet acting as the SCIM server. Mounted at the root under
    /scim/v2, not under /v1. Errors use the RFC 7644 SCIM error envelope rather
    than the standard Qeet error shape.
  summary: "[scim] Delete group"
  tags:
    - SCIM
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  security:
    - scimBearer: []
  responses:
    "204":
      description: Deleted
    "401":
      $ref: ../../components/responses/SCIMUnauthorized.yaml
    "403":
      $ref: ../../components/responses/SCIMForbidden.yaml
    "404":
      $ref: ../../components/responses/SCIMNotFound.yaml
    "429":
      $ref: ../../../shared/responses/TooManyRequests.yaml
get:
  operationId: getScimGroup
  description: >-
    Returns a single provisioned group by id for the organization identified by the
    SCIM bearer token, with Qeet acting as the SCIM server. Mounted at the root
    under /scim/v2, not under /v1. Errors use the RFC 7644 SCIM error envelope
    rather than the standard Qeet error shape.
  summary: "[scim] Get group"
  tags:
    - SCIM
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  security:
    - scimBearer: []
  responses:
    "200":
      description: Group
      content:
        application/scim+json:
          schema:
            $ref: ../../components/schemas/SCIMGroup.yaml
    "401":
      $ref: ../../components/responses/SCIMUnauthorized.yaml
    "403":
      $ref: ../../components/responses/SCIMForbidden.yaml
    "404":
      $ref: ../../components/responses/SCIMNotFound.yaml
    "429":
      $ref: ../../../shared/responses/TooManyRequests.yaml
patch:
  operationId: patchScimGroup
  description: >-
    Applies a SCIM PatchOp to a group, typically a membership add or remove or
    an attribute change, for the organization identified by the SCIM bearer token,
    with Qeet acting as the SCIM server. Mounted at the root under /scim/v2, not
    under /v1. Errors use the RFC 7644 SCIM error envelope, not the standard
    Qeet error shape. Adding someone holding no role to a group that carries one
    takes a seat; when the plan's seats are all taken the whole change is
    refused with 403 in that envelope and nothing changes.
  summary: "[scim] Patch group"
  tags:
    - SCIM
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  security:
    - scimBearer: []
  requestBody:
    required: true
    content:
      application/scim+json:
        schema:
          $ref: ../../components/schemas/SCIMPatchOp.yaml
  responses:
    "200":
      description: Patched
      content:
        application/scim+json:
          schema:
            $ref: ../../components/schemas/SCIMGroup.yaml
    "400":
      $ref: ../../components/responses/SCIMBadRequest.yaml
    "401":
      $ref: ../../components/responses/SCIMUnauthorized.yaml
    "403":
      $ref: ../../components/responses/SCIMForbidden.yaml
    "404":
      $ref: ../../components/responses/SCIMNotFound.yaml
    "409":
      $ref: ../../components/responses/SCIMConflict.yaml
    "429":
      $ref: ../../../shared/responses/TooManyRequests.yaml
put:
  operationId: replaceScimGroup
  description: >-
    Replaces a group's attributes wholesale with the supplied SCIM
    representation for the organization identified by the SCIM bearer token, with Qeet
    acting as the SCIM server. Use PATCH for incremental membership or attribute
    changes. Mounted at the root under /scim/v2; errors use the RFC 7644 SCIM
    error envelope, not the standard Qeet error shape. A member set that gives
    someone a first role, through the group's, beyond the plan's seats is
    refused with 403 in that envelope and nothing changes.
  summary: "[scim] Replace group"
  tags:
    - SCIM
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  security:
    - scimBearer: []
  requestBody:
    required: true
    content:
      application/scim+json:
        schema:
          $ref: ../../components/schemas/SCIMGroup.yaml
  responses:
    "200":
      description: Replaced
      content:
        application/scim+json:
          schema:
            $ref: ../../components/schemas/SCIMGroup.yaml
    "400":
      $ref: ../../components/responses/SCIMBadRequest.yaml
    "401":
      $ref: ../../components/responses/SCIMUnauthorized.yaml
    "403":
      $ref: ../../components/responses/SCIMForbidden.yaml
    "404":
      $ref: ../../components/responses/SCIMNotFound.yaml
    "409":
      $ref: ../../components/responses/SCIMConflict.yaml
    "429":
      $ref: ../../../shared/responses/TooManyRequests.yaml
