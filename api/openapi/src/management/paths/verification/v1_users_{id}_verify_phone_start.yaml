post:
  operationId: startPhoneVerification
  summary: Start phone verification
  description: >-
    Sends a 6-digit code to the number on file. Pass `phone` only to verify a
    different number. The number must be in E.164 form (422 validation_failed),
    SMS must be in the plan of the organization the session is in (402
    billing.upgrade_required; refused outright for a session in none), and an
    SMS provider must be set up (503 verification.delivery_unavailable). As for
    MFA codes, a code goes at most every 30 seconds, ten an hour to one person
    and five an hour to one number over every account (429
    verification.code_send_limited with retry_after, in seconds). A new code
    replaces the caller's earlier ones, and one the SMS provider refuses is
    withdrawn. Audited as phone.verification_started, with the number masked to
    its last three digits, in the audit trail of the organization the session
    is in.
  tags:
    - Verification
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  security:
    - bearerAuth: []
  requestBody:
    required: false
    content:
      application/json:
        schema:
          type: object
          properties:
            phone:
              type: string
              description: Optional; defaults to the user's phone on file. In E.164 form.
  responses:
    '200':
      description: Code sent; returns a confirmation message
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
    '401':
      $ref: ../../../shared/responses/Unauthorized.yaml
    '402':
      description: The plan of the organization the session is in does not include SMS.
    '403':
      $ref: ../../../shared/responses/Forbidden.yaml
    '404':
      $ref: ../../../shared/responses/NotFound.yaml
    '422':
      $ref: ../../../shared/responses/Unprocessable.yaml
    '429':
      $ref: ../../../shared/responses/TooManyRequests.yaml
    '503':
      description: No SMS provider is set up to deliver the code.
