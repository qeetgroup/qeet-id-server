  /v1/signup/passkey/begin:
    post:
      operationId: post_v1_signup_passkey_begin
      description: 'Starts the passwordless counterpart to email/password signup, returning the WebAuthn credential-creation options the authenticator needs to mint a passkey. No password is created and no user exists yet; the account is materialized only when the ceremony completes. Finish registration by returning the signed attestation to the passkey-signup finish call.'
      summary: Passkey-first signup begin (tenant-less)
      tags:
        - Passkeys
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                display_name:
                  type: string
        description: Starts a passwordless counterpart to POST /auth/signup — no password is created.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/signup/passkey/finish:
    post:
      operationId: post_v1_signup_passkey_finish
      description: 'Completes passwordless signup by verifying the authenticator attestation from the begin step and creating a tenant-less user with the new passkey as its founding credential. On success it returns a token pair; because the passkey is first-class, the account has no password and can both authenticate and satisfy MFA with the passkey alone. As with password signup, create a tenant through the Identity Management API before any tenant-scoped call, and the creator becomes the tenant owner.'
      summary: Passkey-first signup finish (tenant-less)
      tags:
        - Passkeys
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - session_id
                - credential
              properties:
                session_id:
                  type: string
                credential:
                  type: object
                  additionalProperties: true
                name:
                  type: string
        description: Verifies the attestation, creates the tenant-less user with the passkey as its founding credential, and returns a token pair.
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/register/passkey/begin:
    post:
      operationId: post_v1_register_passkey_begin
      description: 'Starts the passwordless counterpart to hosted tenant signup, returning the WebAuthn credential-creation options for a passkey scoped to the supplied tenant. It is gated by the tenant''s self-registration policy and is refused when self-registration is disabled. Finish the ceremony by returning the signed attestation to the tenant-scoped passkey-register finish call.'
      summary: Passkey-first signup begin (tenant-scoped hosted signup)
      tags:
        - Passkeys
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - tenant_id
                - email
              properties:
                tenant_id:
                  type: string
                email:
                  type: string
                display_name:
                  type: string
        description: Starts a passwordless counterpart to POST /auth/register — gated by the tenant's self_registration_enabled policy.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/register/passkey/finish:
    post:
      operationId: post_v1_register_passkey_finish
      description: 'Completes passwordless hosted signup by verifying the authenticator attestation and creating the user in the ceremony''s tenant with the passkey as its credential. On success it sets the hosted-login SSO cookie so the browser continues into the OAuth authorize and consent flow rather than returning bearer tokens. The account is passwordless and its passkey satisfies MFA on its own.'
      summary: Passkey-first signup finish (tenant-scoped hosted signup)
      tags:
        - Passkeys
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - session_id
                - credential
              properties:
                session_id:
                  type: string
                credential:
                  type: object
                  additionalProperties: true
                name:
                  type: string
        description: Verifies the attestation, creates the user in the ceremony's tenant, and sets the hosted-login SSO cookie.
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
