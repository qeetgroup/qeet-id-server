post:
  operationId: runRetention
  summary: Run purge now
  tags:
    - Data Retention
  parameters:
    - $ref: ../../../shared/parameters/OrganizationID.yaml
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  description: >-
    Purges the deleted users the retention policy has made ripe, now rather than
    at the next scheduled run, one at a time: a user whose deletion fails is
    skipped, left for the next run, and not counted in purged. Requires
    policy.write.
  responses:
    "201":
      description: Created
      content:
        application/json:
          schema:
            type: object
            required:
              - purged
            properties:
              purged:
                type: integer
    "400":
      $ref: ../../../shared/responses/BadRequest.yaml
    "401":
      $ref: ../../../shared/responses/Unauthorized.yaml
    "403":
      $ref: ../../../shared/responses/Forbidden.yaml
    "404":
      $ref: ../../../shared/responses/NotFound.yaml
    "422":
      $ref: ../../../shared/responses/Unprocessable.yaml
    "429":
      $ref: ../../../shared/responses/TooManyRequests.yaml
