post:
  operationId: consumeSamlAssertion
  description: >-
    The SAML Assertion Consumer Service for a specific connection, with Qeet
    acting as the Service Provider. It validates the external IdP's signed
    SAMLResponse and assertion (an EncryptedAssertion is decrypted with the
    connection's SP key first and must still be signed; signature by any of the
    certificates the connection trusts; conditions, allowing three minutes of
    clock difference with the IdP either way; and replay protection), provisions
    or resolves the user just-in-time, and redirects to the SPA callback with a
    one-time login code carried in the URL fragment. An answer to a sign-in
    request completes only in the browser that began it (holding the cookie the
    login call set): from another it spends the request and answers 403
    saml.other_browser, so a sign-in begun by someone else can't be completed in
    a victim's browser. An IdP-initiated answer, which answers no request, is
    accepted only where the connection allows those. The SPA then trades that
    code for tokens at POST /saml/exchange. Mounted at the root, not under /v1,
    and unauthenticated. An existing account is signed in only while this
    organization is its home, and one adopted by email must have a verified
    address or have been provisioned by the organization's directory (SCIM), and
    is then marked verified: another organization's account or a guest whose
    home is elsewhere is refused with 403 saml.user_organization_mismatch, an
    unverified one with 403 saml.account_unverified. A subject is linked to the
    connection that asserted it, so another connection asserting it doesn't sign
    it in. An address not yet linked is adopted or given an account only on a
    domain the organization has verified (the most specific verified domain
    decides, 403 saml.email_domain_unverified otherwise), and an account that
    owns the organization or holds any permission there but the reads
    organization.read, user.read, role.read, group.read, connection.read, apikey.read,
    webhook.read, billing.read, policy.read, audit.read and analytics.read is
    not adopted by its address (403 saml.account_administers):
    it keeps its own credentials. A new account is created only while the domain
    that manages the address has jit_enabled on; otherwise an address with no
    account is refused with 403 saml.jit_not_allowed and nothing is created.
    Existing members are adopted either way. Every sign-in then brings the
    account in step with the assertion, each change audited: its display name;
    its address, when the asserted one is on a domain the organization has
    verified, is no other account's, and the account doesn't administer the
    organization (recovery links sent to the old address then stop working); and
    its groups, as GET /v1/organizations/{organizationID}/saml/{id}/group-mappings
    describes. The organization's plan must include enterprise SSO when the
    assertion arrives, so a connection set up on a plan that has since lapsed
    signs no one in (402 billing.upgrade_required). A failure of a sign-in the
    hosted login began (its return_to stored with the request, named by the
    answer once it is bound to this browser, or else by this browser's binding
    cookie) redirects instead to the hosted login's /sign-in with a generic
    error (sso, or account_inactive for a suspended or deleted account) and the
    same return_to; the detail is logged, never shown.
  summary: "[acs] Assertion Consumer Service"
  tags:
    - SAML
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  security: []
  requestBody:
    required: true
    content:
      application/x-www-form-urlencoded:
        schema:
          type: object
          properties:
            SAMLResponse:
              type: string
            RelayState:
              type: string
  responses:
    "302":
      description: Signature-validated; redirect with a one-time login code
    "400":
      $ref: ../../../shared/responses/BadRequest.yaml
    "401":
      $ref: ../../../shared/responses/Unauthorized.yaml
    "402":
      description: >-
        The organization's plan does not include enterprise SSO
        (billing.upgrade_required).
