patch:
  operationId: updateLogSink
  description: >-
    Toggles whether the identified log sink actively forwards events, without
    deleting its configuration or resetting its position. Returns 404 when the
    sink does not exist for the organization. Re-enabling resumes forwarding from
    where the sink last left off.
  summary: Enable/disable sink
  tags:
    - Log Sinks
  parameters:
    - $ref: ../../../shared/parameters/OrganizationID.yaml
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            enabled:
              type: boolean
  responses:
    "200":
      description: Updated
    "401":
      $ref: ../../../shared/responses/Unauthorized.yaml
    "403":
      $ref: ../../../shared/responses/Forbidden.yaml
    "404":
      $ref: ../../../shared/responses/NotFound.yaml
delete:
  operationId: deleteLogSink
  description: >-
    Permanently removes the identified log sink and stops any further forwarding
    to its destination. Returns 404 when the sink does not exist for the organization.
    Stored credentials for the destination are discarded; already-delivered
    events are unaffected.
  summary: Delete sink
  tags:
    - Log Sinks
  parameters:
    - $ref: ../../../shared/parameters/OrganizationID.yaml
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  responses:
    "204":
      description: Removed
    "401":
      $ref: ../../../shared/responses/Unauthorized.yaml
    "403":
      $ref: ../../../shared/responses/Forbidden.yaml
    "404":
      $ref: ../../../shared/responses/NotFound.yaml
