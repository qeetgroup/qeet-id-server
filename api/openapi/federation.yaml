          example:
            - urn:ietf:params:scim:api:messages:2.0:ListResponse
        totalResults:
          type: integer
        startIndex:
          type: integer
        itemsPerPage:
          type: integer
        Resources:
          type: array
          items:
            type: object
            additionalProperties: true
    SCIMError:
      type: object
      description: An RFC 7644 §3.12 SCIM error.
      required:
        - schemas
        - status
      properties:
        schemas:
          type: array
          items:
            type: string
            enum:
              - urn:ietf:params:scim:api:messages:2.0:Error
        status:
          type: string
          example: "409"
        scimType:
          type: string
          example: uniqueness
        detail:
          type: string
    SCIMGroup:
      type: object
      required:
        - schemas
        - displayName
      properties:
        schemas:
          type: array
          items:
            type: string
          example:
            - urn:ietf:params:scim:schemas:core:2.0:Group
        id:
          type: string
        externalId:
          type: string
        displayName:
          type: string
        members:
          type: array
          items:
            type: object
            properties:
              value:
                type: string
                description: User id
              display:
                type: string
        meta:
          type: object
          additionalProperties: true
    SCIMPatchOp:
      type: object
      required:
        - schemas
        - Operations
      properties:
        schemas:
          type: array
          items:
            type: string
          example:
            - urn:ietf:params:scim:api:messages:2.0:PatchOp
        Operations:
          type: array
          items:
            type: object
            required:
              - op
            properties:
              op:
                type: string
                enum:
                  - add
                  - remove
                  - replace
              path:
                type: string
              value: {}
    SCIMUser:
      type: object
      required:
        - schemas
      properties:
        schemas:
          type: array
          items:
            type: string
          example:
            - urn:ietf:params:scim:schemas:core:2.0:User
        id:
          type: string
        externalId:
          type: string
        userName:
          type: string
        displayName:
          type: string
        active:
          type: boolean
        name:
          type: object
          properties:
            formatted:
              type: string
            givenName:
              type: string
            familyName:
              type: string
        emails:
          type: array
          items:
            type: object
            properties:
              value:
                type: string
              primary:
                type: boolean
              type:
                type: string
        meta:
          type: object
          additionalProperties: true
    ConfigView:
      type: object
      required:
        - created_at
        - last_request
        - last_used_at
        - provisioned_count
        - token_count
        - token_set
      properties:
        created_at:
          type:
            - string
            - "null"
          format: date-time
          description: When the newest working token was issued.
        last_used_at:
          type:
            - string
            - "null"
          format: date-time
          description: The latest use of any working token, recorded at most once a minute.
        provisioned_count:
          type: integer
        token_count:
          type: integer
          description: How many tokens work, rotated ones still in their overlap included.
        token_prefix:
          type: string
          description: The newest working token's prefix.
        token_set:
          type: boolean
          description: Whether any token works.
        last_request:
          type:
            - object
            - "null"
          description: How the last change the identity provider sent was answered; null before the first. Reads are not recorded.
          required:
            - at
            - operation
            - resource
            - http_status
            - status
          properties:
            at:
              type: string
              format: date-time
            operation:
              type: string
              enum:
                - post
                - put
                - patch
                - delete
            resource:
              type: string
              enum:
                - user
                - group
            http_status:
              type: integer
            status:
              type: string
              enum:
                - success
                - warning
                - failed
            error_code:
              type: string
              description: The directory error code, such as DIR-409.
            reason:
              type: string
              description: The SCIM error type the answer gave, such as scim.uniqueness or scim.invalidValue.
    SCIMToken:
      type: object
      description: A SCIM bearer token, without the token itself.
      required:
        - created_at
        - expires_at
        - id
        - last_used_at
        - name
        - replaced_by
        - revoked_at
        - status
        - token_prefix
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        token_prefix:
          type: string
          description: The token's first characters, to recognise it by.
        status:
          type: string
          enum:
            - active
            - rotated
            - expired
            - revoked
          description: "active: works. rotated: replaced, and works until expires_at, when its overlap ends. expired: past expires_at. revoked: revoked."
        created_at:
          type: string
          format: date-time
        expires_at:
          type:
            - string
            - "null"
          format: date-time
        last_used_at:
          type:
            - string
            - "null"
          format: date-time
          description: Recorded at most once a minute.
        revoked_at:
          type:
            - string
            - "null"
          format: date-time
        replaced_by:
          type:
            - string
            - "null"
          format: uuid
          description: The token that replaced this one when it was rotated.
    adminUser:
      type: object
      required:
        - created_at
        - display_name
