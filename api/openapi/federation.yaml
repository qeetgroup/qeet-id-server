      description: 'Lists the organisation''s OpenID Connect connections, through which its people sign in with its own identity provider (Microsoft Entra ID, Okta, Google Workspace and the like), with Qeet acting as the relying party. Scoped to the tenant in the path. Client secrets are never returned. Each connection carries the redirect_uri to register with the provider. Requires connection.read.'
      summary: List OIDC connections
      tags:
        - OIDC Connections
      parameters:
        - name: tenantID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        '200':
          description: Connections
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/OIDCConnection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: post_v1_tenants_ByTenantID_oidc_connections
      description: 'Creates an OpenID Connect connection in the organisation, a draft unless a status is given. The issuer must be an absolute https URL without a query or fragment (422 oidc_connection.issuer_invalid); the discovery document is read from discovery_url, or from the issuer''s /.well-known/openid-configuration when none is given (422 oidc_connection.discovery_url_invalid). The client secret is stored encrypted and never returned. Scopes default to openid, email and profile, and openid is always asked for (422 oidc_connection.scopes_invalid). allowed_idp_tenant_ids are the provider''s own tenant IDs (the tid claim, as Microsoft Entra ID issues it) a token must name: an Entra issuer that serves every organisation (common, organizations or consumers) is refused without them (422 oidc_connection.idp_tenant_ids_required), or anyone with a Microsoft account could sign in. claim_mapping names the claims read for the email address (required, default email), name, given and family names and groups. Missing fields answer 422 oidc_connection.fields_required, an unknown status 422 oidc_connection.status_invalid. The organisation''s plan must include single sign-on (402 billing.upgrade_required). Audited as oidc_connection.created. Requires connection.write. Needs a recent step-up.'
      summary: Create OIDC connection
      tags:
        - OIDC Connections
      parameters:
        - name: tenantID
          in: path
          required: true
          schema:
            type: string
            format: uuid
