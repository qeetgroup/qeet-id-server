get:
  operationId: getComplianceEvidence
  summary: Get compliance evidence run (full report)
  description: >-
    Returns the full evidence run including per-control results. Carries a
    Content-Disposition header so browsers treat it as a downloadable JSON
    evidence report. organization-scoped; 404 when the run belongs to a different
    organization.
  tags:
    - Compliance
  parameters:
    - $ref: ../../../shared/parameters/OrganizationID.yaml
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  responses:
    "200":
      description: Full evidence run with per-control results.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/EvidenceRun.yaml
    "401":
      $ref: ../../../shared/responses/Unauthorized.yaml
    "403":
      $ref: ../../../shared/responses/Forbidden.yaml
    "404":
      $ref: ../../../shared/responses/NotFound.yaml
