        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: post_v1_tenants_ByTenantID_admin_portal_links
      summary: Generate an admin portal link
      description: >-
        Mints a one-time link an external IT admin (no Qeet ID account) can exchange for a short-lived portal session, scoped to the given capabilities and expiring after ttl_seconds (clamped 15m-24h, default 1h). The raw token/url is returned exactly once; the URL carries the token only in its fragment.
      tags:
        - Admin Portal
      parameters:
        - name: tenantID
          in: path
          required: true
          schema:
            type: string
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - capabilities
              properties:
                capabilities:
                  type: array
                  items:
                    type: string
                    enum: [saml, scim]
                ttl_seconds:
                  type: integer
      responses:
        '201':
          description: Link generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  link:
                    $ref: '#/components/schemas/AdminPortalLink'
                  token:
                    type: string
                    description: The raw token — shown only here. Not recoverable afterward.
                  url:
                    type: string
                    format: uri
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
