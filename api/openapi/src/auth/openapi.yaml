openapi: 3.1.0
info:
  title: Qeet ID — Authentication & Access API
  version: 0.2.0
  description: >-
    Human authentication, passkeys, MFA, and authorization for Qeet ID.


    ## Start here


    1. Authenticate a user — password login, or passwordless **passkey** login.
    Passkeys are first-class: a user can exist with no password at all.

    2. Satisfy **MFA** if tenant policy or adaptive risk requires it. A
    registered passkey satisfies MFA on its own.

    3. Use the returned `Bearer` access token for authenticated calls.

    4. **Signup creates a tenant-less user.** Create a tenant via the Identity
    Management API before any tenant-scoped call — the creator becomes the
    tenant owner.

    5. Configure authorization: RBAC is the baseline; layer in ABAC, ReBAC, or
    AuthZEN as needed.


    ## Authentication


    Auth modes: `bearerAuth` (user/service JWT), `apiKeyAuth` (`Authorization:
    ApiKey <key>` — legacy scheme), `scimBearer` (per-tenant SCIM token),
    `clientCredentials` (OAuth M2M), and `ssoCookie` (hosted-login SSO session).
    CSRF protection applies only to cookie sessions (`ssoCookie`): requests
    authorised by `bearerAuth` or `apiKeyAuth` bypass it, as do the
    client-credentials token exchange (POST /v1/oauth/token) and the directory
    sign-in (POST /ldap/{id}/authenticate), which carry their credentials in the
    request. Basic credentials do not bypass it. A request that fails the check
    is refused with 403 `csrf_failed`.


    The responses of the sign-up, sign-in (password, MFA, magic link, passkey),
    refresh, tenant-switch, sign-out (hosted session, everywhere) and
    forgot-password operations, and of those returning a new authenticator
    secret, recovery codes, pairing code or device credential, are sent with
    `Cache-Control: no-store` and `Pragma: no-cache`.


    Every response carries an `X-Request-Id` header naming the request; quote it
    when reporting a problem. An error body repeats it as `error.request_id`.


    ## Related APIs


    - **Identity Management API** — tenants, users, groups, invitations

    - **Federation API** — OIDC/OAuth provider, SAML, SCIM, LDAP, social

    - **Developer API** — API keys, agents, webhooks, vaults

    - **Operations API** — audit, analytics, billing


    ## Contract maintenance


    This document covers routes mounted by internal/bootstrap/router.go.
    internal/bootstrap/openapi_coverage_test.go walks the production mount
    helpers and fails when a mounted operation is undocumented, a documented
    operation is stale, or API-auth security declarations disagree with runtime
    classification.
servers:
  - url: https://api.id.qeet.in
    description: Production
  - url: http://localhost:4001
    description: Local (make dev)
tags:
  - name: Auth
    description: Login, signup, refresh, sessions, hosted-login SSO cookie.
    externalDocs:
      description: Authentication guide
      url: https://docs.qeet.in/id/authentication
  - name: Passkeys
    description: >-
      WebAuthn passkey registration and passwordless login. A registered passkey
      also satisfies MFA on its own.
  - name: MFA
    description: TOTP and OTP (email/SMS) second factors plus recovery codes.
    externalDocs:
      description: MFA guide
      url: https://docs.qeet.in/id/mfa
  - name: RBAC
    description: Roles, permissions, assignments, and authorization checks.
  - name: ABAC
    description: >-
      Attribute-based access control — policy store (CRUD) and the PDP evaluate
      endpoint.
  - name: ReBAC
    description: >-
      Relationship-based access control — relationship tuples and graph-based
      permission checks.
  - name: AuthZEN
    description: >-
      OpenID AuthZEN core evaluation API — a spec-shaped facade over RBAC/ReBAC
      for external policy-enforcement points.
  - name: Auth Policy
    description: Per-tenant password rules and allowed login methods.
  - name: Policy
    description: Per-tenant security policy.
  - name: IP Rules
    description: Per-tenant IP allow/deny CIDR rules.
  - name: Threats
    description: >-
      Adaptive threat detection — bot telemetry, risk and bot settings, and
      login-anomaly review and resolution.
