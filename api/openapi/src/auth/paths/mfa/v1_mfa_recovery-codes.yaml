get:
  operationId: getRecoveryCodesStatus
  summary: Recovery codes status
  tags:
    - MFA
  security:
    - bearerAuth: []
  description: Reports how many of the caller's recovery codes are left.
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/RecoveryStatus.yaml
    "401":
      $ref: ../../../shared/responses/Unauthorized.yaml
    "403":
      $ref: ../../../shared/responses/Forbidden.yaml
    "404":
      $ref: ../../../shared/responses/NotFound.yaml
    "422":
      $ref: ../../../shared/responses/Unprocessable.yaml
    "429":
      $ref: ../../../shared/responses/TooManyRequests.yaml
