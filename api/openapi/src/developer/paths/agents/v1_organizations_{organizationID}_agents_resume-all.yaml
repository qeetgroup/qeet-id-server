post:
  operationId: resumeAllAgents
  summary: Resume all agents
  description: >-
    Makes every suspended agent of the organization active again in a single
    transaction, the undoing of suspend-all. Returns the number resumed.
    Requires apikey.write. Needs a recent step-up. Audited, and sent to
    webhooks, as agent.resume_all.
  tags:
    - Agents
  parameters:
    - $ref: ../../../shared/parameters/OrganizationID.yaml
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  responses:
    "200":
      description: Agents resumed
      content:
        application/json:
          schema:
            type: object
            properties:
              resumed:
                type: integer
    "400":
      $ref: ../../../shared/responses/BadRequest.yaml
    "401":
      $ref: ../../../shared/responses/Unauthorized.yaml
    "403":
      $ref: ../../../shared/responses/Forbidden.yaml
    "429":
      $ref: ../../../shared/responses/TooManyRequests.yaml
