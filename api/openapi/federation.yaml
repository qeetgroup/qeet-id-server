                        - reference
                        - type
                        - status
                        - health
                        - scope
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        reference:
                          type: string
                        type:
                          type: string
                          enum:
                            - scim
                            - ldap
                        status:
                          type: string
                          enum:
                            - configured
                            - active
                            - draft
                            - disabled
                        health:
                          type: string
                          enum:
                            - healthy
                            - warning
