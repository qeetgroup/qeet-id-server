version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - misspell
    - unused
    - ineffassign
    - errorlint
    - nilerr
    - bodyclose
    - sqlclosecheck
    - rowserrcheck
    - nolintlint
    - forbidigo
    - depguard
  settings:
    errcheck:
      # Close on read paths and Rollback after Commit have nothing actionable to report.
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
        - (github.com/jackc/pgx/v5.Tx).Rollback
        - (*github.com/go-ldap/ldap/v3.Conn).Close
        - (*net/smtp.Client).Close
    nolintlint:
      require-explanation: true
      require-specific: true
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^http\.(DefaultClient|Get|Post|Head)$
          pkg: ^net/http$
          msg: outbound calls must use an egress-guarded client
    depguard:
      rules:
        # R1: the platform layer must not depend on a bounded context or the wiring.
        platform:
          files:
            - "**/internal/platform/**"
          deny:
            - pkg: github.com/qeetgroup/qeet-id-server/internal/access
              desc: platform must not import a bounded context (R1)
            - pkg: github.com/qeetgroup/qeet-id-server/internal/identity
              desc: platform must not import a bounded context (R1)
            - pkg: github.com/qeetgroup/qeet-id-server/internal/federation
              desc: platform must not import a bounded context (R1)
            - pkg: github.com/qeetgroup/qeet-id-server/internal/developer
              desc: platform must not import a bounded context (R1)
            - pkg: github.com/qeetgroup/qeet-id-server/internal/operations
              desc: platform must not import a bounded context (R1)
            - pkg: github.com/qeetgroup/qeet-id-server/internal/bootstrap
              desc: wiring belongs in internal/bootstrap (R1)
            - pkg: github.com/qeetgroup/qeet-id-server/cmd
              desc: platform must not import a binary (R1)
        # R2: bounded contexts must not depend on the wiring or a binary.
        contexts:
          files:
            - "**/internal/access/**"
            - "**/internal/identity/**"
            - "**/internal/federation/**"
            - "**/internal/developer/**"
            - "**/internal/operations/**"
          deny:
            - pkg: github.com/qeetgroup/qeet-id-server/internal/bootstrap
              desc: wiring belongs in internal/bootstrap (R2)
            - pkg: github.com/qeetgroup/qeet-id-server/cmd
              desc: a bounded context must not import a binary (R2)
  exclusions:
    # Generated sqlc code.
    paths:
      - internal/.*/dbgen
    rules:
      - path: _test\.go
        linters: [errcheck, forbidigo]

formatters:
  enable:
    - gofmt
    - goimports
