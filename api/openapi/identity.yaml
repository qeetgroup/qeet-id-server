  /v1/users:
    get:
      operationId: listUsers
      description: "Returns a page of users in the caller's organization, with total, how many match. Every filter is optional and they combine: q (display name, email or phone, case-insensitive), role (a role name in the organization), department (metadata.department, of the organization's own people), mfa (on or off: a confirmed second factor), email_verified, status (active, invited or suspended), last_seen (today: under a day; week: 1 to 7 days; month: 7 to 30 days; older: over 30 days; never), admins_without_mfa (true: the members holding the built-in owner or admin role with no confirmed second factor, exactly those the summary's admins_without_mfa counts; false: everyone else), in_group (true: in at least one of the organization's groups; false: in none of them, whatever groups they are in elsewhere), id and email (each repeatable, up to 200: exactly the members named, an email in any case; with limit=200 one read puts a name to up to 200 people), include_deleted (true: also the members since deleted, so history can still name them, each marked with deleted_at and status deleted). sort is created (the default, newest first), name (by display name, or the email without one, case-insensitive; A first by default) or last_seen (most recent first by default; a member never seen comes last either way), with order asc or desc; a malformed value is refused with 400. Pages by opaque cursor in every order, stable when sort keys tie: next_cursor is present while there is another page, and a cursor works only with the sort and order of the page that gave it (400 otherwise). Requires an existing organization; scope comes from the authenticated principal. Members are the organization's own users (their home is this organization) and the people who hold a role in it; a member whose home is another organization is shown with empty metadata, which their home organization keeps; last_seen_at and last_seen_ip come from sessions in this organization only."
      summary: List users
      tags:
        - Users
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
        - name: role
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
        - name: department
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
        - name: mfa
          in: query
          required: false
          schema:
            type: string
            enum:
              - "on"
              - "off"
        - name: email_verified
          in: query
          required: false
          schema:
            type: boolean
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - active
              - invited
              - suspended
        - name: last_seen
          in: query
          required: false
          schema:
            type: string
            enum:
              - today
              - week
              - month
              - older
              - never
        - name: admins_without_mfa
          in: query
          required: false
          description: "true: only the members holding the built-in owner or admin role with no confirmed second factor; false: everyone else."
          schema:
            type: boolean
        - name: in_group
          in: query
          required: false
          description: "true: only the members in at least one of the organization's groups; false: only those in none of them."
          schema:
            type: boolean
        - name: id
          in: query
          required: false
          description: Only these members, by id. Repeat it, up to 200 times (id=a&id=b); another organization's people are never answered.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 200
            items:
              type: string
              format: uuid
        - name: email
          in: query
          required: false
          description: Only these members, by email, exactly but in any case. Repeat it, up to 200 times.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 200
            items:
              type: string
              minLength: 1
              maxLength: 320
        - name: include_deleted
          in: query
          required: false
          description: "true: the members since deleted too (the organization's own people it deleted, and anyone deleted who still holds one of its roles), each with deleted_at and status deleted."
          schema:
            type: boolean
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum:
              - created
              - name
              - last_seen
        - name: order
          in: query
          required: false
          schema:
            type: string
            enum:
              - asc
              - desc
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        "200":
          description: User page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      operationId: createUser
      description: "Creates a user within the caller's organization. An initial password may be supplied, otherwise the account is created without a password credential and the user signs in via passkey, magic link, or an admin-triggered reset. The password must meet the organization's password rules (minimum length and required character classes), the offline strength baseline and, when enabled, the breached-password check; a refusal is a 422 naming the rule that failed (authpolicy.password_* or auth.password_weak). A refused password writes nothing. An address on a domain another organization has verified is refused with 409 user.domain_managed_elsewhere: only that organization creates accounts there. Requires an existing organization. Send an Idempotency-Key header to retry it safely: a retry with the same key and body within 24 hours gets the first answer, marked Idempotent-Replayed: true; the same key with another body answers 422 idempotency.key_reused, one still being processed 409 idempotency.in_progress, and one whose first request stopped before answering 409 idempotency.outcome_unknown: check whether it took effect, then retry with a new key."
      summary: Create user
      tags:
        - Users
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            example:
              organization_id: 018f2a6c-9c3d-7e4a-b2f1-3a5c9d8e1f00
              email: grace@example.com
              display_name: Grace Hopper
            schema:
              $ref: "#/components/schemas/UserCreate"
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: Created
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              example:
                id: 018f2a73-4e5f-7a6b-8c7d-8e9f0a1b2c3d
                organization_id: 018f2a6c-9c3d-7e4a-b2f1-3a5c9d8e1f00
                email: grace@example.com
                email_verified_at: null
                phone: null
                phone_verified_at: null
                display_name: Grace Hopper
                avatar_url: null
                status: active
                metadata: {}
                created_at: "2026-09-24T10:20:00Z"
                updated_at: "2026-09-24T10:20:00Z"
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Overloaded"
