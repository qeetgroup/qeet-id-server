delete:
  operationId: resetUserMfa
  summary: Admin reset user MFA
  description: >-
    Account-recovery for a locked-out user, which also lifts a lock of their
    second-factor sign-in (403 mfa.locked). Requires the `user.credentials`
    permission; audited as `mfa.admin_reset`. Refused with 403
    user.credentials_shared, and nothing changes, when the account also belongs
    to another organization: its password and second factors are the person's
    credentials there too, so only they change them (the password reset link
    reaches only their address). Otherwise the person is emailed that an
    administrator of this organization made the change. The person must not
    outrank the caller: only an owner changes an owner (403
    rbac.target_is_owner), and the caller must hold every permission the person
    holds here (403 rbac.target_outranks_caller naming one); acting on yourself
    is allowed.
  tags:
    - Users
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  responses:
    "200":
      description: MFA reset; returns a confirmation message
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
    "400":
      $ref: ../../../shared/responses/BadRequest.yaml
    "401":
      $ref: ../../../shared/responses/Unauthorized.yaml
    "403":
      $ref: ../../../shared/responses/Forbidden.yaml
    "404":
      $ref: ../../../shared/responses/NotFound.yaml
