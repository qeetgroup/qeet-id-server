type: object
properties:
  display_name:
    type:
      - string
      - 'null'
    maxLength: 200
  avatar_url:
    type:
      - string
      - 'null'
    maxLength: 300000
    description: A data:image/ URL, or an empty string to clear the picture.
  phone:
    type:
      - string
      - 'null'
  status:
    type: string
    enum:
      - active
      - suspended
  metadata:
    type: object
    additionalProperties: true
