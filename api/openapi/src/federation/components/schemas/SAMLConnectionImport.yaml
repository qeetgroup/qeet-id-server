type: object
additionalProperties: false
required:
  - name
properties:
  name:
    type: string
    minLength: 1
  metadata_url:
    type:
      - string
      - "null"
    format: uri
    description: >-
      Where to fetch the IdP's metadata from, and refresh it from later. Give
      this or metadata_xml.
  metadata_xml:
    type:
      - string
      - "null"
    description: The IdP's SAML 2.0 metadata document. Give this or metadata_url.
  idp_entity_id:
    type:
      - string
      - "null"
    description: The entity id of the IdP to use, when the metadata describes several.
  email_attribute:
    type:
      - string
      - "null"
  name_attribute:
    type:
      - string
      - "null"
  groups_attribute:
    type:
      - string
      - "null"
    description: >-
      The assertion attribute carrying a person's groups; empty reads the common
      ones.
  status:
    type:
      - string
      - "null"
