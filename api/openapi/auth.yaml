  /v1/tenants/{tenantID}/ip-rules/config:
    put:
      operationId: put_v1_tenants_ByTenantID_ip_rules_config
      summary: Set enforcement
      tags:
        - IP Rules
      parameters:
        - name: tenantID
          in: path
          required: true
          schema:
            type: string
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
        description: Request body summarized; see the handler for exact fields.
      description: >-
        Turns the organisation's address rules on or off ({"enabled": bool}).
        While they are on, every sign-in to the organisation (password,
        passkey, magic link, social, SAML, LDAP, invitation, organisation
        switch, application authorization, device approval and the device's
        token collection) and every session renewal asks them first. An address
        is refused when a deny rule matches it, or when allow rules exist and
        none matches; deny wins. An address that can't be read is refused. A
        refusal answers 403 auth.address_not_allowed (access_denied to an
        application), names no rule, and is audited as auth.address_refused
        with the rule responsible, the address and the path. Off, nothing is
        checked. Switching them on is refused with 409
        risk.rules_lock_out_caller when they would refuse the address the
        request comes from (as are adding or removing a rule while they are on,
        when the result would), so an admin can't lock themselves out; the
        console calls from its own server, so its address must stay allowed.
        Switching them off always works.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
