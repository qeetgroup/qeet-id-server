get:
  operationId: listAccessRequests
  summary: List an organisation's access requests
  description: >-
    The organisation's requests for a role, newest first, optionally of one
    status, with how many are waiting. Needs role.read.
  tags:
    - RBAC
  parameters:
    - $ref: ../../../shared/parameters/TenantID.yaml
    - name: status
      in: query
      required: false
      description: Only requests with this status.
      schema:
        type: string
        enum:
          - pending
          - approved
          - denied
          - cancelled
          - expired
    - name: limit
      in: query
      required: false
      description: At most this many, 1 to 200 (100 by default).
      schema:
        type: integer
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            required:
              - access_requests
              - pending
            properties:
              access_requests:
                type: array
                items:
                  $ref: ../../components/schemas/AccessRequest.yaml
              pending:
                type: integer
                description: How many of the organisation's requests are waiting.
    '400':
      $ref: ../../../shared/responses/BadRequest.yaml
    '401':
      $ref: ../../../shared/responses/Unauthorized.yaml
    '403':
      $ref: ../../../shared/responses/Forbidden.yaml
