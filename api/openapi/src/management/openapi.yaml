openapi: 3.1.0
info:
  title: Qeet ID — Identity Management API
  version: 0.2.0
  description: >-
    Tenants, domains, users, groups, and invitations for Qeet ID.


    ## Start here — the tenant lifecycle


    1. A newly registered user has **no tenant**. Create one with `POST
    /v1/tenants`; the caller becomes the tenant **owner**.

    2. (Optional) Prove control of a domain under **Domains** to unlock
    domain-based features.

    3. Add and manage users, organize them into groups, and invite teammates.


    The `register → tenant-less user → create tenant → owner` sequence is the
    most common early surprise: authentication happens in the Authentication &
    Access API; tenant creation happens here.


    ## Authentication


    Auth modes: `bearerAuth` (user/service JWT), `apiKeyAuth` (`Authorization:
    ApiKey <key>` — legacy scheme), `scimBearer` (per-tenant SCIM token),
    `clientCredentials` (OAuth M2M), and `ssoCookie` (hosted-login SSO session).
    CSRF protection applies only to cookie sessions (`ssoCookie`): requests
    authorised by `bearerAuth` or `apiKeyAuth` bypass it, as do the
    client-credentials token exchange (POST /v1/oauth/token) and the directory
    sign-in (POST /ldap/{id}/authenticate), which carry their credentials in the
    request. Basic credentials do not bypass it. A request that fails the check
    is refused with 403 `csrf_failed`.


    The responses of tenant creation and invitation acceptance, including
    accepting with an existing account (sign-in tokens), are sent with
    `Cache-Control: no-store` and `Pragma: no-cache`.


    Every response carries an `X-Request-Id` header naming the request; quote it
    when reporting a problem. An error body repeats it as `error.request_id`.


    ## Related APIs


    - **Authentication & Access API** — login, passkeys, MFA, authorization

    - **Federation API** — OIDC/OAuth provider, SAML, SCIM, LDAP, social

    - **Developer API** — API keys, agents, webhooks, vaults

    - **Operations API** — audit, analytics, billing


    ## Contract maintenance


    This document covers routes mounted by internal/bootstrap/router.go.
    internal/bootstrap/openapi_coverage_test.go walks the production mount
    helpers and fails when a mounted operation is undocumented, a documented
    operation is stale, or API-auth security declarations disagree with runtime
    classification.
servers:
  - url: https://api.id.qeet.in
    description: Production
  - url: http://localhost:4001
    description: Local (make dev)
tags:
  - name: Tenants
    description: Tenant (workspace) CRUD.
  - name: Domains
    description: >-
      Tenant domain ownership — claim a domain, verify it via DNS, and manage
      verified domains.
  - name: Users
    description: User CRUD, password set, and soft-delete recycle bin (restore/purge).
  - name: Verification
    description: Email and phone verification flows.
  - name: Groups
    description: User groups and membership.
  - name: Invites
    description: Tenant member invitations.
  - name: Branding
    description: Per-tenant hosted-login branding.
