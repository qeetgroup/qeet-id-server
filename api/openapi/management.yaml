openapi: 3.1.0
info:
  title: Qeet ID — Identity Management API
  version: 0.2.0
  description: |-
    Tenants, domains, users, groups, and invitations for Qeet ID.

    ## Start here — the tenant lifecycle

    1. A newly registered user has **no tenant**. Create one with `POST /v1/tenants`; the caller becomes the tenant **owner**.
    2. (Optional) Prove control of a domain under **Domains** to unlock domain-based features.
    3. Add and manage users, organize them into groups, and invite teammates.

    The `register → tenant-less user → create tenant → owner` sequence is the most common early surprise: authentication happens in the Authentication & Access API; tenant creation happens here.

    ## Authentication

    Auth modes: `bearerAuth` (user/service JWT), `apiKeyAuth` (`Authorization: ApiKey <key>` — legacy scheme), `scimBearer` (per-tenant SCIM token), `clientCredentials` (OAuth M2M), and `ssoCookie` (hosted-login SSO session). CSRF protection applies only to cookie sessions (`ssoCookie`): requests authorised by `bearerAuth` or `apiKeyAuth` bypass it, as do the client-credentials token exchange (POST /v1/oauth/token) and the directory sign-in (POST /v1/ldap/{id}/authenticate), which carry their credentials in the request. Basic credentials do not bypass it.

    ## Related APIs

    - **Authentication & Access API** — login, passkeys, MFA, authorization
    - **Federation API** — OIDC/OAuth provider, SAML, SCIM, LDAP, social
    - **Developer API** — API keys, agents, webhooks, vaults
    - **Operations API** — audit, analytics, billing

    ## Contract maintenance

    This document covers routes mounted by internal/bootstrap/router.go. internal/bootstrap/openapi_coverage_test.go walks the production mount helpers and fails when a mounted operation is undocumented, a documented operation is stale, or API-auth security declarations disagree with runtime classification.
servers:
  - url: https://api.id.qeet.in
    description: Production
  - url: http://localhost:4001
    description: Local (make dev)
tags:
  - name: Tenants
    description: Tenant (workspace) CRUD.
  - name: Domains
    description: 'Tenant domain ownership — claim a domain, verify it via DNS, and manage verified domains.'
  - name: Users
    description: User CRUD, password set, and soft-delete recycle bin (restore/purge).
  - name: Verification
    description: Email and phone verification flows.
  - name: Groups
    description: User groups and membership.
  - name: Invites
    description: Tenant member invitations.
  - name: Branding
    description: Per-tenant hosted-login branding.
paths:
  /v1/me/organizations:
    get:
      operationId: listMyEligibleOrganizations
      summary: List organizations available to the signed-in user
      tags: [Tenants]
      security:
        - bearerAuth: []
        - apiKeyAuth: []
        - ssoCookie: []
      description: Caller-scoped user-only list of active, non-deleted organizations with valid role membership. No user or tenant identity is taken from query parameters. last_used_at excludes the current session so automatic sign-in scope is not labeled as a prior selection. Also accepts the hosted-login session cookie (qe_ls) in place of a bearer token, so a browser app signed in through the hosted login can list the caller's organizations by name.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 200 }
        - name: cursor
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Eligible organization page
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  next_cursor: { type: string }
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, name, slug, plan, region, logo_url, domain, roles, last_used_at]
                      properties:
                        id: { type: string, format: uuid }
                        name: { type: string }
                        slug: { type: string }
                        plan: { type: string }
                        region: { type: string }
                        logo_url: { type: string }
                        domain: { type: string, description: A verified organization domain, or empty if none. }
                        roles: { type: array, items: { type: string } }
                        last_used_at: { type: string, format: date-time, nullable: true }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /v1/tenants:
    get:
      operationId: get_v1_tenants
      description: 'Returns a page of the tenants the authenticated principal belongs to. Scope is taken from the caller''s identity, never from a query parameter. Use the returned cursor to page through large result sets. A newly registered user with no tenant sees an empty page until a tenant is created.'
      summary: List tenants
      tags:
        - Tenants
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        '200':
          description: Tenant page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: post_v1_tenants
      description: 'Creates a tenant and makes the calling user its owner. A newly registered user has no tenant until this succeeds; every tenant-scoped endpoint requires one. A verified email is required before a tenant can be provisioned. The response includes a tenant-scoped token pair so the client can immediately switch into the new tenant.'
      summary: Create tenant
      tags:
        - Tenants
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            example:
              slug: acme
              name: Acme, Inc.
              plan: pro
              region: ap-south-1
              metadata:
                industry: fintech
            schema:
              $ref: '#/components/schemas/TenantCreate'
      responses:
        '201':
          description: Created; caller becomes owner (token pair included)
          content:
            application/json:
              example:
                tenant:
                  id: 018f2a6c-9c3d-7e4a-b2f1-3a5c9d8e1f00
                  slug: acme
                  name: Acme, Inc.
                  plan: pro
                  region: ap-south-1
                  created_at: '2026-09-24T10:15:00Z'
                  updated_at: '2026-09-24T10:15:00Z'
                  member_count: 1
                  mfa_enabled_count: 0
                tenant_id: 018f2a6c-9c3d-7e4a-b2f1-3a5c9d8e1f00
                roles:
                  - owner
                access_token: eyJhbGciOiJFUzI1NiIsImtpZCI6ImsxIn0.eyJ0ZW5hbnQiOiJhY21lIn0.FAKE-signature
                token_type: Bearer
                expires_at: '2026-09-24T11:15:00Z'
                refresh_token: rt_1a2b3c4d5e6f70819a2b3c4d5e6f7081
                session_id: 018f2a72-7d8e-7f90-b123-4c5d6e7f8091
                user_id: 018f2a70-1a2b-7c3d-9e4f-5a6b7c8d9e0f
              schema:
                $ref: '#/components/schemas/TenantCreateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /v1/tenants/{tenantID}:
    delete:
      operationId: delete_v1_tenants_ByTenantID
      description: 'Soft-deletes the tenant. This is a destructive, owner-only action: members lose access and tenant-scoped calls stop resolving once it completes. Users who belonged only to this tenant are left without one and must create or join another. In the same transaction every session in the tenant ends (session.revoked with reason tenant_deleted) and the deletion is audited (tenant.deleted, naming who) and queued as an event; refresh and every sign-in refuse the tenant from then on (403 auth.tenant_inactive). An access token already issued lasts out its short lifetime.'
      summary: Delete tenant
      tags:
        - Tenants
      parameters:
        - name: tenantID
          in: path
          required: true
          schema:
            type: string
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    get:
      operationId: get_v1_tenants_ByTenantID
      description: 'Returns a single tenant by id. The caller must be a member of the tenant; requests for a tenant the principal does not belong to are rejected rather than disclosed.'
      summary: Get tenant
      tags:
        - Tenants
      parameters:
        - name: tenantID
          in: path
          required: true
          schema:
            type: string
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        '200':
          description: Tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: patch_v1_tenants_ByTenantID
      description: 'Updates mutable tenant attributes such as name and slug. Requires an administrative role within the tenant. Only the fields supplied in the request body are changed. Setting status to suspended ends every session in the tenant in the same transaction (session.revoked with reason tenant_suspended), and refresh and every sign-in refuse it until it is active again (403 auth.tenant_inactive); an access token already issued lasts out its short lifetime. Suspending and reactivating are audited (tenant.suspended, tenant.reactivated, naming who and the status it had) and queued as events.'
      summary: Update tenant
      tags:
        - Tenants
      parameters:
        - name: tenantID
          in: path
          required: true
          schema:
            type: string
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantUpdate'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /v1/tenants/{tenantID}/login-domain:
    get:
      operationId: get_v1_tenants_ByTenantID_login_domain
      summary: Custom login domain status
      tags:
        - Domains
      description: >-
        Provisioning state of the tenant's custom hosted-login hostname, plus the
        DNS records to publish. DNS is checked live; TLS and the login endpoint
        report their own stage rather than being inferred from the DNS result.
      parameters:
        - name: tenantID
          in: path
          required: true
          schema:
            type: string
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/tenants/{tenantID}/domains:
    get:
      operationId: get_v1_tenants_ByTenantID_domains
      description: 'Lists the domains claimed by the tenant together with the DNS record each requires and its current verification status. Use this to track which domains are pending, verified, or failing checks. New domains are added with the claim-domain call and confirmed with the verify-domain call.'
      summary: List domains
      tags:
        - Domains
      parameters:
        - name: tenantID
          in: path
          required: true
          schema:
            type: string
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        '200':
          description: Domains with their DNS verification records
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: post_v1_tenants_ByTenantID_domains
      description: 'Registers a domain for the tenant and returns the DNS TXT record that must be published to prove ownership. The record lives under a dedicated verification subdomain so it does not disturb existing apex TXT records such as SPF. Publish the returned record in DNS, then call the verify-domain endpoint to complete the claim.'
      summary: Claim domain
      tags:
        - Domains
      parameters:
        - name: tenantID
          in: path
          required: true
          schema:
            type: string
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - domain
              properties:
                domain:
                  type: string
      responses:
        '201':
          description: Domain claimed; publish the returned TXT record then verify
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /v1/tenants/{tenantID}/domains/{id}/verify:
    post:
      operationId: post_v1_tenants_ByTenantID_domains_ById_verify
      description: 'Performs a live DNS lookup for the previously issued TXT record and, on a match, marks the domain verified by setting verified_at. Claim the domain first so the expected record is known; verification is only attempted when explicitly requested here, not in the background. Verifying ownership does not by itself enable SSO or just-in-time provisioning for the domain.'
      summary: Verify domain
      tags:
        - Domains
      parameters:
        - name: tenantID
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        '200':
          description: Verification result (verified_at set on success)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /v1/tenants/{tenantID}/domains/{id}:
    patch:
      operationId: patch_v1_tenants_ByTenantID_domains_ById
      summary: Update domain settings
      tags:
        - Domains
      description: >-
        Toggles SSO routing, just-in-time provisioning, and which domain is the
        tenant default. Setting a new default clears the previous one.
      parameters:
        - name: tenantID
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sso_enabled: {type: boolean}
                jit_enabled: {type: boolean}
                is_default: {type: boolean}
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      operationId: delete_v1_tenants_ByTenantID_domains_ById
      description: 'Removes a claimed or verified domain from the tenant. Any domain-based features that depended on it stop applying. Re-adding the domain later requires claiming and verifying it again.'
      summary: Remove domain
      tags:
        - Domains
      parameters:
        - name: tenantID
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        '204':
          description: Domain removed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/users/suspended:
    get:
      operationId: get_v1_users_suspended
      summary: List suspended users and review metrics
      description: >-
        Requires user.read. Tenant scope comes only from the authenticated
        principal. Includes owned accounts and tenant members; private suspension
        metadata is masked for accounts owned elsewhere, with can_manage=false.
        Historical unknown timestamps and risk are not inferred.
      tags: [Users]
      security: [{bearerAuth: []}, {apiKeyAuth: []}]
      parameters:
        - {name: q, in: query, schema: {type: string, maxLength: 200}}
        - {name: reason, in: query, schema: {type: string}}
        - {name: source, in: query, schema: {type: string}}
        - {name: team, in: query, schema: {type: string, maxLength: 200}}
        - {name: risk, in: query, schema: {type: string, enum: [unknown, low, medium, high]}}
        - {name: review, in: query, schema: {type: string, enum: [pending, reviewed, external]}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0, maximum: 100000}}
      responses:
        '200':
          description: Suspended users with scoped summary, reason/risk breakdowns and review queue
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/SuspendedDirectoryUser'}}
                  total: {type: integer}
                  limit: {type: integer}
                  offset: {type: integer}
                  summary:
                    type: object
                    properties:
                      total: {type: integer}
                      high_risk: {type: integer}
                      policy: {type: integer}
                      manual: {type: integer}
                      pending: {type: integer}
                  reasons:
                    type: array
                    items: {type: object, properties: {key: {type: string}, count: {type: integer}}}
                  risks:
                    type: array
                    items: {type: object, properties: {key: {type: string}, count: {type: integer}}}
                  queue: {type: array, items: {$ref: '#/components/schemas/SuspendedDirectoryUser'}}
                  teams: {type: array, items: {type: string}}
        '400': {description: Invalid filters}
        '401': {description: Authentication and tenant required}
        '403': {description: Missing user.read}
  /v1/users/{id}/reactivate:
    post:
      operationId: post_v1_users_ById_reactivate
      summary: Reactivate a suspended owned user
      description: Requires user.write and ownership in the active tenant. Revokes existing sessions and records audit/outbox evidence atomically; old sessions are never restored.
      tags: [Users]
      security: [{bearerAuth: []}, {apiKeyAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: User reactivated
          content: {application/json: {schema: {type: object, additionalProperties: true}}}
        '401': {description: Authentication required}
        '403': {description: Missing user.write}
        '404': {description: Account not owned by this tenant}
        '409': {description: Account is no longer suspended}
  /v1/users/{id}/suspension:
    put:
      operationId: put_v1_users_ById_suspension
      summary: Review a suspended owned user
      description: Requires user.write and ownership. Updates review facts and emits audit/outbox evidence without reactivating the account.
      tags: [Users]
      security: [{bearerAuth: []}, {apiKeyAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, risk, review]
              properties:
                reason: {type: string, enum: [unspecified, provider, suspicious_activity, policy_violation, account_compromise, offboarding, inactive, other]}
                risk: {type: string, enum: [unknown, low, medium, high]}
                review: {type: string, enum: [pending, reviewed]}
      responses:
        '204': {description: Review saved}
        '400': {description: Invalid review facts}
        '401': {description: Authentication required}
        '403': {description: Missing user.write}
        '404': {description: Account not owned by this tenant}
        '409': {description: Account is no longer suspended}
  /v1/users/trends:
    get:
      operationId: get_v1_users_trends
      summary: User directory 30-day trends
      description: 30-day daily total/MFA-enrolled series for the Users KPI sparklines. Requires `user.read`.
      tags:
        - Users
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        '200':
          description: Trend series
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserTrends'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/users/stats:
    get:
      operationId: get_v1_users_stats
      summary: User directory summary
      description: Tenant-wide member counts (total / active / suspended / invited / MFA enabled / MFA missing) for the Users admin summary strip. Requires `user.read`.
      tags:
        - Users
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        '200':
          description: Directory summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserStats'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/users:
    get:
      operationId: get_v1_users
      description: 'Returns a page of users in the caller''s tenant. Supports opaque cursor paging or numeric offset paging to jump to a specific page. Requires an existing tenant; scope comes from the authenticated principal.'
      summary: List users
      tags:
        - Users
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
          description: Offset for numbered paging (jump to page N). Alternative to cursor.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        '200':
          description: User page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: post_v1_users
      description: 'Creates a user within the caller''s tenant. An initial password may be supplied, otherwise the account is created without a password credential and the user signs in via passkey, magic link, or an admin-triggered reset. The password must meet the organisation''s password rules (minimum length and required character classes), the offline strength baseline and, when enabled, the breached-password check; a refusal is a 422 naming the rule that failed (authpolicy.password_* or auth.password_weak). A refused password writes nothing. Requires an existing tenant.'
      summary: Create user
      tags:
        - Users
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /v1/users/bulk:
    post:
      operationId: post_v1_users_bulk
      summary: Bulk-create users
      description: Create many users in one call. Each row is attempted independently — a bad or duplicate row, or one whose password the tenant's password rules refuse, is reported in the response with its reason rather than failing the whole batch (partial success).
      tags:
        - Users
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserBulkImport'
      responses:
        '200':
          description: Per-row import summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserBulkImportResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
