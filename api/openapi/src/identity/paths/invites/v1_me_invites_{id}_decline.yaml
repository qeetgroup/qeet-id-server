post:
  operationId: declineMyInvite
  summary: Decline an invitation from my inbox
  tags:
    - Invites
  security:
    - bearerAuth: []
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  description: >-
    Dismisses a pending invitation addressed to the caller's email (marks it
    declined). Scoped by email, so one user can't decline another's. Answers 403
    invite.email_not_verified until the account's address is verified.
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            required:
              - message
            properties:
              message:
                type: string
    "400":
      $ref: ../../../shared/responses/BadRequest.yaml
    "401":
      $ref: ../../../shared/responses/Unauthorized.yaml
    "403":
      $ref: ../../../shared/responses/Forbidden.yaml
    "429":
      $ref: ../../../shared/responses/TooManyRequests.yaml
