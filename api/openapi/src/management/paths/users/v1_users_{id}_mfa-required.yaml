put:
  operationId: setUserMfaRequired
  summary: Set user MFA-required policy
  description: >-
    Toggle the per-user `mfa_required` policy flag. Requires `user.credentials`;
    audited as `user.mfa_required_set` with the value set (`mfa_required`), in
    the same transaction as the change. The person must not outrank the caller:
    only an owner changes an owner (403 rbac.target_is_owner), and the caller
    must hold every permission the person holds here (403
    rbac.target_outranks_caller naming one); acting on yourself is allowed.
  tags:
    - Users
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - required
          properties:
            required:
              type: boolean
  responses:
    '200':
      description: MFA-required flag updated
      content:
        application/json:
          schema:
            type: object
            properties:
              mfa_required:
                type: boolean
    '400':
      $ref: ../../../shared/responses/BadRequest.yaml
    '401':
      $ref: ../../../shared/responses/Unauthorized.yaml
    '403':
      $ref: ../../../shared/responses/Forbidden.yaml
    '404':
      $ref: ../../../shared/responses/NotFound.yaml
