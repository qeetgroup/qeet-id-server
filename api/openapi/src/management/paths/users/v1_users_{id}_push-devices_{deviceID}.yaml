delete:
  operationId: disconnectUserPushDevice
  summary: Disconnect a member's phone
  description: >-
    Disconnects a member's linked phone, for example a lost one, so it receives
    no approval requests and cannot answer one. Requires the user.credentials
    permission; audited as mfa.push_device_revoked. Refused with 403
    rbac.target_is_owner when the member is an owner and the caller isn't, and
    403 rbac.target_outranks_caller when they hold a permission the caller
    doesn't.
  tags:
    - Users
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: deviceID
      in: path
      required: true
      schema:
        type: string
        format: uuid
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  responses:
    "204":
      description: Disconnected
    "401":
      $ref: ../../../shared/responses/Unauthorized.yaml
    "403":
      $ref: ../../../shared/responses/Forbidden.yaml
    "404":
      $ref: ../../../shared/responses/NotFound.yaml
