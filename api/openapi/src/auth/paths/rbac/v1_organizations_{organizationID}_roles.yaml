get:
  operationId: listRoles
  description: >-
    Lists the roles defined in the organization, including both system roles and
    organization-defined custom roles. Use it to populate role pickers and to review
    the organization's RBAC configuration. Define a new custom role with the
    create-role call.
  summary: List roles
  tags:
    - RBAC
  parameters:
    - $ref: ../../../shared/parameters/OrganizationID.yaml
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  responses:
    "200":
      description: Roles
      content:
        application/json:
          schema:
            type: object
            properties:
              truncated:
                $ref: ../../../shared/schemas/Truncated.yaml
              items:
                type: array
                items:
                  $ref: ../../components/schemas/Role.yaml
    "401":
      $ref: ../../../shared/responses/Unauthorized.yaml
    "403":
      $ref: ../../../shared/responses/Forbidden.yaml
post:
  operationId: createRole
  description: >-
    Creates a custom role in the organization from a name and description. The role
    starts with no permissions; attach them with the grant-permission-to-role
    call before putting it to use. Assign the finished role with the
    assign-role-to-user or grant-role-to-group calls.
  summary: Create role
  tags:
    - RBAC
  parameters:
    - $ref: ../../../shared/parameters/OrganizationID.yaml
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/RoleCreate.yaml
  responses:
    "201":
      description: Role created
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/Role.yaml
    "400":
      $ref: ../../../shared/responses/BadRequest.yaml
    "401":
      $ref: ../../../shared/responses/Unauthorized.yaml
    "403":
      $ref: ../../../shared/responses/Forbidden.yaml
    "422":
      $ref: ../../../shared/responses/Unprocessable.yaml
