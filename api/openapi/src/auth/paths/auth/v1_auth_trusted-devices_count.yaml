get:
  operationId: countMyTrustedDevices
  summary: Count trusted devices
  tags:
    - Auth
  description: >-
    Number of live trusted devices in the caller's organization, as used by the
    Authentication overview. Counts devices, not users, and excludes expired
    rows — an expired device is no longer trusted. Organization scope comes from the
    principal, never a parameter. Returns 0 for organizations that have not enabled
    adaptive MFA (`remember_device_enabled`), since nothing writes a trusted
    device until then.
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  responses:
    "200":
      description: Live trusted-device count
      content:
        application/json:
          schema:
            type: object
            required:
              - devices
              - users
            properties:
              devices:
                type: integer
                minimum: 0
                description: Live trusted devices (one browser cookie = one device).
              users:
                type: integer
                minimum: 0
                description: Distinct people those devices belong to.
    "401":
      $ref: ../../../shared/responses/Unauthorized.yaml
    "403":
      $ref: ../../../shared/responses/Forbidden.yaml
    "429":
      $ref: ../../../shared/responses/TooManyRequests.yaml
