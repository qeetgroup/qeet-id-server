openapi: 3.1.0
info:
  title: Qeet ID — Operations API (audit, billing, analytics)
  version: 0.2.0
  description: |-
    Observability, governance, and commercial operations for Qeet ID.

    ## Start here

    1. **Health** first — `GET /healthz` and `/readyz` need no authentication and are the easiest successful call for a new integrator.
    2. **Observe** — activity feed, usage analytics, and universal search.
    3. **Investigate & govern** — audit log, compliance evidence, data retention, GDPR erasure, and SIEM log sinks.
    4. **Commercial** — billing, plans, and entitlements.

    ## Authentication

    Auth modes: `bearerAuth` (user/service JWT), `apiKeyAuth` (`Authorization: ApiKey <key>` — legacy scheme), `scimBearer` (per-tenant SCIM token), `clientCredentials` (OAuth M2M), and `ssoCookie` (hosted-login SSO session). CSRF protection applies only to `ssoCookie` sessions; `bearerAuth` requests bypass it.

    ## Related APIs

    - **Authentication & Access API** — login, passkeys, MFA, authorization
    - **Identity Management API** — tenants, users, groups, invitations
    - **Federation API** — OIDC/OAuth provider, SAML, SCIM, LDAP, social
    - **Developer API** — API keys, agents, webhooks, vaults

    ## Contract maintenance

    This document covers routes mounted by internal/bootstrap/router.go. internal/bootstrap/openapi_coverage_test.go walks the production mount helpers and fails when a mounted operation is undocumented, a documented operation is stale, or API-auth security declarations disagree with runtime classification.
servers:
  - url: https://api.id.qeet.in
    description: Production
  - url: http://localhost:4001
    description: Local (make dev)
tags:
  - name: Health
    description: Liveness, readiness, and Prometheus metrics.
  - name: Activity
    description: >-
      Live Activity feed — a real-time SSE event stream and cursor-paginated
      history, both sourced from the hash-chained audit log and the NATS outbox.
      Tenant-scoped; requires audit.read. The SSE stream fans out domain events
      from the transactional outbox; reconnects replay missed events via
      Last-Event-ID.
  - name: Analytics
    description: Per-tenant usage analytics.
  - name: Search
    description: >-
      Universal tenant-scoped fuzzy search across all resource types. Results
      are RBAC-gated per type — the caller only sees resources their role
      allows them to read.
  - name: Audit
    description: Append-only, hash-chained audit log query and integrity verification.
  - name: Compliance
    description: SOC 2 and ISO 27001 live evidence generation from real tenant system state.
  - name: Data Retention
    description: Per-tenant auto-purge of soft-deleted users.
  - name: GDPR
    description: Right-to-erasure purge requests.
  - name: Log Sinks
    description: 'SIEM log-sink connectors — forward audit and event streams to external SIEM destinations.'
  - name: Notifications
    description: 'In-app notifications — list notifications and mark them read.'
  - name: Rate Limits
    description: Per-tenant rate-limit overrides (tenant / user / API-key buckets).
  - name: Email Templates
    description: Per-tenant transactional email template overrides.
  - name: Qeet AI
    description: >-
      AI qeetai inference service — streaming conversation turns, conversation
      management, and configuration status. Tool execution runs client-side
      under the user's own token (RBAC/RLS/audit inherited). API key is
      server-side only and never returned by any endpoint.
  - name: Billing
    description: Subscription plans, subscriptions, and invoices.
  - name: Entitlements
    description: >-
      A tenant's resolved plan capability set — boolean feature flags and numeric
      limits. Read by the console to gate the UI off the same source of truth the
      backend enforces on. Gated create endpoints return 402 with a stable code
      (billing.plan_limit / billing.upgrade_required) when a plan cap is reached.
  - name: Sales
    description: 'Contact-sales lead capture (public marketing endpoint).'
paths:
  /healthz:
    get:
      operationId: get_healthz
      description: 'Returns 200 whenever the process can answer the request, reporting only that the instance is running rather than that its dependencies are reachable. Requires no authentication and performs no dependency checks, making it the cheapest way to confirm connectivity. Container orchestrators use this signal to decide whether to restart the instance.'
      summary: Liveness
      tags:
        - Health
      security: []
      responses:
        '200':
          description: Alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /metrics:
    get:
      operationId: get_metrics
      description: 'Exposes process and request metrics in Prometheus exposition format for scraping by a metrics collector. Requires no authentication and is intended to be reached only from within the deployment network. The payload reflects the instance''s current counters and gauges at the time of the call.'
      summary: Metrics (Prometheus)
      tags:
        - Health
      security: []
      responses:
        '200':
          description: Prometheus exposition format
          content:
            text/plain:
              schema:
                type: string
  /readyz:
    get:
      operationId: get_readyz
      description: 'Runs every registered dependency probe under a short shared timeout and returns 200 only when all pass, otherwise 503 with a per-check breakdown. Requires no authentication. Unlike the liveness probe, a failure here indicates the instance is temporarily unable to serve traffic, so orchestrators route requests away without restarting the process.'
      summary: Readiness
      tags:
        - Health
      security: []
      responses:
        '200':
          description: Ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
        '503':
          description: Not ready (a dependency is down)
  /v1/activity:
    get:
      operationId: get_v1_activity
      summary: Activity history
      description: >-
        Returns a cursor-paginated list of ActivityEvent derived from the
        tenant-scoped audit log. Severity and category are computed from the
        event type and applied post-fetch. Tenant is derived from the JWT
        principal only — never from URL or body.
      tags:
        - Activity
      parameters:
        - name: cursor
          in: query
          required: false
          description: >-
            Opaque pagination cursor from a previous response next_cursor field.
            Encodes the ID of the last seen event.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Maximum events to return (1–200; default 50).
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: types
          in: query
          required: false
          description: >-
            Comma-separated list of exact event types (audit action values, e.g.
            "user.created,user.deleted"). Omit to return all types.
          schema:
            type: string
            example: 'user.created,user.deleted'
        - name: severity
          in: query
          required: false
          description: >-
            Minimum severity level. Events below this level are excluded.
            Severity is derived from the event type, not stored in the DB.
          schema:
            type: string
            enum: [info, success, warning, error, critical]
        - name: category
          in: query
          required: false
          description: >-
            Filter by event category (authentication, authorization, security,
            directory, developer, system). Derived from the event type prefix.
          schema:
            type: string
            enum:
              - authentication
              - authorization
              - security
              - directory
              - developer
              - system
        - name: actor
          in: query
          required: false
          description: Filter by actor user UUID.
          schema:
            type: string
            format: uuid
        - name: subject
          in: query
          required: false
          description: >-
            Identity timeline filter. When set, returns every event where the
            given user UUID is either the actor OR the target of a 'user'
            resource event. Omit to return events for all subjects.
          schema:
            type: string
            format: uuid
        - name: q
          in: query
          required: false
          description: >-
            Free-text search over action, resource_type, actor_type, user_agent,
            and metadata. Evaluated as a PostgreSQL websearch_to_tsquery
            expression — supports quoted phrases, exclusions (-saml), and OR.
          schema:
            type: string
        - name: from
          in: query
          required: false
          description: Inclusive lower bound on event timestamp (RFC3339).
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: Inclusive upper bound on event timestamp (RFC3339).
          schema:
            type: string
            format: date-time
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        '200':
          description: Paginated activity events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityResponse'
        '400':
          $ref: '#/components/responses/Unprocessable'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/activity/stream:
    get:
      operationId: get_v1_activity_stream
      summary: Live activity stream (SSE)
      description: >-
        Opens a Server-Sent Events stream of ActivityEvent frames for the
        caller's tenant. Each frame is `event: activity\ndata: <json>\n\n`;
        periodic `: keep-alive` comments prevent proxy timeouts.


        When `Last-Event-ID` is supplied the server replays up to 100 audit
        events newer than that ID (chronological order) before switching to
        the live stream, covering reconnect gaps.


        Server-side filters (`?types`, `?severity`, `?category`) are applied
        to both the replay and the live stream. The connection tenant is
        derived from the JWT principal only — never from the URL or body.


        The write deadline is extended to 1 hour. Set
        `X-Accel-Buffering: no` is already set by the server (Nginx/Caddy
        proxy buffering disabled).
      tags:
        - Activity
      parameters:
        - name: types
          in: query
          required: false
          description: >-
            Comma-separated event type prefixes to match (e.g. "user,auth").
            An event matches if its type equals or starts with any listed value.
          schema:
            type: string
        - name: severity
          in: query
          required: false
          description: Minimum severity level to stream.
          schema:
            type: string
            enum: [info, success, warning, error, critical]
        - name: category
          in: query
          required: false
          description: Exact category to stream; omit for all.
          schema:
            type: string
            enum:
              - authentication
              - authorization
              - security
              - directory
              - developer
              - system
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        '200':
          description: >-
            SSE stream of ActivityEvent frames. Event name: "activity".
            Periodic "`: keep-alive`" comments maintain the connection.
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/activity/summary:
    get:
      operationId: get_v1_activity_summary
      summary: Activity summary
      description: >-
        Aggregate counts over the same filter predicates as the history
        endpoint (types, actor, subject, from/to, q). The severity and category
        filters are ignored — this endpoint produces that distribution. Without
        an explicit `from` the window defaults to the last 24h and is hard-capped
        at 90 days to bound the per-tenant scan. Tenant is derived from the JWT
        principal only.
      tags:
        - Activity
      parameters:
        - name: types
          in: query
          required: false
          description: Comma-separated exact event types (audit action values).
          schema:
            type: string
        - name: actor
          in: query
          required: false
          description: Filter by actor user UUID.
          schema:
            type: string
            format: uuid
        - name: subject
          in: query
          required: false
          description: Identity-timeline filter (actor OR user-resource target).
          schema:
            type: string
            format: uuid
        - name: q
          in: query
          required: false
          description: Free-text search (websearch_to_tsquery).
          schema:
            type: string
        - name: from
          in: query
          required: false
          description: Inclusive lower bound (RFC3339); defaults to now-24h.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: Inclusive upper bound (RFC3339); defaults to now.
          schema:
            type: string
            format: date-time
        - name: bucket
          in: query
          required: false
          description: >-
            Sparkline bucket width in seconds (60–86400). Omit to auto-size to
            ~48 buckets across the window.
          schema:
            type: integer
            minimum: 60
            maximum: 86400
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        '200':
          description: Aggregate activity summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivitySummaryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/activity/{id}/related:
    get:
      operationId: get_v1_activity_ByID_related
      summary: Related activity events
      description: >-
        Returns the anchor event plus events correlated with it by request_id
        and by the same actor within a symmetric time window. The anchor lookup
        is tenant-scoped — an unknown id or a foreign tenant's id both return
        404. An event never appears in both correlation lists.
      tags:
        - Activity
      parameters:
        - name: id
          in: path
          required: true
          description: Anchor event UUID (audit.events row id).
          schema:
            type: string
            format: uuid
        - name: window
          in: query
          required: false
          description: >-
            Half-width of the same-actor correlation window in seconds
            (60–3600; default 300).
          schema:
            type: integer
            minimum: 60
            maximum: 3600
            default: 300
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        '200':
          description: Anchor event and correlated events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityRelatedResponse'
        '400':
          $ref: '#/components/responses/Unprocessable'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/tenants/{tenantID}/analytics/overview:
    get:
      operationId: get_v1_tenants_ByTenantID_analytics_overview
      summary: Tenant analytics overview
      tags:
        - Analytics
      parameters:
        - name: tenantID
          in: path
          required: true
          schema:
            type: string
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      description: Response body summarized; accurate path/method/params/security. Enrich the body later.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/search:
    get:
      operationId: get_v1_search
      summary: Universal search
      description: >-
        Tenant-scoped, RBAC-enforced fuzzy search that fans out across
        user, organization, group, role, oidc_client, and audit_event
        resource types. Each type is gated behind its read permission
        (user.read, tenant.read, group.read, role.read, connection.read,
        audit.read); types the caller cannot read are silently excluded.
        Matching uses ILIKE '%q%' (parameterised). Results are scored and
        returned in descending relevance order. Pagination is cursor-based
        and opaque.
      tags:
        - Search
      parameters:
        - name: q
          in: query
          required: true
          description: Search query (1+ characters after trimming).
          schema:
            type: string
        - name: types
          in: query
          required: false
          description: >-
            Comma-separated list of resource types to search.
            Allowed values: user, organization, group, role, oidc_client,
            audit_event. Omit to search all permitted types.
          schema:
            type: string
            example: 'user,group'
        - name: cursor
          in: query
          required: false
          description: Opaque pagination cursor from a previous response's next_cursor field.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Maximum results to return (1–50; default 20).
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400':
          $ref: '#/components/responses/Unprocessable'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/tenants/{tenantID}/audit:
    get:
      operationId: get_v1_tenants_ByTenantID_audit
      description: 'Returns the tenant''s audit events in reverse chronological order with cursor-based pagination and optional filters for action, resource type, actor, and a free-text query. The audit log is append-only and hash-chained, so results reflect an immutable record of activity. Pass the returned cursor to page through history; access is restricted to the tenant named in the path.'
      summary: List audit events
      tags:
        - Audit
      parameters:
        - name: tenantID
          in: path
          required: true
          schema:
            type: string
        - name: q
          in: query
          required: false
          description: >
            Free-text search over action, resource_type, actor_type, user_agent,
            and metadata. Evaluated as a PostgreSQL websearch_to_tsquery expression —
            supports quoted phrases ("failed login"), exclusions (-saml), and OR.
          schema:
            type: string
        - name: action
          in: query
          required: false
          schema:
            type: string
        - name: resource_type
          in: query
          required: false
          schema:
            type: string
        - name: actor_user_id
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Page size. Defaults to 50; the server clamps values above 200.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          required: false
          description: The id of the last-seen event, for keyset pagination.
          schema:
            type: string
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        '200':
          description: '{ items: AuditEvent[], next_cursor: string }'
          content:
            application/json:
              example:
                events:
                  - id: 018f2a90-1b2c-7d3e-8f40-5a6b7c8d9e01
                    action: user.created
                    resource_type: user
                    resource_id: 018f2a70-1a2b-7c3d-9e4f-5a6b7c8d9e0f
                    actor_user_id: 018f2a70-1a2b-7c3d-9e4f-5a6b7c8d9e0f
                    created_at: '2026-09-24T10:15:04Z'
                  - id: 018f2a90-0a1b-7c2d-8e3f-4a5b6c7d8e00
                    action: tenant.created
                    resource_type: tenant
                    resource_id: 018f2a6c-9c3d-7e4a-b2f1-3a5c9d8e1f00
                    actor_user_id: 018f2a70-1a2b-7c3d-9e4f-5a6b7c8d9e0f
                    created_at: '2026-09-24T10:15:00Z'
                next_cursor: 018f2a90-0a1b-7c2d-8e3f-4a5b6c7d8e00
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /v1/audit/verify:
    get:
      operationId: get_v1_audit_verify
      summary: Verify platform audit chain (public)
      description: >-
        Verifies the platform-level audit hash chain (the rows with no tenant)
        and returns only whether the chain is intact and how many rows were
        checked. Unauthenticated by design so any external party can
        independently confirm the platform has not tampered with its audit log;
        per-tenant verification is at /v1/tenants/{tenantID}/audit/verify and
        requires auth.
      tags:
        - Audit
      security: []
      responses:
        '200':
          description: '{ chain_valid: bool, rows_checked: int }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  chain_valid:
                    type: boolean
                  rows_checked:
                    type: integer
                required:
                  - chain_valid
                  - rows_checked
  /v1/tenants/{tenantID}/audit/verify:
    get:
      operationId: get_v1_tenants_ByTenantID_audit_verify
      summary: Verify audit chain
      description: Walks the tenant's hash chain from the seed and recomputes each row's hash, returning the first broken link (if any). No side effects.
      tags:
        - Audit
      parameters:
        - name: tenantID
          in: path
          required: true
          schema:
            type: string
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        '200':
          description: '{ ok: bool, rows_checked: int, last_verified_id?: uuid, broken_at_id?: uuid, broken_reason?: string }'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/tenants/{tenantID}/audit/anomalies:
    get:
      operationId: get_v1_tenants_ByTenantID_audit_anomalies
      summary: List audit anomalies
      description: Flagged deviations from a behavioral baseline built per (tenant, actor) over audit.events — a first-time action type, an unusual hour, or a new IP. Scored by a background sweep, not synchronously on write.
      tags:
        - Audit
      parameters:
        - name: tenantID
          in: path
          required: true
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [open, resolved]
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        '200':
          description: Anomalies
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditAnomaly'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/tenants/{tenantID}/audit/anomalies/summary:
    get:
      operationId: get_v1_tenants_ByTenantID_audit_anomalies_summary
      description: 'Returns aggregate counts of detected anomalies for the tenant, including currently open anomalies, those resolved in the last seven days, and the number scored as high severity. Anomalies come from scoring the append-only audit log against a per-actor behavioral baseline. Intended to drive an at-a-glance security dashboard.'
      summary: Audit anomaly summary
      tags:
        - Audit
      parameters:
        - name: tenantID
          in: path
          required: true
          schema:
            type: string
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        '200':
          description: '{ open: int, resolved_7d: int, high_score_open: int }'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/tenants/{tenantID}/audit/anomalies/{id}/resolve:
    post:
      operationId: post_v1_tenants_ByTenantID_audit_anomalies_ById_resolve
      description: 'Marks the identified anomaly as resolved and records the acting administrator, removing it from the open queue. Returns 404 when no matching open anomaly exists for the tenant. This is a review action only and does not alter the underlying audit events that triggered detection.'
      summary: Resolve an audit anomaly
      tags:
        - Audit
      parameters:
        - name: tenantID
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        '204':
          description: Resolved
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/tenants/{tenantID}/audit/anomaly-settings:
    get:
      operationId: get_v1_tenants_ByTenantID_audit_anomaly_settings
      description: 'Returns the tenant''s anomaly-detection configuration, including whether scoring is enabled, the score threshold above which an event is flagged, and the minimum number of baseline events required before scoring begins. Platform defaults are reported when the tenant has not customized the settings.'
      summary: Get anomaly-detection settings
      tags:
        - Audit
      parameters:
        - name: tenantID
          in: path
          required: true
          schema:
            type: string
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        '200':
          description: Settings
          content:
