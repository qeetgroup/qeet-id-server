post:
  operationId: resendInvite
  description: >-
    Rotates the invitation token, extends its expiry, and re-sends the
    invitation email; the new link goes only to the invited address. Requires
    member.invite, and, as creating it does, every permission of the role the
    invitation grants (403 rbac.grant_exceeds_caller naming one the caller
    lacks; nothing changes). The response carries the invitation. Only pending or expired
    invites belonging to the caller's tenant qualify; already-accepted or
    revoked invites are rejected. The recipient completes the flow through the
    accept-invite call, as with the original invitation. invite.delivery says
    whether the email went out (as on create): a suppressed address reports
    not_sent with email.suppressed rather than success.
  summary: Resend an invitation
  tags:
    - Invites
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  responses:
    '200':
      description: Invitation resent
      content:
        application/json:
          schema:
            type: object
            required:
              - invite
            properties:
              invite:
                $ref: ../../components/schemas/Invite.yaml
    '401':
      $ref: ../../../shared/responses/Unauthorized.yaml
    '403':
      $ref: ../../../shared/responses/Forbidden.yaml
    '404':
      $ref: ../../../shared/responses/NotFound.yaml
