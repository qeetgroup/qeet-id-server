get:
  operationId: startSamlIdpSso
  description: >-
    The tenant's SAML SingleSignOnService over the HTTP-Redirect binding, with
    Qeet acting as the Identity Provider. It handles SP-initiated SSO from the
    AuthnRequest of a Service Provider registered in that tenant and
    IdP-initiated SSO by SP reference; only SPs of the tenant in the path are
    matched. The user is authenticated by the hosted-login SSO cookie, and the
    browser is bounced to the hosted login when no session exists. On success it
    returns an auto-submitting HTML form that POSTs a signed SAMLResponse to the
    SP's registered ACS URL. Only people whose home is the tenant are signed in
    (403 saml.user_tenant_mismatch otherwise), and an SP with
    assignment_required only those assigned to it, themselves or through a group
    of the tenant they belong to: anyone else is refused with 403
    saml.sp_not_assigned, and the refusal is audited as
    saml.idp_assertion_refused. The assertion's NameID follows the SP's
    name_id_format and name_id_attribute (an emailAddress NameID is the email; a
    persistent one an opaque value made for this person at this SP the first
    time they sign in to it, which never changes, or their user id when
    name_id_attribute is user_id); a NameID from a metadata key the person has
    no single value for is refused with 403 saml.name_id_unavailable, also
    audited. The assertion carries the attributes the SP maps, each the person
    has a value for. A browser asking for HTML gets every error as a page
    showing its message and code; anything else gets the JSON error. An unknown
    or inactive tenant, or an unknown SP, returns 404; a disabled SP answers 403
    saml.service_provider_disabled, and one still in draft 403
    saml.service_provider_draft, whether or not anyone is signed in (a signed-in
    person's attempt is audited as saml.idp_assertion_refused, reason draft).
    The organisation's plan must include enterprise SSO at every sign-in, not
    only when the SP was registered (402 billing.upgrade_required). An SP with
    require_signed_requests is signed in only by a request signed with its
    certificate, over the query as the Redirect binding defines (RSA or ECDSA
    with SHA-256 or SHA-512) or by an enveloped XML signature, and is otherwise
    refused with 403 saml.request_signature_invalid; IdP-initiated sign-in is
    unaffected. An SP with encrypt_assertions gets the signed assertion as an
    EncryptedAssertion to its certificate. The POST-binding variant is POST
    /saml/idp/{tenantID}/sso.
  summary: '[idp] IdP SSO (redirect binding)'
  tags:
    - SAML
  parameters:
    - $ref: ../../../shared/parameters/TenantID.yaml
    - in: query
      name: SAMLRequest
      schema:
        type: string
    - in: query
      name: RelayState
      schema:
        type: string
  security: []
  responses:
    '200':
      description: Auto-submit POST form back to the SP ACS with a signed SAMLResponse
      headers:
        Cache-Control:
          $ref: ../../../shared/headers/NoStoreCacheControl.yaml
        Pragma:
          $ref: ../../../shared/headers/NoStorePragma.yaml
      content:
        text/html:
          schema:
            type: string
    '302':
      description: Redirect to hosted login when no SSO session
      headers:
        Cache-Control:
          $ref: ../../../shared/headers/NoStoreCacheControl.yaml
        Pragma:
          $ref: ../../../shared/headers/NoStorePragma.yaml
    '400':
      $ref: ../../../shared/responses/BadRequest.yaml
    '402':
      description: >-
        The organisation's plan does not include enterprise SSO
        (billing.upgrade_required).
    '403':
      $ref: ../../../shared/responses/Forbidden.yaml
    '404':
      $ref: ../../../shared/responses/NotFound.yaml
post:
  operationId: startSamlIdpSsoWithPost
  description: >-
    The tenant's SAML SingleSignOnService over the HTTP-POST binding, with Qeet
    acting as the Identity Provider; equivalent to GET /saml/idp/{tenantID}/sso
    for Service Providers that send the AuthnRequest via POST. Only SPs of the
    tenant in the path are matched. The user is authenticated by the
    hosted-login SSO cookie, with a redirect to the hosted login when no session
    exists; that sign-in returns to GET /saml/idp/{tenantID}/sso carrying the
    request and RelayState, so the flow resumes. A posted request over 256 KiB
    is refused with saml.authn_request_invalid. Any supplied
    AssertionConsumerServiceURL must match the SP's registered ACS. On success
    it returns an auto-submitting form that POSTs a signed SAMLResponse to that
    ACS. Who is signed in, and what the assertion says, is as for GET
    /saml/idp/{tenantID}/sso: an SP with assignment_required refuses anyone not
    assigned to it with an audited 403 saml.sp_not_assigned. An unknown or
    inactive tenant, or an unknown SP, returns 404. The organisation's plan must
    include enterprise SSO at every sign-in (402 billing.upgrade_required).
  summary: '[idp] IdP SSO (POST binding)'
  tags:
    - SAML
  parameters:
    - $ref: ../../../shared/parameters/TenantID.yaml
  security: []
  requestBody:
    required: true
    content:
      application/x-www-form-urlencoded:
        schema:
          type: object
          properties:
            SAMLRequest:
              type: string
            RelayState:
              type: string
  responses:
    '200':
      description: Auto-submit POST form back to the SP ACS with a signed SAMLResponse
      headers:
        Cache-Control:
          $ref: ../../../shared/headers/NoStoreCacheControl.yaml
        Pragma:
          $ref: ../../../shared/headers/NoStorePragma.yaml
      content:
        text/html:
          schema:
            type: string
    '302':
      description: Redirect to hosted login when no SSO session
      headers:
        Cache-Control:
          $ref: ../../../shared/headers/NoStoreCacheControl.yaml
        Pragma:
          $ref: ../../../shared/headers/NoStorePragma.yaml
    '400':
      $ref: ../../../shared/responses/BadRequest.yaml
    '402':
      description: >-
        The organisation's plan does not include enterprise SSO
        (billing.upgrade_required).
    '403':
      $ref: ../../../shared/responses/Forbidden.yaml
    '404':
      $ref: ../../../shared/responses/NotFound.yaml
