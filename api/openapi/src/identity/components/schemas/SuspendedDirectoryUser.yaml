type: object
required:
  - id
  - email
  - display_name
  - avatar_url
  - team
  - reason
  - source
  - risk
  - review
  - suspended_at
  - last_sign_in
  - can_manage
properties:
  id:
    type: string
    format: uuid
  email:
    type: string
    format: email
  display_name:
    type:
      - string
      - "null"
  avatar_url:
    type:
      - string
      - "null"
  team:
    type: string
  reason:
    type: string
  source:
    type: string
  risk:
    type: string
    enum:
      - unknown
      - low
      - medium
      - high
  review:
    type: string
    enum:
      - pending
      - reviewed
      - external
  suspended_at:
    type:
      - string
      - "null"
    format: date-time
  last_sign_in:
    type:
      - string
      - "null"
    format: date-time
  can_manage:
    type: boolean
