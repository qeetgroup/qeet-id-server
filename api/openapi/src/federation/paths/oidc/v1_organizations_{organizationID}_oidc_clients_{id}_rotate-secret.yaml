post:
  operationId: rotateOidcClientSecret
  description: >-
    Generates a new secret for a confidential OIDC client in the organization and
    returns it exactly once; the previous secret stops working immediately. The
    rotation is audited. Update any client still using the old secret before its
    next token request.
  summary: Rotate client secret
  tags:
    - OIDC
  parameters:
    - $ref: ../../../shared/parameters/OrganizationID.yaml
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  responses:
    '200':
      description: New client secret (shown once)
      headers:
        Cache-Control:
          $ref: ../../../shared/headers/NoStoreCacheControl.yaml
        Pragma:
          $ref: ../../../shared/headers/NoStorePragma.yaml
      content:
        application/json:
          schema:
            type: object
            properties:
              client_secret:
                type: string
              warning:
                type: string
    '401':
      $ref: ../../../shared/responses/Unauthorized.yaml
    '403':
      $ref: ../../../shared/responses/Forbidden.yaml
    '404':
      $ref: ../../../shared/responses/NotFound.yaml
    '422':
      $ref: ../../../shared/responses/Unprocessable.yaml
