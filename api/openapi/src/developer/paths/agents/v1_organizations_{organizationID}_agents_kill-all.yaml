post:
  operationId: suspendAllAgents
  summary: Suspend all agents
  description: >-
    Security incident-response control. Sets disabled_at on all of the organization's
    agents in a single transaction. Returns the number suspended.
  tags:
    - Agents
  parameters:
    - $ref: ../../../shared/parameters/OrganizationID.yaml
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  responses:
    "200":
      description: Agents suspended
      content:
        application/json:
          schema:
            type: object
            properties:
              suspended:
                type: integer
    "401":
      $ref: ../../../shared/responses/Unauthorized.yaml
    "403":
      $ref: ../../../shared/responses/Forbidden.yaml
