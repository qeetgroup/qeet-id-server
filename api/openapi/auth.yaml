  /v1/mfa/push/devices:
    get:
      operationId: get_v1_mfa_push_devices
      description: 'Lists the caller''s registered push-approval devices used as a second factor, each with its label and platform, for management in account security settings. It never returns the secret device token, which is shown only once at registration. Add or rotate a device with the register-device call and remove one with the revoke-device call.'
      summary: List registered push-MFA devices
      tags: [MFA]
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        '200':
          description: Registered devices
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: post_v1_mfa_push_devices
      description: 'Registers a mobile device for push-based MFA, or rotates the credential of an existing one, from its platform push token. The resulting device token is returned only in this response and cannot be retrieved later, so the device must persist it to answer future challenges. That token is required when responding to a challenge; revoke the device with the corresponding delete call.'
      summary: Register or rotate a push-MFA device
      tags: [MFA]
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [push_token, platform]
              properties:
                name: { type: string }
                push_token: { type: string }
                platform: { type: string, enum: [ios, android] }
      responses:
        '201':
          description: Device registered; device_token is returned once
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/mfa/push/devices/{id}:
    delete:
      operationId: delete_v1_mfa_push_devices_ById
      description: 'Revokes a registered push-MFA device by its identifier so it can no longer approve challenges. Its device token is invalidated immediately and any pending challenge to it can no longer be answered. Re-enroll the device with the register-device call if push approval is needed again.'
      summary: Revoke a push-MFA device
      tags: [MFA]
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Device revoked }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/mfa/push/devices/{id}/unlink:
    post:
      operationId: post_v1_mfa_push_devices_ById_unlink
      summary: Unlink this phone
      description: >-
        Called by the mobile app to remove the phone it runs on from the account,
        proving it is that device with the device_token it was given when linked
        (the app holds no signed-in session). Works with a credential past its
        expiry, since removing itself grants nothing. 401 mfa.push_unauthorized
        when the device or credential does not match. Audited as
        mfa.push_device_unlinked.
      tags:
        - MFA
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, device_token]
              properties:
                user_id:
                  type: string
                  format: uuid
                device_token:
                  type: string
      responses:
        '204':
          description: The phone is no longer linked
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/mfa/push/pairing:
    post:
      operationId: post_v1_mfa_push_pairing
      summary: Ask for a code to link a phone
      description: >-
        Issues a pairing code that links a phone running the mobile app to the caller's own account, so
        nobody copies an access token. The code is returned only in this response, shown grouped for
        reading (ABCDE-FGHJK); it links one phone, once, within five minutes, and asking for a new one
        stops the caller's earlier unused codes working. Needs a recent step-up when the caller already
        holds a second factor (403 step_up_required). At most ten an hour (429 with retry_after).
        Audited as mfa.push_pairing_created. The phone exchanges the code with the claim call; the
        status call tells the screen showing it when it has been used.
      tags: [MFA]
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        '201':
          description: Pairing code issued
          content:
            application/json:
              schema:
                type: object
                required: [id, code, status, expires_at]
                properties:
                  id: { type: string, format: uuid }
                  code: { type: string, example: ABCDE-FGHJK }
                  status: { type: string, enum: [pending] }
                  expires_at: { type: string, format: date-time }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/mfa/push/pairing/{id}:
    get:
      operationId: get_v1_mfa_push_pairing_ById
      summary: Check a pairing code
      description: >-
        Reports one of the caller's pairing codes: pending (it can still link a phone), linked (it did;
        device_id names the phone) or expired (it timed out, was replaced by a newer code, or was
        withdrawn). Someone else's code reads as not found.
      tags: [MFA]
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The pairing code's state
          content:
            application/json:
              schema:
                type: object
                required: [id, status, expires_at]
                properties:
                  id: { type: string, format: uuid }
                  status: { type: string, enum: [pending, linked, expired] }
                  expires_at: { type: string, format: date-time }
                  device_id: { type: string, format: uuid }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: delete_v1_mfa_push_pairing_ById
      summary: Withdraw a pairing code
      description: >-
        Stops one of the caller's unused pairing codes working, as when the screen showing it is closed.
        A code that already linked a phone is left as it is: remove the phone instead. Someone else's code
        reads as not found.
      tags: [MFA]
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: The code no longer works }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/mfa/push/pairing/claim:
    post:
      operationId: post_v1_mfa_push_pairing_claim
      summary: Link this phone with a pairing code
      description: >-
        Called by the mobile app, which holds no signed-in session, to link the phone it runs on to the
        account that asked for the pairing code. The code is read as typed or scanned: case, spaces and
        hyphens do not matter, and O, I and L read as 0, 1 and 1. Like registering a device, it returns
        the account's user_id, the device and its device_token, which is shown only here. A wrong, used or
        expired code, or one whose account is no longer active, answers 401 mfa.pairing_code_invalid, all
        alike. Throttled per address (429). Audited as mfa.push_device_linked.
      tags: [MFA]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, push_token, platform]
              properties:
                code: { type: string }
                name: { type: string }
                push_token: { type: string }
                platform: { type: string, enum: [ios, android] }
      responses:
        '201':
          description: The phone is linked; device_token is returned once
          content:
            application/json:
              schema:
                type: object
                required: [user_id, device, device_token]
                properties:
                  user_id: { type: string, format: uuid }
                  device:
                    type: object
                    additionalProperties: true
                  device_token: { type: string }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/mfa/push/challenges/{id}:
    get:
      operationId: get_v1_mfa_push_challenges_ById
      description: 'Returns the current status of a push-MFA challenge, letting the sign-in surface poll while it waits for the user to approve or deny on their device. It is unauthenticated because it is called before the second factor is satisfied. A request past its expiry (two minutes after it was sent) reads as expired, and can no longer be answered. The enrolled device answers the challenge through the challenge-respond call.'
      summary: Poll a push-MFA challenge
      tags: [MFA]
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Challenge status
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/mfa/push/challenges/{id}/respond:
    post:
      operationId: post_v1_mfa_push_challenges_ById_respond
      description: 'Records the user''s approval or denial of a push-MFA challenge, called by the enrolled device rather than the browser. It is authenticated by the device_token issued at registration together with the matching user_id, not a session credential, which is why no bearer token is required. Once recorded, the polling sign-in surface observes the outcome through the challenge-status call and proceeds or fails accordingly.'
      summary: Approve or deny a push-MFA challenge
      tags: [MFA]
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, device_token, approved]
              properties:
                user_id: { type: string, format: uuid }
                device_token: { type: string }
                approved: { type: boolean }
      responses:
        '204': { description: Challenge response recorded }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/check:
    get:
      operationId: get_v1_check
      description: 'Evaluates whether a user may use a permission in a tenant, composing every model: an ABAC deny policy (resource type and action read from the key, so doc:write is resource doc, action write) refuses and stops; otherwise a role granting the permission, or an ABAC allow policy, permits; otherwise it is refused. An engine error refuses. The response names the deciding model and rule in decided_by; the ABAC policy is named only to a caller holding policy.read. Pass explain=true to add the role grant paths, a reason on denial and the step-by-step trace. This is a read-only decision and changes no state.'
      summary: Permission check
      tags:
        - RBAC
      parameters:
        - in: query
          name: user_id
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: tenant_id
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: permission
          required: true
          schema:
            type: string
        - in: query
          name: explain
          required: false
          description: >-
            When "true", also return the role grant path(s), a reason on denial and the decision's trace.
          schema:
            type: string
            enum:
              - "true"
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        '200':
          description: >-
            Decision: {allowed, decided_by}. With explain=true also paths, reason (on denial) and trace.
          content:
            application/json:
              schema:
                type: object
                properties:
                  allowed:
                    type: boolean
                  decided_by:
                    $ref: '#/components/schemas/AuthzDecidedBy'
                  paths:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuthzGrantStep'
                  reason:
                    type: string
                    description: Set only on a denial, with explain=true.
                  trace:
                    type: array
                    items:
                      type: string
                    description: With explain=true. Each step in order, prefixed with its model (tenant, abac, rbac, rebac, none).
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/permissions:
    get:
      operationId: get_v1_permissions
      description: 'Returns the catalog of permissions defined in the system that can be granted to roles under RBAC. Use it to populate role-editing surfaces and to discover the permission keys accepted by the permission-check call. The list is a reference catalog and reflects no particular user''s grants.'
      summary: List permissions
