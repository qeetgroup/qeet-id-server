type: object
required:
  - created_at
  - email
  - expires_at
  - id
  - role_id
  - organization_id
  - organization_name
  - organization_slug
properties:
  created_at:
    type: string
    format: date-time
  email:
    type: string
  expires_at:
    type: string
    format: date-time
  id:
    type: string
    format: uuid
  role_id:
    type:
      - string
      - "null"
    format: uuid
  organization_id:
    type: string
    format: uuid
  organization_name:
    type: string
  organization_slug:
    type: string
