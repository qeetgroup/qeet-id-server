post:
  operationId: startEmailVerification
  summary: Start email verification
  description: >-
    Sends a 6-digit code to the caller's address on file. It never verifies an
    address given in the request; moving to another address is the email-change
    flow (/v1/me/email/change/start). A new code replaces the caller's earlier
    ones, and one the mail provider refuses is withdrawn. At most ten codes an
    hour go to one person, and five to one address over every account (429
    verification.code_send_limited with retry_after, in seconds).
  tags:
    - Verification
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  security:
    - bearerAuth: []
  responses:
    "200":
      description: Code sent; returns a confirmation message
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
    "401":
      $ref: ../../../shared/responses/Unauthorized.yaml
    "403":
      $ref: ../../../shared/responses/Forbidden.yaml
    "404":
      $ref: ../../../shared/responses/NotFound.yaml
    "422":
      $ref: ../../../shared/responses/Unprocessable.yaml
    "429":
      $ref: ../../../shared/responses/TooManyRequests.yaml
