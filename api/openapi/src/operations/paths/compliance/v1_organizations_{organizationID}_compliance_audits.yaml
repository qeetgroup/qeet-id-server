get:
  operationId: listExternalAudits
  summary: List external audits
  description: >-
    The external audits and certificates recorded for the organization, latest
    first, up to 1,000 (truncated when there are more), of one framework when
    asked. Requires audit.read.
  tags:
    - Compliance
  parameters:
    - $ref: ../../../shared/parameters/OrganizationID.yaml
    - name: framework
      in: query
      required: false
      schema:
        type: string
        enum:
          - soc2
          - iso27001
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  responses:
    '200':
      description: Audits
      content:
        application/json:
          schema:
            type: object
            properties:
              truncated:
                $ref: ../../../shared/schemas/Truncated.yaml
              items:
                type: array
                items:
                  $ref: ../../components/schemas/ExternalAudit.yaml
    '401':
      $ref: ../../../shared/responses/Unauthorized.yaml
    '403':
      $ref: ../../../shared/responses/Forbidden.yaml
    '404':
      $ref: ../../../shared/responses/NotFound.yaml
post:
  operationId: recordExternalAudit
  summary: Record an external audit or certificate
  description: >-
    Records an audit an external body carried out, or a certificate it issued:
    framework, kind (audit or certificate), body, scope, reference, issued_on
    and optional expires_on (YYYY-MM-DD, not before issued_on). Invalid fields
    are refused with 422 naming each. Audited as compliance.audit_recorded.
    Requires audit.write.
  tags:
    - Compliance
  parameters:
    - $ref: ../../../shared/parameters/OrganizationID.yaml
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - framework
            - kind
            - body
            - issued_on
          properties:
            framework:
              type: string
              enum:
                - soc2
                - iso27001
            kind:
              type: string
              enum:
                - audit
                - certificate
            body:
              type: string
              maxLength: 200
            scope:
              type: string
              maxLength: 2000
            reference:
              type: string
              maxLength: 200
            issued_on:
              type: string
              format: date
            expires_on:
              type: string
              format: date
  responses:
    '201':
      description: Recorded
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/ExternalAudit.yaml
    '401':
      $ref: ../../../shared/responses/Unauthorized.yaml
    '403':
      $ref: ../../../shared/responses/Forbidden.yaml
    '404':
      $ref: ../../../shared/responses/NotFound.yaml
    '422':
      $ref: ../../../shared/responses/Unprocessable.yaml
