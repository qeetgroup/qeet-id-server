get:
  operationId: listDirectoryActivity
  summary: List recorded directory operations
  description: >-
    Organization-scoped SCIM writes and LDAP operations, newest first. Requires
    connection.read. Counts and durations describe observed operations, not
    provider scheduler jobs. Request bodies and credentials are never stored.
  tags:
    - Directory
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  parameters:
    - $ref: ../../../shared/parameters/OrganizationID.yaml
    - name: days
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 90
        default: 7
    - name: connection_id
      in: query
      schema:
        type: string
        maxLength: 128
    - name: status
      in: query
      schema:
        type: string
        enum:
          - success
          - warning
          - failed
    - name: q
      in: query
      schema:
        type: string
        maxLength: 200
    - name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    - $ref: ../../../shared/parameters/Cursor.yaml
  responses:
    '200':
      description: Operation page, filtered summary, and daily UTC volumes
      content:
        application/json:
          schema:
            type: object
            required:
              - items
              - total
              - limit
              - summary
              - volume
            properties:
              next_cursor:
                $ref: ../../../shared/schemas/NextCursor.yaml
              items:
                type: array
                items:
                  $ref: ../../components/schemas/DirectoryEvent.yaml
              total:
                type: integer
              limit:
                type: integer
              summary:
                type: object
                properties:
                  total:
                    type: integer
                  successful:
                    type: integer
                  warnings:
                    type: integer
                  failed:
                    type: integer
                  average_duration_ms:
                    type:
                      - integer
                      - 'null'
              volume:
                type: array
                items:
                  type: object
                  properties:
                    date:
                      type: string
                      format: date
                    users:
                      type: integer
                    groups:
                      type: integer
    '400':
      description: Invalid filters
    '401':
      description: Authentication required
    '403':
      description: Organization mismatch or missing connection.read
