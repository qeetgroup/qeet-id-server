get:
  operationId: listMyConnectedAccounts
  summary: List the caller's connected third-party accounts
  tags:
    - Token Vault
  security:
    - bearerAuth: []
  description: >-
    Non-secret metadata only (provider, external account id, scope, expiry) for
    the calling user's own connected accounts.
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            required:
              - items
            properties:
              truncated:
                $ref: ../../../shared/schemas/Truncated.yaml
              items:
                type: array
                items:
                  $ref: ../../components/schemas/GrantMeta.yaml
    "401":
      $ref: ../../../shared/responses/Unauthorized.yaml
    "429":
      $ref: ../../../shared/responses/TooManyRequests.yaml
