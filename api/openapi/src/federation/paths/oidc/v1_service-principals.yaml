post:
  operationId: createServicePrincipal
  description: >-
    Creates a service principal, a non-human machine identity, in the caller's
    tenant and returns its client id and one-time client secret, which cannot be
    retrieved afterward. The principal authenticates for machine-to-machine
    access at the client-credentials token endpoint (POST /v1/oauth/token).
    Creation is audited; disable the principal when it is no longer needed. Send
    an Idempotency-Key header to retry it safely: a retry with the same key and
    body within 24 hours gets the first answer, marked Idempotent-Replayed:
    true; the same key with another body answers 422 idempotency.key_reused, one
    still being processed 409 idempotency.in_progress, and one whose first
    request stopped before answering 409 idempotency.outcome_unknown: check
    whether it took effect, then retry with a new key. A credential carries only
    authority its creator holds: every scope must be one the caller holds (a
    vault scope needs secret.read; a machine caller, a scope of its own), or the
    request is refused with 403 rbac.grant_exceeds_caller naming the scope.
  summary: Create service principal
  tags:
    - OIDC
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/ServicePrincipalCreate.yaml
  parameters:
    - $ref: ../../../shared/parameters/IdempotencyKey.yaml
  responses:
    '201':
      description: Service principal created (secret shown once)
      headers:
        Cache-Control:
          $ref: ../../../shared/headers/NoStoreCacheControl.yaml
        Pragma:
          $ref: ../../../shared/headers/NoStorePragma.yaml
        Idempotent-Replayed:
          $ref: ../../../shared/headers/IdempotentReplayed.yaml
      content:
        application/json:
          schema:
            type: object
            required:
              - client_id
              - client_secret
              - service_principal
              - warning
            properties:
              client_id:
                type: string
                format: uuid
              client_secret:
                type: string
              service_principal:
                $ref: ../../components/schemas/ServicePrincipal.yaml
              warning:
                type: string
    '400':
      $ref: ../../../shared/responses/BadRequest.yaml
    '401':
      $ref: ../../../shared/responses/Unauthorized.yaml
    '403':
      $ref: ../../../shared/responses/Forbidden.yaml
    '409':
      description: >-
        A request with this Idempotency-Key is still being processed
        (idempotency.in_progress); retry shortly. Or the first request stopped
        before answering and may have taken effect
        (idempotency.outcome_unknown): check, then retry with a new key.
    '422':
      $ref: ../../../shared/responses/Unprocessable.yaml
