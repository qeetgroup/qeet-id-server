  /scim/v2/Schemas:
    get:
      operationId: get_scim_v2_Schemas
      description: 'Returns the SCIM 2.0 schema definitions for the resources Qeet exposes as a SCIM server, for IdP discovery. Requires the SCIM bearer token and is mounted at the root under /scim/v2, not under /v1. Errors use the RFC 7644 SCIM error envelope, not the standard Qeet error shape.'
      summary: "[scim] Schemas"
      tags:
        - SCIM
      security:
        - scimBearer: []
      responses:
        '200':
          description: SCIM metadata
          content:
            application/scim+json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
  /scim/v2/ServiceProviderConfig:
    get:
      operationId: get_scim_v2_ServiceProviderConfig
      description: 'Returns the SCIM 2.0 ServiceProviderConfig advertising Qeet''s supported SCIM capabilities as a SCIM server, where PATCH and filter are supported while bulk, sort, changePassword and etag are not, along with the tenant bearer-token authentication scheme. Requires the SCIM bearer token and is mounted at the root under /scim/v2, not under /v1. Errors use the RFC 7644 SCIM error envelope.'
      summary: "[scim] ServiceProviderConfig"
      tags:
        - SCIM
      security:
        - scimBearer: []
      responses:
        '200':
          description: SCIM metadata
          content:
            application/scim+json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
  /scim/v2/Users:
    get:
      operationId: get_scim_v2_Users
      description: 'Lists provisioned users for the tenant identified by the SCIM bearer token, with optional SCIM filtering (for example userName eq) and pagination; a userName eq lookup finds any account at home in the tenant, whoever created it, so an identity provider can match and link existing members, returning a SCIM 2.0 ListResponse, with Qeet acting as the SCIM server. Mounted at the root under /scim/v2, not under /v1. Errors use the RFC 7644 SCIM error envelope rather than the standard Qeet error shape.'
      summary: "[scim] List users"
      tags:
        - SCIM
      parameters:
        - in: query
          name: filter
          schema:
            type: string
          description: SCIM filter, e.g. userName eq "a@b.com"
        - in: query
          name: startIndex
          schema:
            type: integer
            minimum: 1
        - in: query
          name: count
          schema:
            type: integer
            minimum: 0
      security:
        - scimBearer: []
      responses:
        '200':
          description: ListResponse
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/SCIMListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: post_scim_v2_Users
      description: 'Provisions a new user in the tenant identified by the SCIM bearer token, with Qeet acting as the SCIM 2.0 server for an external IdP. Mounted at the root under /scim/v2, not under /v1. Errors use the RFC 7644 SCIM error envelope, not the standard Qeet error shape. A userName belonging to an account already at home in the tenant (invited, or signed in with single sign-on) adopts that account: it is tagged as provisioned with the externalId and updated, and answered 201. A userName taken elsewhere, or on a domain another organisation has verified, is refused with 409.'
      summary: "[scim] Create user"
      tags:
        - SCIM
      security:
        - scimBearer: []
      requestBody:
        required: true
        content:
          application/scim+json:
            example:
              schemas:
                - urn:ietf:params:scim:schemas:core:2.0:User
              userName: ada@example.com
              displayName: Ada Lovelace
              active: true
              name:
                givenName: Ada
                familyName: Lovelace
                formatted: Ada Lovelace
              emails:
                - value: ada@example.com
                  primary: true
              externalId: okta-00u1a2b3c4
            schema:
              $ref: '#/components/schemas/SCIMUser'
          application/json:
            schema:
              $ref: '#/components/schemas/SCIMUser'
      responses:
        '201':
          description: User provisioned
          content:
            application/scim+json:
              example:
                schemas:
                  - urn:ietf:params:scim:schemas:core:2.0:User
                id: 018f2a70-1a2b-7c3d-9e4f-5a6b7c8d9e0f
                userName: ada@example.com
                displayName: Ada Lovelace
                active: true
                name:
                  givenName: Ada
                  familyName: Lovelace
                  formatted: Ada Lovelace
                emails:
                  - value: ada@example.com
                    primary: true
                externalId: okta-00u1a2b3c4
                meta:
                  resourceType: User
                  created: '2026-09-24T10:15:00Z'
                  lastModified: '2026-09-24T10:15:00Z'
              schema:
                $ref: '#/components/schemas/SCIMUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /scim/v2/Users/{id}:
    delete:
      operationId: delete_scim_v2_Users_ById
      description: 'Deprovisions a user by id for the tenant identified by the SCIM bearer token, soft-deleting the account after confirming it belongs to the tenant and ending every way it signs in (sessions, hosted-login sessions, remembered devices, application grants, pending authorizations and unused recovery links), with Qeet acting as the SCIM server. Mounted at the root under /scim/v2, not under /v1. Errors use the RFC 7644 SCIM error envelope rather than the standard Qeet error shape. An account that owns the organisation is never deleted by the directory (403).'
      summary: "[scim] Delete user"
      tags:
        - SCIM
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      security:
        - scimBearer: []
      responses:
        '204':
          description: Deprovisioned
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    get:
      operationId: get_scim_v2_Users_ById
      description: 'Returns a single provisioned user by id for the tenant identified by the SCIM bearer token, with Qeet acting as the SCIM server. Mounted at the root under /scim/v2, not under /v1. Errors use the RFC 7644 SCIM error envelope rather than the standard Qeet error shape.'
      summary: "[scim] Get user"
      tags:
        - SCIM
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      security:
        - scimBearer: []
      responses:
        '200':
          description: User
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/SCIMUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: patch_scim_v2_Users_ById
      description: 'Applies a SCIM PatchOp to a user for the tenant identified by the SCIM bearer token; setting active to false (a boolean, or the string Entra sends) is the deprovisioning path IdPs rely on and suspends the account, ending every way it signs in as an administrator''s suspension does; displayName, name.givenName/familyName/formatted, externalId and userName (or the primary email) are applied too, a new userName only on a domain the tenant has verified (400 invalidValue otherwise), counted verified, with links sent to the old address ending; and displayName may also be updated, with Qeet acting as the SCIM server. Mounted at the root under /scim/v2, not under /v1. Errors use the RFC 7644 SCIM error envelope, not the standard Qeet error shape. An account that owns the organisation is never changed or deleted by the directory (403). Setting active to true lifts only a suspension the directory set: one an administrator, a policy or another directory set stands, while the rest of the change applies.'
      summary: "[scim] Patch user (deprovision)"
      tags:
        - SCIM
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      security:
        - scimBearer: []
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              $ref: '#/components/schemas/SCIMPatchOp'
      responses:
        '200':
          description: Patched
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/SCIMUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: put_scim_v2_Users_ById
      description: 'Replaces a user''s attributes wholesale with the supplied SCIM representation for the tenant identified by the SCIM bearer token, with Qeet acting as the SCIM server. Use PATCH for targeted changes such as deprovisioning. Mounted at the root under /scim/v2; errors use the RFC 7644 SCIM error envelope, not the standard Qeet error shape. An account that owns the organisation is never changed or deleted by the directory (403). Setting active to true lifts only a suspension the directory set: one an administrator, a policy or another directory set stands, while the rest of the change applies.'
      summary: "[scim] Replace user"
      tags:
        - SCIM
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      security:
        - scimBearer: []
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              $ref: '#/components/schemas/SCIMUser'
      responses:
        '200':
          description: Replaced
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/SCIMUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/tenants/{tenantID}/scim:
    get:
      operationId: get_v1_tenants_ByTenantID_scim
      summary: Get SCIM config
      tags:
        - SCIM
      parameters:
        - name: tenantID
          in: path
          required: true
          schema:
            type: string
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      description: 'Returns the organisation''s SCIM settings, never a token: whether one works, the newest working token''s prefix and creation, the latest use of any, and how many work (token_count). List the tokens themselves with GET /v1/tenants/{tenantID}/scim/tokens. Requires connection.read.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/tenants/{tenantID}/scim/token:
    delete:
      operationId: delete_v1_tenants_ByTenantID_scim_token
      summary: Revoke SCIM token
      tags:
        - SCIM
      parameters:
        - name: tenantID
          in: path
          required: true
          schema:
            type: string
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      description: 'Revokes every SCIM token of the organisation that still works, which stops provisioning; 404 when none does. To stop one token of several, use DELETE /v1/tenants/{tenantID}/scim/tokens/{id}. Requires connection.write. Needs a recent step-up.'
      responses:
        '204':
          description: No Content
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      operationId: post_v1_tenants_ByTenantID_scim_token
      summary: Rotate SCIM token
      tags:
        - SCIM
      parameters:
        - name: tenantID
          in: path
          required: true
          schema:
            type: string
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      description: 'Issues a new SCIM token, named "SCIM token", and revokes every earlier one at once; the token is shown only in this answer. To switch an identity provider over without a gap, rotate one token with POST /v1/tenants/{tenantID}/scim/tokens/{id}/rotate instead, which keeps the old one working for an overlap. Requires connection.write. Needs a recent step-up.'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [config, token]
                properties:
                  config:
                    $ref: '#/components/schemas/ConfigView'
                  token:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/tenants/{tenantID}/scim/tokens:
    get:
      operationId: get_v1_tenants_ByTenantID_scim_tokens
      summary: List SCIM tokens
      tags:
        - SCIM
      parameters:
        - name: tenantID
          in: path
          required: true
          schema:
            type: string
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      description: 'Lists the organisation''s SCIM tokens, newest first, including revoked and expired ones, never the tokens themselves. Requires connection.read.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/SCIMToken'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      operationId: post_v1_tenants_ByTenantID_scim_tokens
      summary: Create a SCIM token
      tags:
        - SCIM
      parameters:
        - name: tenantID
          in: path
          required: true
          schema:
            type: string
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      description: 'Issues a named SCIM token beside the organisation''s others, for a second identity provider or a staged switch; the token is shown only in this answer and only its hash is kept. Without expires_at it works until revoked or rotated. An organisation holds at most 10 working tokens that have not been rotated (409 scim.token_limit). Requires connection.write. Needs a recent step-up.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 200
                expires_at:
                  type: [string, 'null']
                  format: date-time
                  description: When the token stops working; in the future. Omit for none.
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [scim_token, token]
                properties:
                  scim_token:
                    $ref: '#/components/schemas/SCIMToken'
                  token:
                    type: string
                    description: The token to give the identity provider, shown only here.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402': {description: 'The organisation''s plan does not include SCIM.'}
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
