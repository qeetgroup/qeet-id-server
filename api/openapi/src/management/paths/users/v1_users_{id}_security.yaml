get:
  operationId: getUserSecurity
  summary: User security posture
  description: >-
    Aggregated authentication posture for a user (User 360): MFA factors (TOTP /
    email-SMS OTP / push), passkeys, recovery codes, password state, and the
    active-session / device count. The sessions counted are those the
    list-sessions call returns: only the user's sessions in the caller's
    organization, plus their account-level sessions (in no organization) when
    the caller's organization is the user's home organization. Requires
    `user.read`.
  tags:
    - Users
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  responses:
    "200":
      description: Security posture
      content:
        application/json:
          schema:
            type: object
            properties:
              mfa_required:
                type: boolean
              mfa_enabled:
                type: boolean
              totp_enabled:
                type: boolean
              otp_factors:
                type: integer
              push_devices:
                type: integer
              passkeys:
                type: integer
              passkey_last_used_at:
                type:
                  - string
                  - "null"
                format: date-time
              recovery_codes_remaining:
                type: integer
              password_set:
                type: boolean
              password_changed_at:
                type:
                  - string
                  - "null"
                format: date-time
              active_sessions:
                type: integer
              distinct_devices:
                type: integer
    "401":
      $ref: ../../../shared/responses/Unauthorized.yaml
    "403":
      $ref: ../../../shared/responses/Forbidden.yaml
    "404":
      $ref: ../../../shared/responses/NotFound.yaml
