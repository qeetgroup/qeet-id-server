name: qeet-id-dev

# Local dev: Postgres + NATS. The app runs on the host via `make dev`.
# Start: make db-up   Stop: make db-down

services:
  nats:
    image: nats:2-alpine
    ports:
      - "${NATS_PORT:-4222}:4222"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8222/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16-alpine
    # Local-dev credentials, overridable in .env (POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB,
    # POSTGRES_PORT); keep DB_URL in .env in step (default postgres://postgres:password@localhost:5001/qeet_id).
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-qeet_id}
      PGPORT: ${POSTGRES_PORT:-5001}
    ports:
      - "${POSTGRES_PORT:-5001}:${POSTGRES_PORT:-5001}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -p $${PGPORT}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    # Local email catcher. SMTP on :1025 (matches SMTP_HOST/SMTP_PORT in .env),
    # web UI at http://localhost:8025 to read every message the app "sends".
    # No auth/TLS needed — the app only STARTTLSes/auths when advertised/configured.
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025" # SMTP  (app → Mailpit)
      - "${MAILPIT_UI_PORT:-8025}:8025" # web UI (read caught mail)

  # Local observability stack, off unless asked for: make obs-up (Grafana http://localhost:3300).
  # Every port binds to localhost only. See observability/README.md.
  otel-collector:
    profiles: [observability]
    image: otel/opentelemetry-collector-contrib:0.165.0@sha256:e40d61f10c9a617cca1ffd1be4d7e2b3a4b0f0001798ff07e58cabe82e618cea
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
      - ./bin/logs:/var/log/qeet-id:ro
    ports:
      - "127.0.0.1:${OTLP_GRPC_PORT:-4317}:4317" # OTLP gRPC
      - "127.0.0.1:${OTLP_HTTP_PORT:-4318}:4318" # OTLP HTTP (OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318)
    depends_on: [tempo, loki]

  prometheus:
    profiles: [observability]
    image: prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
    command:
      [
        "--config.file=/etc/prometheus/prometheus.yml",
        "--storage.tsdb.retention.time=15d",
        "--web.enable-lifecycle",
      ]
    volumes:
      - ./observability/prometheus:/etc/prometheus:ro
      - promdata:/prometheus
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"

  alertmanager:
    profiles: [observability]
    image: prom/alertmanager:v0.35.0@sha256:e638797febd034838eca8b98cdbd46f951e9bf7f178777aa8669167406a9946c
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    volumes:
      - ./observability/alertmanager:/etc/alertmanager:ro
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"
    depends_on: [mailpit]

  loki:
    profiles: [observability]
    image: grafana/loki:3.7.10@sha256:b43c257ccfc925d4a50b8717cac61a3b51df8c48d01847936057e5c4075a24a7
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./observability/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - lokidata:/loki
    ports:
      - "127.0.0.1:${LOKI_PORT:-3100}:3100"

  tempo:
    profiles: [observability]
    image: grafana/tempo:3.0.0@sha256:1ce31d6d7ffab62189685e8c47881d4a561c5d38bd0dbd66e40ca83cef07923d
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempodata:/var/tempo
    ports:
      - "127.0.0.1:${TEMPO_PORT:-3200}:3200"

  grafana:
    profiles: [observability]
    image: grafana/grafana-oss:13.0.2@sha256:5dad0df181cb644a14e13617b913b261a54f7d4fd4510721dba420929f35bea2
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true" # local only: every port here binds to localhost
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3300}:3000"
    depends_on: [prometheus, loki, tempo]

  pyroscope:
    profiles: [observability]
    image: grafana/pyroscope:2.4.3@sha256:bf667534cd403320573063894e3faba20a5a5d1bfb92eddaecfabeb2446c502b
    volumes:
      - pyroscopedata:/data
    ports:
      - "127.0.0.1:${PYROSCOPE_PORT:-4040}:4040"

  alloy:
    profiles: [observability]
    image: grafana/alloy:v1.22.0@sha256:9acc2529bc1edb7f5b2bd801dd8334ebc80c158e3a9e5526ecd7c9a273d43189
    command: ["run", "/etc/alloy/config.alloy", "--storage.path=/var/lib/alloy/data"]
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on: [pyroscope]

  postgres-exporter:
    profiles: [observability]
    image: prometheuscommunity/postgres-exporter:v0.20.1@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e
    environment:
      # The fixed local-dev database above; production uses a least-privileged pg_monitor role.
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres:${POSTGRES_PORT:-5001}/${POSTGRES_DB:-qeet_id}?sslmode=disable
    depends_on: [postgres]

  blackbox-exporter:
    profiles: [observability]
    image: prom/blackbox-exporter:v0.29.1@sha256:ea1c7aa3ef3f307cd03e85f34abb604478ccb90b567fc690da0cd9776da76b13
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    volumes:
      - ./observability/blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    extra_hosts: ["host.docker.internal:host-gateway"]

  # SonarQube Community Build for local code analysis (make sonar-up, then make sonar). Its own
  # database (embedded), so it needs nothing else; first sign-in is admin / admin.
  sonarqube:
    profiles: [sonar]
    image: sonarqube:26.10.0.133078-community@sha256:f95aaa9016dd4e92c7d70691167a6d96dbb5d8acffd61eba1cb4335d364a7840
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    volumes:
      - sonardata:/opt/sonarqube/data
      - sonarextensions:/opt/sonarqube/extensions
      - sonarlogs:/opt/sonarqube/logs
    ports:
      - "127.0.0.1:${SONAR_PORT:-9000}:9000"

volumes:
  pgdata:
  promdata:
  lokidata:
  tempodata:
  grafanadata:
  pyroscopedata:
  sonardata:
  sonarextensions:
  sonarlogs:
