post:
  operationId: beginSignInMfaPasskey
  summary: Begin a passkey second factor
  description: >-
    Starts a passkey assertion for the challenged person's own passkeys; only an
    assertion from this ceremony completes the challenge. Used by both sign-in
    flows.
  tags:
    - Auth
  security: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - mfa_token
          properties:
            mfa_token:
              type: string
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              session_id:
                type: string
                format: uuid
              publicKey:
                type: object
                additionalProperties: true
    "401":
      $ref: ../../../shared/responses/Unauthorized.yaml
    "404":
      $ref: ../../../shared/responses/NotFound.yaml
    "429":
      $ref: ../../../shared/responses/TooManyRequests.yaml
