delete:
  operationId: disableServicePrincipal
  summary: Disable service principal
  tags:
    - OIDC
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  description: >-
    Disables a service principal: its credentials no longer get tokens, and the
    tokens it already holds are refused at once (401) and introspect inactive.
    Requires apikey.write. Needs a recent step-up.
  responses:
    "204":
      description: No Content
    "400":
      $ref: ../../../shared/responses/BadRequest.yaml
    "401":
      $ref: ../../../shared/responses/Unauthorized.yaml
    "403":
      $ref: ../../../shared/responses/Forbidden.yaml
    "404":
      $ref: ../../../shared/responses/NotFound.yaml
    "422":
      $ref: ../../../shared/responses/Unprocessable.yaml
    "429":
      $ref: ../../../shared/responses/TooManyRequests.yaml
