type: object
required:
  - tenant_id
  - name
properties:
  tenant_id:
    type: string
    format: uuid
  user_id:
    type:
      - string
      - 'null'
    format: uuid
  name:
    type: string
    minLength: 1
    maxLength: 200
  scopes:
    type: array
    items:
      type: string
  expires_at:
    type:
      - string
      - 'null'
    format: date-time
