post:
  operationId: requestToken
  description: >-
    The OAuth token endpoint advertised in discovery, serving the
    authorization_code, refresh_token, device_code (RFC 8628), token-exchange
    (RFC 8693) and CIBA grants with Qeet as the authorization server. Clients
    authenticate with their credentials in the form body or via HTTP Basic. This
    endpoint does not serve client_credentials: use the client-credentials token
    endpoint at /v1/oauth/token for machine-to-machine tokens. Errors take the
    RFC 6749 §5.2 shape (error, error_description): a missing grant_type is
    invalid_request, an unknown grant or client_credentials
    unsupported_grant_type, and a grant the client may not use
    unauthorized_client. Every grant refuses an account that is suspended or
    deleted with invalid_grant, and a refused refresh ends the application's
    refresh tokens for that user. Device polling from an address the
    organisation's address rules refuse answers access_denied
    address_not_allowed and spends the device code; code redemption and refresh
    come from the application's server, so the address rules are asked at
    authorization instead. An authorization code redeems once, with the
    code_verifier of its challenge; a code issued under a PKCE exemption redeems
    only while the exemption lasts. A code presented a second time is refused
    with invalid_grant and the grant its first redemption issued is revoked,
    every renewal of it included (audited as oidc.authorization_code_reused).
    Token exchange (RFC 8693) is bounded: the caller must be entitled to the
    subject token (issued to it, issued for a registered resource it serves, or
    the person consented to it; else invalid_request), the person must still be
    active and the organisation live (else invalid_grant), the result expires no
    later than the subject token, carries a new session id, and records its
    exchange_depth; a token TOKEN_EXCHANGE_MAX_DEPTH exchanges deep (2) can't be
    exchanged again (invalid_request). Every exchange is audited as
    oidc.token_exchanged; the result holds at most the subject token's scopes
    that the caller is registered for and, when it holds the token by the
    person's consent, that they consented to; a scope beyond those is
    invalid_scope. A refresh token comes only to an application registered for
    refresh_token, on the authorization_code, device_code and CIBA grants: with
    every grant, unless the application lists offline_access among its scopes,
    in which case only with a grant of offline_access (OpenID Connect Core §11).
    The ID token a refresh issues again reports the original sign-in, as OpenID
    Connect Core 12.2 asks: the same auth_time and sid as the first one, and no
    nonce. A refresh may name only the resource (RFC 8707) its grant is bound
    to: another is refused with 400 invalid_target, and naming none carries the
    bound resource forward. Device and CIBA polling authenticate the client as
    the other grants do: a confidential client with a missing or wrong secret,
    or an unknown client_id, is refused with 401 invalid_client, with
    WWW-Authenticate: Basic when the client used HTTP Basic; a public client is
    identified by its client_id, and the device_code or auth_req_id is the
    proof. The per-address rate limit answers 429 too_many_requests in the error
    envelope. A refresh is refused with unauthorized_client when the client is
    no longer registered for refresh_token, and with invalid_grant once the
    person is no longer an active member of the client's organisation (its own
    account, or one holding a role there) or the organisation is suspended. A
    refresh carries forward only the granted scopes the client still registers
    (scope in the response says which) and is refused with invalid_scope when
    none is left. The
    same membership is required when a code, device approval or backchannel
    request is redeemed (a code or backchannel request refused so is spent).
    A code, device code or backchannel approval is refused with
    unauthorized_client once its client is no longer registered for that
    grant, and a backchannel approval also once its client is no longer a
    confidential one. A backchannel request is spent only together with
    storing its refresh token, so a failure leaves it for the next poll. A
    browser may call it from an origin one of the
    applications allows (web_origins), without credentials.
  summary: Token (authorization_code)
  tags:
    - OIDC
  security:
    - clientCredentials: []
  requestBody:
    required: true
    content:
      application/x-www-form-urlencoded:
        example:
          grant_type: authorization_code
          code: ac_5f4d3c2b1a09f8e7d6c5b4a392817060
          redirect_uri: https://app.example.com/callback
          code_verifier: dBjftJeZ4CVP-mB92K27uhbUJU1p1r_wW1gFWFOEjXk
        schema:
          $ref: ../../components/schemas/OAuthTokenRequest.yaml
  responses:
    '200':
      description: Token response
      headers:
        Cache-Control:
          $ref: ../../../shared/headers/NoStoreCacheControl.yaml
        Pragma:
          $ref: ../../../shared/headers/NoStorePragma.yaml
      content:
        application/json:
          example:
            access_token: eyJhbGciOiJFUzI1NiIsImtpZCI6ImsxIn0.eyJzdWIiOiJ1c3IifQ.FAKE-signature
            id_token: eyJhbGciOiJFUzI1NiIsImtpZCI6ImsxIn0.eyJhdWQiOiJhcHAifQ.FAKE-signature
            refresh_token: rt_8e7d6c5b4a39281706f5e4d3c2b1a09f
            token_type: Bearer
            expires_in: 600
            scope: openid profile email
          schema:
            $ref: ../../components/schemas/OAuthTokenResponse.yaml
    '400':
      $ref: ../../components/responses/OAuthBadRequest.yaml
    '401':
      $ref: ../../components/responses/OAuthUnauthorized.yaml
    '429':
      $ref: ../../../shared/responses/TooManyRequests.yaml
