delete:
  operationId: deleteAgent
  description: >-
    Deletes an agent identity. Prefer decommissioning, which preserves audit
    history, unless a hard delete is required.
  summary: Delete agent
  tags:
    - Agents
  parameters:
    - $ref: ../../../shared/parameters/OrganizationID.yaml
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  responses:
    "204":
      description: Deleted
    "400":
      $ref: ../../../shared/responses/BadRequest.yaml
    "401":
      $ref: ../../../shared/responses/Unauthorized.yaml
    "403":
      $ref: ../../../shared/responses/Forbidden.yaml
    "404":
      $ref: ../../../shared/responses/NotFound.yaml
    "429":
      $ref: ../../../shared/responses/TooManyRequests.yaml
patch:
  operationId: updateAgent
  summary: Update agent
  description: >-
    Sets or clears the agent's disabled_at. A disabled agent can no longer mint
    tokens; existing tokens remain valid until they expire.
  tags:
    - Agents
  parameters:
    - $ref: ../../../shared/parameters/OrganizationID.yaml
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: false
          required:
            - disabled
          properties:
            disabled:
              type: boolean
  responses:
    "204":
      description: Updated
    "400":
      $ref: ../../../shared/responses/BadRequest.yaml
    "401":
      $ref: ../../../shared/responses/Unauthorized.yaml
    "403":
      $ref: ../../../shared/responses/Forbidden.yaml
    "404":
      $ref: ../../../shared/responses/NotFound.yaml
    "413":
      $ref: ../../../shared/responses/PayloadTooLarge.yaml
    "429":
      $ref: ../../../shared/responses/TooManyRequests.yaml
