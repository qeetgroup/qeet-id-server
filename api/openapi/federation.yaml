            type: string
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: boolean
                  description: false switches the provider off — it is no longer offered and sign-in through it is refused — until switched on again; other saves keep it off.
                client_id:
                  type: string
                client_secret:
                  type: string
                  writeOnly: true
                  description: Replaces the stored secret; omitted or empty keeps it.
                discovery_url:
                  type: string
      description: >-
        Changes only the fields given on one of the caller's organisation's
        social providers — switch it off or on, replace its secret, or change
        its client ID or discovery URL. Takes effect for the next sign-in;
        other providers are unaffected. A switched-off provider reads to a
        signing-in user exactly like one that was never set up. Audited as
        social_provider.updated (fields changed, whether the secret was
        replaced), social_provider.disabled and social_provider.enabled. 404
        for a provider the organisation does not have.
