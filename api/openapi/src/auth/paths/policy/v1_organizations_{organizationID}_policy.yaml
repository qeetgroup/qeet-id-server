get:
  operationId: getSecurityPolicy
  summary: Get policy
  tags:
    - Policy
  parameters:
    - $ref: ../../../shared/parameters/OrganizationID.yaml
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  description: >-
    The organization's security policy. An organization that has not saved one
    reads the platform defaults.
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/SecurityPolicy.yaml
    "401":
      $ref: ../../../shared/responses/Unauthorized.yaml
    "403":
      $ref: ../../../shared/responses/Forbidden.yaml
    "404":
      $ref: ../../../shared/responses/NotFound.yaml
    "422":
      $ref: ../../../shared/responses/Unprocessable.yaml
    "429":
      $ref: ../../../shared/responses/TooManyRequests.yaml
put:
  operationId: setSecurityPolicy
  summary: Update policy
  tags:
    - Policy
  parameters:
    - $ref: ../../../shared/parameters/OrganizationID.yaml
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  requestBody:
    required: false
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/SecurityPolicy.yaml
    description: The whole policy; organization_id is taken from the path.
  description: >-
    Replaces the organization's security policy. Session bounds apply to
    sessions and application grants started afterwards. A value out of range is
    refused with 422 validation_failed naming the field. The policy holds no IP
    lists: which addresses may sign in is the address rules
    (/v1/organizations/{organizationID}/ip-rules). ip_allowlist and ip_denylist are still
    accepted empty, for older consoles; entries are refused with 422
    validation_failed, code retired.
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/SecurityPolicy.yaml
    "401":
      $ref: ../../../shared/responses/Unauthorized.yaml
    "403":
      $ref: ../../../shared/responses/Forbidden.yaml
    "404":
      $ref: ../../../shared/responses/NotFound.yaml
    "422":
      $ref: ../../../shared/responses/Unprocessable.yaml
    "429":
      $ref: ../../../shared/responses/TooManyRequests.yaml
patch:
  operationId: updateSecurityPolicy
  summary: Change part of the policy
  tags:
    - Policy
  parameters:
    - $ref: ../../../shared/parameters/OrganizationID.yaml
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/SecurityPolicy.yaml
    description: >-
      Only the fields to change; a null clears a nullable one, such as
      max_sessions.
  description: >-
    Changes only the fields sent, over the stored policy, and keeps the rest;
    the read, the change and the write happen under the policy's lock, so a rule
    saved meanwhile is kept (PUT takes the same lock). Validation, auditing
    (security_policy.updated) and the step-up are as for PUT.
  responses:
    "200":
      description: The whole policy after the change
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/SecurityPolicy.yaml
    "401":
      $ref: ../../../shared/responses/Unauthorized.yaml
    "403":
      $ref: ../../../shared/responses/Forbidden.yaml
    "422":
      $ref: ../../../shared/responses/Unprocessable.yaml
    "429":
      $ref: ../../../shared/responses/TooManyRequests.yaml
