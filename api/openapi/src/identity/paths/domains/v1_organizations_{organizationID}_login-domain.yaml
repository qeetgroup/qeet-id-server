get:
  operationId: getLoginDomainStatus
  summary: Custom login domain status
  tags:
    - Domains
  description: >-
    Provisioning state of the organization's custom hosted-login hostname, plus the
    DNS records to publish, as last checked (checked_at): a read returns the
    kept result, and checks only when the hostname was never checked or has
    changed since; POST /v1/organizations/{organizationID}/login-domain/check runs a new
    check. Each stage is checked in order: the TXT record (dns_verified); then,
    over HTTPS, a certificate valid for the hostname (tls_state issued; pending
    until one is served); then the hosted login answering its health check on
    the hostname (endpoint_state live, with endpoint_url). TLS and the login
    endpoint report their own stage rather than being inferred from the DNS
    result. status is active once all three are done, pending before, and
    not_configured without a hostname.
  parameters:
    - $ref: ../../../shared/parameters/OrganizationID.yaml
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/LoginDomainStatus.yaml
    "400":
      $ref: ../../../shared/responses/BadRequest.yaml
    "401":
      $ref: ../../../shared/responses/Unauthorized.yaml
    "403":
      $ref: ../../../shared/responses/Forbidden.yaml
    "404":
      $ref: ../../../shared/responses/NotFound.yaml
    "422":
      $ref: ../../../shared/responses/Unprocessable.yaml
    "429":
      $ref: ../../../shared/responses/TooManyRequests.yaml
