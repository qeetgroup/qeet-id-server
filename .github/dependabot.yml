version: 2
# One grouped pull request a month for each ecosystem, into develop. Updates
# reach production with the next monthly release, like any other change.
updates:
  - package-ecosystem: gomod
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    groups:
      go-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    groups:
      docker-dependencies:
        patterns:
          - "*"
