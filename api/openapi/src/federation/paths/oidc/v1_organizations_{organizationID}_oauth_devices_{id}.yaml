delete:
  operationId: revokeDeviceAuthorization
  description: >-
    Revokes a device authorization in the organization so the device can no longer
    complete or continue its token poll at the token endpoint. For an
    approval the device has already redeemed, the grant it bought ends too: its
    refresh tokens stop working at once, and access tokens already issued run
    out on their own. Audited as oauth.device_revoked, with grant_ended saying
    whether a grant ended.
  summary: Revoke device authorization
  tags:
    - OIDC
  parameters:
    - $ref: ../../../shared/parameters/OrganizationID.yaml
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  responses:
    '204':
      description: Device authorization revoked
    '401':
      $ref: ../../../shared/responses/Unauthorized.yaml
    '403':
      $ref: ../../../shared/responses/Forbidden.yaml
    '404':
      $ref: ../../../shared/responses/NotFound.yaml
