get:
  operationId: getPaymentMethod
  summary: Get the payment method
  description: >-
    Returns what the organization's most recent completed checkout was paid
    with, as its provider reported it, or null. No card is kept with the
    provider: each checkout collects its own, so there is nothing to manage
    between payments. Razorpay reports a card's network and last four digits but
    not its expiry. Requires billing.read.
  tags:
    - Billing
  parameters:
    - $ref: ../../../shared/parameters/OrganizationID.yaml
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            required:
              - payment_method
            properties:
              payment_method:
                oneOf:
                  - $ref: ../../components/schemas/PaymentMethod.yaml
                  - type: 'null'
    '401':
      $ref: ../../../shared/responses/Unauthorized.yaml
    '403':
      $ref: ../../../shared/responses/Forbidden.yaml
    '404':
      $ref: ../../../shared/responses/NotFound.yaml
    '429':
      $ref: ../../../shared/responses/TooManyRequests.yaml
