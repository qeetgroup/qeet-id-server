type: object
properties:
  name:
    type: string
    minLength: 1
    maxLength: 200
  status:
    type: string
    enum:
      - active
      - suspended
  plan:
    type: string
    enum:
      - free
      - pro
      - enterprise
  region:
    type: string
    description: >-
      Read-only: the same value is accepted, as a form sends every field back;
      another is refused with 422 organization.region_read_only.
    maxLength: 64
  metadata:
    type: object
    additionalProperties: true
