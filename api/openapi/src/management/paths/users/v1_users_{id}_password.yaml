post:
  operationId: setUserPassword
  description: >-
    Administratively sets or replaces a user's password. Requires
    user.credentials. The password must meet the organization's password rules
    (minimum length and required character classes), the offline strength
    baseline and, when enabled, the breached-password check; a refusal is a 422
    naming the rule that failed (authpolicy.password_* or auth.password_weak).
    Every way the user is signed in ends in the same step, as with the
    revoke-all-sessions call, since an admin password reset is treated as
    incident response: their sessions, their hosted sign-in (browser) sessions,
    so one opened with the old password can no longer start an application's
    sign-in or enrol a passkey, the refresh grants their applications hold, the
    devices remembered to skip the second factor, and pending authorisations
    (unredeemed codes and device or back-channel sign-in requests). The user
    must authenticate again after this call. The audit record counts each
    (revoked_sessions, revoked_login_sessions, revoked_app_grants,
    revoked_trusted_devices, ended_pending_authorizations). Answers 501
    not_implemented when this server is not configured to end sign-ins. Refused
    with 403 user.credentials_shared, and nothing changes, when the account also
    belongs to another organization: its password and second factors are the
    person's credentials there too, so only they change them (the password reset
    link reaches only their address). Otherwise the person is emailed that an
    administrator of this organization made the change. The person must not
    outrank the caller: only an owner changes an owner (403
    rbac.target_is_owner), and the caller must hold every permission the person
    holds here (403 rbac.target_outranks_caller naming one); acting on yourself
    is allowed.
  summary: Set password
  tags:
    - Users
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - password
          properties:
            password:
              type: string
              minLength: 8
              maxLength: 256
  responses:
    "204":
      description: Password set
    "400":
      $ref: ../../../shared/responses/BadRequest.yaml
    "401":
      $ref: ../../../shared/responses/Unauthorized.yaml
    "403":
      $ref: ../../../shared/responses/Forbidden.yaml
    "404":
      $ref: ../../../shared/responses/NotFound.yaml
    "422":
      $ref: ../../../shared/responses/Unprocessable.yaml
    "501":
      description: Not configured on this server (`not_implemented`); nothing changes.
    "503":
      $ref: ../../../shared/responses/Overloaded.yaml
