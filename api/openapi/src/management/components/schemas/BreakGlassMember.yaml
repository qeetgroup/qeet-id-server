  - email
  - created_at
properties:
  user_id:
    type: string
    format: uuid
  email:
    type: string
  display_name:
    type: string
  created_by:
    type: string
    format: uuid
    description: The owner who named them, while that account exists.
  created_at:
    type: string
    format: date-time
