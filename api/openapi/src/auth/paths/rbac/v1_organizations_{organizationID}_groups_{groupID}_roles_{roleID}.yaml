post:
  operationId: grantGroupRole
  summary: Grant role to group
  description: >-
    Grant a role to a group. Every member of the group inherits the role's
    permissions (effective permissions = direct user grants UNION group-derived
    grants). The role and group must belong to the organization. The caller must hold
    every permission the role carries in this organization (403
    rbac.grant_exceeds_caller, naming one it lacks), and only an owner gives the
    owner role (403 rbac.owner_only); an owner may give any role. A member
    holding no role until now takes a seat; when that leaves more seats in use
    than the plan has, nothing is granted (402 billing.plan_limit, metadata
    resource seats).
  tags:
    - RBAC
  parameters:
    - $ref: ../../../shared/parameters/OrganizationID.yaml
    - name: groupID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: roleID
      in: path
      required: true
      schema:
        type: string
        format: uuid
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  responses:
    '204':
      description: Granted
    '400':
      $ref: ../../../shared/responses/BadRequest.yaml
    '401':
      $ref: ../../../shared/responses/Unauthorized.yaml
    '402':
      description: >-
        The plan has no seat left for a member holding no role
        (billing.plan_limit).
    '403':
      $ref: ../../../shared/responses/Forbidden.yaml
    '404':
      $ref: ../../../shared/responses/NotFound.yaml
delete:
  operationId: revokeGroupRole
  description: >-
    Revokes a role from a group within the organization; members lose the role's
    group-derived permissions as soon as this returns, though direct user grants
    of the same role are unaffected. This is the counterpart to the
    grant-role-to-group call, and is held to the same rule: only an owner takes
    the owner role off a group (403 rbac.owner_only), and nobody takes off a
    role carrying a permission they lack (403 rbac.grant_exceeds_caller). Review the group's remaining roles with the
    list-group-roles call.
  summary: Revoke role from group
  tags:
    - RBAC
  parameters:
    - $ref: ../../../shared/parameters/OrganizationID.yaml
    - name: groupID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: roleID
      in: path
      required: true
      schema:
        type: string
        format: uuid
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  responses:
    '204':
      description: Revoked
    '400':
      $ref: ../../../shared/responses/BadRequest.yaml
    '401':
      $ref: ../../../shared/responses/Unauthorized.yaml
    '403':
      $ref: ../../../shared/responses/Forbidden.yaml
    '404':
      $ref: ../../../shared/responses/NotFound.yaml
