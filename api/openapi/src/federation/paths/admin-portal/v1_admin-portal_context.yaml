get:
  operationId: getPortalContext
  summary: Get portal context
  description: >-
    Returns the organization name, granted capabilities, session expiry, and branding
    for the cookie-authenticated portal, and, when the link's capabilities
    include scim, the SCIM base URL to enter at the IdP.
  tags:
    - Admin Portal
  security:
    - adminPortalCookie: []
  responses:
    "200":
      description: Portal context
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/AdminPortalContext.yaml
    "401":
      $ref: ../../../shared/responses/Unauthorized.yaml
    "429":
      $ref: ../../../shared/responses/TooManyRequests.yaml
