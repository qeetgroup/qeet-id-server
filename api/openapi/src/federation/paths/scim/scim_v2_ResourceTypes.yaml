get:
  operationId: listScimResourceTypes
  description: >-
    Returns the SCIM 2.0 ResourceTypes discovery document describing the User
    and Group resources Qeet exposes as a SCIM server. Requires the SCIM bearer
    token and is mounted at the root under /scim/v2, not under /v1. Errors use
    the RFC 7644 SCIM error envelope, not the standard Qeet error shape.
  summary: '[scim] ResourceTypes'
  tags:
    - SCIM
  security:
    - scimBearer: []
  responses:
    '200':
      description: SCIM metadata
      content:
        application/scim+json:
          schema:
            type: object
            additionalProperties: true
    '401':
      $ref: ../../../shared/responses/Unauthorized.yaml
