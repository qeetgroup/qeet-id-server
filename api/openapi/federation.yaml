      description: 'Lists the effective profile attribute-mapping rules configured for a directory connection, together with the supported profile target fields. Requires connection.read and is scoped to the tenant in the path. These rules apply to SCIM user writes and LDAP just-in-time provisioning; create rules with POST and remove them with DELETE.'
      summary: List effective profile mapping rules
      tags: [Directory]
      security: [{bearerAuth: []}, {apiKeyAuth: []}]
      parameters:
        - {name: tenantID, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: connectionID, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Rules and supported profile target types
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/DirectoryMapping'}}
                  targets: {type: object, additionalProperties: {type: string}}
        '401': {description: Authentication required}
        '403': {description: Tenant mismatch or missing connection.read}
        '404': {description: Connection not found in this tenant}
    post:
      operationId: post_directory_connection_mapping
      summary: Create a profile mapping
      description: >-
        Requires connection.write. Maximum 50 rules per connection and one enabled
        rule per target. Rules apply to SCIM user writes and LDAP JIT provisioning.
        Profile data is tenant-scoped; groups are profile labels, not role or group
        membership grants. Email mapping affects creation, not existing account
        email addresses. Secret sources and privilege targets are rejected.
      tags: [Directory]
      security: [{bearerAuth: []}, {apiKeyAuth: []}]
      parameters:
        - {name: tenantID, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: connectionID, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/DirectoryMapping'}}}
      responses:
        '201':
          description: Mapping created and audited
          content: {application/json: {schema: {$ref: '#/components/schemas/DirectoryMapping'}}}
        '400': {description: Invalid source, target, type or transform}
        '401': {description: Authentication required}
        '403': {description: Tenant mismatch or missing connection.write}
        '404': {description: Connection not found in this tenant}
        '409': {description: Duplicate enabled target or rule limit reached}
  /v1/tenants/{tenantID}/directory/connections/{connectionID}/mappings/{mappingID}:
    put:
      operationId: put_directory_connection_mapping
      summary: Update a versioned profile mapping
      description: Requires connection.write. The current version is required to prevent lost updates. Audited in the same transaction.
      tags: [Directory]
      security: [{bearerAuth: []}, {apiKeyAuth: []}]
      parameters:
        - {name: tenantID, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: connectionID, in: path, required: true, schema: {type: string}}
        - {name: mappingID, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/DirectoryMapping'}}}
      responses:
        '200':
          description: Updated mapping and incremented version
          content: {application/json: {schema: {$ref: '#/components/schemas/DirectoryMapping'}}}
        '400': {description: Invalid mapping or missing version}
        '401': {description: Authentication required}
        '403': {description: Tenant mismatch or missing connection.write}
        '404': {description: Connection not found}
        '409': {description: Stale version, missing mapping or duplicate enabled target}
    delete:
      operationId: delete_directory_connection_mapping
      description: 'Deletes a single profile attribute-mapping rule from a directory connection, scoped to the tenant and connection in the path and requiring connection.write. The removal is audited in the same transaction, and subsequent SCIM writes and LDAP provisioning no longer apply the rule. Returns 404 when the mapping does not exist in this tenant and connection.'
      summary: Delete a profile mapping
      tags: [Directory]
      security: [{bearerAuth: []}, {apiKeyAuth: []}]
      parameters:
        - {name: tenantID, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: connectionID, in: path, required: true, schema: {type: string}}
        - {name: mappingID, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '204': {description: Mapping removed and audited}
        '401': {description: Authentication required}
        '403': {description: Tenant mismatch or missing connection.write}
        '404': {description: Mapping not found in this tenant and connection}
  /v1/tenants/{tenantID}/directory/connections/{connectionID}/mappings/preview:
    post:
      operationId: post_directory_connection_mappings_preview
      summary: Preview the saved mappings with source data
      description: Requires connection.read. Uses the provisioning engine, without persisting the source or changing users. Source input is capped at 64 KiB.
      tags: [Directory]
      security: [{bearerAuth: []}, {apiKeyAuth: []}]
      parameters:
        - {name: tenantID, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: connectionID, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [source], properties: {source: {type: object, additionalProperties: true}}}
      responses:
        '200':
          description: Transformed profile, per-rule preview values and validation issues
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid: {type: boolean}
                  profile: {type: object, additionalProperties: true}
                  values: {type: object, additionalProperties: true}
                  issues:
                    type: array
                    items: {type: object, properties: {mapping_id: {type: string, format: uuid}, field: {type: string}, message: {type: string}}}
        '400': {description: Invalid source JSON}
        '401': {description: Authentication required}
        '403': {description: Tenant mismatch or missing connection.read}
        '404': {description: Connection not found}
        '413': {description: Source exceeds the supported size}
  /v1/tenants/{tenantID}/directory/errors:
    get:
      operationId: get_v1_tenants_ByTenantID_directory_errors
      summary: List directory errors and remediation summary
      description: Requires connection.read. Only errors from the authenticated tenant are returned. Unknown affected-user counts are null, not inferred from request volume.
      tags: [Directory]
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - {name: tenantID, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: days, in: query, schema: {type: integer, minimum: 1, maximum: 90, default: 7}}
        - {name: connection_id, in: query, schema: {type: string, maxLength: 128}}
        - {name: severity, in: query, schema: {type: string, enum: [warning, critical]}}
        - {name: resolution, in: query, schema: {type: string, enum: [open, resolved, retried]}}
        - {name: q, in: query, schema: {type: string, maxLength: 200}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0, maximum: 100000}}
      responses:
        '200':
          description: Error page, categories, affected connections, and latest remediations
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/DirectoryEvent'}}
                  total: {type: integer}
                  limit: {type: integer}
                  offset: {type: integer}
                  summary:
                    type: object
                    properties:
                      open: {type: integer}
                      critical: {type: integer}
                      warning: {type: integer}
                      retried: {type: integer}
                      impacted_users: {type: [integer, 'null']}
                  categories:
                    type: array
                    items: {type: object, properties: {key: {type: string}, count: {type: integer}}}
                  connections:
                    type: array
                    items: {type: object, properties: {key: {type: string}, count: {type: integer}}}
                  remediations: {type: array, items: {$ref: '#/components/schemas/DirectoryEvent'}}
        '400': {description: Invalid filters}
        '401': {description: Authentication required}
        '403': {description: Tenant mismatch or missing connection.read}
  /v1/tenants/{tenantID}/directory/errors/{eventID}/resolve:
    post:
      operationId: post_v1_tenants_ByTenantID_directory_errors_ByEventID_resolve
      summary: Resolve a directory error
      description: Requires connection.write. Atomically closes an open error with an audit record. Does not retry its original operation.
      tags: [Directory]
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - {name: tenantID, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: eventID, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Error resolved
          content:
            application/json:
              schema: {type: object, properties: {succeeded: {type: boolean}}}
        '401': {description: Authentication required}
        '403': {description: Tenant mismatch or missing connection.write}
        '404': {description: Error not found in this tenant}
        '409': {description: Error already closed}
  /v1/tenants/{tenantID}/directory/errors/{eventID}/retry:
    post:
      operationId: post_v1_tenants_ByTenantID_directory_errors_ByEventID_retry
      summary: Retry a failed LDAP connection check
      description: >-
        Requires connection.write. Repeats only a failed manual LDAP bind check
        using current connection settings. SCIM pushes and sign-ins cannot be
        replayed because request bodies and credentials are never retained.
        Concurrent retries serialize and a successful retry closes the original
        error atomically with an audit record. Failed checks remain open.
      tags: [Directory]
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - {name: tenantID, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: eventID, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Check completed; succeeded reports the actual outcome
          content:
            application/json:
              schema: {type: object, properties: {succeeded: {type: boolean}}}
        '401': {description: Authentication required}
        '403': {description: Tenant mismatch or missing connection.write}
        '404': {description: Error not found in this tenant}
        '409': {description: Operation cannot be retried or is already closed}
  /v1/tenants/{tenantID}/directory/activity:
    get:
      operationId: get_v1_tenants_ByTenantID_directory_activity
      summary: List recorded directory operations
      description: >-
        Tenant-scoped SCIM writes and LDAP operations, newest first. Requires
        connection.read. Counts and durations describe observed operations, not
        provider scheduler jobs. Request bodies and credentials are never stored.
      tags: [Directory]
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - {name: tenantID, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: days, in: query, schema: {type: integer, minimum: 1, maximum: 90, default: 7}}
        - {name: connection_id, in: query, schema: {type: string, maxLength: 128}}
        - {name: status, in: query, schema: {type: string, enum: [success, warning, failed]}}
        - {name: q, in: query, schema: {type: string, maxLength: 200}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0, maximum: 100000}}
      responses:
        '200':
          description: Operation page, filtered summary, and daily UTC volumes
          content:
            application/json:
              schema:
                type: object
                required: [items, total, limit, offset, summary, volume]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/DirectoryEvent'}
                  total: {type: integer}
                  limit: {type: integer}
                  offset: {type: integer}
                  summary:
                    type: object
                    properties:
                      total: {type: integer}
                      successful: {type: integer}
                      warnings: {type: integer}
                      failed: {type: integer}
                      average_duration_ms: {type: [integer, 'null']}
                  volume:
                    type: array
                    items:
                      type: object
                      properties:
                        date: {type: string, format: date}
                        users: {type: integer}
                        groups: {type: integer}
        '400': {description: Invalid filters}
        '401': {description: Authentication required}
        '403': {description: Tenant mismatch or missing connection.read}
  /v1/tenants/{tenantID}/directory/alerts:
    post:
      operationId: post_v1_tenants_ByTenantID_directory_alerts
      summary: Create a directory failure alert
      description: >-
        Requires connection.write and a user principal. Creates an in-app alert
        for the caller when the failure threshold is reached within 15 minutes.
        Notifications are rate limited to once per alert per 15 minutes.
      tags: [Directory]
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - {name: tenantID, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, threshold]
              properties:
                name: {type: string, minLength: 1, maxLength: 100}
                connection_id: {type: [string, 'null']}
                threshold: {type: integer, minimum: 1, maximum: 100}
      responses:
        '201':
          description: Alert created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: string, format: uuid}
                  name: {type: string}
                  connection_id: {type: [string, 'null']}
                  threshold: {type: integer}
                  enabled: {type: boolean}
        '400': {description: Invalid alert settings}
        '401': {description: Authenticated user required}
        '403': {description: Tenant mismatch or missing connection.write}
        '404': {description: Connection not found in this tenant}
  /v1/tenants/{tenantID}/directory/connections:
    get:
      operationId: get_v1_tenants_ByTenantID_directory_connections
      summary: List directory connections
      description: >-
        Combines the tenant's configured SCIM endpoint and LDAP connections.
        Requires connection.read. Tenant scope is derived from the authenticated
        principal and must match the path. Credentials are never returned.
        Health is unknown until explicitly observed; last_activity_at is a request
        or login timestamp and is not evidence of a successful synchronization.
      tags:
        - Directory
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: tenantID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Directory connection inventory
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, name, reference, type, status, health, scope]
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        reference:
                          type: string
                        type:
                          type: string
                          enum: [scim, ldap]
                        status:
                          type: string
                          enum: [configured, active, draft, disabled]
                        health:
                          type: string
                          enum: [healthy, warning, failed, unknown]
                        environment:
                          type: [string, 'null']
                        scope:
                          type: string
                          enum: [users-and-groups, users-on-signin]
                        created_at:
                          type: [string, 'null']
                          format: date-time
                        last_activity_at:
                          type: [string, 'null']
                          format: date-time
                        last_sync_at:
                          type: [string, 'null']
                          format: date-time
                        user_count:
                          type: [integer, 'null']
                          minimum: 0
                        group_count:
                          type: [integer, 'null']
                          minimum: 0
                        server_url:
                          type: [string, 'null']
        '400':
          description: Invalid tenant identifier
        '401':
          description: Authentication and tenant scope required
        '403':
          description: Tenant mismatch or missing connection.read permission
        '500':
          description: Directory inventory could not be loaded
  /scim/v2/Groups:
