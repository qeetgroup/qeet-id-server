type: object
description: >-
  Immutable snapshot of one compliance evidence generation pass for a
  organization+framework pair. Controls are populated on GetRun; omitted on ListRuns.
properties:
  id:
    type: string
    format: uuid
  organization_id:
    type: string
    format: uuid
  framework:
    type: string
    enum:
      - soc2
      - iso27001
  generated_at:
    type: string
    format: date-time
  generated_by:
    type:
      - string
      - 'null'
    format: uuid
    description: Actor user ID; null when generated by a system or API-key actor.
  pass_count:
    type: integer
  fail_count:
    type: integer
  na_count:
    type: integer
  controls:
    type: array
    description: Per-control results; present on GetRun, omitted on ListRuns.
    items:
      $ref: ./EvidenceControlResult.yaml
