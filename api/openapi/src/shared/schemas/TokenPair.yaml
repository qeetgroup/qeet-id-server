type: object
required:
  - access_token
  - expires_at
  - idle_expires_at
  - refresh_token
  - session_expires_at
  - session_id
  - token_type
  - user_id
properties:
  access_token:
    type: string
  token_type:
    type: string
    example: Bearer
  expires_at:
    type: string
    format: date-time
  refresh_token:
    type: string
  session_expires_at:
    type: string
    format: date-time
    description: >-
      When the session ends however active it is: the organization's maximum
      session age from sign-in (the platform default where it sets none).
      Switching organization never moves it later.
  idle_expires_at:
    type: string
    format: date-time
    description: >-
      When the session ends unless it is renewed before then: the organization's
      idle timeout from this sign-in or renewal, never after session_expires_at.
      Clients can warn the user ahead of either time; the server refuses a
      renewal after them with 401 auth.session_timed_out whatever the client
      does.
  session_id:
    type: string
    format: uuid
  user_id:
    type: string
    format: uuid
  organization_id:
    type: string
    format: uuid
    description: >-
      The organization the token is scoped to; absent for a session that belongs
      to no organization.
