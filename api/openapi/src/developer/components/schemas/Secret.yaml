type: object
required:
  - created_at
  - id
  - last4
  - last_revealed_at
  - last_revealed_by
  - name
  - rotation_due_at
  - rotation_interval_days
  - rotation_overdue
  - scope
  - updated_at
  - value_changed_at
properties:
  created_at:
    type: string
    format: date-time
  id:
    type: string
    format: uuid
  last4:
    type: string
  name:
    type: string
  scope:
    type: string
  updated_at:
    type: string
    format: date-time
  value_changed_at:
    type: string
    format: date-time
    description: When the value was last set; a scope or interval change leaves it.
  last_revealed_at:
    type:
      - string
      - 'null'
    format: date-time
  last_revealed_by:
    description: >-
      The person who last revealed the secret; null when no one has or a machine
      credential did. Email is empty once the person no longer exists.
    oneOf:
      - type: 'null'
      - type: object
        required:
          - display_name
          - email
          - id
        properties:
          id:
            type: string
            format: uuid
          email:
            type: string
          display_name:
            type: string
  last_revealed_credential:
    type: string
    description: >-
      The id of the machine credential, such as an API key, that last revealed
      the secret; left out when a person did.
  rotation_interval_days:
    type:
      - integer
      - 'null'
  rotation_due_at:
    type:
      - string
      - 'null'
    format: date-time
    description: >-
      The rotation interval after the value last changed; null without an
      interval.
  rotation_overdue:
    type: boolean
