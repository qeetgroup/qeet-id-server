get:
  operationId: listMyOrganizations
  summary: List organizations available to the signed-in user
  tags:
    - Organizations
  security:
    - bearerAuth: []
    - ssoCookie: []
  description: >-
    Caller-scoped user-only list of the active, non-deleted organizations the
    caller belongs to (their own organization, and each one where they hold a
    role). No user or organization identity is taken from query parameters.
    last_used_at excludes the current session so automatic sign-in scope is not
    labeled as a prior selection. Also accepts the hosted-login session cookie
    (qe_ls) in place of a bearer token, so Qeet ID's own hosted pages can list
    the caller's organizations by name. The cookie belongs to Qeet ID's sign-in
    domain, so another site's browser code cannot send it.
  parameters:
    - name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 200
      description: Maximum items to return; a larger one returns 200.
    - name: cursor
      in: query
      schema:
        type: string
        format: uuid
  responses:
    "200":
      description: Eligible organization page
      content:
        application/json:
          schema:
            type: object
            required:
              - items
            properties:
              next_cursor:
                $ref: ../../../shared/schemas/NextCursor.yaml
              items:
                type: array
                items:
                  type: object
                  required:
                    - id
                    - name
                    - slug
                    - plan
                    - region
                    - logo_url
                    - domain
                    - roles
                    - last_used_at
                  properties:
                    id:
                      type: string
                      format: uuid
                    name:
                      type: string
                    slug:
                      type: string
                    plan:
                      type: string
                    region:
                      type: string
                    logo_url:
                      type: string
                    domain:
                      type: string
                      description: A verified organization domain, or empty if none.
                    roles:
                      type: array
                      items:
                        type: string
                    last_used_at:
                      type:
                        - string
                        - "null"
                      format: date-time
    "401":
      $ref: ../../../shared/responses/Unauthorized.yaml
    "403":
      $ref: ../../../shared/responses/Forbidden.yaml
    "422":
      $ref: ../../../shared/responses/Unprocessable.yaml
