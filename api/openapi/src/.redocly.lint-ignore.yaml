operations/paths/health/healthz.yaml:
  operation-4xx-response:
    - '#/get/responses'
operations/paths/health/readyz.yaml:
  operation-4xx-response:
    - '#/get/responses'
operations/paths/health/version.yaml:
  operation-4xx-response:
    - '#/get/responses'
