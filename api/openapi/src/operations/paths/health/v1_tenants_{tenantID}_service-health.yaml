get:
  operationId: getServiceHealth
  summary: Service health
  tags:
    - Health
  parameters:
    - $ref: ../../../shared/parameters/TenantID.yaml
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  description: >-
    The state of each part of the service the organisation uses, from its own
    recent figures, and the incidents operators posted that are open or were
    resolved in the last 14 days. A component is operational, degraded, outage,
    maintenance or not_configured (a part the organisation doesn't use); an open
    incident makes it no better than the incident's impact (reason incident).
    api is an outage while the database is unreachable
    (api.database_unreachable); sign_in while tokens can't be signed
    (sign_in.keys_unavailable); email is degraded when the provider refused at
    least a quarter of the organisation's emails of the last hour
    (email.failing); webhooks while a subscription's deliveries are failing or
    one was disabled for failing (webhooks.failing); directory while a directory
    operation of the last day failed and is still open (directory.failing).
    status is the worst state of the components. Requires tenant.read.
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            required:
              - status
              - checked_at
              - components
              - incidents
            properties:
              status:
                type: string
                enum:
                  - operational
                  - maintenance
                  - degraded
                  - outage
              checked_at:
                type: string
                format: date-time
              components:
                type: array
                items:
                  type: object
                  required:
                    - name
                    - state
                  properties:
                    name:
                      type: string
                      enum:
                        - api
                        - sign_in
                        - email
                        - webhooks
                        - directory
                    state:
                      type: string
                      enum:
                        - operational
                        - maintenance
                        - degraded
                        - outage
                        - not_configured
                    reason:
                      type: string
                      description: Why it isn't operational.
                    figures:
                      type: object
                      additionalProperties:
                        type: integer
                      description: >-
                        The counts its state was judged by: email sent_last_hour
                        and failed_last_hour; webhooks active, failing and
                        disabled_failing; directory ldap_connections,
                        scim_tokens and open_failures.
              incidents:
                type: array
                items:
                  type: object
                  required:
                    - id
                    - component
                    - impact
                    - title
                    - started_at
                    - resolved_at
                  properties:
                    id:
                      type: string
                      format: uuid
                    component:
                      type: string
                      enum:
                        - api
                        - sign_in
                        - email
                        - webhooks
                        - directory
                    impact:
                      type: string
                      enum:
                        - maintenance
                        - degraded
                        - outage
                    title:
                      type: string
                    detail:
                      type: string
                    started_at:
                      type: string
                      format: date-time
                    resolved_at:
                      type:
                        - string
                        - 'null'
                      format: date-time
    '401':
      $ref: ../../../shared/responses/Unauthorized.yaml
    '403':
      $ref: ../../../shared/responses/Forbidden.yaml
