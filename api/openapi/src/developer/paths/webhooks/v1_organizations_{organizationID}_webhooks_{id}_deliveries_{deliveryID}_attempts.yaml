get:
  operationId: listWebhookDeliveryAttempts
  summary: List a delivery's attempts
  description: >-
    Every attempt to send one of the webhook's deliveries, oldest first: when,
    the status answered, how long it took and what went wrong; recorded from
    this release.
  tags:
    - Webhooks
  parameters:
    - $ref: ../../../shared/parameters/OrganizationID.yaml
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: deliveryID
      in: path
      required: true
      schema:
        type: string
        format: uuid
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  responses:
    "200":
      description: Attempts
      content:
        application/json:
          schema:
            type: object
            required:
              - items
            properties:
              truncated:
                $ref: ../../../shared/schemas/Truncated.yaml
              items:
                type: array
                items:
                  $ref: ../../components/schemas/WebhookAttempt.yaml
    "400":
      $ref: ../../../shared/responses/BadRequest.yaml
    "401":
      $ref: ../../../shared/responses/Unauthorized.yaml
    "403":
      $ref: ../../../shared/responses/Forbidden.yaml
    "404":
      $ref: ../../../shared/responses/NotFound.yaml
    "429":
      $ref: ../../../shared/responses/TooManyRequests.yaml
