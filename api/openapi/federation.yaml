  /v1/oidc-connections/{id}/login:
    get:
      operationId: get_v1_oidc_connections_ById_login
      description: 'Begins a sign-in through an OpenID Connect connection: it records the sign-in''s state, PKCE verifier (S256) and nonce, sets an HttpOnly cookie binding the sign-in to this browser, and redirects the browser to the provider''s authorization endpoint, which must be https, asking for the connection''s scopes. The provider sends the browser back to GET /v1/oidc-connections/{id}/callback. Only an active connection signs anyone in: a draft one answers 403 oidc_connection.connection_draft and a disabled one 403 oidc_connection.connection_disabled. A provider that can''t be reached answers 502 oidc_connection.provider_unreachable; a discovery document that can''t be used, or whose issuer isn''t the connection''s (unless it serves many tenants and the connection lists those it accepts), 500 oidc_connection.misconfigured. The organisation''s plan must include enterprise SSO (402 billing.upgrade_required). Unauthenticated.'
      summary: Begin OIDC sign-in (public)
      tags:
        - OIDC Connections
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      security: []
      responses:
        '302':
          description: Redirect to the provider's authorization endpoint
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          description: The organisation's plan does not include enterprise SSO (`billing.upgrade_required`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/oidc-connections/{id}/callback:
    get:
      operationId: get_v1_oidc_connections_ById_callback
      description: 'Where the provider sends the browser back; register it as the connection''s redirect URI. The state is spent whatever happens next, and an unknown, spent or expired one answers 400 oidc_connection.state_invalid. A sign-in completes only in the browser that began it, holding the cookie the login call set (403 oidc_connection.other_browser). A refusal by the provider (an error parameter) answers 401 oidc_connection.provider_refused. Otherwise the code is traded at the provider''s token endpoint with the PKCE verifier (502 oidc_connection.token_exchange_failed) and the ID token is validated: its signature against the provider''s published keys (fetched again once for a key not yet seen), an asymmetric algorithm, iss equal to the connection''s issuer (or, for a provider serving many tenants, the issuer of a tid the connection lists), aud naming the client (and azp the client when it names several), exp and iat within a minute''s skew, and the nonce this sign-in sent; any failure answers 401 oidc_connection.id_token_invalid. The subject (issuer and sub) is linked to the connection, so another connection asserting it signs nobody in. A linked subject signs in while the organisation is still its account''s home (403 oidc_connection.user_tenant_mismatch). An address not yet linked is adopted or given an account only on a domain the organisation has verified (403 oidc_connection.email_domain_unverified), and not when the provider''s email_verified is false (403 oidc_connection.email_unverified); a provider that doesn''t say (Microsoft Entra ID) is trusted for those domains. An adopted account must have the organisation as its home and a verified address (403 oidc_connection.account_unverified), and one that owns or administers the organisation is never adopted by its address (403 oidc_connection.account_administers). A suspended account is refused. Every refusal is audited as auth.sign_in_failed with the error code as its reason. On success the browser goes to the console''s /sso/callback with a one-time code in the fragment (#oidc_code=...), to trade at POST /v1/oidc-connections/exchange. The plan is checked again when the answer arrives, so one that has since lapsed signs no one in (402 billing.upgrade_required). Unauthenticated.'
      summary: Complete OIDC sign-in (public)
      tags:
        - OIDC Connections
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: state
          in: query
          schema:
            type: string
        - name: code
          in: query
          schema:
            type: string
        - name: error
          in: query
          schema:
            type: string
      security: []
      responses:
        '302':
          description: Redirect to the console with a one-time login code in the fragment
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          description: The organisation's plan no longer includes enterprise SSO (`billing.upgrade_required`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/oidc-connections/exchange:
    post:
      operationId: post_v1_oidc_connections_exchange
      description: 'Trades the one-time login code an OpenID Connect sign-in handed the console for a Qeet access and refresh token pair in the connection''s organisation, while the connection is still active. The code is single-use (401 oidc_connection.login_code_used) and lasts five minutes (401 oidc_connection.login_code_expired); an unknown one answers 401 oidc_connection.login_code_invalid and none 400 oidc_connection.login_code_required. The organisation''s login hook and address rules apply. Unauthenticated; sent with Cache-Control: no-store.'
      summary: Exchange OIDC sign-in code (public)
      tags:
        - OIDC Connections
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
              properties:
                code:
                  type: string
      responses:
        '200':
          description: Token pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /ldap/{id}/authenticate:
    post:
      operationId: post_ldap_ById_authenticate
      summary: Authenticate (public)
      tags:
        - LDAP
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
                  format: password
      description: 'Signs a person in with their directory username and password and answers with a token pair, or with a challenge to complete at POST /v1/auth/mfa as for a password sign-in. The connection''s organisation''s network rules apply first (403 auth.address_not_allowed, whatever the password), then the password is checked by a bind against the connection''s directory, under the sign-in lockout, login hook, risk and second-factor rules of that organisation, as a password sign-in is. The lockout counts a username case-insensitively, ignoring extra spaces. A wrong username or password is refused with 401 ldap.invalid_credentials and counted by the lockout like a wrong password. A locked account answers 429 auth.account_locked whatever the password (a throttled source network, 429 too_many_requests), and when the lockout counters cannot be read or written the sign-in is refused with 503 auth.sign_in_unavailable. A disabled connection is refused with 403 ldap.connection_disabled, and a draft one, still being set up, with 403 ldap.connection_draft; one whose organisation''s plan no longer includes LDAP is refused with 402 billing.upgrade_required, before the directory is asked. A sign-in that needs another step (a second factor, setting one up, or a risk confirmation by an emailed code) answers with that challenge, as POST /v1/auth/login does; the session it completes is recorded as an ldap_mfa sign-in. A directory account whose email belongs to an account outside the connection''s organisation is refused with 403 ldap.account_not_in_tenant, and an account that is not active with 403 auth.account_inactive. An empty username or password is refused with 400 ldap.credentials_required, and a connection that does not verify the directory''s certificate with 422 ldap.tls_verify_required. The account signed in must have the connection''s organisation as its home (403 ldap.account_not_in_tenant), and an existing one adopted by email a verified address, or one the organisation''s directory provisioned (SCIM), which is then marked verified (403 ldap.account_unverified otherwise). A directory entry is linked to the connection that bound it. An address not yet linked is adopted or given an account only on a domain the organisation has verified (the most specific verified domain decides, 403 ldap.email_domain_unverified otherwise), and an account that owns the organisation or holds an admin permission there (user.write, role.write, group.write, connection.write, policy.write or tenant.write) is not adopted by its address (403 ldap.account_administers): it keeps its own credentials. A new account is created only while the domain that manages the address has jit_enabled on; otherwise an address with no account is refused with 403 ldap.jit_not_allowed and nothing is created. Existing members are adopted either way. Every sign-in then brings the account in step with the directory, each change audited: its display name; its address, when the directory''s is on a domain the organisation has verified, is no other account''s, and the account doesn''t administer the organisation (recovery links sent to the old address then stop working); and its groups, as GET /v1/tenants/{tenantID}/ldap/{id}/group-mappings describes.'
      responses:
        '200':
          description: Signed in with a token pair, or a challenge to complete at POST /v1/auth/mfa (the MFAChallenge of the authentication API).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/TokenPair'
                  - type: object
                    properties:
                      mfa_required:
                        type: boolean
                      mfa_token:
                        type: string
                      methods:
                        type: array
                        items:
                          type: string
                      enrollment_required:
                        type: boolean
                    additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: The directory refused the username or password (`ldap.invalid_credentials`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '402':
          description: The organisation's plan does not include LDAP (`billing.upgrade_required`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 'The organisation does not allow sign-in from this network (`auth.address_not_allowed`), the connection is disabled or still a draft (`ldap.connection_disabled`, `ldap.connection_draft`), or the account may not sign in here (`ldap.account_not_in_tenant`, `ldap.account_unverified`, `ldap.email_domain_unverified`, `ldap.account_administers`, `ldap.jit_not_allowed`, `auth.account_inactive`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          description: The account is locked (`auth.account_locked`), the source network is throttled, or the rate limit is exceeded (`too_many_requests`). A locked account gets the same answer whatever the password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: The sign-in lockout could not be evaluated, so the attempt was refused (`auth.sign_in_unavailable`, retryable).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
