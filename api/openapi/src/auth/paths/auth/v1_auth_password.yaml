get:
  operationId: getMyPasswordStatus
  summary: Password status
  description: >-
    Reports whether the caller has a password set, so the account UI can offer
    "set a password" (social/passkey accounts) vs "change password".
  tags:
    - Auth
  security:
    - bearerAuth: []
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              has_password:
                type: boolean
            required:
              - has_password
    "401":
      $ref: ../../../shared/responses/Unauthorized.yaml
post:
  operationId: setMyPassword
  summary: Change or set my password
  description: >-
    Rotates (or sets) the signed-in user's password. current_password is
    required only when one is already set; a social/passkey account may set one
    by omitting it. It needs a step-up while the caller holds a second factor
    (403 step_up_required), and otherwise a recent sign-in (403
    recent_sign_in_required). Other sessions are revoked. The new password must
    meet the rules of the organization the account belongs to (not the session's
    organization; the platform baseline of 8 characters for an account with no
    organization), the offline strength baseline and, when enabled, the
    breached-password check; a refusal is a 422 naming the rule that failed.
    Self-service. Every hosted sign-in (browser) session of the person ends too,
    so one opened with the old password can no longer start an application's
    sign-in or enrol a passkey; the audit record counts them
    (revoked_login_sessions). The session the change is made from is kept. The
    account holder is emailed that it happened, with what to do if it wasn't
    them.
  tags:
    - Auth
  security:
    - bearerAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            current_password:
              type: string
            new_password:
              type: string
              minLength: 8
              maxLength: 256
          required:
            - current_password
            - new_password
  responses:
    "200":
      description: Password updated
      content:
        application/json:
          schema:
            type: object
            required:
              - message
            properties:
              message:
                type: string
    "401":
      $ref: ../../../shared/responses/Unauthorized.yaml
    "422":
      $ref: ../../../shared/responses/Unprocessable.yaml
    "429":
      $ref: ../../../shared/responses/TooManyRequests.yaml
    "503":
      $ref: ../../../shared/responses/Overloaded.yaml
