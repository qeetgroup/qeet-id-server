type: object
required:
  - created_at
  - email
  - expires_at
  - id
  - role_id
  - tenant_id
  - tenant_name
  - tenant_slug
properties:
  created_at:
    type: string
    format: date-time
  email:
    type: string
  expires_at:
    type: string
    format: date-time
  id:
    type: string
    format: uuid
  role_id:
    type:
      - string
      - 'null'
    format: uuid
  tenant_id:
    type: string
    format: uuid
  tenant_name:
    type: string
  tenant_slug:
    type: string
