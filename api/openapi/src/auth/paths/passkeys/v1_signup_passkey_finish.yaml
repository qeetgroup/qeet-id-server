post:
  operationId: finishPasskeySignUp
  description: >-
    Completes passwordless signup by verifying the authenticator attestation
    from the begin step and creating a tenant-less user with the new passkey as
    its founding credential. On success it returns a token pair; because the
    passkey is first-class, the account has no password and can both
    authenticate and satisfy MFA with the passkey alone. As with password
    signup, create a tenant through the Identity Management API before any
    tenant-scoped call, and the creator becomes the tenant owner. An address
    already taken is refused with the neutral 422 unprocessable of POST
    /v1/auth/signup, which does not name the reason, and nothing is created.
  summary: Passkey-first signup finish (tenant-less)
  tags:
    - Passkeys
  security: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - session_id
            - credential
          properties:
            session_id:
              type: string
            credential:
              type: object
              additionalProperties: true
            name:
              type: string
    description: >-
      Verifies the attestation, creates the tenant-less user with the passkey as
      its founding credential, and returns a token pair.
  responses:
    '201':
      description: Created
      headers:
        Cache-Control:
          $ref: ../../../shared/headers/NoStoreCacheControl.yaml
        Pragma:
          $ref: ../../../shared/headers/NoStorePragma.yaml
      content:
        application/json:
          schema:
            type: object
            required:
              - access_token
              - expires_at
              - refresh_token
              - session_id
              - token_type
              - user_id
            properties:
              access_token:
                type: string
              expires_at:
                type: string
                format: date-time
              refresh_token:
                type: string
              session_id:
                type: string
                format: uuid
              token_type:
                type: string
              user_id:
                type: string
                format: uuid
    '422':
      $ref: ../../../shared/responses/Unprocessable.yaml
    '429':
      $ref: ../../../shared/responses/TooManyRequests.yaml
