type: object
additionalProperties: false
required:
  - email
  - password
properties:
  email:
    type: string
    format: email
  password:
    type: string
    minLength: 1
  client_id:
    type:
      - string
      - "null"
    maxLength: 255
    description: >-
      The OAuth client the hosted login is serving. Its organization's sign-in lockout
      settings apply where they are stricter than the platform defaults, never
      looser, to the lock on the network the attempt comes from; the lock on
      every network always uses the platform defaults. Omitted or unknown = the
      platform defaults. The account's own
      organization may still refuse password sign-in after the password is
      verified (403 auth.method_disabled).
