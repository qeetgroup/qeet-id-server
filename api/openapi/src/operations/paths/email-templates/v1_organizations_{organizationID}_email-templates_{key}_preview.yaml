post:
  operationId: previewEmailTemplate
  summary: Preview template
  tags:
    - Email Templates
  parameters:
    - $ref: ../../../shared/parameters/OrganizationID.yaml
    - name: key
      in: path
      required: true
      schema:
        type: string
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  requestBody:
    required: false
    content:
      application/json:
        schema:
          type: object
          properties:
            vars:
              type: object
              maxProperties: 32
              description: Each value is limited to 4096 UTF-8 bytes.
              additionalProperties:
                type: string
                maxLength: 4096
            locale:
              type: string
            draft:
              $ref: ../../components/schemas/EmailEditorInput.yaml
    description: Omit draft to preview saved content; include it to preview unsaved edits.
  description: >-
    Renders subject, text and sanitized branded HTML without persisting or
    sending email. Each expanded content field is limited to 200000 UTF-8 bytes
    before the branded wrapper is added.
  responses:
    "200":
      description: Rendered preview
      content:
        application/json:
          schema:
            type: object
            properties:
              subject:
                type: string
              body:
                type: string
              html:
                type: string
              locale:
                type: string
    "401":
      $ref: ../../../shared/responses/Unauthorized.yaml
    "403":
      $ref: ../../../shared/responses/Forbidden.yaml
    "404":
      $ref: ../../../shared/responses/NotFound.yaml
    "422":
      $ref: ../../../shared/responses/Unprocessable.yaml
    "429":
      $ref: ../../../shared/responses/TooManyRequests.yaml
