get:
  operationId: listGroups
  summary: List groups
  tags:
    - Groups
  parameters:
    - $ref: ../../../shared/parameters/OrganizationID.yaml
    - name: role
      in: query
      required: false
      description: Only the groups granted this role. Needs role.read.
      schema:
        type: string
        format: uuid
    - name: grants
      in: query
      required: false
      description: Only the groups that grant some role, or none. Needs role.read.
      schema:
        type: string
        enum:
          - some
          - none
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  description: >-
    Lists the organization's groups. Requires group.read. A caller who also
    holds role.read gets each group's roles (those granted to the group itself),
    all read in one query, and may filter by them; without it roles are left
    out, and a role filter is refused with 403.
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            required:
              - items
            properties:
              truncated:
                $ref: ../../../shared/schemas/Truncated.yaml
              items:
                type: array
                items:
                  $ref: ../../components/schemas/Group.yaml
    "400":
      $ref: ../../../shared/responses/BadRequest.yaml
    "401":
      $ref: ../../../shared/responses/Unauthorized.yaml
    "403":
      $ref: ../../../shared/responses/Forbidden.yaml
    "404":
      $ref: ../../../shared/responses/NotFound.yaml
    "422":
      $ref: ../../../shared/responses/Unprocessable.yaml
    "429":
      $ref: ../../../shared/responses/TooManyRequests.yaml
