get:
  operationId: getUserAccess
  summary: User access summary
  description: >-
    Per-user access within the caller's tenant (User 360): the organization
    (tenant), directly-assigned roles, group memberships, and counts of
    consented applications and enabled tenant policies. Requires `user.read`.
  tags:
    - Users
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  responses:
    '200':
      description: Access summary
      content:
        application/json:
          schema:
            type: object
            properties:
              organization:
                type:
                  - object
                  - 'null'
                properties:
                  id:
                    type: string
                    format: uuid
                  name:
                    type: string
                  slug:
                    type: string
              roles:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                    name:
                      type: string
                    description:
                      type: string
              groups:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                    name:
                      type: string
                    description:
                      type: string
              applications_count:
                type: integer
              policies_count:
                type: integer
              permissions_direct:
                type: integer
              permissions_inherited:
                type: integer
              permissions_total:
                type: integer
    '401':
      $ref: ../../../shared/responses/Unauthorized.yaml
    '403':
      $ref: ../../../shared/responses/Forbidden.yaml
    '404':
      $ref: ../../../shared/responses/NotFound.yaml
