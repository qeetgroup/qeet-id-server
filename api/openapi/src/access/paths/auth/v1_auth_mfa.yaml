post:
  operationId: completeSignInMfa
  summary: Complete MFA login
  description: >-
    Exchanges the mfa_token from /v1/auth/login, plus exactly one proof from the
    factors the challenge listed, for a token pair: a code, a passkey assertion,
    or an approved push. An enrolment challenge is completed instead by a code
    from the authenticator app set up for it (POST /v1/auth/mfa/enroll) — the
    response then carries the account's new recovery codes, shown once — or
    skipped while its grace period runs. A wrong proof counts against the
    challenge's and the account's attempt budgets. A wrong proof is recorded in
    the organization's audit trail as auth.sign_in_failed (method mfa, reason
    code_invalid, with the proof kind and the attempts left). Fifty wrong proofs
    in a row, however far apart, lock the person's second-factor sign-in: that
    answer and every later one is 403 mfa.locked, even with the right proof, the
    lock is audited as auth.mfa_locked and the person is emailed. A right proof
    ends a shorter run; a password reset, a password change or set, or an
    administrator's reset of their factors lifts the lock.
  tags:
    - Auth
  security: []
  requestBody:
    required: true
    content:
      application/json:
        example:
          mfa_token: eyJhbGciOiJFUzI1NiIsImtpZCI6ImsxIn0.eyJwdXJwb3NlIjoibWZhIn0.FAKE-signature
          code: "492817"
        schema:
          type: object
          required:
            - mfa_token
          properties:
            mfa_token:
              type: string
            code:
              type: string
              description: >-
                An authenticator-app code, a one-time recovery code, or a code
                sent to an email or SMS factor (POST /v1/auth/mfa/send).
            passkey:
              type: object
              description: >-
                An assertion from the passkey ceremony begun for this challenge
                (POST /v1/auth/mfa/passkey/begin).
              properties:
                session_id:
                  type: string
                  format: uuid
                credential:
                  type: object
                  additionalProperties: true
            push:
              type: boolean
              description: >-
                true to complete with the push request sent for this challenge
                (POST /v1/auth/mfa/push). Answers 409 mfa.push_pending — not
                counted as a failed attempt — until it is approved on the
                device; a denied request counts as a wrong answer, an expired
                one answers mfa.push_challenge_expired.
            skip:
              type: boolean
              description: >-
                true to put off setting up a second factor, for an enrolment
                challenge that carries enrollment_due_at; a session is issued
                without one. Refused with 403 mfa.enrollment_required once the
                grace period has ended. Not counted as an attempt.
  responses:
    "200":
      description: >-
        Second factor verified (or, for an enrolment challenge, set up or put
        off); token pair issued, with recovery_codes when an authenticator app
        was just set up.
      headers:
        Cache-Control:
          $ref: ../../../shared/headers/NoStoreCacheControl.yaml
        Pragma:
          $ref: ../../../shared/headers/NoStorePragma.yaml
      content:
        application/json:
          example:
            access_token: eyJhbGciOiJFUzI1NiIsImtpZCI6ImsxIn0.eyJzdWIiOiIwMThmMmE3MCJ9.FAKE-signature
            token_type: Bearer
            expires_at: "2026-09-24T10:30:00Z"
            refresh_token: Jk3vQm9xT2pL0sWc8hYbR4nZaE6uFi1oPq7dGt5yHw0
            session_expires_at: "2026-10-24T10:15:00Z"
            idle_expires_at: "2026-10-01T10:15:00Z"
            session_id: "018f2a70-5b6c-7d8e-9f01-2a3b4c5d6e7f"
            user_id: "018f2a70-1a2b-7c3d-9e4f-5a6b7c8d9e0f"
            organization_id: "018f2a6c-9c3d-7e4a-b2f1-3a5c9d8e1f00"
          schema:
            allOf:
              - $ref: ../../../shared/schemas/TokenPair.yaml
              - type: object
                properties:
                  recovery_codes:
                    type: array
                    items:
                      type: string
    "400":
      $ref: ../../../shared/responses/BadRequest.yaml
    "401":
      $ref: ../../../shared/responses/Unauthorized.yaml
    "403":
      $ref: ../../../shared/responses/Forbidden.yaml
    "413":
      $ref: ../../../shared/responses/PayloadTooLarge.yaml
    "422":
      $ref: ../../../shared/responses/Unprocessable.yaml
    "429":
      $ref: ../../../shared/responses/TooManyRequests.yaml
    "503":
      $ref: ../../../shared/responses/Overloaded.yaml
