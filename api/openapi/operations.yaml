        - bearerAuth: []
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                enabled:
                  type:
                    - boolean
                    - "null"
      responses:
        "200":
          description: Updated
        "400":
