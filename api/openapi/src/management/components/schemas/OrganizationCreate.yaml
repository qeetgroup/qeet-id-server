type: object
required:
  - slug
  - name
properties:
  slug:
    type: string
    minLength: 2
    maxLength: 64
  name:
    type: string
    minLength: 1
    maxLength: 200
  plan:
    type: string
    enum:
      - free
      - pro
      - enterprise
  region:
    type: string
    description: >-
      Optional. Only the region this service is hosted in is accepted (422
      organization.region_unavailable, with metadata.available, otherwise); the
      organization is created there either way.
    maxLength: 64
  metadata:
    type: object
    additionalProperties: true
