get:
  operationId: listBreakGlassMembers
  summary: List break-glass members
  tags:
    - Domains
  description: >-
    Lists the members who keep their own sign-in methods (password, magic links,
    passkeys, password resets) on a domain where the organisation requires
    single sign-on, so an outage of its identity provider can't lock everyone
    out. Requires connection.read.
  parameters:
    - $ref: ../../../shared/parameters/TenantID.yaml
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  responses:
    '200':
      description: The organisation's break-glass members
      content:
        application/json:
          schema:
            type: object
            properties:
              truncated:
                $ref: ../../../shared/schemas/Truncated.yaml
              items:
                type: array
                items:
                  $ref: ../../components/schemas/BreakGlassMember.yaml
    '401':
      $ref: ../../../shared/responses/Unauthorized.yaml
    '403':
      $ref: ../../../shared/responses/Forbidden.yaml
