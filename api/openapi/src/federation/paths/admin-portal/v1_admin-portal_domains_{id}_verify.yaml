post:
  operationId: verifyPortalDomain
  summary: Verify a domain (portal)
  description: >-
    Looks up the domain's TXT record and, on a match, marks it verified, as the
    organization-admin verify-domain endpoint does. A domain another organization has
    verified answers 409 domainverify.claimed_by_other; a record not found yet
    422 domainverify.dns_record_missing (retryable). Requires the link's
    capabilities to include domain_verification; the domain must belong to the
    organization bound to the portal session. Audited as domain.verified by the admin
    portal.
  tags:
    - Admin Portal
  security:
    - adminPortalCookie: []
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    "200":
      description: The domain, verified
      content:
        application/json:
          schema:
            $ref: ../../../shared/schemas/Domain.yaml
    "401":
      $ref: ../../../shared/responses/Unauthorized.yaml
    "403":
      $ref: ../../../shared/responses/Forbidden.yaml
    "404":
      $ref: ../../../shared/responses/NotFound.yaml
    "409":
      $ref: ../../../shared/responses/Conflict.yaml
    "422":
      $ref: ../../../shared/responses/Unprocessable.yaml
