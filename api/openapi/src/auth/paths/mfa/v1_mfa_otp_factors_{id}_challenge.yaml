post:
  operationId: challengeOtpFactor
  summary: Challenge OTP factor
  tags:
    - MFA
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  security:
    - bearerAuth: []
  description: >-
    Sends a step-up code to one of the caller's confirmed email or SMS factors,
    to verify at /v1/mfa/otp/verify. A code to one factor can be sent at most
    every 30 seconds, ten an hour to one person and five an hour to one address
    or number over every account; past that the call answers 429
    mfa.code_send_limited with retry_after (seconds). A new code makes the
    factor's earlier unused code stop working. A step-up code works only for a
    step-up, and a code sent for a sign-in or to confirm a new factor never
    counts here; its message says what it is for. An SMS code needs an
    organization whose plan includes SMS (403 upgrade_required). Each code sent
    is audited as mfa.otp_sent.
  responses:
    '201':
      description: Created
      content:
        application/json:
          schema:
            type: object
            required:
              - message
            properties:
              message:
                type: string
    '401':
      $ref: ../../../shared/responses/Unauthorized.yaml
    '403':
      $ref: ../../../shared/responses/Forbidden.yaml
    '404':
      $ref: ../../../shared/responses/NotFound.yaml
    '422':
      $ref: ../../../shared/responses/Unprocessable.yaml
    '429':
      $ref: ../../../shared/responses/TooManyRequests.yaml
