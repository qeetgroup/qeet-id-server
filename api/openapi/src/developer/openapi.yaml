openapi: 3.1.0
info:
  title: Qeet ID — Developer API (keys, webhooks, secrets, agents)
  version: 0.2.0
  description: >-
    Non-human identities and developer integrations for Qeet ID — API keys, AI
    agents, webhooks, auth hooks, vaults, and verifiable credentials.


    ## The non-human identity model


    - **API keys** resolve to actor_type `api_key`.

    - **Service principals** (defined in the Federation API) resolve to
    actor_type `service`.

    - **AI agents** resolve to actor_type `agent`.


    ## Start here


    1. Create an **API key** for simple machine access (`Authorization: ApiKey
    <key>`), or register an **agent** for AI workloads.

    2. **Agent tokens are re-minted, never refreshed** — call the mint endpoint
    again to obtain a fresh short-lived token.

    3. Wire up **webhooks** and **auth hooks** to react to events and customize
    auth flows.

    4. Store secrets in the **Secrets Vault** (organization secrets) or connect
    third-party accounts via the **Token Vault** (external OAuth credentials,
    refreshed for you).


    ## Authentication


    Auth modes: `bearerAuth` (user/service JWT), `apiKeyAuth` (`Authorization:
    ApiKey <key>` — legacy scheme), `scimBearer` (per-organization SCIM token),
    `clientCredentials` (OAuth M2M), and `ssoCookie` (hosted-login SSO session).
    CSRF protection applies only to cookie sessions (`ssoCookie`): requests
    authorised by `bearerAuth` or `apiKeyAuth` bypass it, as do the
    token endpoint (POST /v1/oauth/token) and the directory
    sign-in (POST /ldap/{id}/authenticate), which carry their credentials in the
    request. Basic credentials do not bypass it. A request that fails the check
    is refused with 403 `csrf_failed`.


    The responses of the token vault's access-token read, and of the
    operations returning a new API key, agent or webhook
    secret, a revealed secret or an issued credential, are sent with
    `Cache-Control: no-store` and `Pragma: no-cache`.


    Every response carries an `X-Request-Id` header naming the request; quote it
    when reporting a problem. An error body repeats it as `error.request_id`.
    A path with an encoded slash or backslash (`%2F`, `%5C`) is refused with
    400 `bad_request`.


    ## Related APIs


    - **Authentication & Access API** — login, passkeys, MFA, authorization

    - **Identity Management API** — organizations, users, groups, invitations

    - **Federation API** — OIDC/OAuth provider, SAML, SCIM, LDAP, social

    - **Operations API** — audit, analytics, billing


    ## Contract maintenance


    This document covers routes mounted by internal/bootstrap/router.go.
    internal/bootstrap/openapi_coverage_test.go walks the production mount
    helpers and fails when a mounted operation is undocumented, a documented
    operation is stale, or API-auth security declarations disagree with runtime
    classification.
servers:
  - url: https://api.id.qeet.in
    description: Production
  - url: http://localhost:4001
    description: Local (make dev)
tags:
  - name: API Keys
    description: Long-lived API keys for machine access.
  - name: Agents
    description: >-
      AI agent identities — register agents, which get short-lived scoped
      tokens at the token endpoint by client_credentials (re-minted, never
      refreshed); manage sponsorship, suspension and decommissioning.
  - name: Credentials
    description: >-
      Verifiable credentials — issue, list and revoke W3C / JWT-VC documents,
      plus public verification.
  - name: Auth Hooks
    description: >-
      Custom authentication hooks (actions) invoked during authentication
      flows. Each call is a POST signed as a webhook delivery is: X-Qeet-Timestamp
      (Unix seconds) and X-Qeet-Signature, "sha256=" and the hex HMAC-SHA256,
      keyed by the hook's secret, of the timestamp, a ".", and the raw body. For
      24 hours after the secret is changed the header holds two comma-separated
      values, the new secret's first; accept the call if any one matches. Verify
      in constant time before parsing, and refuse a timestamp more than a few
      minutes old, so a captured call can't be replayed.
  - name: Webhooks
    description: >-
      Outbound webhook endpoint management. A subscription names the events it
      receives, from the event catalogue; an event's name is its version, so an
      incompatible payload change comes as a new name, while new fields may be
      added to any payload. Each delivery is a POST whose JSON body is the
      envelope {id, type, organization_id, occurred_at, data}: id is the same in every
      delivery of one event, retries included, so deduplicate on it, and data is
      the event's own payload. Deliveries are at least once and in no guaranteed
      order. Headers: X-Qeet-Event (the type), X-Qeet-Delivery-ID,
      X-Qeet-Timestamp (Unix seconds) and X-Qeet-Signature, "sha256=" and the
      hex HMAC-SHA256, keyed by the subscription's secret, of the timestamp, a
      ".", and the raw body. For 24 hours after the secret is rotated the header
      holds two comma-separated values, the new secret's first; accept the
      delivery if any one matches. Verify in constant time before parsing, and
      refuse a timestamp more than a few minutes old. Answer 2xx quickly: a
      network error, a 5xx, 408 or 429 is retried with jittered backoff from 30
      seconds up to an hour, for 60 attempts; any other 4xx dead-letters the
      delivery at once. A dead-lettered delivery stays in the delivery list and
      can be sent again. A subscription whose deliveries fail for 3 days with no
      success is disabled (disabled_reason "failing") and the members who hold
      webhook.write are alerted in-app; deliveries queued meanwhile are sent
      once it is enabled again.
  - name: Secrets
    description: Per-organization encrypted secrets vault.
  - name: Token Vault
    description: >-
      Third-party OAuth credential storage with transparent refresh, for calling
      external services on a user's behalf — distinct from Secrets Vault (organization
      secrets).
