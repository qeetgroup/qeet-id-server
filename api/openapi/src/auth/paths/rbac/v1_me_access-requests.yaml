get:
  operationId: listMyAccessRequests
  summary: List my access requests
  description: >-
    The signed-in person's requests for a role in the organization they're
    signed in to, newest first (up to 100), with their answers.
  tags:
    - RBAC
  security:
    - bearerAuth: []
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            required:
              - access_requests
            properties:
              access_requests:
                type: array
                items:
                  $ref: ../../components/schemas/AccessRequest.yaml
    "401":
      $ref: ../../../shared/responses/Unauthorized.yaml
post:
  operationId: createAccessRequest
  summary: Ask for a role
  description: >-
    Asks the organization for one of its roles, for duration_hours (1 to 2160,
    90 days) or, without it, for good, with a reason the people who can grant
    roles see. They're told in the app and on their linked phones. Any role but
    the owner role can be asked for (404 otherwise). A role held directly is
    refused with 409 access_request.role_held, and a second request for a role
    already asked for with 409 access_request.pending. A request nobody answers
    lapses after 14 days.
  tags:
    - RBAC
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - role_id
            - reason
          additionalProperties: false
          properties:
            role_id:
              type: string
              format: uuid
              description: The role asked for.
            reason:
              type: string
              maxLength: 500
              description: Why, in 1 to 500 characters.
            duration_hours:
              type: integer
              minimum: 1
              maximum: 2160
              description: How long the role is needed; absent means for good.
  security:
    - bearerAuth: []
  responses:
    "201":
      description: Asked
      content:
        application/json:
          schema:
            type: object
            required:
              - access_request
            properties:
              access_request:
                $ref: ../../components/schemas/AccessRequest.yaml
    "400":
      $ref: ../../../shared/responses/BadRequest.yaml
    "401":
      $ref: ../../../shared/responses/Unauthorized.yaml
    "404":
      $ref: ../../../shared/responses/NotFound.yaml
    "409":
      $ref: ../../../shared/responses/Conflict.yaml
