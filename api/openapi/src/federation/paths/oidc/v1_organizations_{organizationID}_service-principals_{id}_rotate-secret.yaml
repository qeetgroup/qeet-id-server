post:
  operationId: rotateServicePrincipalSecret
  summary: Rotate service principal secret
  description: >-
    Gives a service principal a new client secret, returned only now, and keeps
    the old secret getting tokens for overlap_hours (default 24, at most 168; 0
    stops it at once). Tokens already issued are unaffected. The new secret
    carries the principal's scopes, so the caller must hold every one of them,
    as for creating one (403 rbac.grant_exceeds_caller, the secret unchanged).
    Requires apikey.write. Needs a recent step-up. Audited as
    service_principal.secret_rotated.
  tags:
    - OIDC
  parameters:
    - $ref: ../../../shared/parameters/OrganizationID.yaml
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  requestBody:
    required: false
    content:
      application/json:
        schema:
          type: object
          properties:
            overlap_hours:
              type: integer
              minimum: 0
              maximum: 168
              description: >-
                How long the old secret goes on working beside the new one.
                Defaults to 24; 0 stops it at once.
  responses:
    '200':
      description: The new secret, shown once
      headers:
        Cache-Control:
          $ref: ../../../shared/headers/NoStoreCacheControl.yaml
        Pragma:
          $ref: ../../../shared/headers/NoStorePragma.yaml
      content:
        application/json:
          schema:
            type: object
            required:
              - client_id
              - client_secret
              - previous_secret_expires_at
              - warning
            properties:
              client_id:
                type: string
                format: uuid
              client_secret:
                type: string
              previous_secret_expires_at:
                type: string
                format: date-time
                description: When the old secret stops working.
              warning:
                type: string
    '401':
      $ref: ../../../shared/responses/Unauthorized.yaml
    '403':
      $ref: ../../../shared/responses/Forbidden.yaml
    '404':
      $ref: ../../../shared/responses/NotFound.yaml
    '422':
      $ref: ../../../shared/responses/Unprocessable.yaml
