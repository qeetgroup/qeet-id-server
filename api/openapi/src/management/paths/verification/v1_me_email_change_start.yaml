post:
  operationId: startMyEmailChange
  summary: Start changing my email
  description: >-
    Sends a verification code to the address the caller wants to move to, to
    prove they control it; confirm it with the confirm-email-change call. The
    answer is the same whether or not the address is already in use by another
    account. An address in use is sent a notice that it already has an account
    instead of a code, and is never assigned to the caller.
  tags:
    - Verification
  security:
    - bearerAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            email:
              type: string
              format: email
          required:
            - email
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            required:
              - message
            properties:
              message:
                type: string
    '401':
      $ref: ../../../shared/responses/Unauthorized.yaml
    '422':
      $ref: ../../../shared/responses/Unprocessable.yaml
    '429':
      $ref: ../../../shared/responses/TooManyRequests.yaml
