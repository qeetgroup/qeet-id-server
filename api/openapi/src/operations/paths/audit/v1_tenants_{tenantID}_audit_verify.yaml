get:
  operationId: verifyAuditChain
  summary: Verify audit chain
  description: >-
    Walks the tenant's hash chain from the seed and recomputes each row's hash,
    returning the first broken link (if any). No side effects.
  tags:
    - Audit
  parameters:
    - $ref: ../../../shared/parameters/TenantID.yaml
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  responses:
    '200':
      description: >-
        { ok: bool, rows_checked: int, last_verified_id?: uuid, broken_at_id?:
        uuid, broken_reason?: string, reason_code?: string }
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/AuditVerifyResult.yaml
    '401':
      $ref: ../../../shared/responses/Unauthorized.yaml
    '403':
      $ref: ../../../shared/responses/Forbidden.yaml
