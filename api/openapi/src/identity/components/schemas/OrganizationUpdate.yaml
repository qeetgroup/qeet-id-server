type: object
additionalProperties: false
properties:
  name:
    type:
      - string
      - "null"
    minLength: 1
    maxLength: 200
  status:
    type:
      - string
      - "null"
    enum:
      - active
      - suspended
      - null
  region:
    type:
      - string
      - "null"
    description: >-
      Read-only: the same value is accepted, as a form sends every field back;
      another is refused with 422 organization.region_read_only.
    maxLength: 64
  logo_url:
    type:
      - string
      - "null"
    maxLength: 3000000
    description: >-
      The logo, a hosted URL or a small inline data URL, up to 3,000,000
      characters; empty removes it.
  metadata:
    type:
      - object
      - "null"
    additionalProperties: true
