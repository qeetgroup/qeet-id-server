get:
  operationId: listWebhookEvents
  summary: List webhook events
  tags:
    - Webhooks
  parameters:
    - $ref: ../../../shared/parameters/OrganizationID.yaml
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  description: >-
    Lists the event catalogue: every event a webhook subscription can name, with
    what it reports. Requires webhook.read.
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            required:
              - items
            properties:
              items:
                type: array
                items:
                  $ref: ../../components/schemas/WebhookEventType.yaml
    '400':
      $ref: ../../../shared/responses/BadRequest.yaml
    '401':
      $ref: ../../../shared/responses/Unauthorized.yaml
    '403':
      $ref: ../../../shared/responses/Forbidden.yaml
    '429':
      $ref: ../../../shared/responses/TooManyRequests.yaml
