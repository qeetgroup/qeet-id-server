post:
  operationId: claimPairingCode
  summary: Link this phone with a pairing code
  description: >-
    Called by the mobile app, which holds no signed-in session, to link the
    phone it runs on to the account that asked for the pairing code. The code is
    read as typed or scanned: case, spaces and hyphens do not matter, and O, I
    and L read as 0, 1 and 1. Like registering a device, it returns the
    account's user_id, the device and its device_token, which is shown only
    here. A wrong, used or expired code, or one whose account is no longer
    active, answers 401 mfa.pairing_code_invalid, all alike. Throttled per
    address (429). Audited as mfa.push_device_linked. The account holder is
    emailed that it happened, with what to do if it wasn't them.
  tags:
    - MFA
  security: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: false
          required:
            - code
            - push_token
            - platform
          properties:
            code:
              type: string
              minLength: 1
            name:
              type:
                - string
                - "null"
            push_token:
              type: string
              minLength: 1
            platform:
              type: string
              enum:
                - ios
                - android
  responses:
    "201":
      description: The phone is linked; device_token is returned once
      headers:
        Cache-Control:
          $ref: ../../../shared/headers/NoStoreCacheControl.yaml
        Pragma:
          $ref: ../../../shared/headers/NoStorePragma.yaml
      content:
        application/json:
          schema:
            type: object
            required:
              - user_id
              - device
              - device_token
            properties:
              user_id:
                type: string
                format: uuid
              device:
                $ref: ../../components/schemas/PushDevice.yaml
              device_token:
                type: string
              account:
                type: object
                description: >-
                  The account the phone now approves sign-ins for, so the app
                  can name it.
                required:
                  - email
                properties:
                  email:
                    type: string
                    format: email
    "400":
      $ref: ../../../shared/responses/BadRequest.yaml
    "401":
      $ref: ../../../shared/responses/Unauthorized.yaml
    "413":
      $ref: ../../../shared/responses/PayloadTooLarge.yaml
    "429":
      $ref: ../../../shared/responses/TooManyRequests.yaml
