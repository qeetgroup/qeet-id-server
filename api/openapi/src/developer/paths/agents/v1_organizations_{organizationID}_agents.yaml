get:
  operationId: listAgents
  description: Lists the AI agent identities registered in the organization.
  summary: List agents
  tags:
    - Agents
  parameters:
    - $ref: ../../../shared/parameters/OrganizationID.yaml
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  responses:
    '200':
      description: Agents (secrets are write-only, not returned)
      content:
        application/json:
          schema:
            type: object
            properties:
              truncated:
                $ref: ../../../shared/schemas/Truncated.yaml
              items:
                type: array
                items:
                  $ref: ../../components/schemas/Agent.yaml
    '401':
      $ref: ../../../shared/responses/Unauthorized.yaml
    '403':
      $ref: ../../../shared/responses/Forbidden.yaml
post:
  operationId: createAgent
  description: >-
    Registers a new AI agent identity. It gets short-lived access tokens at
    the token endpoint (POST /v1/oauth/token, grant_type client_credentials,
    its id as client_id and its secret as client_secret); agents resolve to
    actor_type `agent`.
    Send an Idempotency-Key header to retry it safely: a retry with the same key
    and body within 24 hours gets the first answer, marked Idempotent-Replayed:
    true; the same key with another body answers 422 idempotency.key_reused, one
    still being processed 409 idempotency.in_progress, and one whose first
    request stopped before answering 409 idempotency.outcome_unknown: check
    whether it took effect, then retry with a new key. A credential carries only
    authority its creator holds: every scope must be one the caller holds (a
    vault scope needs secret.read; a machine caller, a scope of its own), or the
    request is refused with 403 rbac.grant_exceeds_caller naming the scope.
  summary: Create agent
  tags:
    - Agents
  parameters:
    - $ref: ../../../shared/parameters/OrganizationID.yaml
    - $ref: ../../../shared/parameters/IdempotencyKey.yaml
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - name
            - sponsor_user_id
          properties:
            name:
              type: string
            scopes:
              type: array
              items:
                type: string
            token_ttl_seconds:
              type: integer
            sponsor_user_id:
              type: string
              format: uuid
              description: >-
                The named human owner accountable for this agent. Must be a
                member of this organization.
  responses:
    '201':
      description: Agent created (secret returned once)
      headers:
        Cache-Control:
          $ref: ../../../shared/headers/NoStoreCacheControl.yaml
        Pragma:
          $ref: ../../../shared/headers/NoStorePragma.yaml
        Idempotent-Replayed:
          $ref: ../../../shared/headers/IdempotentReplayed.yaml
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/Agent.yaml
    '401':
      $ref: ../../../shared/responses/Unauthorized.yaml
    '403':
      $ref: ../../../shared/responses/Forbidden.yaml
    '409':
      description: >-
        A request with this Idempotency-Key is still being processed
        (idempotency.in_progress); retry shortly. Or the first request stopped
        before answering and may have taken effect
        (idempotency.outcome_unknown): check, then retry with a new key.
    '422':
      $ref: ../../../shared/responses/Unprocessable.yaml
