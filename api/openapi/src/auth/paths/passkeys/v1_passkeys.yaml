get:
  operationId: listMyPasskeys
  summary: List passkeys
  tags:
    - Passkeys
  security:
    - bearerAuth: []
    - ssoCookie: []
  description: >-
    The signed-in user's passkeys, newest first, and whether they may add one.
    Also accepts the hosted-login session cookie (qe_ls) in place of a bearer
    token, so the hosted login can show a signed-in user their passkeys.
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            required:
              - items
              - enrollment_allowed
            properties:
              truncated:
                $ref: ../../../shared/schemas/Truncated.yaml
              items:
                type: array
                items:
                  $ref: ../../components/schemas/Passkey.yaml
              enrollment_allowed:
                type: boolean
                description: >-
                  False when the user's organization has passkeys switched off
                  (auth policy passkey_enabled): do not offer adding a passkey,
                  which register begin and finish then refuse (403
                  passkey.disabled). Always true for a user without an
                  organization.
    "401":
      $ref: ../../../shared/responses/Unauthorized.yaml
    "403":
      $ref: ../../../shared/responses/Forbidden.yaml
    "404":
      $ref: ../../../shared/responses/NotFound.yaml
    "422":
      $ref: ../../../shared/responses/Unprocessable.yaml
    "429":
      $ref: ../../../shared/responses/TooManyRequests.yaml
