get:
  operationId: listOidcResources
  summary: List resources
  description: >-
    The organization's registered resources (RFC 8707): the downstream services
    its applications may ask tokens for, with the resource parameter at
    authorize or the token endpoint. A token issued for a resource names it
    alone as its audience, so the platform API and every other service refuse
    it; an unregistered resource is refused with invalid_target.
    server_client_id, when set, is the application that serves the resource and
    may introspect tokens issued for it.
  tags:
    - OIDC
  parameters:
    - $ref: ../../../shared/parameters/OrganizationID.yaml
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  responses:
    "200":
      description: Registered resources
      content:
        application/json:
          schema:
            type: object
            required:
              - items
            properties:
              truncated:
                $ref: ../../../shared/schemas/Truncated.yaml
              items:
                type: array
                items:
                  $ref: ../../components/schemas/OIDCResource.yaml
    "400":
      $ref: ../../../shared/responses/BadRequest.yaml
    "401":
      $ref: ../../../shared/responses/Unauthorized.yaml
    "403":
      $ref: ../../../shared/responses/Forbidden.yaml
    "429":
      $ref: ../../../shared/responses/TooManyRequests.yaml
post:
  operationId: registerOidcResource
  summary: Register a resource
  description: >-
    Registers a resource: identifier is an absolute URI without a fragment (422
    oidc.resource_invalid), unique on the platform (409 oidc.resource_exists),
    not the platform's own token issuer or audience or on their host or this
    API's public host (409 oidc.resource_reserved), not on a domain another
    organization has verified (409 oidc.resource_domain_taken), and, when it
    has a host, on one the organization has verified, itself or a domain above
    it (403 oidc.resource_domain_unverified; an identifier without a host, such
    as a URN, needs none); server_client_id, optional, must be one of the
    organization's applications. Audited as oidc.resource_registered. Every
    organization's tokens share one issuer, so a resource server should also
    check the token's organization_id claim is its own organization.
  tags:
    - OIDC
  parameters:
    - $ref: ../../../shared/parameters/OrganizationID.yaml
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: false
          required:
            - identifier
          properties:
            identifier:
              type: string
              format: uri
            name:
              type:
                - string
                - "null"
            server_client_id:
              type:
                - string
                - "null"
  responses:
    "201":
      description: Registered
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/OIDCResource.yaml
    "400":
      $ref: ../../../shared/responses/BadRequest.yaml
    "401":
      $ref: ../../../shared/responses/Unauthorized.yaml
    "403":
      $ref: ../../../shared/responses/Forbidden.yaml
    "409":
      $ref: ../../../shared/responses/Conflict.yaml
    "413":
      $ref: ../../../shared/responses/PayloadTooLarge.yaml
    "422":
      $ref: ../../../shared/responses/Unprocessable.yaml
    "429":
      $ref: ../../../shared/responses/TooManyRequests.yaml
