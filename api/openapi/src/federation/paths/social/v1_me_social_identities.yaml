get:
  operationId: listMySocialIdentities
  summary: List my connected social accounts
  description: >-
    The signed-in (tenant-less/console) user's connected social identities,
    recorded by platform sign-in and the link flow.
  tags:
    - Social
  security:
    - bearerAuth: []
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            required:
              - items
            properties:
              truncated:
                $ref: ../../../shared/schemas/Truncated.yaml
              items:
                type: array
                items:
                  $ref: ../../components/schemas/ExternalIdentity.yaml
    '401':
      $ref: ../../../shared/responses/Unauthorized.yaml
    '429':
      $ref: ../../../shared/responses/TooManyRequests.yaml
