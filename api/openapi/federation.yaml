      summary: Remove a provider
      tags:
        - Social
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      description: >-
        Removes one of the caller's organisation's social providers. The
        identities people linked through it are kept — they still show in those
        people's connected accounts and work again if the provider is added
        back — but nobody can sign in through it meanwhile. Refused with 409
        social.provider_in_use (metadata.people: how many) while anyone in the
        organisation can sign in only through it (no password, no passkey, no
        other linked identity); switch it off instead, or give them another way
        in first. Audited as social_provider.deleted. 404 for a provider the
        organisation does not have.
      responses:
        '204':
          description: Removed
