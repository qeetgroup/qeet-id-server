post:
  operationId: evaluateAccess
  summary: AuthZEN evaluation
  description: >-
    OpenID AuthZEN core PDP evaluation request, answered by the same composed
    decision as the permission and relation checks (an ABAC deny refuses; then
    roles, relationships and ABAC allow policies are a union). When
    resource.type is "permission", action.name is the permission key; otherwise
    resource becomes "type:id" and action.name the relation. The response
    context always carries decided_by. ABAC policies see the request's
    properties, subject.properties as subject.*, resource.properties as
    resource.*, action.properties as action.*, and context (but for explain) as
    context.*. What the platform knows of the subject (id, type, organization_id, and
    for a person, groups and roles) wins over a property of the same name, as
    resource.type and resource.id and action.name win over theirs. A
    relationship check expands at most 1,000 distinct object#relation pairs,
    and a request's checks together read at most 5,000 relationship sets; past
    either it is refused with 422 rebac.check_too_complex.
  tags:
    - AuthZEN
  parameters:
    - $ref: ../../../shared/parameters/OrganizationID.yaml
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - subject
            - action
          properties:
            subject:
              type: object
              properties:
                type:
                  type: string
                id:
                  type: string
                properties:
                  type: object
                  description: The subject's attributes for ABAC policies (subject.*).
                  additionalProperties: true
            resource:
              type: object
              properties:
                type:
                  type: string
                id:
                  type: string
                properties:
                  type: object
                  description: The resource's attributes for ABAC policies (resource.*).
                  additionalProperties: true
            action:
              type: object
              properties:
                name:
                  type: string
                properties:
                  type: object
                  description: The action's attributes for ABAC policies (action.*).
                  additionalProperties: true
            context:
              type: object
              description: >-
                Optional. The request's attributes for ABAC policies
                (context.*), such as ip or mfa. { explain: true } includes the
                grant path and the decision's trace inline in the response
                context, and is not an attribute.
              additionalProperties: true
  responses:
    "200":
      description: "{ decision: bool, context: { decided_by, paths | path, trace } }"
      content:
        application/json:
          schema:
            type: object
            properties:
              decision:
                type: boolean
              context:
                type: object
    "401":
      $ref: ../../../shared/responses/Unauthorized.yaml
    "403":
      $ref: ../../../shared/responses/Forbidden.yaml
    "422":
      $ref: ../../../shared/responses/Unprocessable.yaml
