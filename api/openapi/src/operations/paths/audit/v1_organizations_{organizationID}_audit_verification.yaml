get:
  operationId: getAuditVerification
  summary: The audit chain's last verification
  description: >-
    How the scheduled audit-chain verification (every six hours, going on from
    where it left each chain, with a full walk at least weekly) last left the
    organization's chain, read rather than walked: whether it has reached it
    yet, when it last verified it and up to which event, whether a break was
    found and when, and when the latest run finished and its scope. GET
    /v1/organizations/{organizationID}/audit/verify still walks the whole chain on request.
    Needs audit.read.
  tags:
    - Audit
  parameters:
    - $ref: ../../../shared/parameters/OrganizationID.yaml
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  responses:
    "200":
      description: The last verification
      content:
        application/json:
          schema:
            type: object
            required:
              - verified
              - intact
              - last_verified_at
              - broken_at
              - last_verified_event_id
              - last_run_at
              - last_run_scope
            properties:
              verified:
                type: boolean
                description: Whether the scheduled verification has reached the chain.
              intact:
                type: boolean
                description: No break found; false also while not yet verified.
              last_verified_at:
                type:
                  - string
                  - "null"
                format: date-time
              broken_at:
                type:
                  - string
                  - "null"
                format: date-time
                description: When a break was found; it stays until resolved.
              last_verified_event_id:
                type:
                  - string
                  - "null"
                format: uuid
              last_run_at:
                type:
                  - string
                  - "null"
                format: date-time
                description: When the latest scheduled run finished.
              last_run_scope:
                type: string
                description: all (a full walk) or incremental; empty before any run.
    "401":
      $ref: ../../../shared/responses/Unauthorized.yaml
    "403":
      $ref: ../../../shared/responses/Forbidden.yaml
