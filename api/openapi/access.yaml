        honeypot:
          type: boolean
        score_threshold:
          type: number
        signature:
          type: boolean
        ua_check:
          type: boolean
    Anomaly:
      type: object
      properties:
        resolved_by:
          type: string
          format: uuid
          description: The person who resolved it; absent while open.
        resolved_by_email:
          type: string
        id:
          type: string
          format: uuid
        type:
          type: string
          description: e.g. credential_stuffing (an account locked after repeated failed sign-ins) or password_spraying (a source network throttled for failing against many accounts).
        severity:
