post:
  operationId: cancelSubscription
  summary: Cancel at period end
  tags:
    - Billing
  parameters:
    - $ref: ../../../shared/parameters/OrganizationID.yaml
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  description: >-
    Cancels the subscription at the end of the current period; it stays active
    until then. Requires billing.write.
  responses:
    "201":
      description: Created
      content:
        application/json:
          schema:
            type: object
            required:
              - cancel_at_period_end
            properties:
              cancel_at_period_end:
                type: boolean
    "400":
      $ref: ../../../shared/responses/BadRequest.yaml
    "401":
      $ref: ../../../shared/responses/Unauthorized.yaml
    "403":
      $ref: ../../../shared/responses/Forbidden.yaml
    "404":
      $ref: ../../../shared/responses/NotFound.yaml
    "422":
      $ref: ../../../shared/responses/Unprocessable.yaml
    "429":
      $ref: ../../../shared/responses/TooManyRequests.yaml
