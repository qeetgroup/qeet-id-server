delete:
  operationId: forgetMyTrustedDevice
  summary: Forget one of my remembered devices
  description: >-
    Forgets one of the caller's remembered devices, so it is asked for the
    second factor at its next sign-in. 404 for a device that is not the
    caller's. Audited as auth.trusted_device_revoked.
  tags:
    - Auth
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  security:
    - bearerAuth: []
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              forgotten:
                type: integer
                description: How many devices were forgotten.
    '401':
      $ref: ../../../shared/responses/Unauthorized.yaml
    '403':
      $ref: ../../../shared/responses/Forbidden.yaml
    '404':
      $ref: ../../../shared/responses/NotFound.yaml
    '429':
      $ref: ../../../shared/responses/TooManyRequests.yaml
