get:
  operationId: listDeletedUsers
  description: >-
    Lists soft-deleted users held in the organization recycle bin. From here an
    account can be brought back with the restore call or removed permanently
    with the purge call.
  summary: List deleted users
  tags:
    - Users
  parameters:
    - $ref: ../../components/parameters/Limit.yaml
    - $ref: ../../../shared/parameters/Cursor.yaml
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  responses:
    '200':
      description: Soft-deleted users
      content:
        application/json:
          schema:
            type: object
            properties:
              next_cursor:
                $ref: ../../../shared/schemas/NextCursor.yaml
              items:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                    email:
                      type: string
                    display_name:
                      type:
                        - string
                        - 'null'
                    deleted_at:
                      type: string
                      format: date-time
                    deleted_by:
                      type:
                        - string
                        - 'null'
                      format: uuid
                      description: The admin who deleted the user; null when not recorded.
                    created_at:
                      type: string
                      format: date-time
    '401':
      $ref: ../../../shared/responses/Unauthorized.yaml
