type: object
required:
  - schemas
  - Operations
properties:
  schemas:
    type: array
    items:
      type: string
    example:
      - urn:ietf:params:scim:api:messages:2.0:PatchOp
  Operations:
    type: array
    items:
      type: object
      required:
        - op
      properties:
        op:
          type: string
          enum:
            - add
            - remove
            - replace
        path:
          type: string
        value: {}
