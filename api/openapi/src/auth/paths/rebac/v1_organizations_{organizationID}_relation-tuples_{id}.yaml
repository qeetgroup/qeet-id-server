delete:
  operationId: deleteRelationTuple
  description: >-
    Removes a relationship tuple by its identifier, severing that edge in the
    ReBAC graph. Any access that depended solely on this tuple is revoked as
    soon as this returns, so re-verify affected grants with the relation-check
    call. This is the counterpart to the write-tuple call.
  summary: Delete relation tuple
  tags:
    - ReBAC
  parameters:
    - $ref: ../../../shared/parameters/OrganizationID.yaml
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  responses:
    "204":
      description: Deleted
    "401":
      $ref: ../../../shared/responses/Unauthorized.yaml
    "403":
      $ref: ../../../shared/responses/Forbidden.yaml
    "404":
      $ref: ../../../shared/responses/NotFound.yaml
