  /v1/tenants/{tenantID}/ldap/{id}/group-mappings:
    get:
      operationId: get_v1_tenants_ByTenantID_ldap_ById_group_mappings
      summary: List group mappings
      description: 'Lists the group mappings of an LDAP connection in the tenant. Each maps a group the directory gives the person (idp_group, compared ignoring case) to one of the organisation''s groups. The groups are the values of the connection''s directory mapping targeting groups when it has one (with its transform, such as extracting the CN), else of the entry''s memberOf. At every sign-in through the connection the person joins the groups those reach, through these mappings or as the external id of a group SCIM provisioned, and leaves the groups the connection''s sign-ins put them in that they no longer reach. A membership an administrator or SCIM made is never changed, and a group whose roles carry the owner role or an administrative permission (user.write, role.write, group.write, connection.write, policy.write or tenant.write) is never joined: sign-in takes out anyone it put there. Requires connection.read; an unknown connection, or another organisation''s, answers 404.'
      tags:
        - LDAP
      parameters:
        - name: tenantID
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        '200':
          description: The connection's group mappings
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/SSOGroupMapping'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: post_v1_tenants_ByTenantID_ldap_ById_group_mappings
      summary: Map a directory group
      description: 'Maps a group the directory gives the person (a memberOf DN, or the value the connection''s groups mapping makes of it) to one of the organisation''s groups, from each person''s next sign-in. Whoever maps a group hands out what it grants: the caller must hold every permission the group''s roles carry, as adding a member needs (403 rbac.grant_exceeds_caller, or rbac.owner_only for a group holding the owner role). A group whose roles carry the owner role or an administrative permission can''t be mapped at all (422 group.mapping_privileged), and the group must be the organisation''s (404 group.not_found). The same pair twice is refused with 409 group.mapping_exists, an empty or over-long idp_group with 422 validation_failed, and a connection holds up to 1,000 mappings (422 group.mapping_too_many). Audited as ldap.group_mapping_created. Requires group.write. Needs a recent step-up.'
      tags:
        - LDAP
      parameters:
        - name: tenantID
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SSOGroupMappingCreate'
      responses:
        '201':
          description: Mapped
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SSOGroupMapping'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /v1/tenants/{tenantID}/ldap/{id}/group-mappings/{mappingID}:
    delete:
      operationId: delete_v1_tenants_ByTenantID_ldap_ById_group_mappings_ByMappingID
      summary: Remove a group mapping
      description: 'Removes a group mapping of the connection. Once none of the connection''s mappings reaches the group, the memberships of it the connection''s sign-ins made end at once, each audited as group.member_removed; one a SCIM group''s external id still reaches comes back at the person''s next sign-in. Audited as ldap.group_mapping_deleted. Requires group.write. Needs a recent step-up.'
      tags:
        - LDAP
      parameters:
        - name: tenantID
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: mappingID
          in: path
          required: true
          schema:
            type: string
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        '204':
          description: Removed
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/tenants/{tenantID}/directory/connections/{connectionID}/mappings:
    get:
      operationId: get_directory_connection_mappings
      description: 'Lists the effective profile attribute-mapping rules configured for a directory connection, together with the supported profile target fields. Requires connection.read and is scoped to the tenant in the path. These rules apply to SCIM user writes and LDAP just-in-time provisioning; create rules with POST and remove them with DELETE.'
      summary: List effective profile mapping rules
      tags: [Directory]
      security: [{bearerAuth: []}, {apiKeyAuth: []}]
      parameters:
        - {name: tenantID, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: connectionID, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Rules and supported profile target types
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/DirectoryMapping'}}
                  targets: {type: object, additionalProperties: {type: string}}
        '401': {description: Authentication required}
        '403': {description: Tenant mismatch or missing connection.read}
        '404': {description: Connection not found in this tenant}
    post:
      operationId: post_directory_connection_mapping
      summary: Create a profile mapping
      description: >-
        Requires connection.write. Maximum 50 rules per connection and one enabled
        rule per target. Rules apply to SCIM user writes and LDAP JIT provisioning.
        Profile data is tenant-scoped; groups are profile labels, not role or group
        membership grants. Email mapping affects creation, not existing account
        email addresses. Secret sources and privilege targets are rejected.
      tags: [Directory]
      security: [{bearerAuth: []}, {apiKeyAuth: []}]
      parameters:
        - {name: tenantID, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: connectionID, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/DirectoryMapping'}}}
      responses:
        '201':
          description: Mapping created and audited
          content: {application/json: {schema: {$ref: '#/components/schemas/DirectoryMapping'}}}
        '400': {description: 'Invalid id, version or body'}
        '422': {description: 'Mapping refused: validation_failed, with error.fields[0].field naming the property at fault (source_attribute, target_field, value_type, transform or pattern) and error.fields[0].code the reason: directory.mapping_source_invalid, directory.mapping_source_credential, directory.mapping_target_unsupported, directory.mapping_value_type_mismatch, directory.mapping_transform_unsupported, directory.mapping_pattern_unexpected or directory.mapping_pattern_invalid.'}
        '401': {description: Authentication required}
        '403': {description: Tenant mismatch or missing connection.write}
        '404': {description: Connection not found in this tenant}
        '409': {description: Duplicate enabled target or rule limit reached}
  /v1/tenants/{tenantID}/directory/connections/{connectionID}/mappings/{mappingID}:
    put:
      operationId: put_directory_connection_mapping
      summary: Update a versioned profile mapping
      description: Requires connection.write. The current version is required to prevent lost updates. Audited in the same transaction.
      tags: [Directory]
      security: [{bearerAuth: []}, {apiKeyAuth: []}]
      parameters:
        - {name: tenantID, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: connectionID, in: path, required: true, schema: {type: string}}
        - {name: mappingID, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/DirectoryMapping'}}}
      responses:
        '200':
          description: Updated mapping and incremented version
          content: {application/json: {schema: {$ref: '#/components/schemas/DirectoryMapping'}}}
        '400': {description: 'Invalid id, version or body'}
        '422': {description: 'Mapping refused: validation_failed, with error.fields[0].field naming the property at fault (source_attribute, target_field, value_type, transform or pattern) and error.fields[0].code the reason: directory.mapping_source_invalid, directory.mapping_source_credential, directory.mapping_target_unsupported, directory.mapping_value_type_mismatch, directory.mapping_transform_unsupported, directory.mapping_pattern_unexpected or directory.mapping_pattern_invalid.'}
        '401': {description: Authentication required}
        '403': {description: Tenant mismatch or missing connection.write}
        '404': {description: Connection not found}
        '409': {description: 'Stale version, missing mapping or duplicate enabled target'}
    delete:
      operationId: delete_directory_connection_mapping
      description: 'Deletes a single profile attribute-mapping rule from a directory connection, scoped to the tenant and connection in the path and requiring connection.write. The removal is audited in the same transaction, and subsequent SCIM writes and LDAP provisioning no longer apply the rule. Returns 404 when the mapping does not exist in this tenant and connection.'
      summary: Delete a profile mapping
      tags: [Directory]
      security: [{bearerAuth: []}, {apiKeyAuth: []}]
      parameters:
        - {name: tenantID, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: connectionID, in: path, required: true, schema: {type: string}}
        - {name: mappingID, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '204': {description: Mapping removed and audited}
        '401': {description: Authentication required}
        '403': {description: Tenant mismatch or missing connection.write}
        '404': {description: Mapping not found in this tenant and connection}
  /v1/tenants/{tenantID}/directory/connections/{connectionID}/mappings/preview:
    post:
      operationId: post_directory_connection_mappings_preview
      summary: Preview the saved mappings with source data
      description: Requires connection.read. Uses the provisioning engine, without persisting the source or changing users. Source input is capped at 64 KiB.
      tags: [Directory]
      security: [{bearerAuth: []}, {apiKeyAuth: []}]
      parameters:
        - {name: tenantID, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: connectionID, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [source], properties: {source: {type: object, additionalProperties: true}}}
      responses:
        '200':
          description: Transformed profile, per-rule preview values and validation issues
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid: {type: boolean}
                  profile: {type: object, additionalProperties: true}
                  values: {type: object, additionalProperties: true}
                  effective:
                    type: object
                    description: "Every field the person would get, with its value and where it came from: a mapping, or the connection's own default where no mapping sets it (SCIM userName and displayName; an LDAP connection's email and name attributes, mail and cn unless set)."
                    additionalProperties:
                      type: object
                      required: [value, from, attribute]
                      properties:
                        value: {}
                        from: {type: string, enum: [mapping, default]}
                        attribute: {type: string, description: The source attribute it was read from.}
                  issues:
                    type: array
                    items:
                      type: object
                      required: [mapping_id, field, code, message]
                      properties:
                        mapping_id: {type: string, format: uuid, description: 'The mapping at fault; the nil UUID for directory.mapping_preview_too_large.'}
                        field: {type: string, description: 'Target profile field of the mapping at fault; empty for directory.mapping_preview_too_large.'}
                        code:
                          type: string
                          description: Stable reason for the issue; word it from this.
                          enum:
                          - directory.mapping_preview_too_large
                          - directory.mapping_source_invalid
                          - directory.mapping_source_credential
                          - directory.mapping_target_unsupported
                          - directory.mapping_target_duplicate
                          - directory.mapping_value_type_mismatch
                          - directory.mapping_transform_unsupported
                          - directory.mapping_pattern_unexpected
                          - directory.mapping_pattern_invalid
                          - directory.mapping_source_missing
                          - directory.mapping_source_empty
                          - directory.mapping_value_not_string
                          - directory.mapping_value_not_array
                          - directory.mapping_value_too_long
                          - directory.mapping_value_too_many
                          - directory.mapping_value_unmatched
                          - directory.mapping_email_invalid
                          - directory.mapping_display_name_too_long
                        message: {type: string, description: 'English text kept for compatibility; it may change.'}
        '400': {description: Invalid source JSON}
        '401': {description: Authentication required}
        '403': {description: Tenant mismatch or missing connection.read}
        '404': {description: Connection not found}
        '413': {description: Source exceeds the supported size}
  /v1/tenants/{tenantID}/directory/errors:
    get:
      operationId: get_v1_tenants_ByTenantID_directory_errors
      summary: List directory errors and remediation summary
      description: Requires connection.read. Only errors from the authenticated tenant are returned. Unknown affected-user counts are null, not inferred from request volume. A person's own credentials refused at an LDAP sign-in is not an error here (it shows in the sync activity as a warning and doesn't count towards alerts); the service account or the directory refusing is. A later successful operation on a connection (a passing check, sign-in or push) resolves its open connection and permission failures, as resolved by the system (resolved_by null) and audited as directory.errors_resolved; a failure being retried is left for its retry.
      tags: [Directory]
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - {name: tenantID, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: days, in: query, schema: {type: integer, minimum: 1, maximum: 90, default: 7}}
        - {name: connection_id, in: query, schema: {type: string, maxLength: 128}}
        - {name: severity, in: query, schema: {type: string, enum: [warning, critical]}}
        - {name: resolution, in: query, schema: {type: string, enum: [open, resolved, retried]}}
        - {name: q, in: query, schema: {type: string, maxLength: 200}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0, maximum: 100000}}
      responses:
        '200':
          description: Error page, categories, affected connections, and latest remediations
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/DirectoryEvent'}}
                  total: {type: integer}
                  limit: {type: integer}
                  offset: {type: integer}
                  summary:
                    type: object
                    properties:
                      open: {type: integer}
                      critical: {type: integer}
                      warning: {type: integer}
                      retried: {type: integer}
                      impacted_users: {type: [integer, 'null']}
                  categories:
                    type: array
                    items: {type: object, properties: {key: {type: string}, count: {type: integer}}}
                  connections:
                    type: array
                    items: {type: object, properties: {key: {type: string}, count: {type: integer}}}
                  remediations: {type: array, items: {$ref: '#/components/schemas/DirectoryEvent'}}
        '400': {description: Invalid filters}
        '401': {description: Authentication required}
        '403': {description: Tenant mismatch or missing connection.read}
  /v1/tenants/{tenantID}/directory/errors/{eventID}/resolve:
    post:
      operationId: post_v1_tenants_ByTenantID_directory_errors_ByEventID_resolve
      summary: Resolve a directory error
      description: Requires connection.write. Atomically closes an open error with an audit record. Does not retry its original operation.
      tags: [Directory]
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - {name: tenantID, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: eventID, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Error resolved
          content:
            application/json:
              schema: {type: object, properties: {succeeded: {type: boolean}}}
        '401': {description: Authentication required}
        '403': {description: Tenant mismatch or missing connection.write}
        '404': {description: Error not found in this tenant}
        '409': {description: Error already closed}
  /v1/tenants/{tenantID}/directory/errors/{eventID}/retry:
    post:
      operationId: post_v1_tenants_ByTenantID_directory_errors_ByEventID_retry
      summary: Retry a failed LDAP connection check
      description: >-
        Requires connection.write. Repeats only a failed manual LDAP bind check
        using current connection settings. SCIM pushes and sign-ins cannot be
        replayed because request bodies and credentials are never retained.
        Concurrent retries serialize and a successful retry closes the original
        error atomically with an audit record. Failed checks remain open.
      tags: [Directory]
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - {name: tenantID, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: eventID, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Check completed; succeeded reports the actual outcome
          content:
            application/json:
              schema: {type: object, properties: {succeeded: {type: boolean}}}
        '401': {description: Authentication required}
        '403': {description: Tenant mismatch or missing connection.write}
        '404': {description: Error not found in this tenant}
        '409': {description: Operation cannot be retried or is already closed}
  /v1/tenants/{tenantID}/directory/activity:
    get:
      operationId: get_v1_tenants_ByTenantID_directory_activity
      summary: List recorded directory operations
      description: >-
        Tenant-scoped SCIM writes and LDAP operations, newest first. Requires
        connection.read. Counts and durations describe observed operations, not
        provider scheduler jobs. Request bodies and credentials are never stored.
      tags: [Directory]
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - {name: tenantID, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: days, in: query, schema: {type: integer, minimum: 1, maximum: 90, default: 7}}
        - {name: connection_id, in: query, schema: {type: string, maxLength: 128}}
        - {name: status, in: query, schema: {type: string, enum: [success, warning, failed]}}
        - {name: q, in: query, schema: {type: string, maxLength: 200}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0, maximum: 100000}}
      responses:
        '200':
          description: Operation page, filtered summary, and daily UTC volumes
          content:
            application/json:
              schema:
                type: object
                required: [items, total, limit, offset, summary, volume]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/DirectoryEvent'}
                  total: {type: integer}
                  limit: {type: integer}
                  offset: {type: integer}
                  summary:
                    type: object
                    properties:
                      total: {type: integer}
                      successful: {type: integer}
                      warnings: {type: integer}
                      failed: {type: integer}
                      average_duration_ms: {type: [integer, 'null']}
                  volume:
                    type: array
                    items:
                      type: object
                      properties:
                        date: {type: string, format: date}
                        users: {type: integer}
                        groups: {type: integer}
        '400': {description: Invalid filters}
        '401': {description: Authentication required}
        '403': {description: Tenant mismatch or missing connection.read}
  /v1/tenants/{tenantID}/directory/alerts:
    get:
      operationId: get_v1_tenants_ByTenantID_directory_alerts
      summary: List directory failure alerts
      description: >-
        Requires connection.read. Every alert of the organisation, newest first,
        with the person it notifies (user_id), when it was made and when it last
        notified.
      tags: [Directory]
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - {name: tenantID, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: The alerts
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/DirectoryAlert'}
        '401': {description: Authentication required}
        '403': {description: Tenant mismatch or missing connection.read}
    post:
      operationId: post_v1_tenants_ByTenantID_directory_alerts
      summary: Create a directory failure alert
      description: >-
        Requires connection.write and a user principal. Creates an in-app alert
        for the caller when the failure threshold is reached within 15 minutes.
        Notifications are rate limited to once per alert per 15 minutes.
        Audited as directory.alert_created.
      tags: [Directory]
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - {name: tenantID, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, threshold]
              properties:
                name: {type: string, minLength: 1, maxLength: 100}
                connection_id: {type: [string, 'null']}
                threshold: {type: integer, minimum: 1, maximum: 100}
      responses:
        '201':
          description: Alert created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DirectoryAlert'}
        '400': {description: Invalid alert settings}
        '401': {description: Authenticated user required}
        '403': {description: Tenant mismatch or missing connection.write}
        '404': {description: Connection not found in this tenant}
  /v1/tenants/{tenantID}/directory/alerts/{alertID}:
    patch:
      operationId: patch_v1_tenants_ByTenantID_directory_alerts_ByAlertID
      summary: Change or pause a directory failure alert
      description: >-
        Requires connection.write. Changes the fields given on one of the
        organisation's alerts: enabled false pauses it, a connection_id of ""
        makes it cover every connection. Audited as directory.alert_updated.
      tags: [Directory]
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - {name: tenantID, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: alertID, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string, minLength: 1, maxLength: 100}
                connection_id: {type: string, description: 'A connection of the organisation, or "" for every connection.'}
                threshold: {type: integer, minimum: 1, maximum: 100}
                enabled: {type: boolean}
      responses:
        '200':
          description: The alert as changed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DirectoryAlert'}
        '400': {description: Invalid alert settings}
        '401': {description: Authentication required}
        '403': {description: Tenant mismatch or missing connection.write}
        '404': {description: 'No such alert in the organisation, or an unknown connection'}
    delete:
      operationId: delete_v1_tenants_ByTenantID_directory_alerts_ByAlertID
      summary: Remove a directory failure alert
      description: Requires connection.write. Removes one of the organisation's alerts. Audited as directory.alert_deleted.
      tags: [Directory]
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - {name: tenantID, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: alertID, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '204': {description: Removed}
        '401': {description: Authentication required}
        '403': {description: Tenant mismatch or missing connection.write}
        '404': {description: No such alert in the organisation}
  /v1/tenants/{tenantID}/directory/profiles/{userID}:
    get:
      operationId: get_v1_tenants_ByTenantID_directory_profiles_ByUserID
      summary: A person's directory profile
      description: >-
        Requires user.read. The fields each directory connection's mappings set
        on the person (email, display_name, first_name, last_name, department,
        title, manager_id, groups), as the directory last sent them, one item
        per connection, newest first, with the connection and when it updated
        them. A person of another organisation has none here.
      tags: [Directory]
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - {name: tenantID, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: userID, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: The person's profiles
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [connection_id, connection_name, fields, updated_at]
                      properties:
                        connection_id: {type: string}
                        connection_name: {type: string, description: 'The connection''s name; empty if it was removed.'}
                        fields: {type: object, additionalProperties: true}
                        updated_at: {type: string, format: date-time}
        '400': {description: Invalid person}
        '401': {description: Authentication required}
        '403': {description: Tenant mismatch or missing user.read}
  /v1/tenants/{tenantID}/directory/connections:
    get:
      operationId: get_v1_tenants_ByTenantID_directory_connections
      summary: List directory connections
      description: >-
        Combines the tenant's configured SCIM endpoint and LDAP connections.
        Requires connection.read. Tenant scope is derived from the authenticated
        principal and must match the path. Credentials are never returned.
        Health is unknown until explicitly observed; last_activity_at is a request
        or login timestamp and is not evidence of a successful synchronization.
      tags:
        - Directory
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: tenantID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Directory connection inventory
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, name, reference, type, status, health, scope]
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        reference:
                          type: string
                        type:
                          type: string
                          enum: [scim, ldap]
                        status:
                          type: string
                          enum: [configured, active, draft, disabled]
                        health:
                          type: string
                          enum: [healthy, warning, failed, unknown]
                        environment:
                          type: [string, 'null']
                        scope:
                          type: string
                          enum: [users-and-groups, users-on-signin]
                        created_at:
                          type: [string, 'null']
                          format: date-time
                        last_activity_at:
                          type: [string, 'null']
                          format: date-time
                        last_sync_at:
                          type: [string, 'null']
                          format: date-time
                        user_count:
                          type: [integer, 'null']
                          minimum: 0
                          description: SCIM, the people it provisioned; LDAP, the people with an identity this connection signed in (not deleted ones).
                        group_count:
                          type: [integer, 'null']
                          minimum: 0
                          description: SCIM, the groups it provisioned; null for LDAP, which provisions none.
                        server_url:
                          type: [string, 'null']
        '400':
          description: Invalid tenant identifier
        '401':
          description: Authentication and tenant scope required
        '403':
          description: Tenant mismatch or missing connection.read permission
        '500':
          description: Directory inventory could not be loaded
  /scim/v2/Groups:
    get:
      operationId: get_scim_v2_Groups
      description: 'Lists the groups SCIM provisioned for the tenant identified by the SCIM bearer token (a group an administrator made is neither listed nor readable or changeable here, so a directory can''t put anyone in a group that carries roles), with optional SCIM filtering and pagination, returning a SCIM 2.0 ListResponse, with Qeet acting as the SCIM server. Mounted at the root under /scim/v2, not under /v1. Errors use the RFC 7644 SCIM error envelope rather than the standard Qeet error shape.'
      summary: "[scim] List groups"
      tags:
        - SCIM
      parameters:
        - in: query
          name: filter
          schema:
            type: string
        - in: query
          name: startIndex
          schema:
            type: integer
        - in: query
          name: count
          schema:
            type: integer
      security:
        - scimBearer: []
      responses:
        '200':
          description: ListResponse
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/SCIMListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: post_scim_v2_Groups
      description: 'Provisions a new group in the tenant identified by the SCIM bearer token, with Qeet acting as the SCIM 2.0 server for an external IdP. The group, and every later change to it and its members, is audited (group.created, group.updated, group.member_added, group.member_removed, group.deleted; actor scim). Mounted at the root under /scim/v2, not under /v1. Errors use the RFC 7644 SCIM error envelope, not the standard Qeet error shape.'
      summary: "[scim] Create group"
      tags:
        - SCIM
      security:
        - scimBearer: []
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              $ref: '#/components/schemas/SCIMGroup'
      responses:
        '201':
          description: Group created
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/SCIMGroup'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/SCIMConflict'
  /scim/v2/Groups/{id}:
    delete:
      operationId: delete_scim_v2_Groups_ById
      description: 'Deletes a provisioned group by id for the tenant identified by the SCIM bearer token, with Qeet acting as the SCIM server. Mounted at the root under /scim/v2, not under /v1. Errors use the RFC 7644 SCIM error envelope rather than the standard Qeet error shape.'
      summary: "[scim] Delete group"
      tags:
        - SCIM
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      security:
        - scimBearer: []
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    get:
      operationId: get_scim_v2_Groups_ById
      description: 'Returns a single provisioned group by id for the tenant identified by the SCIM bearer token, with Qeet acting as the SCIM server. Mounted at the root under /scim/v2, not under /v1. Errors use the RFC 7644 SCIM error envelope rather than the standard Qeet error shape.'
      summary: "[scim] Get group"
      tags:
        - SCIM
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      security:
        - scimBearer: []
      responses:
        '200':
          description: Group
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/SCIMGroup'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: patch_scim_v2_Groups_ById
      description: 'Applies a SCIM PatchOp to a group, typically a membership add or remove or an attribute change, for the tenant identified by the SCIM bearer token, with Qeet acting as the SCIM server. Mounted at the root under /scim/v2, not under /v1. Errors use the RFC 7644 SCIM error envelope, not the standard Qeet error shape. Adding someone holding no role to a group that carries one takes a seat; when the plan''s seats are all taken the whole change is refused with 403 in that envelope and nothing changes.'
      summary: "[scim] Patch group"
      tags:
        - SCIM
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      security:
        - scimBearer: []
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              $ref: '#/components/schemas/SCIMPatchOp'
      responses:
        '200':
          description: Patched
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/SCIMGroup'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/SCIMConflict'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: put_scim_v2_Groups_ById
      description: 'Replaces a group''s attributes wholesale with the supplied SCIM representation for the tenant identified by the SCIM bearer token, with Qeet acting as the SCIM server. Use PATCH for incremental membership or attribute changes. Mounted at the root under /scim/v2; errors use the RFC 7644 SCIM error envelope, not the standard Qeet error shape. A member set that gives someone a first role, through the group''s, beyond the plan''s seats is refused with 403 in that envelope and nothing changes.'
      summary: "[scim] Replace group"
      tags:
        - SCIM
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      security:
        - scimBearer: []
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              $ref: '#/components/schemas/SCIMGroup'
      responses:
        '200':
          description: Replaced
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/SCIMGroup'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/SCIMConflict'
        '404':
          $ref: '#/components/responses/NotFound'
  /scim/v2/ResourceTypes:
    get:
      operationId: get_scim_v2_ResourceTypes
      description: 'Returns the SCIM 2.0 ResourceTypes discovery document describing the User and Group resources Qeet exposes as a SCIM server. Requires the SCIM bearer token and is mounted at the root under /scim/v2, not under /v1. Errors use the RFC 7644 SCIM error envelope, not the standard Qeet error shape.'
      summary: "[scim] ResourceTypes"
      tags:
