name: deploy

on:
  push:
    branches: [main] # every merge to main builds, deploys, then tags
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write  # push the version tag after a successful deploy
  id-token: write  # required for GitHub OIDC → AWS role assumption
  pull-requests: read  # find the merged release/x.y.z pull request (version)

env:
  AWS_REGION: ${{ vars.AWS_REGION }}

jobs:
  deploy:
    # Production deploys only from main — a manual run on another branch (the
    # default branch is develop) does nothing.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://api.id.qeet.in
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history to find latest tag

      - name: Determine next version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(git tag --list 'v*' --sort=-version:refname | head -1)
          latest=${latest:-v0.0.0}
          # A merged release/x.y.z pull request releases exactly x.y.z, so every
          # Qeet ID repository tags the same product version
          # (qeet-id-deploy: docs/test-kit/release-process.md).
          head=""
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            head=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
              --jq '[.[] | select(.merged_at != null and .base.ref == "main") | .head.ref][0] // ""')
          fi
          if [[ $head =~ ^release/([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            new_tag="v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
            if git rev-parse -q --verify "refs/tags/$new_tag" > /dev/null; then
              echo "::error::$new_tag already exists"
              exit 1
            fi
            if [ "$(printf '%s\n' "${latest#v}" "${new_tag#v}" | sort -V | tail -1)" != "${new_tag#v}" ]; then
              echo "::error::$head is not newer than $latest"
              exit 1
            fi
          else
            IFS='.' read -r major minor patch <<< "${latest#v}"
            new_tag="v${major}.${minor}.$((patch + 1))"
          fi
          echo "Latest: $latest  →  new: $new_tag"
          echo "tag=$new_tag" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Fast gate: don't ship code that doesn't build/pass unit tests.
      - name: Build & unit test
        run: |
          go build ./...
          go test ./...

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push image
        env:
          REPO: ${{ vars.ECR_REPOSITORY_URL }}
          VERSION: ${{ steps.version.outputs.tag }}
        run: |
          docker build -t "${REPO}:${VERSION}" -t "${REPO}:${{ github.sha }}" -t "${REPO}:latest" .
          docker push "${REPO}:${VERSION}"
          docker push "${REPO}:${{ github.sha }}"
          docker push "${REPO}:latest"

      - name: Roll the host (SSM)
        env:
          SSM_PREFIX: /qeet-id/prod
          VERSION: ${{ steps.version.outputs.tag }}
        run: |
          INSTANCE_ID=$(aws ssm get-parameter --name "$SSM_PREFIX/INSTANCE_ID" --query Parameter.Value --output text)
          echo "Deploying $VERSION to $INSTANCE_ID"
          cmd_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${VERSION}" \
            --parameters commands='["/opt/qeet-id/redeploy.sh"]' \
            --query Command.CommandId --output text)
          echo "SSM command: $cmd_id"
          aws ssm wait command-executed --command-id "$cmd_id" --instance-id "$INSTANCE_ID" || true
          status=$(aws ssm get-command-invocation --command-id "$cmd_id" --instance-id "$INSTANCE_ID" --query Status --output text)
          echo "----- stdout -----"
          aws ssm get-command-invocation --command-id "$cmd_id" --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text
          echo "----- stderr -----"
          aws ssm get-command-invocation --command-id "$cmd_id" --instance-id "$INSTANCE_ID" --query StandardErrorContent --output text
          echo "status: $status"
          [ "$status" = "Success" ]

      # Tag + release AFTER a successful deploy so every tag == a live deployed version.
      - name: Push version tag and create GitHub release
        env:
          VERSION: ${{ steps.version.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$VERSION"
          git push origin "$VERSION"
          gh release create "$VERSION" \
            --title "$VERSION" \
            --generate-notes \
            --repo "${{ github.repository }}"
