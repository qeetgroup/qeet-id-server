get:
  operationId: listRelationObjectTypes
  summary: List relationship object types
  description: >-
    Lists the types of object the organization's relationship tuples name, with
    how many objects of each and how many tuples. Requires role.read.
  tags:
    - ReBAC
  parameters:
    - $ref: ../../../shared/parameters/OrganizationID.yaml
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  responses:
    '200':
      description: Object types
      content:
        application/json:
          schema:
            type: object
            required:
              - items
            properties:
              truncated:
                $ref: ../../../shared/schemas/Truncated.yaml
              items:
                type: array
                items:
                  type: object
                  required:
                    - type
                    - objects
                    - tuples
                  properties:
                    type:
                      type: string
                    objects:
                      type: integer
                    tuples:
                      type: integer
    '401':
      $ref: ../../../shared/responses/Unauthorized.yaml
    '403':
      $ref: ../../../shared/responses/Forbidden.yaml
