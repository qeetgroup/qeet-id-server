post:
  operationId: signUpInOrganization
  summary: Register (hosted, B2C)
  description: >
    Creates a new end-user in the client's organization and sets the SSO cookie

    (qe_ls) so they continue into the OAuth authorize flow. Where the organization

    requires MFA, no cookie is set: the response is an enrolment challenge

    (with user_id) to complete at POST /v1/auth/session/mfa once an

    authenticator app is set up. Gated by the

    organization's self_registration_enabled policy (403 when disabled). The

    password must meet that organization's password rules (422 naming the rule

    that failed). An address that already has an account is refused with

    the neutral 422 unprocessable of POST /v1/auth/signup, which does not

    name the reason, and every attempt takes at least the same minimum time.

    So is an address on a domain another organization has verified: only

    that organization creates accounts there.


    An address the organization's address rules refuse answers 403

    auth.address_not_allowed, and no account is created.

    A body not sent as JSON is refused (415 unsupported_media_type).

    Where the organization has password sign-in switched off, it is refused with
    403 auth.method_disabled (the answer password sign-in gives) and nothing is
    created.


    On a domain whose organization requires single sign-on, the registration

    is refused with 403 auth.sso_required before anything else is checked,

    and nothing is created: the identity provider creates the account (see

    the SSORequired response).
  tags:
    - Auth
  security: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: false
          required:
            - organization_id
            - email
            - password
          properties:
            organization_id:
              type: string
              format: uuid
            email:
              type: string
              format: email
            password:
              type: string
              minLength: 1
              maxLength: 256
            display_name:
              type:
                - string
                - "null"
              maxLength: 200
  responses:
    "201":
      description: User created; SSO cookie set, or an enrolment challenge returned
      headers:
        Cache-Control:
          $ref: ../../../shared/headers/NoStoreCacheControl.yaml
        Pragma:
          $ref: ../../../shared/headers/NoStorePragma.yaml
      content:
        application/json:
          schema:
            oneOf:
              - type: object
                required:
                  - user_id
                properties:
                  user_id:
                    type: string
                    format: uuid
              - allOf:
                  - $ref: ../../../shared/schemas/MFAChallenge.yaml
                  - type: object
                    properties:
                      user_id:
                        type: string
                        format: uuid
    "400":
      $ref: ../../../shared/responses/BadRequest.yaml
    "403":
      $ref: ../../../shared/responses/Forbidden.yaml
    "413":
      $ref: ../../../shared/responses/PayloadTooLarge.yaml
    "415":
      $ref: ../../components/responses/UnsupportedMediaType.yaml
    "422":
      $ref: ../../../shared/responses/Unprocessable.yaml
    "429":
      $ref: ../../../shared/responses/TooManyRequests.yaml
    "503":
      $ref: ../../../shared/responses/Overloaded.yaml
