post:
  operationId: resolveAuditAnomaly
  description: >-
    Marks the identified anomaly as resolved and records the acting
    administrator, removing it from the open queue. Returns 404 when no matching
    open anomaly exists for the organization. This is a review action only and does
    not alter the underlying audit events that triggered detection.
  summary: Resolve an audit anomaly
  tags:
    - Audit
  parameters:
    - $ref: ../../../shared/parameters/OrganizationID.yaml
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  responses:
    "204":
      description: Resolved
    "401":
      $ref: ../../../shared/responses/Unauthorized.yaml
    "403":
      $ref: ../../../shared/responses/Forbidden.yaml
    "404":
      $ref: ../../../shared/responses/NotFound.yaml
