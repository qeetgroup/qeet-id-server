      description: 'The SAML Assertion Consumer Service for a specific connection, with Qeet acting as the Service Provider. It validates the external IdP''s signed SAMLResponse and assertion (signature, conditions and replay protection), provisions or resolves the user just-in-time, and redirects to the SPA callback with a one-time login code carried in the URL fragment. The SPA then trades that code for tokens at POST /saml/exchange. Mounted at the root, not under /v1, and unauthenticated.'
      summary: "[acs] Assertion Consumer Service"
      tags:
        - SAML
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                SAMLResponse:
                  type: string
                RelayState:
                  type: string
      responses:
        '302':
          description: Signature-validated; redirect with a one-time login code
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /saml/exchange:
    post:
      operationId: post_saml_exchange
      description: 'Trades the one-time login code minted by the SAML Assertion Consumer Service for a Qeet access and refresh token pair, with Qeet acting as the Service Provider. The code is single-use and short-lived. Mounted at the root, not under /v1, and unauthenticated; it is the second step after POST /saml/acs/{id}.'
      summary: Exchange code (public)
      tags:
        - SAML
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
              properties:
                code:
                  type: string
      responses:
        '200':
          description: Token pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /saml/idp/metadata:
    get:
      operationId: get_saml_idp_metadata
      description: 'Returns Qeet''s SAML Identity Provider metadata XML, including the entity id, signing certificate and the redirect- and POST-binding SingleSignOnService endpoints, for downstream Service Providers to configure Qeet as their IdP. Mounted at the root, not under /v1, and unauthenticated. Register each downstream SP with the SAML SP (IdP side) endpoints before it can obtain assertions at the IdP SSO endpoint.'
      summary: "[idp] IdP metadata"
      tags:
        - SAML
      security: []
      responses:
        '200':
          description: IdP metadata XML
          content:
            application/xml:
              schema:
                type: string
  /saml/idp/sso:
    get:
      operationId: get_saml_idp_sso
      description: 'The SAML SingleSignOnService over the HTTP-Redirect binding, with Qeet acting as the Identity Provider. It handles SP-initiated SSO from a registered Service Provider''s AuthnRequest and IdP-initiated SSO by SP reference; the user is authenticated by the hosted-login SSO cookie, and the browser is bounced to the hosted login when no session exists. On success it returns an auto-submitting HTML form that POSTs a signed SAMLResponse to the SP''s registered ACS URL. The POST-binding variant is POST /saml/idp/sso.'
      summary: "[idp] IdP SSO (redirect binding)"
      tags:
        - SAML
      parameters:
        - in: query
          name: SAMLRequest
          schema:
            type: string
        - in: query
          name: RelayState
          schema:
            type: string
      security: []
      responses:
        '200':
          description: Auto-submit POST form back to the SP ACS with a signed SAMLResponse
          content:
            text/html:
              schema:
                type: string
        '302':
          description: Redirect to hosted login when no SSO session
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      operationId: post_saml_idp_sso
      description: 'The SAML SingleSignOnService over the HTTP-POST binding, with Qeet acting as the Identity Provider; equivalent to GET /saml/idp/sso for Service Providers that send the AuthnRequest via POST. The user is authenticated by the hosted-login SSO cookie, with a redirect to the hosted login when no session exists, and any supplied AssertionConsumerServiceURL must match the SP''s registered ACS. On success it returns an auto-submitting form that POSTs a signed SAMLResponse to that ACS.'
      summary: "[idp] IdP SSO (POST binding)"
      tags:
        - SAML
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                SAMLRequest:
                  type: string
                RelayState:
                  type: string
      responses:
        '200':
          description: Auto-submit POST form back to the SP ACS with a signed SAMLResponse
          content:
            text/html:
              schema:
                type: string
        '302':
          description: Redirect to hosted login when no SSO session
        '400':
          $ref: '#/components/responses/BadRequest'
