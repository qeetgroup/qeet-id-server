                            - default
                        attribute:
                          type: string
                          description: The source attribute it was read from.
                  issues:
                    type: array
                    items:
                      type: object
                      required:
                        - mapping_id
                        - field
                        - code
                        - message
                      properties:
                        mapping_id:
                          type: string
                          format: uuid
                          description: The mapping at fault; the nil UUID for directory.mapping_preview_too_large.
                        field:
                          type: string
                          description: Target profile field of the mapping at fault; empty for directory.mapping_preview_too_large.
                        code:
                          type: string
                          description: Stable reason for the issue; word it from this.
                          enum:
                            - directory.mapping_preview_too_large
                            - directory.mapping_source_invalid
                            - directory.mapping_source_credential
                            - directory.mapping_target_unsupported
                            - directory.mapping_target_duplicate
                            - directory.mapping_value_type_mismatch
                            - directory.mapping_transform_unsupported
                            - directory.mapping_pattern_unexpected
                            - directory.mapping_pattern_invalid
                            - directory.mapping_source_missing
                            - directory.mapping_source_empty
                            - directory.mapping_value_not_string
                            - directory.mapping_value_not_array
                            - directory.mapping_value_too_long
                            - directory.mapping_value_too_many
                            - directory.mapping_value_unmatched
                            - directory.mapping_email_invalid
                            - directory.mapping_display_name_too_long
                        message:
                          type: string
                          description: English text kept for compatibility; it may change.
        "400":
          description: Invalid source JSON
        "401":
          description: Authentication required
        "403":
          description: Organization mismatch or missing connection.read
        "404":
          description: Connection not found
        "413":
          description: Source exceeds the supported size
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/organizations/{organizationID}/directory/errors:
    get:
      operationId: listDirectoryErrors
      summary: List directory errors and remediation summary
      description: Requires connection.read. Only errors from the authenticated organization are returned. Unknown affected-user counts are null, not inferred from request volume. A person's own credentials refused at an LDAP sign-in is not an error here (it shows in the sync activity as a warning and doesn't count towards alerts); the service account or the directory refusing is. A later successful operation on a connection (a passing check, sign-in or push) resolves its open connection and permission failures, as resolved by the system (resolved_by null) and audited as directory.errors_resolved; a failure being retried is left for its retry.
      tags:
        - Directory
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationID"
        - name: days
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 90
            default: 7
        - name: connection_id
          in: query
          schema:
            type: string
            maxLength: 128
        - name: severity
          in: query
          schema:
            type: string
            enum:
              - warning
              - critical
        - name: resolution
          in: query
          schema:
            type: string
            enum:
              - open
              - resolved
              - retried
        - name: q
          in: query
          schema:
            type: string
            maxLength: 200
        - name: limit
          description: Page size, 1 to 100 (default 25). A larger value is lowered to 100; a smaller or malformed one gets the default.
          in: query
          schema:
            type: integer
            default: 25
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Error page, categories, affected connections, and latest remediations
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                  - total
                  - limit
                  - summary
                  - categories
                  - connections
                  - remediations
                properties:
                  next_cursor:
                    $ref: "#/components/schemas/NextCursor"
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/DirectoryEvent"
                  total:
                    type: integer
                  limit:
                    type: integer
                  summary:
                    type: object
                    required:
                      - open
                      - critical
                      - warning
                      - retried
                      - impacted_users
                    properties:
                      open:
                        type: integer
                      critical:
                        type: integer
                      warning:
                        type: integer
                      retried:
                        type: integer
                      impacted_users:
                        type:
                          - integer
                          - "null"
                  categories:
                    type: array
                    items:
                      type: object
                      required:
                        - key
                        - count
                      properties:
                        key:
                          type: string
                        count:
                          type: integer
                  connections:
                    type: array
                    items:
                      type: object
                      required:
                        - key
                        - count
                      properties:
                        key:
                          type: string
                        count:
                          type: integer
                  remediations:
                    type: array
                    items:
                      $ref: "#/components/schemas/DirectoryEvent"
        "400":
          description: Invalid filters
        "401":
          description: Authentication required
        "403":
          description: Organization mismatch or missing connection.read
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/organizations/{organizationID}/directory/errors/{eventID}/resolve:
    post:
      operationId: resolveDirectoryError
      summary: Resolve a directory error
      description: Requires connection.write. Atomically closes an open error with an audit record. Does not retry its original operation.
      tags:
        - Directory
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationID"
        - name: eventID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Error resolved
          content:
            application/json:
              schema:
                type: object
                properties:
                  succeeded:
                    type: boolean
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Authentication required
        "403":
          description: Organization mismatch or missing connection.write
        "404":
          description: Error not found in this organization
        "409":
          description: Error already closed
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/organizations/{organizationID}/directory/errors/{eventID}/retry:
    post:
      operationId: retryDirectoryError
      summary: Retry a failed LDAP connection check
      description: Requires connection.write. Repeats only a failed manual LDAP bind check using current connection settings. SCIM pushes and sign-ins cannot be replayed because request bodies and credentials are never retained. Concurrent retries serialize and a successful retry closes the original error atomically with an audit record. Failed checks remain open.
      tags:
        - Directory
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationID"
        - name: eventID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Check completed; succeeded reports the actual outcome
          content:
            application/json:
              schema:
                type: object
                properties:
                  succeeded:
                    type: boolean
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Authentication required
        "403":
          description: Organization mismatch or missing connection.write
        "404":
          description: Error not found in this organization
        "409":
          description: Operation cannot be retried or is already closed
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/organizations/{organizationID}/directory/activity:
    get:
      operationId: listDirectoryActivity
      summary: List recorded directory operations
      description: Organization-scoped SCIM writes and LDAP operations, newest first. Requires connection.read. Counts and durations describe observed operations, not provider scheduler jobs. Request bodies and credentials are never stored.
      tags:
        - Directory
      security:
