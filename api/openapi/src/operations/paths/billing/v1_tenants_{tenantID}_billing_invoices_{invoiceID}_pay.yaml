post:
  operationId: payInvoice
  summary: Pay an open invoice
  description: >-
    Returns a hosted-payment URL for an open invoice, such as a renewal,
    charging its total. The provider is chosen by the billing profile's country,
    else the invoice's currency; with none, it answers 422 and the invoice is
    paid by bank transfer, quoting its number. When the payment completes, the
    invoice is paid (billing.invoice_paid) and a renewal starts the period it
    billed. A paid or void invoice answers 409 billing.invoice_not_open. Send an
    Idempotency-Key header to retry it safely, as for checkout.
  tags:
    - Billing
  parameters:
    - $ref: ../../../shared/parameters/TenantID.yaml
    - name: invoiceID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - $ref: ../../../shared/parameters/IdempotencyKey.yaml
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - success_url
            - cancel_url
          properties:
            success_url:
              type: string
              format: uri
            cancel_url:
              type: string
              format: uri
  responses:
    '200':
      description: The hosted checkout ({status:"checkout"})
      headers:
        Idempotent-Replayed:
          $ref: ../../../shared/headers/IdempotentReplayed.yaml
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/CheckoutResult.yaml
    '400':
      $ref: ../../../shared/responses/BadRequest.yaml
    '401':
      $ref: ../../../shared/responses/Unauthorized.yaml
    '403':
      $ref: ../../../shared/responses/Forbidden.yaml
    '404':
      $ref: ../../../shared/responses/NotFound.yaml
    '409':
      description: >-
        The invoice is paid or void (billing.invoice_not_open), or a request
        with this Idempotency-Key is still being processed.
      content:
        application/json:
          schema:
            $ref: ../../../shared/schemas/Error.yaml
    '422':
      $ref: ../../../shared/responses/Unprocessable.yaml
    '429':
      $ref: ../../../shared/responses/TooManyRequests.yaml
