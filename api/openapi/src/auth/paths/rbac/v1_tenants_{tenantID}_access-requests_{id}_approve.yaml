post:
  operationId: approveAccessRequest
  summary: Approve an access request
  description: >-
    Gives the requester the role, for the duration they asked (access_ends_at;
    it's taken back then) or for good, with an optional note they see. Needs
    role.write and a recent step-up, and is held to the rule for giving the role
    directly (403 rbac.grant_exceeds_caller or rbac.owner_only); a first role
    takes a seat (402 billing.plan_limit). Nobody answers their own request (403
    access_request.own). A request no longer waiting answers 409
    access_request.closed. A role the requester meanwhile holds directly is left
    as it is, and never taken back by the request.
  tags:
    - RBAC
  parameters:
    - $ref: ../../../shared/parameters/TenantID.yaml
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  requestBody:
    required: false
    content:
      application/json:
        schema:
          type: object
          additionalProperties: false
          properties:
            note:
              type: string
              maxLength: 500
              description: Optional, up to 500 characters; the requester sees it.
  security:
    - bearerAuth: []
  responses:
    '200':
      description: Approved
      content:
        application/json:
          schema:
            type: object
            required:
              - access_request
            properties:
              access_request:
                $ref: ../../components/schemas/AccessRequest.yaml
    '400':
      $ref: ../../../shared/responses/BadRequest.yaml
    '401':
      $ref: ../../../shared/responses/Unauthorized.yaml
    '403':
      $ref: ../../../shared/responses/Forbidden.yaml
    '404':
      $ref: ../../../shared/responses/NotFound.yaml
    '409':
      $ref: ../../../shared/responses/Conflict.yaml
