post:
  operationId: enableWebhook
  summary: Enable webhook
  tags:
    - Webhooks
  parameters:
    - $ref: ../../../shared/parameters/OrganizationID.yaml
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  description: >-
    Turns a disabled webhook subscription back on, whether an administrator or
    its failures disabled it, with its failures forgotten, and returns it.
    Deliveries queued while it was off are then sent. Enabling one already on
    changes nothing. The organization's plan must include webhooks (402
    billing.upgrade_required). Requires webhook.write. Needs a recent step-up.
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/WebhookSubscription.yaml
    '400':
      $ref: ../../../shared/responses/BadRequest.yaml
    '401':
      $ref: ../../../shared/responses/Unauthorized.yaml
    '402':
      description: The organization's plan does not include webhooks.
    '403':
      $ref: ../../../shared/responses/Forbidden.yaml
    '404':
      $ref: ../../../shared/responses/NotFound.yaml
    '429':
      $ref: ../../../shared/responses/TooManyRequests.yaml
