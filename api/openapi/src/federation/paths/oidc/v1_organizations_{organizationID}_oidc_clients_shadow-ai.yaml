get:
  operationId: listShadowAiClients
  summary: List shadow-AI candidates
  description: >-
    OIDC clients whose grant_types include a machine grant type
    (client_credentials or token-exchange) that haven't been explicitly reviewed
    — the same "unmanaged non-human identity" risk the agents/service-accounts
    registries exist to close, surfaced for a client that picked up a machine
    grant type sideways. Ordered by live (active, unexpired, unrevoked)
    refresh-token count so clients actually in use surface first.
  tags:
    - OIDC
  parameters:
    - $ref: ../../../shared/parameters/OrganizationID.yaml
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            required:
              - items
            properties:
              truncated:
                $ref: ../../../shared/schemas/Truncated.yaml
              items:
                type: array
                items:
                  $ref: ../../components/schemas/ShadowAICandidate.yaml
    '401':
      $ref: ../../../shared/responses/Unauthorized.yaml
    '403':
      $ref: ../../../shared/responses/Forbidden.yaml
