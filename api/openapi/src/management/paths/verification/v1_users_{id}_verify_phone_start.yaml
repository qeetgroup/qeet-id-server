post:
  operationId: startPhoneVerification
  summary: Start phone verification
  description: >-
    Sends a 6-digit code to the number on file. Pass `phone` only to verify a
    different number. Audited as phone.verification_started, with the number
    masked to its last three digits, in the audit trail of the organization the
    session is in.
  tags:
    - Verification
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  security:
    - bearerAuth: []
  requestBody:
    required: false
    content:
      application/json:
        schema:
          type: object
          properties:
            phone:
              type: string
              description: Optional; defaults to the user's phone on file.
  responses:
    '200':
      description: Code sent; returns a confirmation message
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
    '401':
      $ref: ../../../shared/responses/Unauthorized.yaml
    '403':
      $ref: ../../../shared/responses/Forbidden.yaml
    '404':
      $ref: ../../../shared/responses/NotFound.yaml
    '422':
      $ref: ../../../shared/responses/Unprocessable.yaml
    '429':
      $ref: ../../../shared/responses/TooManyRequests.yaml
