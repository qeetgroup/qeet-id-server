patch:
  operationId: updatePortalDomain
  summary: Turn single sign-on on or off for a domain (portal)
  description: >-
    Sets whether the organisation's people at this domain are sent to its
    identity provider when they sign in (sso_enabled), as the tenant-admin
    domain settings do; no other setting changes. Requires the link's
    capabilities to include domain_verification and saml; the domain must belong
    to the tenant bound to the portal session. Audited as
    domain.settings_updated by the admin portal.
  tags:
    - Admin Portal
  security:
    - adminPortalCookie: []
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - sso_enabled
          properties:
            sso_enabled:
              type: boolean
  responses:
    '200':
      description: The domain, with its setting
      content:
        application/json:
          schema:
            $ref: ../../../shared/schemas/Domain.yaml
    '400':
      $ref: ../../../shared/responses/BadRequest.yaml
    '401':
      $ref: ../../../shared/responses/Unauthorized.yaml
    '403':
      $ref: ../../../shared/responses/Forbidden.yaml
    '404':
      $ref: ../../../shared/responses/NotFound.yaml
