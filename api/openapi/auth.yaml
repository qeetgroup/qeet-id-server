components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'User or service JWT: `Authorization: Bearer <token>`.'
    apiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: 'API key credential. Send `Authorization: ApiKey <key>` (note the `ApiKey ` prefix). Accepted on the same authenticated routes as bearerAuth.'
    scimBearer:
      type: http
      scheme: bearer
      description: 'Per-tenant SCIM provisioning token presented by the IdP: `Authorization: Bearer <scim-token>`. Distinct from user JWTs; rotated via the SCIM admin endpoints.'
    clientCredentials:
      type: oauth2
      description: OAuth 2.0 client credentials. Clients authenticate at the token endpoint via form params (`client_id`/`client_secret`) or HTTP Basic. Revocation/introspection use the same client auth.
      flows:
        clientCredentials:
          tokenUrl: /v1/oauth/token
          scopes: {}
    ssoCookie:
      type: apiKey
      in: cookie
      name: qe_ls
      description: Hosted-login SSO session cookie (HttpOnly). Set by POST /v1/auth/session and consumed by the OAuth authorize/consent flow, and by the few signed-in routes the hosted login calls itself (listing, renaming and adding passkeys). State-changing calls made with it need the CSRF token.
  responses:
    BadRequest:
      description: Malformed request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: 'Authenticated but not permitted. auth.application_token: the access token was issued to an application (it carries client_id) and this route accepts only the user''s own tokens; applications may call GET /v1/oauth/userinfo. auth.insufficient_scope: an application''s token reached a route open to applications without the scope the route needs (named in the WWW-Authenticate challenge).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Resource conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unprocessable:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    SignInUnavailable:
      description: The sign-in lockout could not be evaluated (its counters could not be read or written), so the attempt was refused (`auth.sign_in_unavailable`, retryable). The same answer whatever the password and whether the address has an account.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    RiskSettings:
      type: object
      properties:
        medium_threshold:
          type: number
        high_threshold:
          type: number
        force_mfa_at_level:
          type: string
          enum: [medium, high]
        impossible_travel_enabled:
          type: boolean
          description: Off by default. Also needs a geo signal to do anything — see GEO_COUNTRY_HEADER.
        min_travel_hours:
          type: number
          description: A login from a different country than the last one, sooner than this many hours later, is flagged.
        device_reputation_enabled:
          type: boolean
          description: Off by default. Flags a login from a browser+OS combination never seen before for this user.
    Error:
      type: object
      required:
        - error
      description: Canonical error envelope (internal/platform/httpx.WriteError).
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              description: Stable machine code
              example: unauthorized
            message:
              type: string
              example: authentication required
            detail:
              type: string
              description: Optional human detail
            translation_key:
              type: string
              description: Optional i18n key the client can use to localize the message.
            retryable:
              type: boolean
              description: Whether the client may safely retry the request.
            fields:
              type: array
              description: Per-field validation errors (typically on 422 responses).
              items:
                type: object
                properties:
                  field:
                    type: string
                  code:
                    type: string
                  message:
                    type: string
            metadata:
              type: object
              additionalProperties: true
              description: Optional structured, error-specific context.
            request_id:
              type: string
              description: Correlates with the X-Request-Id header
    TokenPair:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_at:
          type: string
          format: date-time
        refresh_token:
          type: string
        session_expires_at:
          type: string
          format: date-time
          description: >-
            When the session ends however active it is: the organisation's
            maximum session age from sign-in (the platform default where it
            sets none). Switching organisation never moves it later.
        idle_expires_at:
          type: string
          format: date-time
          description: >-
            When the session ends unless it is renewed before then: the
            organisation's idle timeout from this sign-in or renewal, never
            after session_expires_at. Clients can warn the user ahead of either
            time; the server refuses a renewal after them with 401
            auth.session_timed_out whatever the client does.
        session_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
          nullable: true
    Principal:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
          nullable: true
        tenant_id:
          type: string
          format: uuid
          nullable: true
        session_id:
          type: string
          format: uuid
          nullable: true
        actor:
          type: string
          example: user
        scopes:
          type: array
          items:
            type: string
    Session:
      type: object
      additionalProperties: true
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        ip:
          type: string
          nullable: true
        user_agent:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
          description: The session's last renewal, from which its idle timeout counts.
        revoked_at:
          type: string
          format: date-time
          nullable: true
        expires_at:
          type: string
          format: date-time
          description: When the session ends however active it is.
        idle_expires_at:
          type: string
          format: date-time
          description: When the session ends unless renewed first (never after expires_at).
        status:
          type: string
          enum: [active, revoked, expired]
          description: >-
            active, revoked (ended by sign-out or revocation) or expired
            (reached its maximum age or idle timeout first). Only active
            sessions can be revoked.
        device:
          type: string
          example: Chrome on macOS
          description: >-
            The device and browser in words, read from the user agent on the
            server ("Unknown device" when it says nothing recognisable). Show
            this; user_agent stays for support.
        device_kind:
          type: string
          enum: [desktop, mobile, tablet, unknown]
        country:
          type: string
          example: IN
          description: >-
            Where the session was opened, approximately — the ISO 3166-1
            alpha-2 country a trusted upstream proxy reported
            (GEO_COUNTRY_HEADER). Omitted when the deployment supplies none.
        current:
          type: boolean
          description: True for the session the listing request was made with.
    MFAChallenge:
      type: object
      description: >-
        A sign-in stopped before its session: the account holds a second factor,
        or must have one — its organisation requires MFA (of everyone, or of
        administrators) or it is marked as requiring it. Complete it at POST
        /v1/auth/mfa (token sign-in) or /v1/auth/session/mfa (hosted login).
        Each challenge is audited as auth.mfa_challenged with its reason
        (enrolled, tenant_required, admin_required or user_required) and how
        the first factor was proven (password or magic_link); meeting it as
        auth.mfa_verified.
      properties:
        mfa_required:
          type: boolean
        mfa_token:
          type: string
        methods:
          type: array
          description: The distinct factor types of factors (["totp"] for an enrolment challenge).
          items:
            type: string
            enum: [totp, recovery_code, email, sms, passkey, push]
        factors:
          type: array
          description: >-
            Exactly the second factors this person can complete the challenge
            with — an authenticator app, recovery codes, each confirmed email or
            SMS factor (with its id and masked destination, for
            POST /v1/auth/mfa/send), passkeys while the organisation allows them,
            and push devices. Empty for an enrolment challenge.
          items:
            $ref: '#/components/schemas/LoginFactor'
        enrollment_required:
          type: boolean
          description: >-
            The account must have a second factor and holds none: set up an
            authenticator app (POST /v1/auth/mfa/enroll) and complete the
            challenge with a code from it.
        enrollment_due_at:
          type: string
          format: date-time
          description: >-
            On an enrolment challenge in the organisation's grace period: when
            it ends. Until then the setup may be put off (skip: true).
    LoginFactor:
      type: object
      properties:
        type:
          type: string
          enum: [totp, recovery_code, email, sms, passkey, push]
        id:
          type: string
          format: uuid
          description: An email or SMS factor's id.
        destination:
          type: string
          description: An email or SMS factor's masked address or number.
    SecurityPolicy:
      type: object
      properties:
        tenant_id:
          type: string
          format: uuid
        password_min_length:
          type: integer
          minimum: 8
          maximum: 128
        password_complexity:
          type: string
          enum: [relaxed, standard, strict]
        session_max_age:
          type: string
          example: 720h
          description: >-
            How long a session lasts after sign-in however active it is, and an
            application's grant however often it is renewed: a duration such as
            "720h" or "90m", between 1h and 8760h. Applies to sessions and grants
            started after it is saved. Omitted or zero on update: the platform
            default.
        session_idle_timeout:
          type: string
          example: 24h
          description: >-
            How long a session may go without being renewed before it ends: a
            duration of at least 15m and no longer than session_max_age. Applies
            to sessions started after it is saved. Omitted or zero on update:
            the platform default (no longer than session_max_age).
        max_sessions:
          type: integer
          nullable: true
          minimum: 1
          maximum: 1000
          description: >-
            How many live sessions one person may hold in the organisation at
            once; null for no limit (the default). Counted and enforced as a
            session opens, so simultaneous sign-ins cannot exceed it.
        session_limit_action:
          type: string
          enum: [evict_oldest, refuse]
          description: >-
            What a sign-in at max_sessions does: evict_oldest ends the person's
            least recently used session (renewal stops at once; an access token
            it already issued lasts out its own lifetime, ACCESS_TOKEN_TTL),
            announced to session.revoked subscribers as session_limit; refuse
            refuses the sign-in with 403 auth.session_limit. Both are audited.
        mfa_enforcement:
          type: string
          enum: [optional, required, admin_only]
          description: >-
            Who must use a second factor to sign in, enforced at password
            sign-in: optional (only people who set one up are challenged),
            required (everyone), admin_only (anyone holding a role, directly or
            through a group, that grants a write permission). Separately, an
            account an administrator marks as requiring MFA must, whatever is
            set here. An account that must and holds no factor sets up an
            authenticator app before any session is issued.
        mfa_grace_days:
          type: integer
          minimum: 0
          maximum: 90
          description: >-
            For this many days after the requirement is turned on, the accounts
            that already existed may put setting up a second factor off (they
            are prompted at each sign-in). 0, the default: no grace period.
        mfa_enforced_since:
          type: string
          format: date-time
          nullable: true
          readOnly: true
          description: >-
            When the requirement was turned on (from optional); null while
            optional. Moving between required and admin_only keeps it.
        step_up_window:
          type: string
          example: 5m
          description: >-
            How long a step-up keeps a session's sensitive actions unlocked: a
            duration between 1m and 60m. A step-up belongs to the session that
            earned it; it ends with that session, and a changed password or an
            administrative factor reset clears it. Omitted or zero on update:
            5m.
        step_up_methods:
          type: array
          nullable: true
          items:
            type: string
            enum: [totp, recovery_code, otp, webauthn, push]
          description: >-
            The factor types that count as a step-up (otp: an emailed or
            text-message code; webauthn: a passkey). Null or empty: every one.
            A session stepped up by a factor that is not listed is asked again.
        settings:
          type: object
          additionalProperties: true
    Passkey:
      type: object
      required:
        - id
        - user_id
        - created_at
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        name:
          type: string
          nullable: true
          maxLength: 64
          description: >-
            User-supplied text: show it as text, never as markup. Null for a
            passkey enrolled before passkeys were named by default.
        transports:
          type: array
          nullable: true
          items:
            type: string
        last_used_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
      description: An active session (id, ip, user agent, timestamps).
    SignupRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 256
        display_name:
          type: string
          maxLength: 200
    SignupResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        access_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_at:
          type: string
          format: date-time
        refresh_token:
          type: string
        session_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    SessionRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        client_id:
          type: string
          maxLength: 255
          description: The OAuth client the hosted login is serving. Its tenant's sign-in lockout settings apply; omitted or unknown = the platform defaults.
    AuthPolicy:
      type: object
      properties:
        password_enabled:
          type: boolean
        password_min_length:
          type: integer
          minimum: 8
          maximum: 128
        password_require_uppercase:
          type: boolean
        password_require_number:
          type: boolean
        password_require_symbol:
          type: boolean
        magic_link_enabled:
          type: boolean
        magic_link_ttl_minutes:
          type: integer
          minimum: 5
          maximum: 1440
        passkey_enabled:
          type: boolean
        otp_email_enabled:
          type: boolean
        otp_sms_enabled:
          type: boolean
        self_registration_enabled:
          type: boolean
        remember_device_enabled:
          type: boolean
        remember_device_days:
          type: integer
          minimum: 1
          maximum: 90
          description: >-
            How long a device stays remembered after the sign-in that remembered
            it, in days (30 by default; 0 on update keeps the default). Applies to
            devices remembered after it is set.
        lockout_threshold:
          type: [integer, 'null']
          description: Failed password sign-ins to one account from one network, each within the window of the last, that lock the account for that network. null = the platform default. Must lie within lockout_limits (default bounds 3..20).
        lockout_window_minutes:
          type: [integer, 'null']
          description: A failure is forgotten once this many minutes pass with no new failure. null = the platform default. Must lie within lockout_limits (default bounds 1..1440).
        lockout_duration_minutes:
          type: [integer, 'null']
          description: How long a lock lasts. null = the platform default. Must lie within lockout_limits (default bounds 1..1440).
        lockout_limits:
          $ref: '#/components/schemas/LockoutLimits'
    LockoutSettings:
      type: object
      properties:
        threshold:
          type: integer
        window_minutes:
          type: integer
        duration_minutes:
          type: integer
    LockoutLimits:
      type: object
      readOnly: true
      description: The platform defaults for the lockout settings (LOGIN_LOCKOUT_THRESHOLD / _WINDOW / _DURATION, built-in 5 / 15 / 15) and the inclusive bounds a tenant may choose within (LOGIN_LOCKOUT_*_MIN / _MAX). Ignored on update.
      properties:
        defaults:
          $ref: '#/components/schemas/LockoutSettings'
        min:
          $ref: '#/components/schemas/LockoutSettings'
        max:
          $ref: '#/components/schemas/LockoutSettings'
    Anomaly:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          description: e.g. credential_stuffing (an account locked after repeated failed sign-ins) or password_spraying (a source network throttled for failing against many accounts).
        severity:
          type: string
        detail:
          type: string
        status:
          type: string
        user_id:
          type: string
          format: uuid
        user_email:
          type: string
        ip:
          type: string
        metadata:
          type: object
          additionalProperties: true
          description: 'The detection''s structured context. For a sign-in lock: reason, account, network, counter (account_network or account), failures, threshold, window_minutes, locked_until. For a throttled source: reason, network, counter (source), distinct_accounts, window_minutes, throttled_until.'
        created_at:
          type: string
          format: date-time
        resolved_at:
          type: string
          format: date-time
    RefreshRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        email_verified_at:
          type: string
          format: date-time
          nullable: true
        phone:
          type: string
          nullable: true
        phone_verified_at:
          type: string
          format: date-time
          nullable: true
        display_name:
          type: string
          nullable: true
        status:
          type: string
          enum:
            - active
            - suspended
        metadata:
          type: object
          additionalProperties: true
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Role:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        is_system:
          type: boolean
        created_at:
          type: string
          format: date-time
    GroupRole:
      type: object
      description: A role granted to a group, with the role's name for display.
      properties:
        role_id:
          type: string
          format: uuid
        name:
          type: string
        granted_at:
          type: string
          format: date-time
    AuthzGrantStep:
      type: object
      description: >-
        One link in an authorization decision's grant path: a role that confers the requested permission and how that role reaches the user.
      properties:
        permission:
          type: string
        granted_by:
          type: string
          description: 'The conferring role, e.g. "role:admin".'
        via:
          type: string
          description: '"direct" for a user grant, or "group:<name>" for a group-derived grant.'
        group_id:
          type: string
          format: uuid
          description: Set only when via is a group grant.
        role_id:
          type: string
          format: uuid
    AuthzDecidedBy:
      type: object
      description: >-
        What decided a composed authorization decision. The ABAC policy (rule, policy_id) is named only to a caller holding policy.read; anyone else sees rule "an attribute policy".
      properties:
        model:
          type: string
          enum: [tenant, abac, rbac, rebac, none]
        rule:
          type: string
        policy_id:
          type: string
          format: uuid
    AuthzExplanation:
      type: object
      description: >-
        The structured "why?" for a single permission check: the decision plus every distinct grant (direct and group-derived) that confers it. Returned from GET /check when explain=true.
      properties:
        allowed:
          type: boolean
        paths:
          type: array
          items:
            $ref: '#/components/schemas/AuthzGrantStep'
        reason:
          type: string
          description: Set only on a denial.
    RoleCreate:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        description:
          type: string
          maxLength: 500
    Permission:
      type: object
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
        description:
          type: string
    ABACPolicy:
      type: object
      description: One ABAC policy row.
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        effect:
          type: string
          enum:
            - allow
            - deny
        resource_type:
          type: string
          description: Resource type matched by this policy; '*' matches any.
        action:
          type: string
          description: Action matched by this policy; '*' matches any.
        condition:
          type: object
          description: >-
            Recursive JSON condition tree. An empty object {} means unconditional.
            Logical nodes: {"all":[...]}, {"any":[...]}, {"not": node}.
            Comparison leaf: {"attr":"subject.dept","op":"eq","value":"eng"}.
          additionalProperties: true
        priority:
          type: integer
          description: Higher priority is evaluated first; deny wins at any priority.
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ABACPolicyCreate:
      type: object
      required:
        - name
        - effect
        - resource_type
        - action
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        effect:
          type: string
          enum:
            - allow
            - deny
        resource_type:
          type: string
          description: Resource type to match; '*' matches any resource type.
          minLength: 1
        action:
          type: string
          description: Action to match; '*' matches any action.
          minLength: 1
        condition:
          type: object
          description: Optional condition tree. Omit or send {} for unconditional.
          additionalProperties: true
        priority:
          type: integer
          default: 0
          description: Higher priority policies are evaluated first.
        enabled:
          type: boolean
          default: true
    ABACEvaluateRequest:
      type: object
      required:
        - action
      description: Input for an ABAC policy evaluation. Subject/resource/context carry the attribute bags.
      properties:
        subject:
          type: object
          description: Subject (caller) attributes, e.g. {"id":"user:123","department":"eng"}.
          additionalProperties: true
        resource:
          type: object
          description: Resource attributes.
          properties:
            type:
              type: string
              description: Resource type, e.g. "document".
            id:
              type: string
              description: Resource identifier.
            attrs:
              type: object
              description: Additional resource attributes.
              additionalProperties: true
        action:
          type: string
          description: The action being attempted, e.g. "read".
        context:
          type: object
          description: Request-context attributes, e.g. {"ip":"1.2.3.4","hour":14}.
          additionalProperties: true
    ABACDecision:
      type: object
      description: Result of an ABAC evaluation.
      properties:
        allow:
          type: boolean
          description: True when an allow policy matched and no deny policy matched.
        effect:
          type: string
          enum:
            - allow
            - deny
        matched_policy_id:
          type: string
          format: uuid
          nullable: true
          description: ID of the policy that determined the outcome, if any.
        reason:
          type: string
          description: Human-readable explanation of the decision.
        trace:
          type: array
          description: Grant-path trace (present only when ?explain=true).
          items:
            type: string
