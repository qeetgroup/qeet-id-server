type: object
description: An RFC 6749 §5.2 token error.
required:
  - error
additionalProperties: false
properties:
  error:
    type: string
    enum:
      - invalid_request
      - invalid_client
      - invalid_grant
      - unauthorized_client
      - unsupported_grant_type
      - invalid_scope
      - invalid_target
      - authorization_pending
      - slow_down
      - access_denied
      - expired_token
  error_description:
    type: string
