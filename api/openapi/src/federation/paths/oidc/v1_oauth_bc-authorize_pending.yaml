get:
  operationId: listMyPendingBackchannelRequests
  summary: List my pending CIBA requests
  description: >-
    The authenticated user's own still-pending, unexpired backchannel
    authentication requests — an "approve sign-in" view.
  tags:
    - OIDC
  security:
    - bearerAuth: []
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            required:
              - items
            properties:
              truncated:
                $ref: ../../../shared/schemas/Truncated.yaml
              items:
                type: array
                items:
                  $ref: ../../components/schemas/CIBAPendingRequest.yaml
    "401":
      $ref: ../../../shared/responses/Unauthorized.yaml
    "429":
      $ref: ../../../shared/responses/TooManyRequests.yaml
