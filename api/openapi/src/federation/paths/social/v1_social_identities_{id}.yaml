delete:
  operationId: unlinkSocialIdentity
  summary: Unlink identity
  tags:
    - Social
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  description: >-
    Unlinks a social sign-in from the account of a member of the caller's
    organisation. Requires user.write. Refused with 403 rbac.target_is_owner
    when the account is an owner's and the caller isn't one, and 403
    rbac.target_outranks_caller when it holds a permission the caller doesn't.
  responses:
    '204':
      description: No Content
    '401':
      $ref: ../../../shared/responses/Unauthorized.yaml
    '403':
      $ref: ../../../shared/responses/Forbidden.yaml
    '404':
      $ref: ../../../shared/responses/NotFound.yaml
    '422':
      $ref: ../../../shared/responses/Unprocessable.yaml
    '429':
      $ref: ../../../shared/responses/TooManyRequests.yaml
