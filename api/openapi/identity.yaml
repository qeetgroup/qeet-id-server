                    - string
                    - "null"
                  maxLength: 200
                avatar_url:
                  type:
                    - string
                    - "null"
                  maxLength: 300000
                  description: A small image data URL (data:image/…); an empty string clears it.
                locale:
                  type:
                    - string
                    - "null"
                  enum:
                    - en
                    - de
                    - es
                    - fr
                    - hi
                    - ja
                    - pt
