delete:
  operationId: deleteOidcResource
  summary: Remove a resource
  description: >-
    Removes a registered resource: no new token is issued for it; tokens already
    issued last out their short lifetime. Audited as oidc.resource_removed.
  tags:
    - OIDC
  parameters:
    - $ref: ../../../shared/parameters/TenantID.yaml
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  responses:
    '204':
      description: Removed
    '401':
      $ref: ../../../shared/responses/Unauthorized.yaml
    '403':
      $ref: ../../../shared/responses/Forbidden.yaml
    '404':
      $ref: ../../../shared/responses/NotFound.yaml
