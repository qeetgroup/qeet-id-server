post:
  operationId: denyAccessRequest
  summary: Deny an access request
  description: >-
    Refuses the request with a note the requester sees (required: 422
    access_request.note_required without it). Needs role.write. Nobody answers
    their own request (403 access_request.own); one no longer waiting answers
    409 access_request.closed.
  tags:
    - RBAC
  parameters:
    - $ref: ../../../shared/parameters/OrganizationID.yaml
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - note
          additionalProperties: false
          properties:
            note:
              type: string
              maxLength: 500
              description: Why, up to 500 characters; the requester sees it.
  security:
    - bearerAuth: []
  responses:
    '200':
      description: Denied
      content:
        application/json:
          schema:
            type: object
            required:
              - access_request
            properties:
              access_request:
                $ref: ../../components/schemas/AccessRequest.yaml
    '400':
      $ref: ../../../shared/responses/BadRequest.yaml
    '401':
      $ref: ../../../shared/responses/Unauthorized.yaml
    '403':
      $ref: ../../../shared/responses/Forbidden.yaml
    '404':
      $ref: ../../../shared/responses/NotFound.yaml
    '409':
      $ref: ../../../shared/responses/Conflict.yaml
    '422':
      $ref: ../../../shared/responses/Unprocessable.yaml
