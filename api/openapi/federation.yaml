        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: 'A key of the client''s choosing, 1 to 255 printable characters, that makes retrying the request safe. Kept for 24 hours.'
      schema: {type: string, minLength: 1, maxLength: 255}
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'User or service JWT: `Authorization: Bearer <token>`.'
    apiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: 'API key credential. Send `Authorization: ApiKey <key>` (note the `ApiKey ` prefix). Accepted on the same authenticated routes as bearerAuth.'
    scimBearer:
      type: http
      scheme: bearer
      description: 'An organisation''s SCIM provisioning token, presented by its identity provider: `Authorization: Bearer <scim-token>`. Distinct from user JWTs. An organisation can hold several, managed under /v1/tenants/{tenantID}/scim/tokens. A revoked or expired token, and every token of an organisation that is suspended or due for deletion, is refused with 401.'
    clientCredentials:
      type: oauth2
      description: OAuth 2.0 client credentials. Clients authenticate at the token endpoint via form params (`client_id`/`client_secret`) or HTTP Basic. Revocation/introspection use the same client auth.
      flows:
        clientCredentials:
          tokenUrl: /v1/oauth/token
          scopes: {}
    ssoCookie:
      type: apiKey
      in: cookie
      name: qe_ls
      description: Hosted-login SSO session cookie (HttpOnly). Set by POST /v1/auth/session and consumed by the OAuth authorize/consent flow.
    adminPortalLink:
      type: http
      scheme: bearer
      description: One-time admin-portal link credential. Accepted only by POST /v1/admin-portal/session and invalid after exchange.
    adminPortalCookie:
      type: apiKey
      in: cookie
      name: qeet_admin_portal_session
      description: Short-lived HttpOnly, SameSite=Strict admin-portal session cookie. Mutations also require the global CSRF double-submit token.
  responses:
    BadRequest:
      description: Malformed request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: 'Authenticated but not permitted. auth.application_token: the access token was issued to an application (it carries client_id) and this route accepts only the user''s own tokens; applications may call GET /v1/oauth/userinfo. auth.insufficient_scope: an application''s token reached a route open to applications without the scope the route needs (named in the WWW-Authenticate challenge).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Resource conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unprocessable:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    SCIMConflict:
      description: 'RFC 7644 error with scimType uniqueness: the externalId is taken, or a group without an externalId takes a displayName, ignoring case, that another group without one uses (including when the change clears the externalId).'
      content:
        application/scim+json:
          schema:
            $ref: '#/components/schemas/SCIMError'
    OAuthBadRequest:
      description: The token request was refused (RFC 6749 §5.2).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OAuthError'
    OAuthUnauthorized:
      description: The client failed to authenticate (invalid_client).
      headers:
        WWW-Authenticate:
          description: 'Basic realm="qeet", sent when the client used HTTP Basic.'
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OAuthError'
  schemas:
    DirectoryMapping:
      type: object
      required: [source_attribute, target_field, value_type, transform, enabled, required]
      properties:
        id: {type: string, format: uuid, readOnly: true}
        source_attribute: {type: string, minLength: 1, maxLength: 128}
        target_field: {type: string, enum: [email, display_name, first_name, last_name, department, title, manager_id, groups]}
        value_type: {type: string, enum: [string, array]}
        transform: {type: string, enum: [none, trim, lowercase, uppercase, extract]}
        pattern: {type: string, maxLength: 256}
        enabled: {type: boolean}
        required: {type: boolean}
        version: {type: integer, minimum: 1}
    DirectoryEvent:
      type: object
      required: [id, connection_id, operation, trigger, resource_type, started_at, duration_ms, status, users_synced, groups_synced, retryable]
      properties:
        id: {type: string, format: uuid}
        connection_id: {type: string}
        operation: {type: string}
        trigger: {type: string, enum: [push, manual, sign-in]}
        resource_type: {type: string, enum: [user, group, connection]}
        resource_id: {type: string}
        started_at: {type: string, format: date-time}
        duration_ms: {type: integer, minimum: 0}
        http_status: {type: integer}
        status: {type: string, enum: [success, warning, failed]}
        users_synced: {type: integer, minimum: 0}
        groups_synced: {type: integer, minimum: 0}
        error_code: {type: string}
        message: {type: string}
        category: {type: string}
        severity: {type: string, enum: ['', warning, critical]}
        resolution: {type: string, enum: [open, resolved, retried]}
        resolved_at: {type: [string, 'null'], format: date-time}
        retry_of: {type: [string, 'null'], format: uuid}
        retryable: {type: boolean}
    Error:
      type: object
      required:
        - error
      description: Canonical error envelope (internal/platform/httpx.WriteError).
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              description: Stable machine code
              example: unauthorized
            message:
              type: string
              example: authentication required
            detail:
              type: string
              description: Optional human detail
            translation_key:
              type: string
              description: Optional i18n key the client can use to localize the message.
            retryable:
              type: boolean
              description: Whether the client may safely retry the request.
            fields:
              type: array
              description: Per-field validation errors (typically on 422 responses).
              items:
                type: object
                properties:
                  field:
                    type: string
                  code:
                    type: string
                  message:
                    type: string
            metadata:
              type: object
              additionalProperties: true
              description: Optional structured, error-specific context.
            request_id:
              type: string
              description: Correlates with the X-Request-Id header
    TokenPair:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_at:
          type: string
          format: date-time
        refresh_token:
          type: string
        session_expires_at:
          type: string
          format: date-time
          description: >-
            When the session ends however active it is: the organisation's
            maximum session age from sign-in (the platform default where it
            sets none). Switching organisation never moves it later.
        idle_expires_at:
          type: string
          format: date-time
          description: >-
            When the session ends unless it is renewed before then: the
            organisation's idle timeout from this sign-in or renewal, never
            after session_expires_at. Clients can warn the user ahead of either
            time; the server refuses a renewal after them with 401
            auth.session_timed_out whatever the client does.
        session_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
          nullable: true
    OIDCClient:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        client_id:
          type: string
        type:
          type: string
          enum:
            - public
            - confidential
        name:
          type: string
        redirect_uris:
          type: array
          items:
            type: string
            format: uri
        post_logout_uris:
          type: array
          items:
            type: string
            format: uri
        grant_types:
          type: array
          items:
            type: string
        scopes:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        pkce_exempt_until:
          type: string
          format: date-time
          nullable: true
          description: When this confidential application's exemption from sending a PKCE code_challenge ends; null for none.
        backchannel_logout_uri:
          type: string
          format: uri
          description: Receives a signed logout token (OpenID Connect Back-Channel Logout, with sid) when someone the application signed in signs out; "" for none.
        frontchannel_logout_uri:
          type: string
          format: uri
          description: Loaded by the hosted signed-out page (with iss and sid) when someone the application signed in signs out; "" for none.
        logo_uri:
          type: string
          format: uri
          maxLength: 2048
          description: The application's logo, an https URL, shown on the hosted sign-in page; "" for none (set "" to clear).
        client_uri:
          type: string
          format: uri
          maxLength: 2048
          description: The application's home page, an https URL; the hosted sign-in page shows its host. "" for none (set "" to clear).
    OIDCResource:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        identifier:
          type: string
          format: uri
        name:
          type: string
        server_client_id:
          type: string
        created_at:
          type: string
          format: date-time
    OIDCClientCreate:
      type: object
      required:
        - tenant_id
        - name
        - type
      properties:
        tenant_id:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string
          enum:
            - public
            - confidential
        redirect_uris:
          type: array
          items:
            type: string
            format: uri
        post_logout_uris:
          type: array
          items:
            type: string
            format: uri
        grant_types:
          type: array
          description: "Any of authorization_code, refresh_token, urn:ietf:params:oauth:grant-type:device_code, token exchange (token_exchange or urn:ietf:params:oauth:grant-type:token-exchange; confidential only) and urn:openid:params:grant-type:ciba (confidential only). client_credentials is refused with oidc.grant_type_unsupported: a machine caller is a service principal, which gets its tokens from POST /v1/oauth/token."
          items:
            type: string
        scopes:
          type: array
          description: "The scopes the application may request. offline_access needs no entry: an application registered for refresh_token may always request it. Listing offline_access opts the application in to OpenID Connect Core §11: it then gets a refresh token only for a request granted offline_access, where otherwise every grant to an application registered for refresh_token comes with one."
          items:
            type: string
        backchannel_logout_uri:
          type: string
          format: uri
          description: Receives a signed logout token (OpenID Connect Back-Channel Logout, with sid) when someone the application signed in signs out; "" for none.
        frontchannel_logout_uri:
          type: string
          format: uri
          description: Loaded by the hosted signed-out page (with iss and sid) when someone the application signed in signs out; "" for none.
        logo_uri:
          type: string
          format: uri
          maxLength: 2048
          description: The application's logo, an https URL, shown on the hosted sign-in page; "" for none (set "" to clear).
        client_uri:
          type: string
          format: uri
          maxLength: 2048
          description: The application's home page, an https URL; the hosted sign-in page shows its host. "" for none (set "" to clear).
    OIDCClientUpdate:
      type: object
      description: Partial (COALESCE-style) update; omitted fields are left unchanged.
      properties:
        name:
          type: string
        redirect_uris:
          type: array
          items:
            type: string
            format: uri
        post_logout_uris:
          type: array
          items:
            type: string
            format: uri
        grant_types:
          type: array
          description: "Any of authorization_code, refresh_token, urn:ietf:params:oauth:grant-type:device_code, token exchange (token_exchange or urn:ietf:params:oauth:grant-type:token-exchange; confidential only) and urn:openid:params:grant-type:ciba (confidential only). client_credentials is refused with oidc.grant_type_unsupported: a machine caller is a service principal, which gets its tokens from POST /v1/oauth/token."
          items:
            type: string
        scopes:
          type: array
          description: "The scopes the application may request. offline_access needs no entry: an application registered for refresh_token may always request it. Listing offline_access opts the application in to OpenID Connect Core §11: it then gets a refresh token only for a request granted offline_access, where otherwise every grant to an application registered for refresh_token comes with one."
          items:
            type: string
        pkce_exempt_until:
          type: string
          format: date-time
          nullable: true
          description: Sets (a date-time, within 90 days) or clears (null) a confidential application's PKCE exemption; omitted, unchanged.
        backchannel_logout_uri:
          type: string
          format: uri
          description: Receives a signed logout token (OpenID Connect Back-Channel Logout, with sid) when someone the application signed in signs out; "" for none.
        frontchannel_logout_uri:
          type: string
          format: uri
          description: Loaded by the hosted signed-out page (with iss and sid) when someone the application signed in signs out; "" for none.
        logo_uri:
          type: string
          format: uri
          maxLength: 2048
          description: The application's logo, an https URL, shown on the hosted sign-in page; "" for none (set "" to clear).
        client_uri:
          type: string
          format: uri
          maxLength: 2048
          description: The application's home page, an https URL; the hosted sign-in page shows its host. "" for none (set "" to clear).
    OAuthDeviceAuthorization:
      type: object
      description: Admin view of an RFC 8628 device-authorization row. Never includes the device_code or its hash.
      properties:
        id:
          type: string
          format: uuid
        client_id:
          type: string
        user_code:
          type: string
        status:
          type: string
          enum:
            - pending
            - authorized
            - denied
        user_id:
          type: string
          format: uuid
          nullable: true
        user_email:
          type: string
        scopes:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        last_polled_at:
          type: string
          format: date-time
          nullable: true
    DirectoryAlert:
      type: object
      required: [id, name, connection_id, threshold, enabled, user_id, created_at, last_notified_at]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        connection_id: {type: [string, 'null'], description: The connection it watches; null for every connection.}
        threshold: {type: integer, description: Failures within 15 minutes that notify.}
        enabled: {type: boolean, description: False while paused.}
        user_id: {type: string, format: uuid, description: The person it notifies (who made it).}
        created_at: {type: string, format: date-time}
        last_notified_at: {type: [string, 'null'], format: date-time}
    SigningKey:
      type: object
      description: Non-secret metadata for an issuer signing key (no key material).
      properties:
        kid:
          type: string
          description: RFC 7638 JWK thumbprint of the public key.
        alg:
          type: string
          example: ES256
        use:
          type: string
          example: sig
        status:
          type: string
          enum:
            - candidate
            - active
            - retired
        retire_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
          nullable: true
          description: When the key registry first held the key; null for a key it doesn't hold (one only in configuration).
        activated_at:
          type: string
          format: date-time
          nullable: true
          description: When the key became the active signing key; null for a candidate that never was, or a key the registry doesn't hold.
    ServicePrincipalCreate:
      type: object
      required:
        - tenant_id
        - name
      properties:
        tenant_id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        scopes:
          type: array
          items:
            type: string
    OAuthTokenRequest:
      type: object
      required:
        - grant_type
      properties:
        grant_type:
          type: string
          enum:
            - authorization_code
            - refresh_token
            - urn:ietf:params:oauth:grant-type:device_code
            - urn:ietf:params:oauth:grant-type:token-exchange
        code:
          type: string
        redirect_uri:
          type: string
          format: uri
        code_verifier:
          type: string
        refresh_token:
          type: string
        device_code:
          type: string
          description: Present when grant_type is the RFC 8628 device_code grant.
        resource:
          type: string
          format: uri
          description: RFC 8707 resource indicator. Grant-agnostic — accepted on authorization_code, refresh_token, and token-exchange — and binds the issued access token's audience to this resource (e.g. an MCP server) in addition to the platform's own audience. On refresh_token, omitting it preserves the resource bound at the original grant; supplying it switches the bound resource.
        subject_token:
          type: string
          description: RFC 8693 token-exchange grant only — the token identifying the party whose authority is being exercised.
        subject_token_type:
          type: string
          description: RFC 8693 token-exchange grant only. Only "urn:ietf:params:oauth:token-type:access_token" is supported.
        actor_token:
          type: string
          description: RFC 8693 token-exchange grant only (optional) — names the delegate acting on the subject's behalf (e.g. an AI agent); the issued token carries an "act" claim.
        actor_token_type:
          type: string
        requested_token_type:
          type: string
        scope:
          type: string
        client_id:
          type: string
        client_secret:
          type: string
    DeviceAuthorizationResponse:
      type: object
      description: RFC 8628 §3.2 device authorization response.
      required:
        - device_code
        - user_code
        - verification_uri
        - expires_in
      properties:
        device_code:
          type: string
        user_code:
          type: string
          description: Human-friendly code (XXXX-XXXX) from an unambiguous alphabet.
        verification_uri:
          type: string
          format: uri
        verification_uri_complete:
          type: string
          format: uri
        expires_in:
          type: integer
        interval:
          type: integer
          description: Minimum seconds the device must wait between token polls.
    OAuthTokenResponse:
      type: object
      properties:
        access_token:
          type: string
        id_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          description: The access token's lifetime in seconds.
        expires_at:
          type: string
          format: date-time
          description: When the access token expires; client_credentials tokens only.
        scope:
          type: string
    SCIMError:
      type: object
      description: An RFC 7644 §3.12 SCIM error.
      required: [schemas, status]
      properties:
        schemas:
          type: array
          items:
            type: string
            enum: ['urn:ietf:params:scim:api:messages:2.0:Error']
        status:
          type: string
          example: '409'
        scimType:
          type: string
          example: uniqueness
        detail:
          type: string
    OAuthError:
      type: object
      description: An RFC 6749 §5.2 token error.
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: string
          enum:
            - invalid_request
            - invalid_client
            - invalid_grant
            - unauthorized_client
            - unsupported_grant_type
            - invalid_scope
            - invalid_target
            - authorization_pending
            - slow_down
            - access_denied
            - expired_token
        error_description:
          type: string
    Introspection:
      type: object
      properties:
        active:
          type: boolean
      additionalProperties: true
      description: RFC 7662 response; `active` plus claims when active.
    OIDCDiscovery:
      type: object
      additionalProperties: true
      description: OIDC discovery metadata (issuer, endpoints, supported features).
    JWKS:
      type: object
      properties:
        keys:
          type: array
          items:
            $ref: '#/components/schemas/JWK'
    SAMLConnection:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        name:
          type: string
        idp_entity_id:
          type: string
        idp_sso_url:
          type: string
          format: uri
        idp_certificate:
          type: string
          description: The oldest of the signing certificates the connection trusts.
        certificates:
          type: array
          description: >-
            Every IdP signing certificate the connection trusts, oldest first. An assertion signed with any of them is accepted, so an IdP can roll its key over without a sign-in outage.
          items:
            $ref: '#/components/schemas/SAMLCertificate'
        metadata_url:
          type: string
          format: uri
          nullable: true
          description: The IdP metadata URL the connection refreshes its SSO URL and certificates from; null when it doesn't refresh.
        metadata_refreshed_at:
          type: string
          format: date-time
          nullable: true
          description: When the connection last took its settings from the IdP's metadata.
        metadata_error:
          type: string
          nullable: true
          description: Why the last refresh from metadata_url failed; null once one succeeds.
        email_attribute:
          type: string
        name_attribute:
          type: string
          description: >-
            The attribute carrying the person's display name. When it is empty
            or the assertion lacks it, the common display-name attributes are
            read, else the given and family names joined. Each sign-in sets the
            account's display name to what the assertion carries.
        groups_attribute:
          type: string
          maxLength: 256
          description: >-
            The attribute carrying the person's groups, matched against the
            connection's group mappings and the external ids of groups SCIM
            provisioned. Empty (the default) reads groups,
            http://schemas.microsoft.com/ws/2008/06/identity/claims/groups and
            memberOf. When Microsoft Entra ID leaves the groups out for being
            too many, memberships stay as they are.
        status:
          type: string
        allow_idp_initiated:
          type: boolean
          default: false
          description: >-
            Accept unsolicited assertions that carry no InResponseTo, i.e.
            IdP-initiated SSO. Off by default. Enabling it relaxes only the
            AuthnRequest correlation — signature, issuer, audience, destination
            and time-condition validation are unchanged, and response and
            assertion IDs are still consumed for replay protection.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        last_login_at:
          type: string
          format: date-time
          nullable: true
    SAMLConnectionCreate:
      type: object
      required:
        - name
        - idp_entity_id
        - idp_sso_url
        - idp_certificate
      properties:
        name:
          type: string
        idp_entity_id:
          type: string
        idp_sso_url:
          type: string
          format: uri
        idp_certificate:
          type: string
          description: >-
            PEM or base64 DER X.509 signing certificate. On update it becomes the only certificate the connection trusts; add and remove certificates one at a time with the certificates endpoints.
        email_attribute:
          type: string
        name_attribute:
          type: string
        groups_attribute:
          type: string
          maxLength: 256
          description: The attribute carrying the person's groups; empty reads the common ones (see SAMLConnection). Over 256 characters is refused with 422 validation_failed.
        status:
          type: string
    SAMLConnectionImport:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        metadata_url:
          type: string
          format: uri
          description: Where to fetch the IdP's metadata from, and refresh it from later. Give this or metadata_xml.
        metadata_xml:
          type: string
          description: The IdP's SAML 2.0 metadata document. Give this or metadata_url.
        idp_entity_id:
          type: string
          description: The entity id of the IdP to use, when the metadata describes several.
        email_attribute:
          type: string
        name_attribute:
          type: string
        groups_attribute:
          type: string
          description: The assertion attribute carrying a person's groups; empty reads the common ones.
        status:
          type: string
    SAMLCertificate:
      type: object
      properties:
        id:
          type: string
          format: uuid
        certificate:
          type: string
          description: PEM or base64 DER X.509 certificate
        subject:
          type: string
          description: The certificate's subject; empty if it doesn't parse.
        fingerprint_sha256:
          type: string
          description: SHA-256 fingerprint as colon-separated hex; empty if it doesn't parse.
        not_before:
          type: string
          format: date-time
          nullable: true
        not_after:
          type: string
          format: date-time
          nullable: true
          description: When the certificate expires; an assertion it signed is refused after then.
        source:
          type: string
          enum: [manual, metadata]
          description: Whether an administrator added the certificate or the IdP's metadata listed it.
        created_at:
          type: string
          format: date-time
    OIDCClaimMapping:
      type: object
      description: The ID token claims a sign-in reads. An empty name reads none, except for email, which is required.
      properties:
        email:
          type: string
          default: email
          description: The claim holding the email address, such as email, preferred_username or upn. The provider's email_verified is consulted only when this is email.
        name:
          type: string
          default: name
        given_name:
          type: string
          default: given_name
