type: object
description: The group's organization is the caller's; it is never taken from the body.
required:
  - name
properties:
  description:
    type: string
  name:
    type: string
  parent_id:
    type:
      - string
      - 'null'
    format: uuid
    description: >-
      One of the organization's groups to nest it under; omit or null for a
      top-level group.
