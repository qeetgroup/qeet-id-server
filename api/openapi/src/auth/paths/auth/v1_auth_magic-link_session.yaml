post:
  operationId: createMagicLinkSession
  summary: Magic link — hosted-login session
  description: >-
    Exchanges a magic link issued for the hosted login (app hosted_login) for
    the hosted-login session cookie, and returns where the sign-in journey
    continues (return_to, empty for none). The link works once: used, expired or
    unknown links, and console links, are refused (recovery.link_used,
    recovery.link_expired, recovery.magic_link_invalid), and so are links to an
    account whose organization has since switched magic links off. A link that proves the account's address for the first time marks it
    verified, ends every earlier session and removes everything set up on the
    account before it, its password included (recorded as email.verified and
    auth.credentials_removed), so whoever registered the address first keeps no
    way in. When the account holds
    a second factor, or must have one, no cookie is set: the answer is an MFA
    challenge (with return_to) completed at POST /v1/auth/session/mfa — on the
    same terms as the hosted password sign-in, including a trusted device
    (qe_td) skipping it where the organization allows. The link is spent either
    way. A link for an organization whose address rules refuse the browser's
    address answers 403 auth.address_not_allowed and opens no session. It is
    protected against cross-site requests as POST /v1/auth/session is (an
    allowed Origin, and the qe_csrf token echoed in X-CSRF-Token), and a body
    not sent as JSON is refused (415 unsupported_media_type). A link to an
    address that must now sign in with single sign-on is refused with 403
    auth.sso_required and stays unused (see the SSORequired response).
  tags:
    - Auth
  security: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - token
          properties:
            token:
              type: string
  responses:
    "200":
      description: >-
        Signed in to the hosted login (the cookie is set), or an MFA challenge
        to complete first
      headers:
        Cache-Control:
          $ref: ../../../shared/headers/NoStoreCacheControl.yaml
        Pragma:
          $ref: ../../../shared/headers/NoStorePragma.yaml
      content:
        application/json:
          schema:
            oneOf:
              - type: object
                properties:
                  user_id:
                    type: string
                    format: uuid
                  return_to:
                    type: string
              - allOf:
                  - $ref: ../../../shared/schemas/MFAChallenge.yaml
                  - type: object
                    properties:
                      return_to:
                        type: string
    "400":
      $ref: ../../../shared/responses/BadRequest.yaml
    "403":
      $ref: ../../../shared/responses/Forbidden.yaml
    "404":
      $ref: ../../../shared/responses/NotFound.yaml
    "415":
      $ref: ../../components/responses/UnsupportedMediaType.yaml
    "429":
      $ref: ../../../shared/responses/TooManyRequests.yaml
