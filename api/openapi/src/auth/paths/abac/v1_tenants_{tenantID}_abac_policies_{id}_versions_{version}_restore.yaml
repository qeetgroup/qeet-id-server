post:
  operationId: restoreAbacPolicyVersion
  summary: Restore an ABAC policy version
  description: >-
    Saves one of the policy's earlier versions as its next one, checked as any
    change is: a version whose name another policy has taken answers 409
    abac.policy_name_exists, and one that would lock the caller out 422
    abac.policy_locks_out. Returns the policy. Audited as abac_policy.restored,
    naming the version restored; webhooks receive abac_policy.updated. Requires
    policy.write. Needs a recent step-up.
  tags:
    - ABAC
  parameters:
    - $ref: ../../../shared/parameters/TenantID.yaml
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: version
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  responses:
    '200':
      description: The policy, as restored
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/ABACPolicy.yaml
    '400':
      $ref: ../../../shared/responses/BadRequest.yaml
    '401':
      $ref: ../../../shared/responses/Unauthorized.yaml
    '403':
      $ref: ../../../shared/responses/Forbidden.yaml
    '404':
      $ref: ../../../shared/responses/NotFound.yaml
    '409':
      $ref: ../../../shared/responses/Conflict.yaml
    '422':
      $ref: ../../../shared/responses/Unprocessable.yaml
