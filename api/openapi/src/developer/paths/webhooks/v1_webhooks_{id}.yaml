get:
  operationId: getWebhook
  description: Fetches a single webhook endpoint's configuration and current status.
  summary: Get webhook
  tags:
    - Webhooks
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  responses:
    "200":
      description: Webhook subscription
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/WebhookSubscription.yaml
    "401":
      $ref: ../../../shared/responses/Unauthorized.yaml
    "403":
      $ref: ../../../shared/responses/Forbidden.yaml
    "404":
      $ref: ../../../shared/responses/NotFound.yaml
delete:
  operationId: disableWebhook
  summary: Disable webhook
  tags:
    - Webhooks
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  description: >-
    Disables one of the organization's webhook subscriptions: no further events
    are sent to it. Requires webhook.write. Needs a recent step-up.
  responses:
    "204":
      description: No Content
    "401":
      $ref: ../../../shared/responses/Unauthorized.yaml
    "403":
      $ref: ../../../shared/responses/Forbidden.yaml
    "404":
      $ref: ../../../shared/responses/NotFound.yaml
    "422":
      $ref: ../../../shared/responses/Unprocessable.yaml
    "429":
      $ref: ../../../shared/responses/TooManyRequests.yaml
