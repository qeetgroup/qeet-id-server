        '422':
          $ref: '#/components/responses/Unprocessable'
  /v1/tenants/{tenantID}/relation-tuples:
    get:
      operationId: get_v1_tenants_ByTenantID_relation_tuples
      summary: List relation tuples
      description: |
        List tuples anchored on one side of the relationship. Supply exactly one of:
        - **object** — all tuples where this is the object ("type:id"); returns who has a relation on it.
        - **subject** — all tuples where this is the subject ("type:id" or "type:id#relation"); reverse-lookup of what a principal can reach.
      tags:
        - ReBAC
      parameters:
        - name: tenantID
          in: path
          required: true
          schema:
            type: string
        - name: object
          in: query
          required: false
          schema:
            type: string
          description: 'Object ref "type:id", e.g. document:readme. Mutually exclusive with subject.'
        - name: subject
          in: query
          required: false
          schema:
            type: string
          description: 'Subject ref "type:id" or "type:id#relation", e.g. user:abc123. Returns all objects the subject appears on. Mutually exclusive with object.'
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        '200':
          description: Tuples anchored on the given object or subject
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: post_v1_tenants_ByTenantID_relation_tuples
      description: 'Writes a relationship tuple asserting that a subject holds a named relation on an object, the building block of the ReBAC graph. The subject may be a direct principal or a userset reference (type:id#relation) so relationships can be composed. Test the effect of a tuple with the relation-check call and remove it with the delete-tuple call.'
      summary: Write relation tuple
      tags:
        - ReBAC
      parameters:
        - name: tenantID
          in: path
          required: true
          schema:
            type: string
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - object
                - relation
                - subject
              properties:
                object:
                  type: string
                  description: '"type:id"'
                relation:
                  type: string
                subject:
                  type: string
                  description: '"user:<id>" or "type:id#relation" (userset)'
      responses:
        '201':
          description: Tuple written
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /v1/tenants/{tenantID}/relation-tuples/{id}:
    delete:
      operationId: delete_v1_tenants_ByTenantID_relation_tuples_ById
      description: 'Removes a relationship tuple by its identifier, severing that edge in the ReBAC graph. Any access that depended solely on this tuple is revoked as soon as this returns, so re-verify affected grants with the relation-check call. This is the counterpart to the write-tuple call.'
      summary: Delete relation tuple
      tags:
        - ReBAC
      parameters:
        - name: tenantID
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/tenants/{tenantID}/relation-tuples/check:
    post:
      operationId: post_v1_tenants_ByTenantID_relation_tuples_check
      description: 'Evaluates whether a user holds a relation on an object by walking the ReBAC tuple graph, following userset references transitively. It returns a boolean decision by default; pass explain=true to also receive the root-to-leaf chain of tuples that granted access. This is a read-only decision; author the underlying tuples with the write-tuple call.'
      summary: Check relation
      tags:
        - ReBAC
      parameters:
        - name: tenantID
          in: path
          required: true
          schema:
            type: string
        - name: explain
          in: query
          required: false
          description: When "true", returns the root-to-leaf chain of relation tuples that granted (or would grant) access instead of just the boolean.
          schema:
            type: string
            enum: ['true', 'false']
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - object
                - relation
                - user_id
              properties:
                object:
                  type: string
                relation:
                  type: string
                user_id:
                  type: string
      responses:
        '200':
          description: '{ allowed: bool } by default; with explain=true, { allowed, path } where each path step is { object, relation, subject, depth }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  allowed:
                    type: boolean
                  path:
                    type: array
                    items:
                      type: object
                      properties:
                        object:
                          type: string
                        relation:
                          type: string
                        subject:
                          type: string
                        depth:
                          type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /v1/tenants/{tenantID}/relation-tuples/graph:
    get:
      operationId: get_v1_tenants_ByTenantID_relation_tuples_graph
      summary: Expand identity graph
      description: |
        Builds a node+edge graph of all subject identities reachable from a
        given object+relation, up to `depth` hops. Answers the question:
        "who/what can reach this resource, and through which chain of
        relationships?"

        Each **node** is a `"type:id"` identity (user, group, agent, document,
        or any other modeled entity). Each **edge** is a named relation between
        two nodes, following userset references recursively. The result is
        suitable for graph visualization (e.g. a security-posture or privilege-path
        view) or as input to further investigation queries.

        This is the ReBAC analogue of a privilege-path graph: it is explicit about
        the boundaries of what Qeet ID's own relation-tuple store covers (only
        tuples modeled here, not external RBAC or cloud IAM), and never
        over-claims coverage.
      tags:
        - ReBAC
      parameters:
        - name: tenantID
          in: path
          required: true
          schema:
            type: string
        - name: object
          in: query
          required: true
          schema:
            type: string
          description: 'Root object ref "type:id", e.g. document:security-runbook'
        - name: relation
          in: query
          required: true
          schema:
            type: string
          description: 'Relation to expand from the root, e.g. viewer'
        - name: depth
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 10
            default: 10
          description: Maximum hops to follow (default and max 10)
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        '200':
          description: Graph of all nodes and directed edges reachable from the root
          content:
            application/json:
              schema:
                type: object
                properties:
                  nodes:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: '"type:id"'
                        type:
                          type: string
                        label:
                          type: string
                  edges:
                    type: array
                    items:
                      type: object
                      properties:
                        from:
                          type: string
                        to:
                          type: string
                        relation:
                          type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /v1/tenants/{tenantID}/access/v1/evaluation:
