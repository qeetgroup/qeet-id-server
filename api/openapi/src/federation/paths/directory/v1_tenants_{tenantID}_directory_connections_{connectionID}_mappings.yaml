get:
  operationId: listProfileMappings
  description: >-
    Lists the effective profile attribute-mapping rules configured for a
    directory connection, together with the supported profile target fields.
    Requires connection.read and is scoped to the tenant in the path. These
    rules apply to SCIM user writes and LDAP just-in-time provisioning; create
    rules with POST and remove them with DELETE.
  summary: List effective profile mapping rules
  tags:
    - Directory
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  parameters:
    - $ref: ../../../shared/parameters/TenantID.yaml
    - name: connectionID
      in: path
      required: true
      schema:
        type: string
  responses:
    '200':
      description: Rules and supported profile target types
      content:
        application/json:
          schema:
            type: object
            properties:
              truncated:
                $ref: ../../../shared/schemas/Truncated.yaml
              items:
                type: array
                items:
                  $ref: ../../components/schemas/DirectoryMapping.yaml
              targets:
                type: object
                additionalProperties:
                  type: string
    '401':
      description: Authentication required
    '403':
      description: Tenant mismatch or missing connection.read
    '404':
      description: Connection not found in this tenant
post:
  operationId: createProfileMapping
  summary: Create a profile mapping
  description: >-
    Requires connection.write. Maximum 50 rules per connection and one enabled
    rule per target. Rules apply to SCIM user writes and LDAP JIT provisioning.
    Profile data is tenant-scoped; groups are profile labels, not role or group
    membership grants. Email mapping affects creation, not existing account
    email addresses. Secret sources and privilege targets are rejected.
  tags:
    - Directory
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  parameters:
    - $ref: ../../../shared/parameters/TenantID.yaml
    - name: connectionID
      in: path
      required: true
      schema:
        type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/DirectoryMapping.yaml
  responses:
    '201':
      description: Mapping created and audited
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/DirectoryMapping.yaml
    '400':
      description: Invalid id, version or body
    '401':
      description: Authentication required
    '403':
      description: Tenant mismatch or missing connection.write
    '404':
      description: Connection not found in this tenant
    '409':
      description: Duplicate enabled target or rule limit reached
    '422':
      description: >-
        Mapping refused: validation_failed, with error.fields[0].field naming
        the property at fault (source_attribute, target_field, value_type,
        transform or pattern) and error.fields[0].code the reason:
        directory.mapping_source_invalid, directory.mapping_source_credential,
        directory.mapping_target_unsupported,
        directory.mapping_value_type_mismatch,
        directory.mapping_transform_unsupported,
        directory.mapping_pattern_unexpected or
        directory.mapping_pattern_invalid.
