type: object
required:
  - tenant_id
  - email
properties:
  tenant_id:
    type: string
    format: uuid
  email:
    type: string
    format: email
  password:
    type: string
    minLength: 8
    maxLength: 256
  display_name:
    type: string
    maxLength: 200
  phone:
    type: string
    description: E.164
  metadata:
    type: object
    additionalProperties: true
