get:
  operationId: getBranding
  summary: Get branding
  tags:
    - Branding
  parameters:
    - $ref: ../../../shared/parameters/TenantID.yaml
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  description: >-
    Organization branding, including optional background_color and
    email_reply_to values in settings. Unknown settings are preserved by
    clients. Custom sender addresses are configuration preferences and do not
    activate a provider identity. The saved branding is returned whatever the
    plan, but the hosted login and emails show it only while the organisation's
    plan includes custom_branding; after the plan lapses they use the default
    appearance.
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/TenantBranding.yaml
    '401':
      $ref: ../../../shared/responses/Unauthorized.yaml
    '403':
      $ref: ../../../shared/responses/Forbidden.yaml
    '404':
      $ref: ../../../shared/responses/NotFound.yaml
    '422':
      $ref: ../../../shared/responses/Unprocessable.yaml
    '429':
      $ref: ../../../shared/responses/TooManyRequests.yaml
put:
  operationId: setBranding
  summary: Update branding
  tags:
    - Branding
  parameters:
    - $ref: ../../../shared/parameters/TenantID.yaml
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  requestBody:
    required: false
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/TenantBranding.yaml
    description: >-
      Complete editable branding fields and settings. Preserve unrelated
      settings when updating. The tenant ID is enforced by the authenticated
      route scope.
  description: >-
    Requires custom_branding entitlement. Accepts at most 3 MiB of JSON,
    including an optional base64 PNG, JPEG, WEBP or SVG logo of at most 2 MiB
    decoded. settings.background_color is a six-digit hex color or empty for the
    default; settings.email_reply_to is a single mailbox or empty. Sender name
    and reply-to apply only to tenant invitations and magic links. The
    provider-approved From address is retained.
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/TenantBranding.yaml
    '401':
      $ref: ../../../shared/responses/Unauthorized.yaml
    '403':
      $ref: ../../../shared/responses/Forbidden.yaml
    '404':
      $ref: ../../../shared/responses/NotFound.yaml
    '422':
      $ref: ../../../shared/responses/Unprocessable.yaml
    '429':
      $ref: ../../../shared/responses/TooManyRequests.yaml
