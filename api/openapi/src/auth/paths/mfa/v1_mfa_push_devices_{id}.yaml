delete:
  operationId: revokeMyPushDevice
  description: >-
    Revokes a registered push-MFA device by its identifier so it can no longer
    approve challenges. Its device token is invalidated immediately and any
    pending challenge to it can no longer be answered. Re-enroll the device with
    the register-device call if push approval is needed again. The account
    holder is emailed that it happened, with what to do if it wasn't them.
  summary: Revoke a push-MFA device
  tags:
    - MFA
  security:
    - bearerAuth: []
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    "204":
      description: Device revoked
    "401":
      $ref: ../../../shared/responses/Unauthorized.yaml
    "404":
      $ref: ../../../shared/responses/NotFound.yaml
