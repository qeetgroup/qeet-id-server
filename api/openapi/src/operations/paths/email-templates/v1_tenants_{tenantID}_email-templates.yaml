get:
  operationId: listEmailTemplates
  summary: List templates
  tags:
    - Email Templates
  parameters:
    - $ref: ../../../shared/parameters/TenantID.yaml
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  description: >-
    Lists the tenant-scoped catalogue and overrides. Capabilities indicate
    rich-text/localization support and whether a mail transport is configured
    for test delivery. delivery_scope distinguishes tenant invitations/magic
    links from platform-account security email.
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              items:
                type: array
                items:
                  $ref: ../../components/schemas/EmailResolvedTemplate.yaml
              capabilities:
                type: object
                properties:
                  rich_text:
                    type: boolean
                  localization:
                    type: boolean
                  test_email:
                    type: boolean
    '401':
      $ref: ../../../shared/responses/Unauthorized.yaml
    '403':
      $ref: ../../../shared/responses/Forbidden.yaml
    '404':
      $ref: ../../../shared/responses/NotFound.yaml
    '422':
      $ref: ../../../shared/responses/Unprocessable.yaml
    '429':
      $ref: ../../../shared/responses/TooManyRequests.yaml
