post:
  operationId: completeSocialLink
  summary: Complete linking a provider to my account
  description: >-
    Attaches the provider identity a link callback returned, held under the
    one-time link_code the account page was sent back with, to the caller. Only
    the account that began the link (POST /v1/social/{provider}/link/start)
    completes it; for any other the code is spent and the answer is 403
    social.link_account_mismatch, so a connect link sent to someone else never
    attaches their provider account to the sender's. An unknown, used or expired
    code answers 400 social.link_code_invalid (codes live two minutes); an
    identity already linked to another account answers 409
    social.already_linked. An account whose organization requires single
    sign-on on its domain links no provider (403 auth.sso_required), as no
    social sign-in signs it in.
  tags:
    - Social
  security:
    - bearerAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - code
          properties:
            code:
              type: string
              description: The link_code from the callback's redirect.
  responses:
    "200":
      description: Linked
      content:
        application/json:
          schema:
            type: object
            properties:
              provider:
                type: string
            required:
              - provider
    "400":
      $ref: ../../../shared/responses/BadRequest.yaml
    "401":
      $ref: ../../../shared/responses/Unauthorized.yaml
    "403":
      $ref: ../../../shared/responses/Forbidden.yaml
    "409":
      $ref: ../../../shared/responses/Conflict.yaml
