  /v1/tenants/{tenantID}/oauth/devices/{id}:
    delete:
      operationId: delete_v1_tenants_ByTenantID_oauth_devices_ById
      description: 'Revokes a device authorization in the tenant so the device can no longer complete or continue its token poll at the token-code endpoint. The action is audited. Pairs with the device-authorization list for administrative cleanup.'
