get:
  operationId: getUserStats
  summary: User directory summary
  description: >-
    Organization-wide member counts for the Users admin summary: total, active,
    suspended, invited, with and without a second factor, new in the last 30
    days; members by when they were last seen (last_seen: today, week, month,
    older, never, with the same edges as the list's last_seen filter); owners
    and admins without a second factor; members whose email isn't verified;
    members by role; and the organization's own people by department
    (metadata.department), by team within its department (metadata.team) and
    by location (metadata.location), each up to 200, largest first, and an
    empty list when there are none. Each count equals the list's total for the
    matching filter. Requires `user.read`.
  tags:
    - Users
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  responses:
    "200":
      description: Directory summary
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/UserStats.yaml
    "401":
      $ref: ../../../shared/responses/Unauthorized.yaml
    "403":
      $ref: ../../../shared/responses/Forbidden.yaml
    "429":
      $ref: ../../../shared/responses/TooManyRequests.yaml
