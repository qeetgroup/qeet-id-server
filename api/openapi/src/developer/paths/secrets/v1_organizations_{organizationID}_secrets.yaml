get:
  operationId: listSecrets
  summary: List secrets
  tags:
    - Secrets
  parameters:
    - $ref: ../../../shared/parameters/OrganizationID.yaml
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  description: >-
    Lists the organization's secrets: names, scopes and the last four
    characters, never the values; who last revealed each, and when one with a
    rotation interval is due to be rotated. Requires secret.read.
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            required:
              - items
            properties:
              truncated:
                $ref: ../../../shared/schemas/Truncated.yaml
              items:
                type: array
                items:
                  $ref: ../../components/schemas/Secret.yaml
    '401':
      $ref: ../../../shared/responses/Unauthorized.yaml
    '403':
      $ref: ../../../shared/responses/Forbidden.yaml
    '404':
      $ref: ../../../shared/responses/NotFound.yaml
    '422':
      $ref: ../../../shared/responses/Unprocessable.yaml
    '429':
      $ref: ../../../shared/responses/TooManyRequests.yaml
post:
  operationId: createSecret
  summary: Create secret
  tags:
    - Secrets
  parameters:
    - $ref: ../../../shared/parameters/OrganizationID.yaml
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  requestBody:
    required: false
    content:
      application/json:
        schema:
          type: object
          required:
            - name
            - scope
            - value
          properties:
            name:
              type: string
            scope:
              type: string
            value:
              type: string
            rotation_interval_days:
              type:
                - integer
                - 'null'
              minimum: 1
              maximum: 3650
              description: >-
                Days after the value last changed that the secret is due to be
                rotated; null or left out for no reminder.
  description: >-
    Stores a secret for the organization, encrypted at rest. A name the
    organization already uses is refused, and a rotation interval outside 1 to
    3650 days with 422 secret.rotation_interval_out_of_range. Requires
    secret.write. Needs a recent step-up.
  responses:
    '201':
      description: Created
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/Secret.yaml
    '401':
      $ref: ../../../shared/responses/Unauthorized.yaml
    '403':
      $ref: ../../../shared/responses/Forbidden.yaml
    '404':
      $ref: ../../../shared/responses/NotFound.yaml
    '422':
      $ref: ../../../shared/responses/Unprocessable.yaml
    '429':
      $ref: ../../../shared/responses/TooManyRequests.yaml
