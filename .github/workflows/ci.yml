name: ci

# Verify, on pull requests into develop, release/* and main: the code compiles (build and vet), is formatted and linted
# (golangci-lint, the database tests included), has no known vulnerability in what ships (govulncheck), and the pull
# request adds no secret (gitleaks). Database tests, on pull requests into release/* and main only: every test, the
# database ones too, as make test-db runs them. The generated-SQL check and gosec, and on pull requests into develop the
# tests, run locally before every push (make ci, AGENTS.md "Before you finish").

on:
  pull_request:
    branches: [develop, "release/**", main]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the pull request's commits, for the secret scan
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Installed from source so each is compiled with this repo's Go toolchain (a prebuilt golangci-lint built with
      # an older Go refuses go.mod's newer target). Pinned, not @latest; the same versions as the Makefile.
      - name: Install golangci-lint and govulncheck
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0

      - name: Compile
        run: |
          go build ./...
          go vet ./...

      # The whole tree, including the integration-tagged database tests; gofmt and goimports run as formatters.
      - name: Format and lint
        run: golangci-lint run --build-tags=integration ./...

      # What ships (cmd/ and internal/), with go.mod's toolchain, so the built-in standard library is covered too.
      - name: Dependency audit
        run: govulncheck ./cmd/... ./internal/...

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3

      - name: API contract
        # Lint the OpenAPI sources and fail on a stale generated document, then
        # match the documents against the production routes. No database needed.
        run: |
          make openapi-check
          go test ./internal/bootstrap -run 'OpenAPI|RouteContract'

      # The free gitleaks CLI (the gitleaks Action needs a paid licence for an organization), pinned and
      # checksum-verified, over this pull request's commits.
      - name: Secret scan
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          (cd "$RUNNER_TEMP" && echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict && tar -xzf "$archive" gitleaks)
          "$RUNNER_TEMP/gitleaks" git --redact --exit-code 1 --log-opts="$BASE_SHA..$HEAD_SHA" .

  database:
    name: Database tests
    if: github.base_ref != 'develop'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Every test, with the race detector, against one throwaway PostgreSQL in Docker: the same run as make test-db.
      - name: Database tests
        run: go run ./cmd/devtool test-db
