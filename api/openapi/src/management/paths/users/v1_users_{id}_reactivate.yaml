post:
  operationId: reactivateUser
  summary: Reactivate a suspended owned user
  description: >-
    Requires user.suspend and ownership in the active tenant. Revokes existing
    sessions and records audit/outbox evidence atomically; old sessions are
    never restored. The person must not outrank the caller: only an owner
    changes an owner (403 rbac.target_is_owner), and the caller must hold every
    permission the person holds here (403 rbac.target_outranks_caller naming
    one); acting on yourself is allowed.
  tags:
    - Users
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    '200':
      description: User reactivated
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/UserUser.yaml
    '401':
      description: Authentication required
    '403':
      description: Missing user.suspend
    '404':
      description: Account not owned by this tenant
    '409':
      description: Account is no longer suspended
