name: deploy

on:
  push:
    branches: [main] # every merge to main builds, deploys, then tags
  workflow_dispatch:
    inputs:
      rollback_to:
        description: >-
          Roll production back to this released version (vX.Y.Z, or a full commit sha) instead of
          building. Its image must still be in ECR, and its build must run on the current schema.
        required: false
        default: ""

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write  # push the version tag after a successful deploy
  id-token: write  # required for GitHub OIDC → AWS role assumption
  pull-requests: read  # find the merged release/x.y.z pull request (version)

env:
  AWS_REGION: ${{ vars.AWS_REGION }}

jobs:
  deploy:
    # Production deploys only from main — a manual run on another branch (the
    # default branch is develop) does nothing.
    if: github.ref == 'refs/heads/main' && inputs.rollback_to == ''
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://api.id.qeet.in
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history to find latest tag

      - name: Determine next version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(git tag --list 'v*' --sort=-version:refname | head -1)
          latest=${latest:-v0.0.0}
          # A merged release/x.y.z pull request releases exactly x.y.z, so every
          # Qeet ID repository tags the same product version
          # (qeet-id-kit: docs/release-process.md).
          head=""
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            head=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
              --jq '[.[] | select(.merged_at != null and .base.ref == "main") | .head.ref][0] // ""')
          fi
          if [[ $head =~ ^release/([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            new_tag="v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
            if git rev-parse -q --verify "refs/tags/$new_tag" > /dev/null; then
              echo "::error::$new_tag already exists"
              exit 1
            fi
            if [ "$(printf '%s\n' "${latest#v}" "${new_tag#v}" | sort -V | tail -1)" != "${new_tag#v}" ]; then
              echo "::error::$head is not newer than $latest"
              exit 1
            fi
          else
            IFS='.' read -r major minor patch <<< "${latest#v}"
            new_tag="v${major}.${minor}.$((patch + 1))"
          fi
          echo "Latest: $latest  →  new: $new_tag"
          echo "tag=$new_tag" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Fast gate: don't ship code that doesn't build/pass unit tests.
      - name: Build & unit test
        run: |
          go build ./...
          go test ./...

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      # Immutable tags only: the release version and the commit. Nothing runs a
      # moving "latest" (the registry refuses to overwrite a tag, qeet-id-deploy).
      # The build args stamp the version and commit that /version reports.
      - name: Build & push image
        env:
          REPO: ${{ vars.ECR_REPOSITORY_URL }}
          VERSION: ${{ steps.version.outputs.tag }}
        run: |
          # A re-run after a failed roll finds the version already pushed: fine
          # for the same commit, refused for another (tags are immutable).
          repo_name="${REPO#*/}"
          if tags=$(aws ecr describe-images --repository-name "$repo_name" --image-ids "imageTag=$VERSION" \
              --query 'imageDetails[0].imageTags' --output text 2> /dev/null); then
            if grep -qw "$GITHUB_SHA" <<< "$tags"; then
              echo "$VERSION is already in ECR for this commit; not pushing it again"
              exit 0
            fi
            echo "::error::$VERSION is already in ECR for another commit ($tags); a version can't be overwritten"
            exit 1
          fi
          docker build \
            --build-arg VERSION="$VERSION" \
            --build-arg COMMIT="$GITHUB_SHA" \
            --build-arg DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t "${REPO}:${VERSION}" -t "${REPO}:${GITHUB_SHA}" .
          docker push "${REPO}:${VERSION}"
          docker push "${REPO}:${GITHUB_SHA}"

      # The host switches to exactly this tag (redeploy.sh <version>), records
      # the version it replaces, and refuses a build that can't run on the
      # schema; the job then confirms GET /version serves it.
      - name: Roll the host (SSM)
        env:
          SSM_PREFIX: /qeet-id/prod
          API_URL: ${{ vars.API_URL || 'https://api.id.qeet.in' }}
          ECR_REPOSITORY_URL: ${{ vars.ECR_REPOSITORY_URL }}
        run: scripts/deploy/roll-host.sh "${{ steps.version.outputs.tag }}"

      # Tag + release AFTER a successful deploy so every tag == a live deployed version.
      - name: Push version tag and create GitHub release
        env:
          VERSION: ${{ steps.version.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$VERSION"
          git push origin "$VERSION"
          gh release create "$VERSION" \
            --title "$VERSION" \
            --generate-notes \
            --repo "${{ github.repository }}"

  # Manual rollback: Actions → deploy → Run workflow on main, with rollback_to.
  # Builds nothing and tags nothing; switches the host to a version already in
  # ECR. It stops before touching production when the version isn't retained
  # or its build can't run on the current schema (restore or roll forward
  # instead: operations/runbooks/deployment.md in qeet-id-files).
  rollback:
    if: github.ref == 'refs/heads/main' && inputs.rollback_to != ''
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://api.id.qeet.in
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Roll the host back (SSM)
        env:
          SSM_PREFIX: /qeet-id/prod
          API_URL: ${{ vars.API_URL || 'https://api.id.qeet.in' }}
          ECR_REPOSITORY_URL: ${{ vars.ECR_REPOSITORY_URL }}
          ROLLBACK_TO: ${{ inputs.rollback_to }}
        run: scripts/deploy/roll-host.sh "$ROLLBACK_TO"
