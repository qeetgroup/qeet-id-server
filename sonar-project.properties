# SonarQube analysis of this repository: make sonar-up starts a local server, make sonar analyses
# the code with the coverage of every test, the database ones too. Generated code and build output
# are left out, and so are .env and .secrets/ by name, so local keys are never analysed even if the
# scanner can't read .gitignore.
sonar.projectKey=qeet-id-server
sonar.projectName=Qeet ID server
sonar.sourceEncoding=UTF-8
sonar.sources=.
sonar.exclusions=**/dbgen/**,**/node_modules/**,bin/**,.env,.env.*,.secrets/**,api/openapi/*.yaml,api/postman/**,observability/grafana/dashboards/**,**/*_test.go
sonar.tests=.
sonar.test.inclusions=**/*_test.go
sonar.test.exclusions=**/node_modules/**
sonar.go.coverage.reportPaths=bin/reports/coverage.out
# Coverage describes the server that ships: the development tools, the demo seed, the test harness and
# the build scripts have no coverage to report.
sonar.coverage.exclusions=cmd/devtool/**,cmd/seed/**,tests/**,api/openapi/src/**
sonar.working.directory=bin/.scannerwork
