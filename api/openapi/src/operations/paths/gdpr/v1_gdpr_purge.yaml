post:
  operationId: createPurgeRequest
  summary: Create purge request
  tags:
    - GDPR
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  requestBody:
    required: false
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/GdprCreateInput.yaml
  description: >-
    Requests erasure of a person's account, carried out after the grace period
    unless cancelled. The erasure ends their sessions, redacts the account
    (email, phone, name, avatar, external ID and metadata) and deletes
    everything else it left: credentials and second factors, sign-in history,
    sessions and remembered devices, linked social and single sign-on accounts,
    application consents and grants, connected accounts and their tokens,
    personal API keys, role, group and break-glass memberships, application
    assignments and the persistent identifiers applications know them by,
    directory profiles, notifications, sign-in links and failed sign-in
    counters, and the payloads of the person's data exports; verifiable
    credentials issued to them are revoked and their claims cleared. The audit
    trail and the request itself are kept; the request goes on naming the
    account by user_id after the account is deleted for good. Requires
    gdpr.write.
  responses:
    '201':
      description: Created
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/Request.yaml
    '401':
      $ref: ../../../shared/responses/Unauthorized.yaml
    '403':
      $ref: ../../../shared/responses/Forbidden.yaml
    '404':
      $ref: ../../../shared/responses/NotFound.yaml
    '422':
      $ref: ../../../shared/responses/Unprocessable.yaml
    '429':
      $ref: ../../../shared/responses/TooManyRequests.yaml
