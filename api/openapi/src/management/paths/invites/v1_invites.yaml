post:
  operationId: createInvite
  summary: Create invite
  tags:
    - Invites
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  requestBody:
    required: false
    content:
      application/json:
        example:
          email: grace@example.com
          role_id: '018f2a6d-7b8c-7d9e-a0f1-2b3c4d5e6f70'
          organization_id: '018f2a6c-9c3d-7e4a-b2f1-3a5c9d8e1f00'
        schema:
          $ref: ../../components/schemas/InviteCreateInput.yaml
  description: >-
    Creates an invitation and emails its accept link. Requires member.invite.
    The address is kept lower-case and matched without regard to case. An
    invitation with no role_id, to someone already at home in another
    organization, is refused with 422 invite.role_required, as accepting it
    would join them to nothing. The accept link goes only to the invited
    address; the response carries the invitation and invite.delivery: status
    sent when a provider accepted the email, or not_sent with code and message
    when it did not (email.suppressed: the address bounced or reported spam
    before; email.provider_unavailable: no provider is configured). The
    invitation is created either way. A role_id that is not a role of the
    caller's organization is refused with 404 not_found, the same answer whether
    the role does not exist or belongs to another organization, and no
    invitation is created. A pending invitation holds a seat, as does each
    person holding a role, directly or through a group; when the plan's seats
    are all taken the invitation is refused with 402 billing.plan_limit
    (metadata resource seats, limit), and accepting it later takes no further
    seat. An invitation a person sent is accepted only while they still may
    give it: active, still in the organization and able to give its role, or
    acceptance is refused with 400 invite.invalid; removing them from the
    organization or deleting their account withdraws the invitations they sent.
    Send an Idempotency-Key header to retry it safely: a retry with the
    same key and body within 24 hours gets the first answer, marked
    Idempotent-Replayed: true; the same key with another body answers 422
    idempotency.key_reused, one still being processed 409
    idempotency.in_progress, and one whose first request stopped before
    answering 409 idempotency.outcome_unknown: check whether it took effect,
    then retry with a new key.
  parameters:
    - $ref: ../../../shared/parameters/IdempotencyKey.yaml
  responses:
    '201':
      description: Created
      headers:
        Idempotent-Replayed:
          $ref: ../../../shared/headers/IdempotentReplayed.yaml
      content:
        application/json:
          example:
            invite:
              id: '018f2a74-5f6a-7b7c-9d8e-9f0a1b2c3d4e'
              organization_id: '018f2a6c-9c3d-7e4a-b2f1-3a5c9d8e1f00'
              email: grace@example.com
              role_id: '018f2a6d-7b8c-7d9e-a0f1-2b3c4d5e6f70'
              status: pending
              expires_at: '2026-10-01T10:20:00Z'
              accepted_at: null
              created_at: '2026-09-24T10:20:00Z'
              delivery:
                status: sent
          schema:
            type: object
            required:
              - invite
            properties:
              invite:
                $ref: ../../components/schemas/Invite.yaml
    '401':
      $ref: ../../../shared/responses/Unauthorized.yaml
    '402':
      description: The plan has no seat left for another invitation (billing.plan_limit).
    '403':
      $ref: ../../../shared/responses/Forbidden.yaml
    '404':
      $ref: ../../../shared/responses/NotFound.yaml
    '409':
      description: >-
        A request with this Idempotency-Key is still being processed
        (idempotency.in_progress); retry shortly. Or the first request stopped
        before answering and may have taken effect
        (idempotency.outcome_unknown): check, then retry with a new key.
    '422':
      $ref: ../../../shared/responses/Unprocessable.yaml
    '429':
      $ref: ../../../shared/responses/TooManyRequests.yaml
