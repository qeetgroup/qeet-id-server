get:
  operationId: listUserSessions
  summary: List a user's live sessions
  description: >-
    Admin view of a user's active (non-revoked) sessions, most recently seen
    first: only their sessions in the caller's organization, plus their
    account-level sessions (in no organization) when the caller's organization
    is the user's home organization. Sessions the user holds in other
    organizations are not listed. Requires `user.read`.
  tags:
    - Users
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  responses:
    "200":
      description: Active sessions
      content:
        application/json:
          schema:
            type: object
            properties:
              truncated:
                $ref: ../../../shared/schemas/Truncated.yaml
              items:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                    ip:
                      type:
                        - string
                        - "null"
                    user_agent:
                      type:
                        - string
                        - "null"
                    created_at:
                      type: string
                      format: date-time
                    last_seen_at:
                      type: string
                      format: date-time
                    device:
                      type: string
                      description: >-
                        The device and browser in words ("Chrome on macOS"), as
                        the person's own session list says.
                    device_kind:
                      type: string
                      enum:
                        - desktop
                        - mobile
                        - tablet
                        - unknown
                    country:
                      type: string
                      description: >-
                        Where the session was opened, approximately (ISO 3166-1 alpha-2);
                        omitted when unknown.
                    city:
                      type: string
                      description: The city it was opened from, when the proxy names one.
    "401":
      $ref: ../../../shared/responses/Unauthorized.yaml
    "403":
      $ref: ../../../shared/responses/Forbidden.yaml
    "404":
      $ref: ../../../shared/responses/NotFound.yaml
