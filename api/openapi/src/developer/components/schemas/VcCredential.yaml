type: object
required:
  - id
  - issued_at
  - revoked
  - subject
  - type
  - user
properties:
  expires_at:
    type: string
    format: date-time
  id:
    type: string
    format: uuid
  issued_at:
    type: string
    format: date-time
  revoked:
    type: boolean
  subject:
    type: string
  type:
    type: string
  user:
    description: >-
      The person the credential was issued to; null when the issuer named no
      one, or the account was deleted.
    oneOf:
      - type: "null"
      - type: object
        required:
          - display_name
          - email
          - id
        properties:
          id:
            type: string
            format: uuid
          email:
            type: string
          display_name:
            type: string
