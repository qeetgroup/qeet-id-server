      summary: Map an IdP group
      description: 'Maps a group the connection''s IdP asserts to one of the organisation''s groups, from each person''s next sign-in. Whoever maps a group hands out what it grants: the caller must hold every permission the group''s roles carry, as adding a member needs (403 rbac.grant_exceeds_caller, or rbac.owner_only for a group holding the owner role). A group whose roles carry the owner role or an administrative permission can''t be mapped at all (422 group.mapping_privileged), and the group must be the organisation''s (404 group.not_found). The same pair twice is refused with 409 group.mapping_exists, an empty or over-long idp_group with 422 validation_failed, and a connection holds up to 1,000 mappings (422 group.mapping_too_many). Audited as saml.group_mapping_created. Requires group.write. Needs a recent step-up.'
      tags:
        - SAML
      parameters:
        - name: tenantID
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
