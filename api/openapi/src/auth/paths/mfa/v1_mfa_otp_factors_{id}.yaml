delete:
  operationId: deleteOtpFactor
  summary: Delete OTP factor
  tags:
    - MFA
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  security:
    - bearerAuth: []
  description: >-
    Removes one of the caller's SMS or email factors. Needs a recent step-up.
    The account holder is emailed that it happened, with what to do if it wasn't
    them.
  responses:
    '204':
      description: No Content
    '401':
      $ref: ../../../shared/responses/Unauthorized.yaml
    '403':
      $ref: ../../../shared/responses/Forbidden.yaml
    '404':
      $ref: ../../../shared/responses/NotFound.yaml
    '422':
      $ref: ../../../shared/responses/Unprocessable.yaml
    '429':
      $ref: ../../../shared/responses/TooManyRequests.yaml
