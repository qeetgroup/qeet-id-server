get:
  operationId: listSamlConnections
  description: >-
    Lists the organization's inbound SAML connections, where Qeet acts as the Service
    Provider consuming an external Identity Provider, scoped to the organization in
    the path. Create a connection with POST, then validate it with the
    connection test endpoint before relying on it for sign-in.
  summary: List connections
  tags:
    - SAML
  parameters:
    - $ref: ../../../shared/parameters/OrganizationID.yaml
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  responses:
    "200":
      description: Connections
      content:
        application/json:
          schema:
            type: object
            required:
              - items
            properties:
              truncated:
                $ref: ../../../shared/schemas/Truncated.yaml
              items:
                type: array
                items:
                  $ref: ../../components/schemas/SAMLConnection.yaml
    "400":
      $ref: ../../../shared/responses/BadRequest.yaml
    "401":
      $ref: ../../../shared/responses/Unauthorized.yaml
    "403":
      $ref: ../../../shared/responses/Forbidden.yaml
    "429":
      $ref: ../../../shared/responses/TooManyRequests.yaml
post:
  operationId: createSamlConnection
  description: >-
    Creates an inbound SAML connection in the organization with the external IdP's
    entity id, SSO URL and signing certificate so Qeet can act as the Service
    Provider for that IdP. A name alone creates a draft before the IdP's details
    are known, since the IdP needs the connection's addresses first: the answer
    carries them (sp_entity_id, acs_url, sp_metadata_url), and the IdP's details
    are added later by PATCH, its metadata or its certificates. Any one of the
    IdP's details brings the rest with it (422 saml.connection_fields_required),
    and a connection without them is a draft only (422
    saml.connection_incomplete). Validate the configuration with the connection
    test endpoint, then drive sign-in via GET /saml/login/{id}. Scoped to the
    organization in the path. A status, when given, must be draft, active or disabled
    (422 saml.status_invalid). The organization's plan must include enterprise
    SSO (402 billing.upgrade_required, metadata.feature sso), and every sign-in
    through the connection checks it again.
  summary: Create connection
  tags:
    - SAML
  parameters:
    - $ref: ../../../shared/parameters/OrganizationID.yaml
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/SAMLConnectionCreate.yaml
  responses:
    "201":
      description: Connection created
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/SAMLConnection.yaml
    "400":
      $ref: ../../../shared/responses/BadRequest.yaml
    "401":
      $ref: ../../../shared/responses/Unauthorized.yaml
    "402":
      description: >-
        The organization's plan does not include enterprise SSO
        (billing.upgrade_required).
    "403":
      $ref: ../../../shared/responses/Forbidden.yaml
    "413":
      $ref: ../../../shared/responses/PayloadTooLarge.yaml
    "422":
      $ref: ../../../shared/responses/Unprocessable.yaml
    "429":
      $ref: ../../../shared/responses/TooManyRequests.yaml
