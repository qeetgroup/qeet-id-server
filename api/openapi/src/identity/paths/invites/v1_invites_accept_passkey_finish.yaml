post:
  operationId: finishPasskeyInviteAcceptance
  summary: Accept an invitation with a passkey — finish (public)
  description: >-
    Verifies the passkey and, in one transaction, creates the account in the
    inviting organization with it, grants the invited role and marks the
    invitation accepted; then signs the invitee in, returning a token pair as
    POST /v1/invites/accept does. Each ceremony finishes once: a second attempt,
    or one after the ceremony expired (auth.session_expired), creates nothing
    and leaves the invitation as it was. Refused, with nothing created, when the
    invitation was accepted, revoked or expired meanwhile, its sender may no
    longer give it (400 invite.invalid), or the organization switched passkeys
    off.
  tags:
    - Invites
  security: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: false
          required:
            - session_id
            - credential
          properties:
            session_id:
              type: string
              format: uuid
            credential:
              type: object
              additionalProperties: true
            name:
              type:
                - string
                - "null"
              description: The passkey's name; defaults to one from the device.
  responses:
    "200":
      description: Token pair for the new session
      headers:
        Cache-Control:
          $ref: ../../../shared/headers/NoStoreCacheControl.yaml
        Pragma:
          $ref: ../../../shared/headers/NoStorePragma.yaml
      content:
        application/json:
          schema:
            $ref: ../../../shared/schemas/TokenPair.yaml
    "400":
      $ref: ../../../shared/responses/BadRequest.yaml
    "403":
      $ref: ../../../shared/responses/Forbidden.yaml
    "409":
      $ref: ../../../shared/responses/Conflict.yaml
    "413":
      $ref: ../../../shared/responses/PayloadTooLarge.yaml
    "422":
      $ref: ../../../shared/responses/Unprocessable.yaml
    "429":
      $ref: ../../../shared/responses/TooManyRequests.yaml
