get:
  operationId: listGroupMembers
  summary: List members
  tags:
    - Groups
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  description: Lists a group's members. Requires group.read.
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            required:
              - items
            properties:
              truncated:
                $ref: ../../../shared/schemas/Truncated.yaml
              items:
                type: array
                items:
                  $ref: ../../components/schemas/Member.yaml
    "401":
      $ref: ../../../shared/responses/Unauthorized.yaml
    "403":
      $ref: ../../../shared/responses/Forbidden.yaml
    "404":
      $ref: ../../../shared/responses/NotFound.yaml
    "422":
      $ref: ../../../shared/responses/Unprocessable.yaml
    "429":
      $ref: ../../../shared/responses/TooManyRequests.yaml
