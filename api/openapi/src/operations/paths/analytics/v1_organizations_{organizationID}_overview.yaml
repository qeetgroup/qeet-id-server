get:
  operationId: getOrganizationOverview
  summary: Organization overview
  description: >-
    The dashboard's set-up checklist and counts in one read. Each area is
    answered only to a caller the area's own list would admit, and left out of
    the answer otherwise: single_sign_on, applications, domains, directory and
    remembered_devices need connection.read; api_keys apikey.read; webhooks
    webhook.read; sign_in, access_policies and threats policy.read; invitations
    user.read; billing billing.read. A person is judged by their roles, an
    application's token also by its scopes, and an API key, service principal
    or agent by its scopes, as the route guard judges them. The read itself
    needs organization.read. The detailed lists stay at their own reads.
  tags:
    - Analytics
  parameters:
    - $ref: ../../../shared/parameters/OrganizationID.yaml
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  responses:
    "200":
      description: The overview, with the areas the caller may read
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/OrganizationOverview.yaml
    "400":
      $ref: ../../../shared/responses/BadRequest.yaml
    "401":
      $ref: ../../../shared/responses/Unauthorized.yaml
    "403":
      $ref: ../../../shared/responses/Forbidden.yaml
    "404":
      $ref: ../../../shared/responses/NotFound.yaml
    "429":
      $ref: ../../../shared/responses/TooManyRequests.yaml
