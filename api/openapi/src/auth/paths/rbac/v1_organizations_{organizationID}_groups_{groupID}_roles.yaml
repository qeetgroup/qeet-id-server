get:
  operationId: listGroupRoles
  description: >-
    Lists the roles granted to a group within the organization; every member of the
    group inherits these roles' permissions. Use it to review a group's
    authorization before changing it. Grant a role with the grant-role-to-group
    call and remove one with the revoke-role-from-group call.
  summary: List group roles
  tags:
    - RBAC
  parameters:
    - $ref: ../../../shared/parameters/OrganizationID.yaml
    - name: groupID
      in: path
      required: true
      schema:
        type: string
        format: uuid
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  responses:
    '200':
      description: Roles granted to the group
      content:
        application/json:
          schema:
            type: object
            properties:
              truncated:
                $ref: ../../../shared/schemas/Truncated.yaml
              items:
                type: array
                items:
                  $ref: ../../components/schemas/GroupRole.yaml
    '400':
      $ref: ../../../shared/responses/BadRequest.yaml
    '401':
      $ref: ../../../shared/responses/Unauthorized.yaml
    '403':
      $ref: ../../../shared/responses/Forbidden.yaml
