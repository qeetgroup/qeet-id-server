post:
  operationId: importSamlConnection
  summary: Create connection from IdP metadata
  description: >-
    Creates an inbound SAML connection from the external IdP's SAML 2.0
    metadata, given either as the XML (metadata_xml) or as a URL to fetch it
    from (metadata_url). The connection takes the IdP's entity id, its https
    HTTP-Redirect SingleSignOnService and its signing certificates from the
    metadata. A connection given a URL refreshes from it every few hours, adding
    the IdP's new signing certificates and dropping those the metadata no longer
    lists (certificates an administrator added are kept); metadata that can't be
    fetched or no longer describes the same IdP changes nothing and is reported
    in metadata_error. The URL is fetched only from public https addresses, with
    a 10-second timeout and a 1 MiB limit. Metadata describing several identity
    providers needs idp_entity_id to pick one. Neither or both sources answer
    422 saml.metadata_required; unusable metadata 422 saml.metadata_invalid,
    with the reason in detail; a URL that isn't allowed 422
    saml.metadata_url_invalid; one that can't be fetched 422
    saml.metadata_unreachable. The organization's plan must include enterprise
    SSO (402 billing.upgrade_required), checked before anything is fetched.
    Scoped to the organization in the path and audited.
  tags:
    - SAML
  parameters:
    - $ref: ../../../shared/parameters/OrganizationID.yaml
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/SAMLConnectionImport.yaml
  responses:
    "201":
      description: Connection created
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/SAMLConnection.yaml
    "400":
      $ref: ../../../shared/responses/BadRequest.yaml
    "401":
      $ref: ../../../shared/responses/Unauthorized.yaml
    "402":
      description: >-
        The organization's plan does not include enterprise SSO
        (`billing.upgrade_required`); nothing is fetched.
      content:
        application/json:
          schema:
            $ref: ../../../shared/schemas/Error.yaml
    "403":
      $ref: ../../../shared/responses/Forbidden.yaml
    "413":
      $ref: ../../../shared/responses/PayloadTooLarge.yaml
    "422":
      $ref: ../../../shared/responses/Unprocessable.yaml
    "429":
      $ref: ../../../shared/responses/TooManyRequests.yaml
