get:
  operationId: getQeetAiStatus
  summary: Qeet AI configuration status
  description: >-
    Returns whether Qeet AI is configured for the caller's organization, whose
    key applies (source), whether the assistant may be used (available) and
    which provider and model are active. Never returns key material. Used by
    the console to render the unconfigured setup state.
  tags:
    - Qeet AI
  security:
    - bearerAuth: []
  responses:
    "200":
      description: Qeet AI status
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/QeetAIStatus.yaml
    "401":
      $ref: ../../../shared/responses/Unauthorized.yaml
    "429":
      $ref: ../../../shared/responses/TooManyRequests.yaml
