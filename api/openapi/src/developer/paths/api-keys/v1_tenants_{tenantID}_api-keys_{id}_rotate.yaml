post:
  operationId: rotateApiKey
  summary: Rotate API key
  description: >-
    Replaces a live API key with a new one of the same name, scopes, person and
    expiry, whose secret is returned only now, and keeps the old key working for
    overlap_hours (default 24, at most 168; 0 revokes it at once). The new key
    names the one it replaced in rotated_from. A key acting for a person is
    rotated only by that person (403 apikey.user_not_self). The caller must hold
    every scope of the key (403 rbac.grant_exceeds_caller). Requires
    apikey.write. Needs a recent step-up. Audited as apikey.rotated.
  tags:
    - API Keys
  parameters:
    - $ref: ../../../shared/parameters/TenantID.yaml
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  requestBody:
    required: false
    content:
      application/json:
        schema:
          type: object
          properties:
            overlap_hours:
              type: integer
              minimum: 0
              maximum: 168
              description: >-
                How long the old key goes on working beside the new one.
                Defaults to 24; 0 stops it at once.
  responses:
    '201':
      description: The new key; its secret shown once
      headers:
        Cache-Control:
          $ref: ../../../shared/headers/NoStoreCacheControl.yaml
        Pragma:
          $ref: ../../../shared/headers/NoStorePragma.yaml
      content:
        application/json:
          schema:
            type: object
            properties:
              api_key:
                $ref: ../../components/schemas/ApiKey.yaml
              secret:
                type: string
              warning:
                type: string
    '401':
      $ref: ../../../shared/responses/Unauthorized.yaml
    '403':
      $ref: ../../../shared/responses/Forbidden.yaml
    '404':
      $ref: ../../../shared/responses/NotFound.yaml
    '422':
      $ref: ../../../shared/responses/Unprocessable.yaml
