delete:
  operationId: deleteOrganization
  description: >-
    Schedules the organization's deletion seven days from now (202 with
    deletion_due_at), audited as organization.deletion_scheduled. Requires
    organization.delete, and only a person who owns the organization may (403
    organization.owner_only otherwise), and 409 organization.deletion_scheduled answers one
    already scheduled. Until it is due the organization keeps working and shows
    deletion_due_at, and an owner can call it off (POST
    /v1/organizations/{organizationID}/deletion/cancel). Once due, a background job
    soft-deletes it: members lose access and organization-scoped calls stop resolving.
    Users who belonged only to this organization are left without one and must create
    or join another. In the same transaction every session in the organization ends
    (session.revoked with reason organization_deleted) and the deletion is audited
    (organization.deleted, by the system) and queued as an event; refresh and every
    sign-in refuse the organization from then on (403 auth.organization_inactive). The
    sessions' access tokens stop working on this API at once; a service that
    verifies tokens offline accepts one until it expires. Thirty days after that
    its data is purged for good: every row of it, its audit trail included, and
    the accounts whose home it was (one still a member of another organization
    is kept, with no home organization). A record of the purge (when, and how
    many rows of each table) outlives it, with a platform audit event
    organization.purged.
  summary: Delete organization
  tags:
    - Organizations
  parameters:
    - $ref: ../../../shared/parameters/OrganizationID.yaml
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  responses:
    '202':
      description: Deletion scheduled
      content:
        application/json:
          schema:
            type: object
            properties:
              organization_id:
                type: string
                format: uuid
              deletion_due_at:
                type: string
                format: date-time
    '401':
      $ref: ../../../shared/responses/Unauthorized.yaml
    '403':
      $ref: ../../../shared/responses/Forbidden.yaml
    '404':
      $ref: ../../../shared/responses/NotFound.yaml
    '409':
      $ref: ../../../shared/responses/Conflict.yaml
get:
  operationId: getOrganization
  description: >-
    Returns a single organization by id. The caller must be a member of the organization;
    requests for an organization the principal does not belong to are rejected rather
    than disclosed.
  summary: Get organization
  tags:
    - Organizations
  parameters:
    - $ref: ../../../shared/parameters/OrganizationID.yaml
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  responses:
    '200':
      description: Organization
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/Organization.yaml
    '401':
      $ref: ../../../shared/responses/Unauthorized.yaml
    '403':
      $ref: ../../../shared/responses/Forbidden.yaml
    '404':
      $ref: ../../../shared/responses/NotFound.yaml
patch:
  operationId: updateOrganization
  description: >-
    Updates mutable organization attributes such as name and slug. Requires an
    administrative role within the organization. Only the fields supplied in the
    request body are changed. Changing status is an owner's (403
    organization.owner_only otherwise), and an organization can't suspend itself (403
    organization.self_suspend): that would lock out every member, its owners too, with
    nobody left to reactivate it; delete it instead. An organization suspended another
    way that is reactivated is audited as organization.reactivated and queued as an
    event. The region can't be changed (422 organization.region_read_only; the current
    value is accepted). A change to the name, logo or metadata is audited, in
    the same transaction, as organization.updated naming every field that changed
    (changed), with the old and new name (changes); the logo and metadata are
    named but not copied. An update that changes nothing records nothing.
  summary: Update organization
  tags:
    - Organizations
  parameters:
    - $ref: ../../../shared/parameters/OrganizationID.yaml
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/OrganizationUpdate.yaml
  responses:
    '200':
      description: Updated
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/Organization.yaml
    '400':
      $ref: ../../../shared/responses/BadRequest.yaml
    '401':
      $ref: ../../../shared/responses/Unauthorized.yaml
    '403':
      $ref: ../../../shared/responses/Forbidden.yaml
    '404':
      $ref: ../../../shared/responses/NotFound.yaml
    '422':
      $ref: ../../../shared/responses/Unprocessable.yaml
