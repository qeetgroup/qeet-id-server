get:
  operationId: listUserTrustedDevices
  summary: List a member's remembered devices
  description: >-
    Lists a member's devices remembered in the caller's organisation. Requires
    the user.read permission; 404 for someone who is not a member.
  tags:
    - Users
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              truncated:
                $ref: ../../../shared/schemas/Truncated.yaml
              items:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                    tenant_id:
                      type:
                        - string
                        - 'null'
                      format: uuid
                      description: The organisation the device was remembered in.
                    device:
                      type: string
                      description: >-
                        The device and browser in words, such as "Chrome on
                        macOS".
                    device_kind:
                      type: string
                      enum:
                        - desktop
                        - mobile
                        - tablet
                        - unknown
                    user_agent:
                      type: string
                    created_at:
                      type: string
                      format: date-time
                    last_used_at:
                      type:
                        - string
                        - 'null'
                      format: date-time
                      description: When the device last skipped the second factor.
                    expires_at:
                      type: string
                      format: date-time
                    current:
                      type: boolean
                      description: The request came from this device.
    '401':
      $ref: ../../../shared/responses/Unauthorized.yaml
    '403':
      $ref: ../../../shared/responses/Forbidden.yaml
    '404':
      $ref: ../../../shared/responses/NotFound.yaml
    '429':
      $ref: ../../../shared/responses/TooManyRequests.yaml
delete:
  operationId: forgetAllUserTrustedDevices
  summary: Forget a member's remembered devices
  description: >-
    Forgets every device a member has remembered in the caller's organisation,
    so each is asked for the second factor at its next sign-in there. Requires
    the user.credentials permission; each is audited as
    auth.trusted_device_revoked. Refused with 403 rbac.target_is_owner when the
    member is an owner and the caller isn't, and 403
    rbac.target_outranks_caller when they hold a permission the caller doesn't.
  tags:
    - Users
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              forgotten:
                type: integer
                description: How many devices were forgotten.
    '401':
      $ref: ../../../shared/responses/Unauthorized.yaml
    '403':
      $ref: ../../../shared/responses/Forbidden.yaml
    '404':
      $ref: ../../../shared/responses/NotFound.yaml
    '429':
      $ref: ../../../shared/responses/TooManyRequests.yaml
