get:
  operationId: listCredentials
  description: >-
    Lists the verifiable credentials issued by the organization, each with the person
    it was issued to when the issuer named one.
  summary: List credentials
  tags:
    - Credentials
  parameters:
    - $ref: ../../../shared/parameters/OrganizationID.yaml
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  responses:
    "200":
      description: Issued credentials (registry view)
      content:
        application/json:
          schema:
            type: object
            required:
              - items
            properties:
              truncated:
                $ref: ../../../shared/schemas/Truncated.yaml
              items:
                type: array
                items:
                  $ref: ../../components/schemas/VcCredential.yaml
    "400":
      $ref: ../../../shared/responses/BadRequest.yaml
    "401":
      $ref: ../../../shared/responses/Unauthorized.yaml
    "403":
      $ref: ../../../shared/responses/Forbidden.yaml
    "429":
      $ref: ../../../shared/responses/TooManyRequests.yaml
post:
  operationId: issueCredential
  description: >-
    Issues a verifiable credential (W3C VC / JWT-VC) to a subject. A presented
    credential can later be checked with the public verify endpoint.
  summary: Issue credential
  tags:
    - Credentials
  parameters:
    - $ref: ../../../shared/parameters/OrganizationID.yaml
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: false
          required:
            - subject
            - type
          properties:
            subject:
              type: string
              minLength: 1
            type:
              type: string
              minLength: 1
            claims:
              type:
                - object
                - "null"
              additionalProperties: true
            ttl_seconds:
              type:
                - integer
                - "null"
            user_id:
              type:
                - string
                - "null"
              format: uuid
              description: >-
                The person the credential is for, a member of the organization
                (else 422 vc.user_not_member). Recorded with the credential, not
                in the signed JWT-VC.
  responses:
    "201":
      description: Signed JWT-VC + credential id
      headers:
        Cache-Control:
          $ref: ../../../shared/headers/NoStoreCacheControl.yaml
        Pragma:
          $ref: ../../../shared/headers/NoStorePragma.yaml
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/IssueResult.yaml
    "400":
      $ref: ../../../shared/responses/BadRequest.yaml
    "401":
      $ref: ../../../shared/responses/Unauthorized.yaml
    "403":
      $ref: ../../../shared/responses/Forbidden.yaml
    "413":
      $ref: ../../../shared/responses/PayloadTooLarge.yaml
    "422":
      $ref: ../../../shared/responses/Unprocessable.yaml
    "429":
      $ref: ../../../shared/responses/TooManyRequests.yaml
