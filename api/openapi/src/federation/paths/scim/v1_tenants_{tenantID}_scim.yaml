get:
  operationId: getScimConfig
  summary: Get SCIM config
  tags:
    - SCIM
  parameters:
    - $ref: ../../../shared/parameters/TenantID.yaml
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  description: >-
    Returns the organisation's SCIM settings, never a token: whether one works,
    the newest working token's prefix and creation, the latest use of any, how
    many work (token_count), and how the last change the identity provider sent
    was answered (last_request). List the tokens themselves with GET
    /v1/tenants/{tenantID}/scim/tokens. Requires connection.read.
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/ConfigView.yaml
    '401':
      $ref: ../../../shared/responses/Unauthorized.yaml
    '403':
      $ref: ../../../shared/responses/Forbidden.yaml
    '404':
      $ref: ../../../shared/responses/NotFound.yaml
    '422':
      $ref: ../../../shared/responses/Unprocessable.yaml
    '429':
      $ref: ../../../shared/responses/TooManyRequests.yaml
