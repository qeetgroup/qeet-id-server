get:
  operationId: listAuditEvents
  description: >-
    Returns the organization's audit events in reverse chronological order with
    cursor-based pagination and optional filters for action, resource type,
    actor, and a free-text query. The audit log is append-only and hash-chained,
    so results reflect an immutable record of activity. Events are kept for the
    plan's audit_retention_days (7, 30, 90 days, or for good), then deleted.
    Pass the returned cursor to page through history; access is restricted to
    the organization named in the path.
  summary: List audit events
  tags:
    - Audit
  parameters:
    - $ref: ../../../shared/parameters/OrganizationID.yaml
    - name: q
      in: query
      required: false
      description: >
        Finds words of the action, resource type, actor type, user agent,
        address and metadata, each split into words (auth.login_succeeded is
        auth, login and succeeded), every plain word as a prefix; or the events
        of an actor whose name contains it or whose email begins with it.
        "Quoted phrases", -exclusions and OR are read as websearch_to_tsquery
        reads them.
      schema:
        type: string
    - name: action
      in: query
      required: false
      description: Comma-separated actions; events of any of them.
      schema:
        type: string
    - name: resource_type
      in: query
      required: false
      description: Comma-separated resource types; events about any of them.
      schema:
        type: string
    - name: resource_id
      in: query
      required: false
      schema:
        type: string
        format: uuid
    - name: ip
      in: query
      required: false
      description: Events from this address.
      schema:
        type: string
    - name: from
      in: query
      required: false
      description: Inclusive lower bound (RFC3339).
      schema:
        type: string
        format: date-time
    - name: to
      in: query
      required: false
      description: Inclusive upper bound (RFC3339).
      schema:
        type: string
        format: date-time
    - name: actor_user_id
      in: query
      required: false
      schema:
        type: string
    - name: limit
      in: query
      required: false
      description: Page size, 1 to 200 (default 50). A larger value is lowered to 200; a smaller or malformed one gets the default.
      schema:
        type: integer
        default: 50
    - name: cursor
      in: query
      required: false
      description: >-
        The previous page's next_cursor (the id of its last event), for keyset
        pagination.
      schema:
        type: string
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  responses:
    "200":
      description: >-
        { items: AuditEvent[], next_cursor?: string, total, total_capped };
        next_cursor is absent on the last page.
      content:
        application/json:
          example:
            items:
              - id: 018f2a90-1b2c-7d3e-8f40-5a6b7c8d9e01
                organization_id: 018f2a6c-9c3d-7e4a-b2f1-3a5c9d8e1f00
                action: user.created
                resource_type: user
                resource_id: 018f2a70-1a2b-7c3d-9e4f-5a6b7c8d9e0f
                actor_type: user
                actor_user_id: 018f2a70-1a2b-7c3d-9e4f-5a6b7c8d9e0f
                ip: 203.0.113.10
                user_agent: Mozilla/5.0 (Macintosh; Intel Mac OS X 14_6)
                request_id: api-1/Kx9fQ2mW7a-000124
                created_at: "2026-09-24T10:15:04Z"
              - id: 018f2a90-0a1b-7c2d-8e3f-4a5b6c7d8e00
                organization_id: 018f2a6c-9c3d-7e4a-b2f1-3a5c9d8e1f00
                action: organization.created
                resource_type: organization
                resource_id: 018f2a6c-9c3d-7e4a-b2f1-3a5c9d8e1f00
                actor_type: user
                actor_user_id: 018f2a70-1a2b-7c3d-9e4f-5a6b7c8d9e0f
                ip: 203.0.113.10
                user_agent: Mozilla/5.0 (Macintosh; Intel Mac OS X 14_6)
                request_id: api-1/Kx9fQ2mW7a-000123
                created_at: "2026-09-24T10:15:00Z"
            next_cursor: 018f2a90-0a1b-7c2d-8e3f-4a5b6c7d8e00
            total: 2
            total_capped: false
          schema:
            type: object
            required:
              - items
              - total
              - total_capped
            properties:
              items:
                type: array
                items:
                  $ref: ../../components/schemas/Row.yaml
              next_cursor:
                $ref: ../../../shared/schemas/NextCursor.yaml
              total:
                type: integer
                description: How many events match, up to 10,000.
              total_capped:
                type: boolean
                description: More than 10,000 events match.
    "400":
      $ref: ../../../shared/responses/BadRequest.yaml
    "401":
      $ref: ../../../shared/responses/Unauthorized.yaml
    "403":
      $ref: ../../../shared/responses/Forbidden.yaml
    "422":
      $ref: ../../../shared/responses/Unprocessable.yaml
    "429":
      $ref: ../../../shared/responses/TooManyRequests.yaml
