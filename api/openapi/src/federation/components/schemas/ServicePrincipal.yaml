type: object
required:
  - created_at
  - description
  - disabled_at
  - id
  - last_used_at
  - name
  - scopes
  - organization_id
properties:
  created_at:
    type: string
    format: date-time
  disabled_at:
    type:
      - string
      - 'null'
    format: date-time
  id:
    type: string
    format: uuid
  name:
    type: string
  scopes:
    type: array
    items:
      type: string
  organization_id:
    type: string
    format: uuid
  description:
    type: string
  last_used_at:
    type:
      - string
      - 'null'
    format: date-time
    description: When the principal was last issued a token, to the minute.
  previous_secret_expires_at:
    type: string
    format: date-time
    description: >-
      Present while the secret replaced at its last rotation still works, until
      then.
