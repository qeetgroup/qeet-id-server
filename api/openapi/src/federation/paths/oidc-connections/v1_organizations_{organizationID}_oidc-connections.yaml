get:
  operationId: listOidcConnections
  description: >-
    Lists the organization's OpenID Connect connections, through which its
    people sign in with its own identity provider (Microsoft Entra ID, Okta,
    Google Workspace and the like), with Qeet acting as the relying party.
    Scoped to the organization in the path. Client secrets are never returned. Each
    connection carries the redirect_uri to register with the provider. Requires
    connection.read.
  summary: List OIDC connections
  tags:
    - OIDC Connections
  parameters:
    - $ref: ../../../shared/parameters/OrganizationID.yaml
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  responses:
    "200":
      description: Connections
      content:
        application/json:
          schema:
            type: object
            properties:
              truncated:
                $ref: ../../../shared/schemas/Truncated.yaml
              items:
                type: array
                items:
                  $ref: ../../components/schemas/OIDCConnection.yaml
    "400":
      $ref: ../../../shared/responses/BadRequest.yaml
    "401":
      $ref: ../../../shared/responses/Unauthorized.yaml
    "403":
      $ref: ../../../shared/responses/Forbidden.yaml
    "429":
      $ref: ../../../shared/responses/TooManyRequests.yaml
post:
  operationId: createOidcConnection
  description: >-
    Creates an OpenID Connect connection in the organization, a draft unless a
    status is given. The issuer must be an absolute https URL without a query or
    fragment (422 oidc_connection.issuer_invalid); the discovery document is
    read from discovery_url, or from the issuer's
    /.well-known/openid-configuration when none is given (422
    oidc_connection.discovery_url_invalid). The client secret is stored
    encrypted and never returned. Scopes default to openid, email and profile,
    and openid is always asked for (422 oidc_connection.scopes_invalid).
    allowed_idp_tenant_ids are the provider's own tenant IDs (the tid claim, as
    Microsoft Entra ID issues it) a token must name: an Entra issuer that serves
    every organization (common, organizations or consumers) is refused without
    them (422 oidc_connection.idp_tenant_ids_required), or anyone with a
    Microsoft account could sign in. claim_mapping names the claims read for the
    email address (required, default email), name, given and family names and
    groups. Missing fields answer 422 oidc_connection.fields_required, an
    unknown status 422 oidc_connection.status_invalid. The organization's plan
    must include single sign-on (402 billing.upgrade_required). Audited as
    oidc_connection.created. Requires connection.write. Needs a recent step-up.
  summary: Create OIDC connection
  tags:
    - OIDC Connections
  parameters:
    - $ref: ../../../shared/parameters/OrganizationID.yaml
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/OIDCConnectionCreate.yaml
  responses:
    "201":
      description: Connection created
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/OIDCConnection.yaml
    "400":
      $ref: ../../../shared/responses/BadRequest.yaml
    "401":
      $ref: ../../../shared/responses/Unauthorized.yaml
    "402":
      description: >-
        The organization's plan does not include single sign-on
        (billing.upgrade_required).
      content:
        application/json:
          schema:
            $ref: ../../../shared/schemas/Error.yaml
    "403":
      $ref: ../../../shared/responses/Forbidden.yaml
    "413":
      $ref: ../../../shared/responses/PayloadTooLarge.yaml
    "422":
      $ref: ../../../shared/responses/Unprocessable.yaml
    "429":
      $ref: ../../../shared/responses/TooManyRequests.yaml
