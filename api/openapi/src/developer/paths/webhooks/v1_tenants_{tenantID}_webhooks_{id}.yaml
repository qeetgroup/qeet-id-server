patch:
  operationId: updateWebhook
  summary: Change a webhook
  description: >-
    Changes a webhook's URL, its events, or both, each checked as on creation: a
    URL that isn't a public https address is refused with 400
    webhook.url_not_allowed, events outside the catalogue with
    webhook.event_unknown. Audited as webhook.subscription_updated with what
    changed. Needs a recent step-up.
  tags:
    - Webhooks
  parameters:
    - $ref: ../../../shared/parameters/TenantID.yaml
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            url:
              type: string
              format: uri
            events:
              type: array
              items:
                type: string
  responses:
    '200':
      description: The changed webhook
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/WebhookSubscription.yaml
    '400':
      $ref: ../../../shared/responses/BadRequest.yaml
    '401':
      $ref: ../../../shared/responses/Unauthorized.yaml
    '403':
      $ref: ../../../shared/responses/Forbidden.yaml
    '404':
      $ref: ../../../shared/responses/NotFound.yaml
    '422':
      $ref: ../../../shared/responses/Unprocessable.yaml
