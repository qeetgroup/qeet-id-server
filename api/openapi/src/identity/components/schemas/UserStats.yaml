type: object
required:
  - total
  - active
  - suspended
  - invited
  - mfa_enabled
  - mfa_missing
  - new_last_30d
  - last_seen
  - admins_without_mfa
  - email_unverified
  - by_role
  - by_department
  - by_team
  - by_location
properties:
  total:
    type: integer
  active:
    type: integer
  suspended:
    type: integer
  invited:
    type: integer
  mfa_enabled:
    type: integer
  mfa_missing:
    type: integer
  new_last_30d:
    type: integer
  last_seen:
    type: object
    required:
      - today
      - week
      - month
      - older
      - never
    properties:
      today:
        type: integer
      week:
        type: integer
      month:
        type: integer
      older:
        type: integer
      never:
        type: integer
  admins_without_mfa:
    type: integer
    description: >-
      Members holding the built-in owner or admin role with no confirmed second
      factor.
  email_unverified:
    type: integer
  by_role:
    type: array
    items:
      type: object
      required:
        - role
        - count
      properties:
        role:
          type: string
        count:
          type: integer
  by_department:
    type: array
    description: >-
      Up to 200 departments (metadata.department), largest first, counting
      the organization's own people: another organization's show it no
      metadata.
    items:
      type: object
      required:
        - department
        - count
      properties:
        department:
          type: string
        count:
          type: integer
  by_team:
    type: array
    description: >-
      Up to 200 teams (metadata.team) within their departments
      (metadata.department, "" when a member names none), largest first,
      counting the organization's own people.
    items:
      type: object
      required:
        - department
        - team
        - count
      properties:
        department:
          type: string
        team:
          type: string
        count:
          type: integer
  by_location:
    type: array
    description: >-
      Up to 200 locations (metadata.location), largest first, counting the
      organization's own people.
    items:
      type: object
      required:
        - location
        - count
      properties:
        location:
          type: string
        count:
          type: integer
