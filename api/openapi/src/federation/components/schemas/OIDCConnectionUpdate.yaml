type: object
additionalProperties: false
properties:
  name:
    type:
      - string
      - "null"
  issuer:
    type:
      - string
      - "null"
    format: uri
  discovery_url:
    type:
      - string
      - "null"
  client_id:
    type:
      - string
      - "null"
  client_secret:
    type:
      - string
      - "null"
    writeOnly: true
    description: A new client secret; absent or empty keeps the stored one.
  scopes:
    type:
      - array
      - "null"
    maxItems: 20
    items:
      type: string
  allowed_idp_tenant_ids:
    type:
      - array
      - "null"
    maxItems: 50
    items:
      type: string
      format: uuid
  claim_mapping:
    $ref: ./OIDCClaimMapping.yaml
  status:
    type:
      - string
      - "null"
    enum:
      - draft
      - active
      - disabled
      - null
