type: object
additionalProperties: false
required:
  - organization_id
  - email
properties:
  organization_id:
    type: string
    format: uuid
  email:
    type: string
    format: email
  password:
    type:
      - string
      - "null"
    minLength: 8
    maxLength: 256
  display_name:
    type:
      - string
      - "null"
    maxLength: 200
  phone:
    type:
      - string
      - "null"
    description: E.164
  metadata:
    type:
      - object
      - "null"
    additionalProperties: true
