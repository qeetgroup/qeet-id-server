get:
  operationId: listPortalDomains
  summary: List domains (portal)
  description: >-
    Lists the domains of the tenant bound to the portal session, with the DNS
    record each needs and its verification status. Requires the link's
    capabilities to include domain_verification.
  tags:
    - Admin Portal
  security:
    - adminPortalCookie: []
  responses:
    '200':
      description: Domains with their DNS verification records
      content:
        application/json:
          schema:
            type: object
            properties:
              truncated:
                $ref: ../../../shared/schemas/Truncated.yaml
              items:
                type: array
                items:
                  $ref: ../../../shared/schemas/Domain.yaml
    '401':
      $ref: ../../../shared/responses/Unauthorized.yaml
    '403':
      $ref: ../../../shared/responses/Forbidden.yaml
post:
  operationId: claimPortalDomain
  summary: Claim a domain (portal)
  description: >-
    Claims a domain for the tenant bound to the portal session and returns the
    DNS TXT record to publish, as the tenant-admin claim-domain endpoint does,
    under the same plan. Requires the link's capabilities to include
    domain_verification. Audited as domain.created by the admin portal.
  tags:
    - Admin Portal
  security:
    - adminPortalCookie: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - domain
          properties:
            domain:
              type: string
  responses:
    '201':
      description: Domain claimed; publish the returned TXT record, then verify
      content:
        application/json:
          schema:
            $ref: ../../../shared/schemas/Domain.yaml
    '401':
      $ref: ../../../shared/responses/Unauthorized.yaml
    '403':
      $ref: ../../../shared/responses/Forbidden.yaml
    '409':
      $ref: ../../../shared/responses/Conflict.yaml
    '422':
      $ref: ../../../shared/responses/Unprocessable.yaml
