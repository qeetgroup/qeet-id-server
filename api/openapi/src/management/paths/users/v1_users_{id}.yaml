delete:
  operationId: deleteUser
  description: >-
    Soft-deletes the user, moving the account into the organization recycle bin rather
    than erasing it. Requires user.delete. A soft-deleted account can be brought
    back with the restore call or removed for good with the purge call. It
    continues to appear in the deleted-users list until purged. In the same
    transaction every way the user is signed in ends (sessions, hosted-login
    sessions, application grants, remembered devices and pending
    authorizations), the deletion is audited (user.deleted, naming the admin)
    and a user.deleted event is queued; restoring the account brings none of
    those sessions back. The same transaction revokes the admin-portal links
    and pending invitations the user issued here and, when they created any
    integration here that still works (a service principal, SCIM token,
    webhook, auth hook or OIDC application), records the critical
    user.integrations_left event listing them for review. The answer names the
    deleted user, when, and by whom.
    Only the organization the account belongs to can delete it; for a member
    whose account belongs elsewhere the call answers 403 user.managed_elsewhere.
    Refused with 409 organization.last_owner, and nothing changes, when it would leave
    this organization with no active owner: make someone else an owner first. An
    organization the person owns elsewhere doesn't block it; it is left without
    an active owner. The person must not outrank the caller: only an owner
    changes an owner (403 rbac.target_is_owner), and the caller must hold every
    permission the person holds here (403 rbac.target_outranks_caller naming
    one); acting on yourself is allowed.
  summary: Delete user
  tags:
    - Users
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  responses:
    '200':
      description: The deleted user
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                format: uuid
              deleted_at:
                type: string
                format: date-time
              deleted_by:
                type:
                  - string
                  - 'null'
                format: uuid
    '400':
      $ref: ../../../shared/responses/BadRequest.yaml
    '401':
      $ref: ../../../shared/responses/Unauthorized.yaml
    '403':
      $ref: ../../../shared/responses/Forbidden.yaml
    '404':
      $ref: ../../../shared/responses/NotFound.yaml
get:
  operationId: getUser
  description: >-
    Returns a single user by id within the caller's organization. Requests for a user
    outside the organization are rejected rather than disclosed. Anyone who belongs to
    the caller's organization can be fetched: a role here, or here being their
    home. Anyone else is 404. Someone whose home is another organization is
    shown with empty metadata, which their home organization keeps.
  summary: Get user
  tags:
    - Users
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  responses:
    '200':
      description: User
      content:
        application/json:
          schema:
            $ref: ../../../shared/schemas/User.yaml
    '401':
      $ref: ../../../shared/responses/Unauthorized.yaml
    '404':
      $ref: ../../../shared/responses/NotFound.yaml
patch:
  operationId: updateUser
  description: >-
    Updates mutable attributes of a user in the caller's organization. Only the fields
    present in the request body are modified. This edits directory attributes,
    not credentials or verification state. Changing the account (status,
    profile) belongs to the organization the account belongs to; for a member
    whose account belongs elsewhere the call answers 403 user.managed_elsewhere
    and nothing changes. Remove them from this organization instead (DELETE
    /v1/users/{id}/membership). Suspending is refused with 409
    organization.last_owner, and nothing changes, when it would leave this
    organization with no active owner: make someone else an owner first. An
    organization the person owns elsewhere doesn't block it; it is left without
    an active owner. Changing the phone number clears its verification. A change
    to the display name, avatar, phone number or metadata is audited, in the
    same transaction, as user.updated naming the fields that changed (changed),
    never their values; a status change is audited as user.suspended or
    user.reactivated. The person must not outrank the caller: only an owner
    changes an owner (403 rbac.target_is_owner), and the caller must hold every
    permission the person holds here (403 rbac.target_outranks_caller naming
    one); acting on yourself is allowed.
  summary: Update user
  tags:
    - Users
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/UserUpdate.yaml
  responses:
    '200':
      description: Updated
      content:
        application/json:
          schema:
            $ref: ../../../shared/schemas/User.yaml
    '400':
      $ref: ../../../shared/responses/BadRequest.yaml
    '401':
      $ref: ../../../shared/responses/Unauthorized.yaml
    '403':
      $ref: ../../../shared/responses/Forbidden.yaml
    '404':
      $ref: ../../../shared/responses/NotFound.yaml
    '422':
      $ref: ../../../shared/responses/Unprocessable.yaml
