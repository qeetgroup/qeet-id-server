allOf:
  - $ref: ./EmailEditorInput.yaml
  - type: object
    required:
      - key
      - name
      - description
      - variables
      - custom
      - delivery_scope
    properties:
      key:
        type: string
      name:
        type: string
      description:
        type: string
      variables:
        type: array
        items:
          type: string
      custom:
        type: boolean
      delivery_scope:
        type: string
        enum:
          - organization
          - platform
