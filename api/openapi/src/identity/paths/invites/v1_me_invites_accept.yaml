post:
  operationId: acceptMyInviteByToken
  summary: Accept an invitation with my existing account (by token)
  tags:
    - Invites
  security:
    - bearerAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: false
          properties:
            token:
              type: string
              minLength: 1
          required:
            - token
  description: >-
    Joins the caller's existing account to the invited organization (no new user, no
    password) and returns an organization-scoped token pair. The invite must be
    addressed to the caller's own email (`invite.email_mismatch` otherwise), and
    its sender must still be able to give it (400 `invite.invalid`). An
    organization that requires a second factor of the caller (its security
    policy, or administrators-only for its administrators) is entered (the pair
    issued) only by a session whose sign-in met one, or that holds a fresh
    step-up; otherwise 403 step_up_required (step up, then switch in) or 403
    mfa.enrollment_required (set a factor up first), unless the organization's
    grace period still lets the caller put the setup off. The new session
    carries the factor on, and continues the caller's sign-in: it ends when the
    caller's session would. The invite stays accepted when the pair is refused.
  responses:
    "200":
      description: OK
      headers:
        Cache-Control:
          $ref: ../../../shared/headers/NoStoreCacheControl.yaml
        Pragma:
          $ref: ../../../shared/headers/NoStorePragma.yaml
      content:
        application/json:
          schema:
            $ref: ../../../shared/schemas/TokenPair.yaml
    "400":
      $ref: ../../../shared/responses/BadRequest.yaml
    "401":
      $ref: ../../../shared/responses/Unauthorized.yaml
    "403":
      $ref: ../../../shared/responses/Forbidden.yaml
    "413":
      $ref: ../../../shared/responses/PayloadTooLarge.yaml
    "422":
      $ref: ../../../shared/responses/Unprocessable.yaml
    "429":
      $ref: ../../../shared/responses/TooManyRequests.yaml
