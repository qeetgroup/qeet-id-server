get:
  operationId: listProvisionedUsers
  summary: List provisioned users
  tags:
    - SCIM
  parameters:
    - $ref: ../../../shared/parameters/OrganizationID.yaml
    - name: limit
      in: query
      required: false
      description: Page size, 1 to 200; 50 by default.
      schema:
        type: integer
        minimum: 1
        maximum: 200
    - name: cursor
      in: query
      required: false
      description: The next_cursor of the previous page.
      schema:
        type: string
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  description: >-
    Lists the users provisioned over SCIM, newest first, a page at a time:
    next_cursor fetches the next page and total counts them all. Requires
    connection.read.
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            required:
              - items
              - total
            properties:
              items:
                type: array
                items:
                  $ref: ../../components/schemas/adminUser.yaml
              next_cursor:
                type: string
                description: Present when there is another page.
              total:
                type: integer
    "400":
      $ref: ../../../shared/responses/BadRequest.yaml
    "401":
      $ref: ../../../shared/responses/Unauthorized.yaml
    "403":
      $ref: ../../../shared/responses/Forbidden.yaml
    "404":
      $ref: ../../../shared/responses/NotFound.yaml
    "422":
      $ref: ../../../shared/responses/Unprocessable.yaml
    "429":
      $ref: ../../../shared/responses/TooManyRequests.yaml
