name: ci

on:
  push:
    branches: [develop, "release/**"]
  pull_request:
    branches: [main, develop, "release/**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test -race -count=1 -coverprofile=coverage.out ./... | tee test-output.txt

      # Informational: no threshold. Generated dbgen/ code is left out of the total.
      - name: Coverage summary
        run: |
          grep -v '/dbgen/' coverage.out > coverage.app.out
          {
            echo "### Unit test coverage: $(go tool cover -func=coverage.app.out | tail -1 | awk '{print $NF}') (excluding dbgen/)"
            echo
            echo "| Package | Coverage |"
            echo "|---|---|"
            awk '/coverage: [0-9.]+% of statements/ { for (i = 1; i <= NF; i++) if ($i == "coverage:") { p = ($1 == "ok") ? $2 : $1; print "| " p " | " $(i+1) " |" } }' test-output.txt \
              | sed 's#github.com/qeetgroup/qeet-id-server/##' | awk '!/\/dbgen/' | sort -t'|' -k3 -n
          } >> "$GITHUB_STEP_SUMMARY"

  # Tenant-isolation and sign-in tests against a real PostgreSQL
  # (testcontainers; files tagged `integration`, helper in
  # internal/platform/database/dbtest). With CI set, a missing Docker fails
  # the job instead of skipping the tests.
  database:
    name: Database tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Database tests
        env:
          CI: "true"
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: go test -tags integration -count=1 -timeout 10m ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Installed from source so golangci-lint is compiled with this repo's Go
      # toolchain — a prebuilt binary built with an older Go refuses go.mod's
      # newer target ("go language version ... lower than the targeted version").
      - name: Install golangci-lint and sqlc
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1

      # The whole tree, including the integration-tagged database tests.
      - name: golangci-lint
        run: golangci-lint run --build-tags=integration ./...

      # dbgen/ must be what sqlc generates from each package's queries.sql.
      - name: Generated SQL is up to date
        run: |
          fail=0
          for cfg in $(find internal -name sqlc.yaml); do
            (cd "$(dirname "$cfg")" && sqlc diff) \
              || { echo "::error::stale sqlc output in $(dirname "$cfg"); run make sqlc"; fail=1; }
          done
          exit $fail

  vuln:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Pinned, not @latest; it needs go1.26 or newer. setup-go runs go.mod's
      # toolchain (the same Go the Dockerfile ships), so the scan covers the
      # standard library that is actually built in. Bump with go.mod.
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0

      # Gate on what actually ships (cmd/ and internal/). The full tree also
      # covers test fixtures and is reported as advice only.
      - name: govulncheck (shipped code)
        run: govulncheck ./cmd/... ./internal/...

      - name: govulncheck (full tree, advisory)
        continue-on-error: true
        run: govulncheck ./...

  sast:
    name: Security scan
    runs-on: ubuntu-latest
    # Blocking. Every accepted finding carries a `#nosec <rule> -- <reason>` on
    # its line; .gosec.json excludes only G101 in the errs catalogue (error-code
    # constants) and requires a rule and a reason on every #nosec.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # gosec v2.29.0 requires a golang.org/x/tools too old to read Go 1.27
      # export data, so `go install gosec@...` loads most packages without type
      # information (200 files, "export data version 5 is greater than maximum
      # supported version 4") and the findings that need types go missing.
      # Build it against a current x/tools instead. Pinned, not @latest; bump
      # both with go.mod.
      - name: Install gosec
        run: |
          mkdir "$RUNNER_TEMP/gosec" && cd "$RUNNER_TEMP/gosec"
          go mod init gosec-build
          go get github.com/securego/gosec/v2/cmd/gosec@v2.29.0 golang.org/x/tools@v0.52.0
          go build -o "$(go env GOPATH)/bin/gosec" github.com/securego/gosec/v2/cmd/gosec

      # Generated sqlc code is excluded, as in golangci-lint: it is not hand-authored.
      - name: gosec
        run: gosec -conf .gosec.json -exclude-dir='.*dbgen' -exclude-generated ./...

  # Release branches only: publish one immutable, commit-addressed image
  # (ghcr.io/qeetgroup/qeet-id-server:sha-<commit>) after every gate above has
  # passed. No rc.N is computed here — qeet-id-kit assembles the product
  # release candidate from these images (qeet-id-kit:
  # docs/application-contract.md). Production keeps deploying from
  # deploy.yml (ECR, main); this job does not touch it.
  image:
    name: Release image
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')
    needs: [test, database, lint, vuln]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Release metadata
        id: meta
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          release="${REF_NAME#release/}"
          if ! [[ "$release" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release branches must be named release/x.y.z (got $REF_NAME)"
            exit 1
          fi
          schema=$(find internal/platform/database/migrations -name '*.up.sql' \
            | sed -E 's#.*/0*([0-9]+)_[^/]*$#\1#' | sort -n | tail -1)
          {
            echo "release=$release"
            echo "schema=$schema"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "image=ghcr.io/$GITHUB_REPOSITORY"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Build and push linux/amd64 + linux/arm64
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          RELEASE: ${{ steps.meta.outputs.release }}
          SCHEMA: ${{ steps.meta.outputs.schema }}
          CREATED: ${{ steps.meta.outputs.created }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          ref="$IMAGE:sha-$GITHUB_SHA"
          # sha-<commit> tags are immutable: a re-run must not move them.
          if out=$(docker buildx imagetools inspect "$ref" 2>&1); then
            echo "::notice::$ref already published; leaving it untouched."
            exit 0
          elif ! grep -qiE 'not found|manifest unknown' <<<"$out"; then
            echo "::error::cannot check $ref: $out"
            exit 1
          fi
          labels=(
            "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY"
            "org.opencontainers.image.revision=$GITHUB_SHA"
            "org.opencontainers.image.version=$RELEASE"
            "org.opencontainers.image.created=$CREATED"
            "in.qeet.release=$RELEASE"
            "in.qeet.source-branch=$REF_NAME"
            "in.qeet.id.schema-version=$SCHEMA"
          )
          args=()
          for l in "${labels[@]}"; do args+=(--label "$l" --annotation "index:$l"); done
          docker buildx build . \
            --platform linux/amd64,linux/arm64 \
            --build-arg VERSION="$RELEASE" \
            --build-arg COMMIT="$GITHUB_SHA" \
            --build-arg DATE="$CREATED" \
            "${args[@]}" \
            --tag "$ref" \
            --metadata-file "$RUNNER_TEMP/build.json" \
            --push
          digest=$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/build.json")
          {
            echo "### Release image"
            echo "| | |"
            echo "|---|---|"
            echo "| Image | \`$ref\` |"
            echo "| Digest | \`$digest\` |"
            echo "| Release | \`$RELEASE\` (schema $SCHEMA) |"
            echo
            echo "Assemble a product RC in qeet-id-kit → Actions → **publish-candidate** with server = \`$GITHUB_SHA\`."
          } >> "$GITHUB_STEP_SUMMARY"
