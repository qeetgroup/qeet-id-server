  /v1/mfa/step-up/status:
    get:
      operationId: get_v1_mfa_step_up_status
      summary: Step-up status
      tags:
        - MFA
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      description: >-
        Reports whether the calling session is stepped up: it met a second
        factor of a type its organisation counts within the organisation's
        step-up window. A step-up belongs to the session that earned it, so a
        factor proved in another session, or by an API key or agent, never
        counts.


        These need a step-up, and answer 403 step_up_required without one
        (with window_seconds and, when the organisation limits them,
        allowed_methods): adding or removing the caller's own factors and
        sign-in methods while they hold a factor their organisation counts;
        switching the authenticator app off or replacing recovery codes;
        creating, changing or revoking API keys, service principals, agents,
        OAuth clients and their secrets, SCIM tokens, credentials, webhooks
        and auth hooks; creating, changing, revealing or deleting secrets,
        vault providers and the AI provider configuration; changing the
        security policy, sign-in methods, risk, bot, IP and rate-limit
        settings, a user's MFA requirement, factors or password; configuring
        SAML, LDAP, social providers, domains, directory mappings and
        administrator portal links; editing email templates; changing
        retention, anomaly settings and log streaming; and updating or
        deleting the organisation, deleting or purging a user, or deleting
        one's own account. An API key, service principal or agent holds no
        session, so it cannot perform these. The hosted login's own sign-in
        counts as a step-up for the organisation's window after it happens.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  recently_verified:
                    type: boolean
                    description: The session is stepped up now.
                  verified_at:
                    type: string
                    format: date-time
                    nullable: true
                    description: The session's latest step-up, whether or not it still counts.
                  window_seconds:
                    type: integer
                    description: How long a step-up lasts in the organisation.
                  allowed_methods:
                    type: array
                    nullable: true
                    items:
                      type: string
                    description: The factor types the organisation counts; null when every one does.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
