type: object
required:
  - created_at
  - description
  - group_count
  - id
  - name
  - nodes
  - organization_id
  - updated_at
properties:
  created_at:
    type: string
    format: date-time
  description:
    type: string
  group_count:
    type: integer
  id:
    type: string
    format: uuid
  name:
    type: string
  nodes:
    type: array
    items:
      $ref: ./TemplateNode.yaml
  organization_id:
    type: string
    format: uuid
  updated_at:
    type: string
    format: date-time
