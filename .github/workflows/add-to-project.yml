name: Add to Qeet ID project

# Adds newly opened issues to the org-level Qeet ID delivery board.
#
# Why an Action rather than the built-in project workflow: the qeetgroup org is on the
# GitHub Free plan, which allows a single auto-add workflow targeting a single repository.
# Qeet ID spans 12 repositories, so each one carries this file instead.
#
# Deliberately NOT triggered on pull_request: a merged PR must never move work to Done.

on:
  issues:
    types: [opened]

permissions: {}

jobs:
  add-to-project:
    name: Add issue to Qeet ID — Roadmap
    runs-on: ubuntu-latest
    # Human-created issues only. Keeps Dependabot and other bot artifacts out of the
    # product backlog — the previous tracker was almost entirely bot noise.
    if: ${{ github.event.issue.user.type != 'Bot' }}
    steps:
      - uses: actions/add-to-project@v2.0.0
        with:
          project-url: https://github.com/orgs/qeetgroup/projects/33
          github-token: ${{ secrets.QEET_PROJECT_TOKEN }}
