post:
  operationId: finishPasskeySignUp
  description: >-
    Completes passwordless signup by verifying the authenticator attestation
    from the begin step and creating an organization-less user with the new passkey as
    its founding credential. On success it returns a token pair; because the
    passkey is first-class, the account has no password and can both
    authenticate and satisfy MFA with the passkey alone. As with password
    signup, create an organization through the Identity Management API before any
    organization-scoped call, and the creator becomes the organization owner. An address
    already taken, or on a domain an organization has verified, is refused with
    the neutral 422 unprocessable of POST /v1/auth/signup, which does not name
    the reason, and nothing is created.
  summary: Passkey-first signup finish (organization-less)
  tags:
    - Passkeys
  security: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: false
          required:
            - session_id
            - credential
          properties:
            session_id:
              type: string
              minLength: 1
            credential:
              type: object
              additionalProperties: true
            name:
              type:
                - string
                - "null"
    description: >-
      Verifies the attestation, creates the organization-less user with the passkey as
      its founding credential, and returns a token pair.
  responses:
    "201":
      description: Created
      headers:
        Cache-Control:
          $ref: ../../../shared/headers/NoStoreCacheControl.yaml
        Pragma:
          $ref: ../../../shared/headers/NoStorePragma.yaml
      content:
        application/json:
          schema:
            type: object
            required:
              - access_token
              - expires_at
              - refresh_token
              - session_id
              - token_type
              - user_id
            properties:
              access_token:
                type: string
              expires_at:
                type: string
                format: date-time
              refresh_token:
                type: string
              session_id:
                type: string
                format: uuid
              token_type:
                type: string
              user_id:
                type: string
                format: uuid
    "400":
      $ref: ../../../shared/responses/BadRequest.yaml
    "413":
      $ref: ../../../shared/responses/PayloadTooLarge.yaml
    "422":
      $ref: ../../../shared/responses/Unprocessable.yaml
    "429":
      $ref: ../../../shared/responses/TooManyRequests.yaml
