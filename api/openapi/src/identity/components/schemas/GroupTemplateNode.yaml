type: object
description: >-
  One group in a template tree. Recursive: `children` holds the same shape, up
  to 6 levels deep.
required:
  - name
properties:
  name:
    type: string
    minLength: 1
  description:
    type:
      - string
      - "null"
  children:
    type:
      - array
      - "null"
    items:
      $ref: ./GroupTemplateNode.yaml
