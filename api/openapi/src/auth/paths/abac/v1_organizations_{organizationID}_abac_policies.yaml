get:
  operationId: listAbacPolicies
  summary: List ABAC policies
  description: >-
    Returns all ABAC policies for the organization, ordered by priority desc then
    name.
  tags:
    - ABAC
  parameters:
    - $ref: ../../../shared/parameters/OrganizationID.yaml
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              truncated:
                $ref: ../../../shared/schemas/Truncated.yaml
              items:
                type: array
                items:
                  $ref: ../../components/schemas/ABACPolicy.yaml
    "401":
      $ref: ../../../shared/responses/Unauthorized.yaml
    "403":
      $ref: ../../../shared/responses/Forbidden.yaml
post:
  operationId: createAbacPolicy
  summary: Create ABAC policy
  description: >-
    Creates a new ABAC policy for the organization. An enabled deny for policy writes
    (resource type policy or *, action write or *) that would refuse its own
    author, judged on the attributes the route guard sees for the author's call
    now (their groups, roles, address and whether their session met a second
    factor), is refused with abac.policy_locks_out, as nobody could then remove
    it.
  tags:
    - ABAC
  parameters:
    - $ref: ../../../shared/parameters/OrganizationID.yaml
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/ABACPolicyCreate.yaml
  responses:
    "201":
      description: Created
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/ABACPolicy.yaml
    "401":
      $ref: ../../../shared/responses/Unauthorized.yaml
    "403":
      $ref: ../../../shared/responses/Forbidden.yaml
    "409":
      $ref: ../../../shared/responses/Conflict.yaml
    "422":
      $ref: ../../../shared/responses/Unprocessable.yaml
