          application/json:
            schema:
              type: object
              additionalProperties: true
        description: Request body summarized; see the handler for exact fields.
      description: 'Creates the invited account and signs it in. Its address is not verified by this: the invitation link is also returned to the inviter to share, so the account proves the address later with a code or link sent to it (its invitations inbox stays closed until then). The response is a token pair, or, where the organisation requires a second factor, the sign-in''s challenge instead (mfa_required, mfa_token and, for an account with no factor yet, enrollment_required), met as at sign-in. Where the inviting organisation has password sign-in switched off, accepting with a password is refused with 403 auth.method_disabled and nothing is created.'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/invites/lookup:
    post:
      operationId: post_v1_invites_lookup
      summary: Look up an invitation (public)
      description: >-
        Previews the invitation an emailed link names, so the acceptance screen
        can show the organisation and address and offer the ways of accepting
        it. A password is always offered; a passkey where the organisation
        allows passkeys. account_exists means an account already holds the
        address, so the invitee signs in and accepts as themselves. Refused like
        acceptance: invite.link_invalid, invite.invalid (no longer pending),
        invite.expired. Read-only. The token travels in the body so it stays out
        of logs.
      tags:
        - Invites
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
              properties:
                token:
                  type: string
      responses:
        '200':
          description: The invitation
          content:
            application/json:
              schema:
                type: object
                properties:
                  organization:
                    type: object
                    properties:
                      name:
                        type: string
                      slug:
                        type: string
                  email:
                    type: string
                  expires_at:
                    type: string
                    format: date-time
                  account_exists:
                    type: boolean
                  methods:
                    type: object
                    properties:
                      password:
                        type: boolean
                      passkey:
                        type: boolean
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/invites/accept/passkey/begin:
    post:
      operationId: post_v1_invites_accept_passkey_begin
      summary: Accept an invitation with a passkey — begin (public)
      description: >-
        Starts accepting an invitation by founding the new account on a passkey
        instead of a password, returning the WebAuthn credential-creation
        options. The account's email and organisation come from the invitation,
        never from the request. Refused like POST /v1/invites/accept
        (invite.link_invalid, invite.invalid, invite.expired,
        invite.account_exists — the invitee signs in and accepts as themselves),
        and with passkey.disabled when the organisation has passkeys switched
        off. Starting again replaces an unfinished ceremony for the same
        invitation; the invitation stays pending until one finishes.
      tags:
        - Invites
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
              properties:
                token:
                  type: string
                display_name:
                  type: string
                  maxLength: 200
      responses:
        '200':
          description: session_id and the publicKey creation options
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/invites/accept/passkey/finish:
    post:
      operationId: post_v1_invites_accept_passkey_finish
      summary: Accept an invitation with a passkey — finish (public)
      description: >-
        Verifies the passkey and, in one transaction, creates the account in the
        inviting organisation with it, grants the invited role and marks the
        invitation accepted; then signs the invitee in, returning a token pair
        as POST /v1/invites/accept does. Each ceremony finishes once: a second
        attempt, or one after the ceremony expired (auth.session_expired),
        creates nothing and leaves the invitation as it was. Refused, with
        nothing created, when the invitation was accepted, revoked or expired
        meanwhile, or the organisation switched passkeys off.
      tags:
        - Invites
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - session_id
                - credential
              properties:
                session_id:
                  type: string
                  format: uuid
                credential:
                  type: object
                  additionalProperties: true
                name:
                  type: string
                  description: The passkey's name; defaults to one from the device.
      responses:
        '200':
          description: Token pair for the new session
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/me/invites:
    get:
      operationId: get_v1_me_invites
      summary: List invitations addressed to me
      tags:
        - Invites
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      description: 'Pending, unexpired invitations addressed to the signed-in user''s email, each with the inviting organization''s name — the in-app inbox for a user who may not belong to any org yet. Answers 403 invite.email_not_verified until the account''s address is verified: anyone can sign up with any address.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/me/invites/accept:
    post:
      operationId: post_v1_me_invites_accept
      summary: Accept an invitation with my existing account (by token)
      tags:
        - Invites
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
              required:
                - token
      description: 'Joins the caller''s existing account to the invited tenant (no new user, no password) and returns a tenant-scoped token pair. The invite must be addressed to the caller''s own email (`invite.email_mismatch` otherwise). An organisation that requires a second factor of the caller (its security policy, or administrators-only for its administrators) is entered (the pair issued) only by a session whose sign-in met one, or that holds a fresh step-up; otherwise 403 step_up_required (step up, then switch in) or 403 mfa.enrollment_required (set a factor up first), unless the organisation''s grace period still lets the caller put the setup off. The new session carries the factor on. The invite stays accepted when the pair is refused.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/me/invites/{id}/accept:
    post:
      operationId: post_v1_me_invites_ById_accept
      summary: Accept an invitation from my inbox (by id)
      tags:
        - Invites
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      description: 'Same as accepting by token, but selects the invite by id (from GET /v1/me/invites). Returns a tenant-scoped token pair, under the same second-factor rule. Answers 403 invite.email_not_verified until the account''s address is verified.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/me/invites/{id}/decline:
    post:
      operationId: post_v1_me_invites_ById_decline
      summary: Decline an invitation from my inbox
      tags:
        - Invites
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      description: 'Dismisses a pending invitation addressed to the caller''s email (marks it declined). Scoped by email, so one user can''t decline another''s. Answers 403 invite.email_not_verified until the account''s address is verified.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/invites/{id}:
    delete:
      operationId: delete_v1_invites_ById
      summary: Revoke invite
      tags:
        - Invites
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      description: Response body summarized; accurate path/method/params/security. Enrich the body later.
      responses:
        '204':
          description: No Content
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/invites/{id}/resend:
    post:
      operationId: post_v1_invites_ById_resend
      description: 'Rotates the invitation token, extends its expiry, and re-sends the invitation email. Only pending or expired invites belonging to the caller''s tenant qualify; already-accepted or revoked invites are rejected. The recipient completes the flow through the accept-invite call, as with the original invitation. invite.delivery says whether the email went out (as on create): a suppressed address reports not_sent with email.suppressed rather than success.'
      summary: Resend an invitation
      tags: [Invites]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        '200':
          description: Invitation resent
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/tenants/{tenantID}/invites:
    get:
      operationId: get_v1_tenants_ByTenantID_invites
      summary: List invites
      tags:
        - Invites
      parameters:
        - name: tenantID
          in: path
          required: true
          schema:
            type: string
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      description: Response body summarized; accurate path/method/params/security. Enrich the body later.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/tenants/{tenantID}/branding:
    get:
      operationId: get_v1_tenants_ByTenantID_branding
      summary: Get branding
      tags:
        - Branding
      parameters:
        - name: tenantID
          in: path
          required: true
          schema:
            type: string
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      description: Organization branding, including optional background_color and email_reply_to values in settings. Unknown settings are preserved by clients. Custom sender addresses are configuration preferences and do not activate a provider identity.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantBranding'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    put:
      operationId: put_v1_tenants_ByTenantID_branding
      summary: Update branding
      tags:
        - Branding
      parameters:
        - name: tenantID
          in: path
          required: true
          schema:
            type: string
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantBranding'
        description: Complete editable branding fields and settings. Preserve unrelated settings when updating. The tenant ID is enforced by the authenticated route scope.
      description: Requires custom_branding entitlement. Accepts at most 3 MiB of JSON, including an optional base64 PNG, JPEG, WEBP or SVG logo of at most 2 MiB decoded. settings.background_color is a six-digit hex color or empty for the default; settings.email_reply_to is a single mailbox or empty. Sender name and reply-to apply only to tenant invitations and magic links. The provider-approved From address is retained.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantBranding'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'User or service JWT: `Authorization: Bearer <token>`.'
    apiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: 'API key credential. Send `Authorization: ApiKey <key>` (note the `ApiKey ` prefix). Accepted on the same authenticated routes as bearerAuth.'
    scimBearer:
      type: http
      scheme: bearer
      description: 'Per-tenant SCIM provisioning token presented by the IdP: `Authorization: Bearer <scim-token>`. Distinct from user JWTs; rotated via the SCIM admin endpoints.'
    clientCredentials:
      type: oauth2
      description: OAuth 2.0 client credentials. Clients authenticate at the token endpoint via form params (`client_id`/`client_secret`) or HTTP Basic. Revocation/introspection use the same client auth.
      flows:
        clientCredentials:
          tokenUrl: /v1/oauth/token
          scopes: {}
    ssoCookie:
      type: apiKey
      in: cookie
      name: qe_ls
      description: Hosted-login SSO session cookie (HttpOnly). Set by POST /v1/auth/session and consumed by the OAuth authorize/consent flow.
  parameters:
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
      description: Maximum items to return.
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
      description: Opaque pagination cursor from a prior response's next_cursor.
  responses:
    BadRequest:
      description: Malformed request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: 'Authenticated but not permitted. auth.application_token: the access token was issued to an application (it carries client_id) and this route accepts only the user''s own tokens; applications may call GET /v1/oauth/userinfo. auth.insufficient_scope: an application''s token reached a route open to applications without the scope the route needs (named in the WWW-Authenticate challenge).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Resource conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unprocessable:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    InviteDelivery:
      type: object
      description: Whether the invitation's email went out. The invitation exists either way.
      properties:
        status:
          type: string
          enum: [sent, not_sent]
        code:
          type: string
          description: 'Why not, when not_sent: email.suppressed, email.provider_unavailable or email.send_failed.'
        message:
          type: string
    TenantBranding:
      type: object
      properties:
        tenant_id:
          type: string
          format: uuid
        logo_url:
          type: string
          nullable: true
        primary_color:
          type: string
          nullable: true
        secondary_color:
          type: string
          nullable: true
          description: Brand-panel accent, independent of page background.
        custom_domain:
          type: string
          nullable: true
        email_from_name:
          type: string
          nullable: true
        email_from_address:
          type: string
          nullable: true
          description: Requested sender mailbox; provider approval is separate.
        settings:
          type: object
          additionalProperties: true
          properties:
            background_color:
              type: string
              pattern: '^$|^#[0-9a-fA-F]{6}$'
              description: Hosted-login page background; empty keeps the default theme.
            email_reply_to:
              type: string
              description: Single reply mailbox for tenant-scoped messages; empty omits Reply-To.
    GroupTemplateNode:
      type: object
      description: >-
        One group in a template tree. Recursive: `children` holds the same shape,
        up to 6 levels deep.
      required: [name]
      properties:
        name: {type: string}
        description: {type: string}
        children:
          type: array
          items:
            $ref: '#/components/schemas/GroupTemplateNode'
    SuspendedDirectoryUser:
      type: object
      properties:
        id: {type: string, format: uuid}
        email: {type: string, format: email}
        display_name: {type: [string, 'null']}
        avatar_url: {type: [string, 'null']}
        team: {type: string}
        reason: {type: string}
        source: {type: string}
        risk: {type: string, enum: [unknown, low, medium, high]}
        review: {type: string, enum: [pending, reviewed, external]}
        suspended_at: {type: [string, 'null'], format: date-time}
        last_sign_in: {type: [string, 'null'], format: date-time}
        can_manage: {type: boolean}
    Error:
      type: object
      required:
        - error
      description: Canonical error envelope (internal/platform/httpx.WriteError).
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              description: Stable machine code
              example: unauthorized
            message:
              type: string
              example: authentication required
            detail:
              type: string
              description: Optional human detail
            translation_key:
              type: string
              description: Optional i18n key the client can use to localize the message.
            retryable:
              type: boolean
              description: Whether the client may safely retry the request.
            fields:
              type: array
              description: Per-field validation errors (typically on 422 responses).
              items:
                type: object
                properties:
                  field:
                    type: string
                  code:
                    type: string
                  message:
                    type: string
            metadata:
              type: object
              additionalProperties: true
              description: Optional structured, error-specific context.
            request_id:
              type: string
              description: Correlates with the X-Request-Id header
    Page:
      type: object
      description: Cursor-paginated list wrapper.
      properties:
        items:
          type: array
          items: {}
        next_cursor:
          type: string
          nullable: true
          description: Cursor for the next page; empty/absent at the end.
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        email_verified_at:
          type: string
          format: date-time
          nullable: true
        phone:
          type: string
          nullable: true
        phone_verified_at:
          type: string
          format: date-time
          nullable: true
        display_name:
          type: string
          nullable: true
        status:
          type: string
          enum:
            - active
            - suspended
        metadata:
          type: object
          additionalProperties: true
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        roles:
          type: array
          items: { type: string }
          description: Role names in the listed tenant. Populated only by the list endpoint.
        mfa_enabled:
          type: boolean
          description: List-only. True if the user has a confirmed TOTP, a verified OTP factor, or a push device.
        groups_count:
          type: integer
          description: List-only. Number of groups the user belongs to in this tenant.
        last_seen_at:
          type: string
          format: date-time
          nullable: true
          description: List-only. Most recent live-session activity, or null.
        last_seen_ip:
          type: string
          nullable: true
          description: List-only. IP of the most-recent live session, or null.
    UserStats:
      type: object
      properties:
        total: { type: integer }
        active: { type: integer }
        suspended: { type: integer }
        invited: { type: integer }
        mfa_enabled: { type: integer }
        mfa_missing: { type: integer }
        new_last_30d: { type: integer }
    UserTrends:
      type: object
      properties:
        total:
          type: array
          items: { type: integer }
          description: 30-day daily cumulative member count (oldest first).
        mfa_enabled:
          type: array
          items: { type: integer }
          description: 30-day daily cumulative MFA-enrolled count (oldest first).
    UserCreate:
      type: object
      required:
        - tenant_id
        - email
      properties:
        tenant_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 256
        display_name:
          type: string
          maxLength: 200
        phone:
          type: string
          description: E.164
        metadata:
          type: object
          additionalProperties: true
    UserBulkImport:
      type: object
      required:
        - users
      properties:
        tenant_id:
          type: string
          format: uuid
          description: Optional; when present must match the caller's tenant.
        users:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            type: object
            required:
              - email
            properties:
              email:
                type: string
                format: email
              password:
                type: string
                minLength: 8
                maxLength: 256
              display_name:
                type: string
                maxLength: 200
              phone:
                type: string
                description: E.164
    UserBulkImportResult:
      type: object
      required:
        - succeeded
        - failed
      properties:
        succeeded:
          type: integer
        failed:
          type: integer
        errors:
          type: array
          items:
            type: object
            required:
              - message
            properties:
              line:
                type: integer
                description: 1-based index of the row within the submitted array.
              email:
                type: string
              message:
                type: string
    UserUpdate:
      type: object
      properties:
        display_name:
          type: string
          maxLength: 200
          nullable: true
        phone:
          type: string
          nullable: true
        status:
          type: string
          enum:
            - active
            - suspended
        metadata:
          type: object
          additionalProperties: true
    UserPage:
      allOf:
        - $ref: '#/components/schemas/Page'
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/User'
        next_cursor:
          type: string
          nullable: true
    Tenant:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        status:
          type: string
          enum:
            - active
            - suspended
        plan:
