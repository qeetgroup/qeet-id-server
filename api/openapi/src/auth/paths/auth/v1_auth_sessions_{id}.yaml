delete:
  operationId: revokeMySession
  description: >-
    Revokes a single session belonging to the caller by its identifier. The
    session's refresh token stops working as soon as this returns, forcing that
    device to sign in again, while the caller's other sessions are left intact.
    Enumerate session identifiers first with the list-sessions call.
  summary: Revoke session
  tags:
    - Auth
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  security:
    - bearerAuth: []
  responses:
    '200':
      description: Session revoked
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
    '400':
      $ref: ../../../shared/responses/BadRequest.yaml
    '401':
      $ref: ../../../shared/responses/Unauthorized.yaml
    '404':
      $ref: ../../../shared/responses/NotFound.yaml
