get:
  operationId: getExportRequest
  summary: Get a GDPR export request (payload once ready)
  tags:
    - GDPR
  parameters:
    - $ref: ../../../shared/parameters/TenantID.yaml
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  description: >-
    Returns status plus the full data payload once status is "ready"; response
    carries a Content-Disposition download header in that case. The payload is
    deleted seven days after it was built, or when the person is erased, and the
    status becomes "expired".
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/ExportRequest.yaml
    '401':
      $ref: ../../../shared/responses/Unauthorized.yaml
    '403':
      $ref: ../../../shared/responses/Forbidden.yaml
    '404':
      $ref: ../../../shared/responses/NotFound.yaml
    '422':
      $ref: ../../../shared/responses/Unprocessable.yaml
    '429':
      $ref: ../../../shared/responses/TooManyRequests.yaml
