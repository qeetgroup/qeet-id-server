openapi: 3.1.0
info:
  title: Qeet ID — Operations API (audit, billing, analytics)
  version: 0.2.0
  description: |-
    Observability, governance, and commercial operations for Qeet ID.

    ## Start here

    1. **Health** first — `GET /healthz` and `/readyz` need no authentication and are the easiest successful call for a new integrator.
    2. **Observe** — activity feed, usage analytics, and universal search.
    3. **Investigate & govern** — audit log, compliance evidence, data retention, GDPR erasure, and SIEM log sinks.
    4. **Commercial** — billing, plans, and entitlements.

    ## Authentication

    Auth modes: `bearerAuth` (user/service JWT), `apiKeyAuth` (`Authorization: ApiKey <key>` — legacy scheme), `scimBearer` (per-organization SCIM token), `clientCredentials` (OAuth M2M), and `ssoCookie` (hosted-login SSO session). CSRF protection applies only to cookie sessions (`ssoCookie`): requests authorised by `bearerAuth` or `apiKeyAuth` bypass it, as do the token endpoint (POST /v1/oauth/token) and the directory sign-in (POST /ldap/{id}/authenticate), which carry their credentials in the request. Basic credentials do not bypass it. A request that fails the check is refused with 403 `csrf_failed`.

    Responses that carry a token, a sign-in session or a newly created secret are sent with `Cache-Control: no-store` and `Pragma: no-cache`; no operation in this API returns one.

    Every response carries an `X-Request-Id` header naming the request; quote it when reporting a problem. An error body repeats it as `error.request_id`. A path with an encoded slash or backslash (`%2F`, `%5C`) is refused with 400 `bad_request`.

    ## Related APIs

    - **Authentication & Access API** — login, passkeys, MFA, authorization
    - **Identity Management API** — organizations, users, groups, invitations
    - **Federation API** — OIDC/OAuth provider, SAML, SCIM, LDAP, social
    - **Developer API** — API keys, agents, webhooks, vaults

    ## Contract maintenance

    This document covers routes mounted by internal/bootstrap/router.go. internal/bootstrap/openapi_coverage_test.go walks the production mount helpers and fails when a mounted operation is undocumented, a documented operation is stale, or API-auth security declarations disagree with runtime classification.
servers:
  - url: https://api.id.qeet.in
    description: Production
  - url: http://localhost:4001
    description: Local (make dev)
tags:
  - name: Health
    description: Liveness, readiness, and Prometheus metrics.
  - name: Activity
    description: Live Activity feed — a real-time SSE event stream and cursor-paginated history, both sourced from the hash-chained audit log and the NATS outbox. Organization-scoped; requires audit.read. The SSE stream fans out domain events from the transactional outbox; reconnects replay missed events via Last-Event-ID.
  - name: Analytics
    description: Per-organization usage analytics, and the dashboard's overview of what is set up.
  - name: Search
    description: Universal organization-scoped fuzzy search across all resource types. Results are RBAC-gated per type — the caller only sees resources their role allows them to read.
  - name: Audit
    description: Append-only, hash-chained audit log query and integrity verification.
  - name: Compliance
    description: SOC 2 and ISO 27001 live evidence generation from real organization system state.
  - name: Data Retention
    description: Per-organization auto-purge of soft-deleted users.
  - name: GDPR
    description: Right-to-erasure purge requests.
  - name: Log Sinks
    description: SIEM log-sink connectors — forward audit and event streams to external SIEM destinations.
  - name: Notifications
    description: In-app notifications — list notifications and mark them read.
  - name: Rate Limits
    description: Per-organization rate-limit overrides (organization / user / API-key buckets).
  - name: Email Templates
    description: Per-organization transactional email template overrides.
  - name: Qeet AI
    description: AI qeetai inference service — streaming conversation turns, conversation management, and configuration status. Tool execution runs client-side under the user's own token (RBAC/RLS/audit inherited). API key is server-side only and never returned by any endpoint.
  - name: Billing
    description: Subscription plans, subscriptions, and invoices.
  - name: Entitlements
    description: An organization's resolved plan capability set — boolean feature flags and numeric limits. Read by the console to gate the UI off the same source of truth the backend enforces on. Gated create endpoints return 402 with a stable code (billing.plan_limit / billing.upgrade_required) when a plan cap is reached.
  - name: Sales
    description: Contact-sales lead capture (public marketing endpoint).
paths:
  /healthz:
    get:
      operationId: checkLiveness
      description: Returns 200 whenever the process can answer the request, reporting only that the instance is running rather than that its dependencies are reachable. Requires no authentication and performs no dependency checks, making it the cheapest way to confirm connectivity. Container orchestrators use this signal to decide whether to restart the instance.
      summary: Liveness
      tags:
        - Health
      security: []
      responses:
        "200":
          description: Alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /metrics:
    get:
      operationId: getMetrics
      description: "Exposes process and request metrics in Prometheus exposition format for scraping by a metrics collector. The scraper presents METRICS_TOKEN as `Authorization: Bearer <token>`; without the right token the endpoint answers 404, as it does everywhere but development when no METRICS_TOKEN is set, since its counters (sign-in throttles among them) would tell an attacker how close they are to a limit. The payload reflects the instance's current counters and gauges at the time of the call."
      summary: Metrics (Prometheus)
      tags:
        - Health
      security: []
      responses:
        "200":
          description: Prometheus exposition format
          content:
            text/plain:
              schema:
                type: string
        "404":
          description: "Metrics are not served to this caller: no METRICS_TOKEN is configured outside development, or the request did not send it as `Authorization: Bearer <token>`. The same plain-text answer as an unknown path."
          content:
            text/plain:
              schema:
                type: string
  /readyz:
    get:
      operationId: checkReadiness
      description: Runs every registered dependency probe under a short shared timeout and returns 200 only when all pass, otherwise 503 with a per-check breakdown (ok or fail; the cause is logged, never answered). Requires no authentication. Unlike the liveness probe, a failure here indicates the instance is temporarily unable to serve traffic, so orchestrators route requests away without restarting the process.
      summary: Readiness
      tags:
        - Health
      security: []
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
        "503":
          description: Not ready (a dependency is down)
  /version:
    get:
      operationId: getVersion
      description: "Answers what is running on this instance: the release version, the commit it was built from and its build date, and the database migration the instance runs on next to the newest migration the build carries. Requires no authentication and reads nothing at request time (the migration is the one found at start). Operators compare it with the deploy record after a deploy or rollback."
      summary: Version
      tags:
        - Health
      security: []
      responses:
        "200":
          description: The running build and its schema
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: string
                    example: v2027.1.0
                  commit:
                    type: string
                  date:
                    type: string
                  go_version:
                    type: string
                  schema:
                    type: object
                    properties:
                      migration:
                        type: integer
                        description: The migration the database is at.
                      latest:
                        type: integer
                        description: The newest migration this build carries.
  /v1/activity:
    get:
      operationId: listActivity
      summary: Activity history
      description: Returns a cursor-paginated list of ActivityEvent derived from the organization-scoped audit log, with total, how many match (counted up to 10,000; total_capped says when there are more). Every filter, severity and category included, is applied in the query, so every page but the last is full. An unknown severity or category, or a malformed resource_id or ip, is refused with 400. Organization is derived from the JWT principal only — never from URL or body.
      tags:
        - Activity
      parameters:
        - name: cursor
          in: query
          required: false
          description: Opaque pagination cursor from a previous response next_cursor field. Encodes the time and ID of the last event that page returned.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Page size, 1 to 200 (default 50). A larger value is lowered to 200; a smaller or malformed one gets the default.
          schema:
            type: integer
            default: 50
        - name: types
          in: query
          required: false
          description: Comma-separated list of exact event types (audit action values, e.g. "user.created,user.deleted"). Omit to return all types.
          schema:
            type: string
            example: user.created,user.deleted
        - name: severity
          in: query
          required: false
          description: Comma-separated severities (info, success, warning, error, critical); events of any of them. Severity is derived from the event type, not stored. For a minimum, use min_severity.
          schema:
            type: string
            pattern: ^(info|success|warning|error|critical)(,(info|success|warning|error|critical))*$
        - name: min_severity
          in: query
          required: false
          description: Events of at least this severity.
          schema:
            type: string
            enum:
              - info
              - success
              - warning
              - error
              - critical
        - name: category
          in: query
          required: false
          description: Comma-separated categories (authentication, authorization, security, directory, developer, system); events of any of them. Derived from the event type prefix.
          schema:
            type: string
            pattern: ^(authentication|authorization|security|directory|developer|system)(,(authentication|authorization|security|directory|developer|system))*$
        - name: resource_type
          in: query
          required: false
          description: Comma-separated resource types; events about any of them.
          schema:
            type: string
        - name: resource_id
          in: query
          required: false
          description: Events about this resource.
          schema:
            type: string
            format: uuid
        - name: ip
          in: query
          required: false
          description: Events from this address.
          schema:
            type: string
            anyOf:
              - format: ipv4
              - format: ipv6
        - name: actor
          in: query
          required: false
          description: Filter by actor user UUID.
          schema:
            type: string
            format: uuid
        - name: subject
          in: query
          required: false
          description: Identity timeline filter. When set, returns every event where the given user UUID is the actor, the target of a 'user' resource event, or the person another resource's event names in metadata.user_id (such as being added to or removed from a group). Omit to return events for all subjects.
          schema:
            type: string
            format: uuid
        - name: q
          in: query
          required: false
          description: Finds words of the action, resource type, actor type, user agent, address and metadata, each split into words (auth.login_succeeded is auth, login and succeeded), every plain word as a prefix; or the events of an actor whose name contains it or whose email begins with it. "Quoted phrases", -exclusions and OR are read as websearch_to_tsquery reads them.
          schema:
            type: string
        - name: from
          in: query
          required: false
          description: Inclusive lower bound on event timestamp (RFC3339).
          schema:
            type: string
            anyOf:
              - format: date-time
              - maxLength: 0
            description: An RFC 3339 time; empty means none.
        - name: to
          in: query
          required: false
          description: Inclusive upper bound on event timestamp (RFC3339).
          schema:
            type: string
            anyOf:
              - format: date-time
              - maxLength: 0
            description: An RFC 3339 time; empty means none.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        "200":
          description: Paginated activity events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityResponse"
        "400":
          $ref: "#/components/responses/Unprocessable"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/activity/stream:
    get:
      operationId: streamActivity
      summary: Live activity stream (SSE)
      description: |-
        Opens a Server-Sent Events stream of ActivityEvent frames for the caller's organization: the audit records themselves, every kind (sign-ins and MFA included), each with its own audit id, so a live event can be opened and related like one from the history. The server follows the audit log every two seconds, or at once when the organization acts. Each frame is `id: <cursor>\nevent: activity\ndata: <json>\n\n`; periodic `: keep-alive` comments prevent proxy timeouts.

        When `Last-Event-ID` is supplied (the `id` of the last frame received, an opaque cursor, not the event's UUID) the server replays every audit event newer than it, in chronological order, before switching to the live stream. One connection replays at most 1,000 audit rows: further behind, it sends the cursor of the last row read and a `retry:` frame and ends, and the client's reconnect carries on from there. A frame may carry only an `id` (no event): the cursor of rows the filters passed over, kept as the client's Last-Event-ID. A live frame's id sits ten seconds before its event, to cover records whose transaction committed late; the stream sends each record once, and a reconnect may repeat one, recognisable by its id. Delivery is at least once: a reconnect may repeat an event but doesn't skip one, and a client too slow for the live stream is sent a `retry:` frame and disconnected, to catch up from the audit log on reconnect.

        The stream lasts only as long as the access it was opened with. It ends when the access token or API key expires, and within 30 seconds of the reader losing access: their session ended, audit.read no longer theirs (or no longer the key's), the API key revoked, the service principal or agent disabled. It also ends if that check can't be made. A new request is then refused as any other would be.

        Server-side filters (`?types`, `?severity`, `?category`) are applied to both the replay and the live stream. The connection organization is derived from the JWT principal only — never from the URL or body.

        The write deadline is extended to 1 hour. Set `X-Accel-Buffering: no` is already set by the server (Nginx/Caddy proxy buffering disabled).
      tags:
        - Activity
      parameters:
        - name: types
          in: query
          required: false
          description: Comma-separated event type prefixes to match (e.g. "user,auth"). An event matches if its type equals or starts with any listed value.
          schema:
            type: string
        - name: severity
          in: query
          required: false
          description: Minimum severity level to stream.
          schema:
            type: string
            enum:
              - info
              - success
              - warning
              - error
              - critical
        - name: category
          in: query
          required: false
          description: Exact category to stream; omit for all.
          schema:
            type: string
            enum:
              - authentication
              - authorization
              - security
              - directory
              - developer
              - system
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        "200":
          description: 'SSE stream of ActivityEvent frames. Event name: "activity". Periodic "`: keep-alive`" comments maintain the connection.'
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/activity/summary:
    get:
      operationId: getActivitySummary
      summary: Activity summary
      description: Aggregate counts over the same filters as the history endpoint (types, actor, subject, from/to, q, resource_type, resource_id, ip, category, severity and min_severity), so category and severity together total the events of both; by_severity and by_category then show the spread within what the filters match. Without an explicit `from` the window defaults to the last 24h; it is capped at 366 days, with buckets of up to a week. Organization is derived from the JWT principal only.
      tags:
        - Activity
      parameters:
        - name: types
          in: query
          required: false
          description: Comma-separated exact event types (audit action values).
          schema:
            type: string
        - name: actor
          in: query
          required: false
          description: Filter by actor user UUID.
          schema:
            type: string
            format: uuid
        - name: subject
          in: query
          required: false
          description: Identity-timeline filter (actor, user-resource target, or the person named in metadata.user_id).
          schema:
            type: string
            format: uuid
        - name: q
          in: query
          required: false
          description: Search, as for the history.
          schema:
            type: string
        - name: from
          in: query
          required: false
          description: Inclusive lower bound (RFC3339); defaults to now-24h.
          schema:
            type: string
            anyOf:
              - format: date-time
              - maxLength: 0
            description: An RFC 3339 time; empty means none.
        - name: to
          in: query
          required: false
          description: Inclusive upper bound (RFC3339); defaults to now.
          schema:
            type: string
            anyOf:
              - format: date-time
              - maxLength: 0
            description: An RFC 3339 time; empty means none.
        - name: category
          in: query
          required: false
          description: Comma-separated categories, as for the history.
          schema:
            type: string
            pattern: ^(authentication|authorization|security|directory|developer|system)(,(authentication|authorization|security|directory|developer|system))*$
        - name: severity
          in: query
          required: false
          description: Comma-separated severities, as for the history.
          schema:
            type: string
            pattern: ^(info|success|warning|error|critical)(,(info|success|warning|error|critical))*$
        - name: min_severity
          in: query
          required: false
          schema:
            type: string
            enum:
              - info
              - success
              - warning
              - error
              - critical
        - name: resource_type
          in: query
          required: false
          schema:
            type: string
        - name: resource_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: ip
          in: query
          required: false
          schema:
            type: string
            anyOf:
              - format: ipv4
              - format: ipv6
        - name: bucket
          in: query
          required: false
          description: Sparkline bucket width in seconds (60–86400). Omit to auto-size to ~48 buckets across the window.
          schema:
            type: integer
            minimum: 60
            maximum: 86400
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        "200":
          description: Aggregate activity summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivitySummaryResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/activity/{id}/related:
    get:
      operationId: listRelatedActivity
      summary: Related activity events
      description: Returns the anchor event plus events correlated with it by request_id and by the same actor within a symmetric time window. The anchor lookup is organization-scoped — an unknown id or a foreign organization's id both return 404. An event never appears in both correlation lists.
      tags:
        - Activity
      parameters:
        - name: id
          in: path
          required: true
          description: Anchor event UUID (audit.events row id).
          schema:
            type: string
            format: uuid
        - name: window
          in: query
          required: false
          description: 60 to 3600 (default 300); a larger value is lowered to 3600.
          schema:
            type: integer
            default: 300
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        "200":
          description: Anchor event and correlated events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityRelatedResponse"
        "400":
          $ref: "#/components/responses/Unprocessable"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/organizations/{organizationID}/activity/{id}:
    get:
      operationId: getActivityEvent
      summary: One activity event
      description: One of the organization's activity events by its id (an audit.events row id), with its metadata, actor name and email, address and browser, as in the history. 404 for an unknown id or another organization's. Needs audit.read.
      tags:
        - Activity
      parameters:
        - $ref: "#/components/parameters/OrganizationID"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        "200":
          description: The event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityEvent"
        "400":
          $ref: "#/components/responses/Unprocessable"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/organizations/{organizationID}/service-health:
    get:
      operationId: getServiceHealth
      summary: Service health
      tags:
        - Health
      parameters:
        - $ref: "#/components/parameters/OrganizationID"
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      description: The state of each part of the service the organization uses, from its own recent figures, and the incidents operators posted that are open or were resolved in the last 14 days. A component is operational, degraded, outage, maintenance or not_configured (a part the organization doesn't use); an open incident makes it no better than the incident's impact (reason incident). api is an outage while the database is unreachable (api.database_unreachable); sign_in while tokens can't be signed (sign_in.keys_unavailable); email is degraded when the provider refused at least a quarter of the organization's emails of the last hour (email.failing); webhooks while a subscription's deliveries are failing or one was disabled for failing (webhooks.failing); directory while a directory operation of the last day failed and is still open (directory.failing). status is the worst state of the components. Requires organization.read.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - checked_at
                  - components
                  - incidents
                properties:
                  status:
                    type: string
                    enum:
                      - operational
                      - maintenance
                      - degraded
                      - outage
                  checked_at:
                    type: string
                    format: date-time
                  components:
                    type: array
                    items:
                      type: object
                      required:
                        - name
                        - state
                      properties:
                        name:
                          type: string
                          enum:
                            - api
                            - sign_in
                            - email
                            - webhooks
                            - directory
                        state:
                          type: string
                          enum:
                            - operational
                            - maintenance
                            - degraded
                            - outage
                            - not_configured
                        reason:
                          type: string
                          description: Why it isn't operational.
                        figures:
                          type: object
                          additionalProperties:
                            type: integer
                          description: "The counts its state was judged by: email sent_last_hour and failed_last_hour; webhooks active, failing and disabled_failing; directory ldap_connections, scim_tokens and open_failures."
                  incidents:
                    type: array
                    items:
                      type: object
                      required:
                        - id
                        - component
                        - impact
                        - title
                        - started_at
                        - resolved_at
                      properties:
                        id:
                          type: string
                          format: uuid
                        component:
                          type: string
                          enum:
                            - api
                            - sign_in
                            - email
                            - webhooks
                            - directory
                        impact:
                          type: string
                          enum:
                            - maintenance
                            - degraded
                            - outage
                        title:
                          type: string
                        detail:
                          type: string
                        started_at:
                          type: string
                          format: date-time
                        resolved_at:
                          type:
                            - string
                            - "null"
                          format: date-time
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/organizations/{organizationID}/analytics/overview:
    get:
      operationId: getAnalyticsOverview
      summary: Organization analytics overview
      tags:
        - Analytics
      parameters:
        - $ref: "#/components/parameters/OrganizationID"
        - name: from
          in: query
          required: false
          description: Start of a chosen range (RFC 3339), returned as range.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: End of the range (RFC 3339); now by default.
          schema:
            type: string
            format: date-time
        - name: days
          in: query
          required: false
          description: The range as days back from to; 30 by default, at most 366.
          schema:
            type: integer
            minimum: 1
            maximum: 366
        - name: method
          in: query
          required: false
          description: Count only sign-ins of this first method (password, passkey, magic_link, social, saml, ...).
          schema:
            type: string
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      description: "Returns the organization's dashboard figures: sign-ins, failures, active users and their trends. Sign-ins and active users are counted from the sign-in log, which outlives the sessions: a person who switched to the organization, created it or accepted an invitation to it is active in it, but only a sign-in that proved a factor counts as one. Requires analytics.read."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Overview"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/organizations/{organizationID}/overview:
    get:
      operationId: getOrganizationOverview
      summary: Organization overview
      description: "The dashboard's set-up checklist and counts in one read. Each area is answered only to a caller the area's own list would admit, and left out of the answer otherwise: single_sign_on, applications, domains, directory and remembered_devices need connection.read; api_keys apikey.read; webhooks webhook.read; sign_in, access_policies and threats policy.read; invitations user.read; billing billing.read. A person is judged by their roles, an application's token also by its scopes, and an API key, service principal or agent by its scopes, as the route guard judges them. The read itself needs organization.read. The detailed lists stay at their own reads."
      tags:
        - Analytics
      parameters:
        - $ref: "#/components/parameters/OrganizationID"
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        "200":
          description: The overview, with the areas the caller may read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationOverview"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/search:
    get:
      operationId: search
      summary: Universal search
      description: Organization-scoped, RBAC-enforced fuzzy search that fans out across user, organization, group, role, oidc_client, and audit_event resource types. Each type is gated behind its read permission (user.read, organization.read, group.read, role.read, connection.read, audit.read); types the caller cannot read are silently excluded. Matching uses ILIKE '%q%' (parameterised). Results are scored and returned in descending relevance order. Pagination is cursor-based and opaque.
      tags:
        - Search
      parameters:
        - name: q
          in: query
          required: true
          description: Search query (1+ characters after trimming).
          schema:
            type: string
            minLength: 1
        - name: types
          in: query
          required: false
          description: "Comma-separated list of resource types to search. Allowed values: user, organization, group, role, oidc_client, audit_event. Omit to search all permitted types."
          schema:
            type: string
            example: user,group
        - name: cursor
          in: query
          required: false
          description: Opaque pagination cursor from a previous response's next_cursor field.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Page size, 1 to 50 (default 20). A larger value is lowered to 50; a smaller or malformed one gets the default.
          schema:
            type: integer
            default: 20
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
        "400":
          $ref: "#/components/responses/Unprocessable"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/organizations/{organizationID}/audit:
    get:
      operationId: listAuditEvents
      description: Returns the organization's audit events in reverse chronological order with cursor-based pagination and optional filters for action, resource type, actor, and a free-text query. The audit log is append-only and hash-chained, so results reflect an immutable record of activity. Events are kept for the plan's audit_retention_days (7, 30, 90 days, or for good), then deleted. Pass the returned cursor to page through history; access is restricted to the organization named in the path.
      summary: List audit events
      tags:
        - Audit
      parameters:
        - $ref: "#/components/parameters/OrganizationID"
        - name: q
          in: query
          required: false
          description: |
            Finds words of the action, resource type, actor type, user agent, address and metadata, each split into words (auth.login_succeeded is auth, login and succeeded), every plain word as a prefix; or the events of an actor whose name contains it or whose email begins with it. "Quoted phrases", -exclusions and OR are read as websearch_to_tsquery reads them.
          schema:
            type: string
        - name: action
          in: query
          required: false
          description: Comma-separated actions; events of any of them.
          schema:
            type: string
        - name: resource_type
          in: query
          required: false
          description: Comma-separated resource types; events about any of them.
          schema:
            type: string
        - name: resource_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: ip
          in: query
          required: false
          description: Events from this address.
          schema:
            type: string
        - name: from
          in: query
          required: false
          description: Inclusive lower bound (RFC3339).
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: Inclusive upper bound (RFC3339).
          schema:
            type: string
            format: date-time
        - name: actor_user_id
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Page size, 1 to 200 (default 50). A larger value is lowered to 200; a smaller or malformed one gets the default.
          schema:
            type: integer
            default: 50
        - name: cursor
          in: query
          required: false
          description: The previous page's next_cursor (the id of its last event), for keyset pagination.
          schema:
            type: string
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        "200":
          description: "{ items: AuditEvent[], next_cursor?: string, total, total_capped }; next_cursor is absent on the last page."
          content:
            application/json:
              example:
                items:
                  - id: 018f2a90-1b2c-7d3e-8f40-5a6b7c8d9e01
                    organization_id: 018f2a6c-9c3d-7e4a-b2f1-3a5c9d8e1f00
                    action: user.created
                    resource_type: user
                    resource_id: 018f2a70-1a2b-7c3d-9e4f-5a6b7c8d9e0f
                    actor_type: user
                    actor_user_id: 018f2a70-1a2b-7c3d-9e4f-5a6b7c8d9e0f
                    ip: 203.0.113.10
                    user_agent: Mozilla/5.0 (Macintosh; Intel Mac OS X 14_6)
                    request_id: api-1/Kx9fQ2mW7a-000124
                    created_at: "2026-09-24T10:15:04Z"
                  - id: 018f2a90-0a1b-7c2d-8e3f-4a5b6c7d8e00
                    organization_id: 018f2a6c-9c3d-7e4a-b2f1-3a5c9d8e1f00
                    action: organization.created
                    resource_type: organization
                    resource_id: 018f2a6c-9c3d-7e4a-b2f1-3a5c9d8e1f00
                    actor_type: user
                    actor_user_id: 018f2a70-1a2b-7c3d-9e4f-5a6b7c8d9e0f
                    ip: 203.0.113.10
                    user_agent: Mozilla/5.0 (Macintosh; Intel Mac OS X 14_6)
                    request_id: api-1/Kx9fQ2mW7a-000123
                    created_at: "2026-09-24T10:15:00Z"
                next_cursor: 018f2a90-0a1b-7c2d-8e3f-4a5b6c7d8e00
                total: 2
                total_capped: false
              schema:
                type: object
                required:
                  - items
                  - total
                  - total_capped
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Row"
                  next_cursor:
                    $ref: "#/components/schemas/NextCursor"
                  total:
                    type: integer
                    description: How many events match, up to 10,000.
                  total_capped:
                    type: boolean
                    description: More than 10,000 events match.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
