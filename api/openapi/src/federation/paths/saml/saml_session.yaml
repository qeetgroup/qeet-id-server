post:
  operationId: createSamlSession
  summary: Hosted sign-in session (public)
  description: >-
    Trades the one-time login code a hosted-login SAML sign-in came back with
    (the hosted login's /sign-in URL fragment, saml_code) for the hosted-login
    session, as POST /v1/auth/session answers: the qe_ls cookie and the user's
    id. The code is single-use and short-lived (401 saml.login_code_invalid,
    saml.login_code_used or saml.login_code_expired), and trades only while the
    connection that issued it is still active (403 saml.connection_disabled or
    saml.connection_draft; 401 saml.login_code_invalid once it is deleted). The
    organisation's network
    rules apply (403 auth.address_not_allowed), and an account that is not
    active is refused (403 auth.account_inactive). As the console's SAML
    sign-in, no second factor is asked: the identity provider decides how its
    people sign in. The session is recorded as a saml sign-in. Mounted at the
    root, not under /v1, and unauthenticated; CSRF-checked.
  tags:
    - SAML
  security: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - code
          properties:
            code:
              type: string
              description: The saml_code from the URL fragment.
  responses:
    '200':
      description: >-
        Signed in to the hosted login; the hosted-login session cookie (qe_ls)
        is set.
      headers:
        Cache-Control:
          $ref: ../../../shared/headers/NoStoreCacheControl.yaml
        Pragma:
          $ref: ../../../shared/headers/NoStorePragma.yaml
        Set-Cookie:
          schema:
            type: string
      content:
        application/json:
          schema:
            type: object
            properties:
              user_id:
                type: string
                format: uuid
    '400':
      $ref: ../../../shared/responses/BadRequest.yaml
    '401':
      $ref: ../../../shared/responses/Unauthorized.yaml
    '403':
      $ref: ../../../shared/responses/Forbidden.yaml
