get:
  operationId: getSecurityAnomalySummary
  description: >-
    Returns aggregate counts of login anomalies for the organization, including open,
    resolved, affected-user, and high-severity totals, for a dashboard overview.
    It summarizes the same records enumerated by the list-anomalies call. Drill
    into individual entries there and close them with the resolve-anomaly call.
  summary: Anomaly summary
  tags:
    - Threats
  parameters:
    - $ref: ../../../shared/parameters/OrganizationID.yaml
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  responses:
    "200":
      description: Open/resolved/affected/high-severity counts
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/ThreatSummary.yaml
    "401":
      $ref: ../../../shared/responses/Unauthorized.yaml
    "403":
      $ref: ../../../shared/responses/Forbidden.yaml
