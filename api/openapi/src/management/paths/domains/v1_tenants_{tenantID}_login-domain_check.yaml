post:
  operationId: checkLoginDomain
  summary: Check the custom login domain now
  tags:
    - Domains
  description: >-
    Checks every stage of the tenant's custom hosted-login hostname now (as GET
    /v1/tenants/{tenantID}/login-domain describes), keeps the result as the last
    check, and returns it with checked_at. Needs connection.read.
  parameters:
    - $ref: ../../../shared/parameters/TenantID.yaml
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  responses:
    '200':
      description: The new check
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/LoginDomainStatus.yaml
    '401':
      $ref: ../../../shared/responses/Unauthorized.yaml
    '403':
      $ref: ../../../shared/responses/Forbidden.yaml
