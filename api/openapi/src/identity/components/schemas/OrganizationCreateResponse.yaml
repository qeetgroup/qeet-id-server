type: object
required:
  - organization
  - organization_id
  - roles
properties:
  organization:
    $ref: ./Organization.yaml
  organization_id:
    type: string
    format: uuid
  roles:
    type: array
    items:
      type: string
    example:
      - owner
  access_token:
    type: string
  token_type:
    type: string
  expires_at:
    type: string
    format: date-time
  refresh_token:
    type: string
  session_id:
    type: string
    format: uuid
  user_id:
    type: string
    format: uuid
