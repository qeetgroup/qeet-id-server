  /saml/acs/{id}:
    post:
      operationId: post_saml_acs_ById
      description: 'The SAML Assertion Consumer Service for a specific connection, with Qeet acting as the Service Provider. It validates the external IdP''s signed SAMLResponse and assertion (an EncryptedAssertion is decrypted with the connection''s SP key first and must still be signed; signature by any of the certificates the connection trusts; conditions, allowing three minutes of clock difference with the IdP either way; and replay protection), provisions or resolves the user just-in-time, and redirects to the SPA callback with a one-time login code carried in the URL fragment. An answer to a sign-in request completes only in the browser that began it (holding the cookie the login call set): from another it spends the request and answers 403 saml.other_browser, so a sign-in begun by someone else can''t be completed in a victim''s browser. An IdP-initiated answer, which answers no request, is accepted only where the connection allows those. The SPA then trades that code for tokens at POST /saml/exchange. Mounted at the root, not under /v1, and unauthenticated. An existing account is signed in only while this organisation is its home, and one adopted by email must have a verified address or have been provisioned by the organisation''s directory (SCIM), and is then marked verified: another organisation''s account or a guest whose home is elsewhere is refused with 403 saml.user_tenant_mismatch, an unverified one with 403 saml.account_unverified. A subject is linked to the connection that asserted it, so another connection asserting it doesn''t sign it in. An address not yet linked is adopted or given an account only on a domain the organisation has verified (the most specific verified domain decides, 403 saml.email_domain_unverified otherwise), and an account that owns the organisation or holds an admin permission there (user.write, role.write, group.write, connection.write, policy.write or tenant.write) is not adopted by its address (403 saml.account_administers): it keeps its own credentials. A new account is created only while the domain that manages the address has jit_enabled on; otherwise an address with no account is refused with 403 saml.jit_not_allowed and nothing is created. Existing members are adopted either way. Every sign-in then brings the account in step with the assertion, each change audited: its display name; its address, when the asserted one is on a domain the organisation has verified, is no other account''s, and the account doesn''t administer the organisation (recovery links sent to the old address then stop working); and its groups, as GET /v1/tenants/{tenantID}/saml/{id}/group-mappings describes. The organisation''s plan must include enterprise SSO when the assertion arrives, so a connection set up on a plan that has since lapsed signs no one in (402 billing.upgrade_required).'
      summary: "[acs] Assertion Consumer Service"
      tags:
        - SAML
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                SAMLResponse:
                  type: string
                RelayState:
                  type: string
      responses:
        '302':
          description: Signature-validated; redirect with a one-time login code
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402': {description: 'The organisation''s plan does not include enterprise SSO (billing.upgrade_required).'}
  /saml/exchange:
    post:
      operationId: post_saml_exchange
      description: 'Trades the one-time login code minted by the SAML Assertion Consumer Service for a Qeet access and refresh token pair, with Qeet acting as the Service Provider. The code is single-use and short-lived. Mounted at the root, not under /v1, and unauthenticated; it is the second step after POST /saml/acs/{id}.'
      summary: Exchange code (public)
      tags:
        - SAML
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
              properties:
                code:
                  type: string
      responses:
        '200':
          description: Token pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /saml/idp/{tenantID}/metadata:
    get:
      operationId: get_saml_idp_ByTenantID_metadata
      description: 'Returns the tenant''s SAML Identity Provider metadata XML, including the tenant''s IdP entity id (/saml/idp/{tenantID}), the signing certificate and the redirect- and POST-binding SingleSignOnService endpoints (/saml/idp/{tenantID}/sso), for downstream Service Providers to configure Qeet as their IdP, and the NameID formats it issues (emailAddress, persistent and unspecified). Mounted at the root, not under /v1, and unauthenticated. An unknown or inactive tenant returns 404. Register each downstream SP with the SAML SP (IdP side) endpoints before it can obtain assertions at the tenant''s IdP SSO endpoint.'
      summary: "[idp] IdP metadata"
      tags:
        - SAML
      parameters:
        - name: tenantID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      security: []
      responses:
