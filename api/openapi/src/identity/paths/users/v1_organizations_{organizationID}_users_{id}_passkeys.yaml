get:
  operationId: listUserPasskeys
  tags:
    - Users
  summary: List a user's passkeys
  description: >-
    The passkeys on a member's account, oldest first: each one's name, when it
    was added and when it last signed them in. Requires user.read; someone who
    doesn't belong to the caller's organization answers 404.
  parameters:
    - $ref: ../../../shared/parameters/OrganizationID.yaml
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  responses:
    "200":
      description: The user's passkeys
      content:
        application/json:
          schema:
            type: object
            properties:
              truncated:
                $ref: ../../../shared/schemas/Truncated.yaml
              items:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                    name:
                      type:
                        - string
                        - "null"
                    created_at:
                      type: string
                      format: date-time
                    last_used_at:
                      type:
                        - string
                        - "null"
                      format: date-time
    "400":
      $ref: ../../../shared/responses/BadRequest.yaml
    "401":
      $ref: ../../../shared/responses/Unauthorized.yaml
    "403":
      $ref: ../../../shared/responses/Forbidden.yaml
    "404":
      $ref: ../../../shared/responses/NotFound.yaml
    "429":
      $ref: ../../../shared/responses/TooManyRequests.yaml
