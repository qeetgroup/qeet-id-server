get:
  operationId: listMySessions
  description: >-
    Lists the caller's own active sessions, each with its device, address, and
    timestamp metadata, for review in account security settings. Results are
    cursor-paginated: pass the returned next_cursor to fetch the following page
    until has_more is false. Terminate any listed session individually with the
    session-revocation call, or every session except the current one with the
    revoke-other-sessions call.
  summary: List sessions
  tags:
    - Auth
  parameters:
    - name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    - name: cursor
      in: query
      required: false
      schema:
        type: string
        format: uuid
      description: Opaque owner-scoped cursor returned by the previous page.
  security:
    - bearerAuth: []
  responses:
    "200":
      description: Active sessions
      content:
        application/json:
          schema:
            type: object
            properties:
              items:
                type: array
                items:
                  $ref: ../../components/schemas/Session.yaml
              next_cursor:
                type: string
                description: >-
                  Opaque owner-scoped cursor for the next page; omitted on the
                  final page.
              has_more:
                type: boolean
              total:
                type: integer
                minimum: 0
    "401":
      $ref: ../../../shared/responses/Unauthorized.yaml
