          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name:
                  type:
                    - string
                    - "null"
                  minLength: 1
                  maxLength: 100
                connection_id:
                  type:
                    - string
                    - "null"
                  description: A connection of the organization, or "" for every connection.
                threshold:
                  type:
                    - integer
                    - "null"
                  minimum: 1
                  maximum: 100
                enabled:
                  type:
                    - boolean
                    - "null"
      responses:
