post:
  operationId: retryWebhookDelivery
  description: >-
    Sends one of the organization's webhook deliveries again now. A delivery
    that had finished, delivered or given up after its 60 attempts, starts a
    fresh set of attempts; one still retrying keeps its count. The delivery
    must be one of the webhook's in the path: any other, like one that doesn't
    exist or is being sent at this moment, is refused with 404
    webhook.delivery_not_found and left as it was. An ID that isn't a UUID is
    refused with 400 webhook.invalid_id.
  summary: Retry delivery
  tags:
    - Webhooks
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: deliveryID
      in: path
      required: true
      schema:
        type: string
        format: uuid
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  responses:
    '200':
      description: Delivery re-queued
    '400':
      $ref: ../../../shared/responses/BadRequest.yaml
    '401':
      $ref: ../../../shared/responses/Unauthorized.yaml
    '403':
      $ref: ../../../shared/responses/Forbidden.yaml
    '404':
      $ref: ../../../shared/responses/NotFound.yaml
