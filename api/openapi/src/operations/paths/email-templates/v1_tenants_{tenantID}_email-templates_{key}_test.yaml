post:
  operationId: sendTestEmail
  summary: Send the current draft to the operator's verified email
  tags:
    - Email Templates
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  parameters:
    - $ref: ../../../shared/parameters/TenantID.yaml
    - name: key
      in: path
      required: true
      schema:
        type: string
  description: >-
    Requires branding.write, a user principal with a verified active account,
    and a configured mail transport. The destination is resolved server-side,
    never accepted from input. Sends inert sample links and codes; limited to
    one request per tenant/user per minute on each server instance. Records an
    audit event before attempting delivery. An accepted response means the
    provider accepted the message, not that it reached the inbox.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - draft
          properties:
            draft:
              $ref: ../../components/schemas/EmailEditorInput.yaml
            locale:
              type: string
  responses:
    '202':
      description: Mail transport accepted the test
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                enum:
                  - accepted
    '401':
      $ref: ../../../shared/responses/Unauthorized.yaml
    '403':
      $ref: ../../../shared/responses/Forbidden.yaml
    '404':
      $ref: ../../../shared/responses/NotFound.yaml
    '422':
      $ref: ../../../shared/responses/Unprocessable.yaml
    '429':
      $ref: ../../../shared/responses/TooManyRequests.yaml
