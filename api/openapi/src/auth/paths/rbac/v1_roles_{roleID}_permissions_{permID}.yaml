delete:
  operationId: revokeRolePermission
  description: >-
    Revokes a permission from a role; holders lose it from their effective
    permissions as soon as this returns, unless another role still grants it.
    This is the counterpart to the grant-permission-to-role call. Confirm the
    resulting grants with the list-role-permissions call. A built-in role
    (owner, every permission; admin, all but organization.delete; viewer, every read
    but secret.read; member, none) holds what its definition says, so it can't
    be changed (403 rbac.system_role_fixed), and nobody takes away a permission
    they don't hold (403 rbac.grant_exceeds_caller). Audited in the
    organization's audit log as role.permission_revoked, naming the role, the
    permission (permission_id, permission) and the caller.
  summary: Revoke permission from role
  tags:
    - RBAC
  parameters:
    - name: roleID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: permID
      in: path
      required: true
      schema:
        type: string
        format: uuid
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  responses:
    "204":
      description: Revoked
    "400":
      $ref: ../../../shared/responses/BadRequest.yaml
    "401":
      $ref: ../../../shared/responses/Unauthorized.yaml
    "403":
      $ref: ../../../shared/responses/Forbidden.yaml
    "404":
      $ref: ../../../shared/responses/NotFound.yaml
post:
  operationId: grantRolePermission
  description: >-
    Grants a permission to a role, so every current and future holder of the
    role gains it through their effective permissions. The role and permission
    must both exist, and the grant is idempotent. Reverse it with the
    revoke-permission-from-role call, and inspect the role's grants with the
    list-role-permissions call. The caller must hold the permission in this
    organization, unless they are an owner (403 rbac.grant_exceeds_caller
    otherwise). A built-in role (owner, every permission; admin, all but
    organization.delete; viewer, every read but secret.read; member, none) holds what
    its definition says, so it can't be changed (403 rbac.system_role_fixed).
    Audited in the organization's audit log as role.permission_granted, naming
    the role, the permission (permission_id, permission) and the caller.
  summary: Grant permission to role
  tags:
    - RBAC
  parameters:
    - name: roleID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: permID
      in: path
      required: true
      schema:
        type: string
        format: uuid
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  responses:
    "204":
      description: Granted
    "400":
      $ref: ../../../shared/responses/BadRequest.yaml
    "401":
      $ref: ../../../shared/responses/Unauthorized.yaml
    "403":
      $ref: ../../../shared/responses/Forbidden.yaml
    "404":
      $ref: ../../../shared/responses/NotFound.yaml
