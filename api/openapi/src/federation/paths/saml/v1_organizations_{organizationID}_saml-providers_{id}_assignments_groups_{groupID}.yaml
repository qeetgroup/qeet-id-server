post:
  operationId: assignSamlAppToGroup
  description: >-
    Assigns a group of the organization to one of its downstream Service Providers, so
    an SP with assignment_required signs in the group's members (its own
    members, not those of groups nested under it). Another organization's group, or an
    unknown one, is refused with 404 saml.assignee_not_found. Assigning a group
    already assigned changes nothing. The assignment is audited as
    saml.sp_group_assigned, and needs a recent step-up.
  summary: Assign a group to a SAML SP
  tags:
    - SAML
  parameters:
    - $ref: ../../../shared/parameters/OrganizationID.yaml
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: groupID
      in: path
      required: true
      schema:
        type: string
        format: uuid
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  responses:
    "204":
      description: Assigned
    "400":
      $ref: ../../../shared/responses/BadRequest.yaml
    "401":
      $ref: ../../../shared/responses/Unauthorized.yaml
    "403":
      $ref: ../../../shared/responses/Forbidden.yaml
    "404":
      $ref: ../../../shared/responses/NotFound.yaml
delete:
  operationId: unassignSamlAppFromGroup
  description: >-
    Removes a group's assignment to one of the organization's downstream Service
    Providers; its members assigned themselves stay assigned. A group not
    assigned answers 404. The removal is audited as saml.sp_group_unassigned,
    and needs a recent step-up.
  summary: Unassign a group from a SAML SP
  tags:
    - SAML
  parameters:
    - $ref: ../../../shared/parameters/OrganizationID.yaml
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: groupID
      in: path
      required: true
      schema:
        type: string
        format: uuid
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  responses:
    "204":
      description: Unassigned
    "400":
      $ref: ../../../shared/responses/BadRequest.yaml
    "401":
      $ref: ../../../shared/responses/Unauthorized.yaml
    "403":
      $ref: ../../../shared/responses/Forbidden.yaml
    "404":
      $ref: ../../../shared/responses/NotFound.yaml
