type: object
required:
  - created_at
  - last_request
  - last_used_at
  - provisioned_count
  - token_count
  - token_set
properties:
  created_at:
    type:
      - string
      - "null"
    format: date-time
    description: When the newest working token was issued.
  last_used_at:
    type:
      - string
      - "null"
    format: date-time
    description: The latest use of any working token, recorded at most once a minute.
  provisioned_count:
    type: integer
  token_count:
    type: integer
    description: How many tokens work, rotated ones still in their overlap included.
  token_prefix:
    type: string
    description: The newest working token's prefix.
  token_set:
    type: boolean
    description: Whether any token works.
  last_request:
    type:
      - object
      - "null"
    description: >-
      How the last change the identity provider sent was answered; null before
      the first. Reads are not recorded.
    required:
      - at
      - operation
      - resource
      - http_status
      - status
    properties:
      at:
        type: string
        format: date-time
      operation:
        type: string
        enum:
          - post
          - put
          - patch
          - delete
      resource:
        type: string
        enum:
          - user
          - group
      http_status:
        type: integer
      status:
        type: string
        enum:
          - success
          - warning
          - failed
      error_code:
        type: string
        description: The directory error code, such as DIR-409.
      reason:
        type: string
        description: >-
          The SCIM error type the answer gave, such as scim.uniqueness or
          scim.invalidValue.
