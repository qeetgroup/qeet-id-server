      tags:
        - Directory
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationID"
        - name: userID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The person's profiles
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  truncated:
                    $ref: "#/components/schemas/Truncated"
                  items:
                    type: array
                    items:
                      type: object
                      required:
