type: object
description: Every field is optional; an omitted one keeps its value.
properties:
  description:
    type:
      - string
      - 'null'
  name:
    type:
      - string
      - 'null'
  parent_id:
    type:
      - string
      - 'null'
    format: uuid
    description: >-
      The new parent group's id, or null to make the group top-level. Omit it to
      keep the parent.
