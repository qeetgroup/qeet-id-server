post:
  operationId: resetPassword
  description: >-
    Completes the password-reset flow started by the forgot-password call by
    consuming the emailed token and setting the new password. The token is
    single-use and time-limited, so an expired or already-redeemed token is
    rejected. The new password is checked against the rules of the organization
    the account belongs to (the platform baseline of 8 characters for an account
    with no organization), the offline strength baseline and, when enabled, the
    breached-password check; a refusal is a 422 naming the rule that failed and
    leaves the password and the token unchanged. On success the password is
    updated and the user can sign in with the new credentials. Every hosted
    sign-in (browser) session of the person ends too, so one opened with the old
    password can no longer start an application's sign-in or enrol a passkey;
    the audit record counts them (revoked_login_sessions). The completed reset
    is recorded in the account's organization's audit trail as
    auth.password_reset_confirmed. A reset that proves the account's address
    for the first time marks it verified and removes everything set up on the
    account before it but the new password (passkeys, second factors, linked
    accounts, pending verifications and sign-in codes, and personal API keys),
    so whoever registered the address first keeps no way in; recorded as
    email.verified and auth.credentials_removed. A link for an address that must now sign in
    with single sign-on is refused with 403 auth.sso_required; the password and
    the link stay as they were (see the SSORequired response). The account
    holder is emailed that it happened, with what to do if it wasn't them.
  summary: Reset password
  tags:
    - Auth
  security: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: false
          required:
            - token
            - new_password
          properties:
            token:
              type: string
              minLength: 1
            new_password:
              type: string
              minLength: 8
              maxLength: 256
  responses:
    "200":
      description: Password reset; returns a confirmation message
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
    "400":
      $ref: ../../../shared/responses/BadRequest.yaml
    "401":
      $ref: ../../../shared/responses/Unauthorized.yaml
    "403":
      $ref: ../../components/responses/SSORequired.yaml
    "413":
      $ref: ../../../shared/responses/PayloadTooLarge.yaml
    "422":
      $ref: ../../../shared/responses/Unprocessable.yaml
    "429":
      $ref: ../../../shared/responses/TooManyRequests.yaml
    "503":
      $ref: ../../../shared/responses/Overloaded.yaml
