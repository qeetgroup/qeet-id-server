post:
  operationId: signIn
  description: >-
    Authenticates a user by email and password and, on success, returns an
    access and refresh token pair. If the account has a second factor enrolled,
    tokens are withheld and a short-lived mfa_token with the available methods
    is returned instead; exchange it for tokens at the complete-MFA call.
    Passwordless accounts authenticate through passkey login rather than this
    endpoint, and a registered passkey satisfies MFA on its own. Requests are
    rate limited to slow credential stuffing. Failed sign-ins are counted per
    account and source network, per account across networks, and per source
    network across accounts (see the sign-in lockout on the create-SSO-session
    call); a locked account answers 429 auth.account_locked whatever the
    password, a throttled source 429 too_many_requests, and an address with no
    account answers exactly like a wrong password. A suspended or otherwise
    inactive account also answers a wrong password with 401
    auth.invalid_credentials, counted like any wrong password; only the right
    password is refused with 403 auth.account_inactive. When the account's own
    organization has switched password sign-in off, a correct password is
    refused with 403 auth.method_disabled. Every sign-in is assessed for risk
    (bot-like clients, and impossible travel and new devices where the
    organization turns them on), and its country and device are kept 90 days for
    later sign-ins to be compared against. A risky sign-in by someone with no
    second factor answers an mfa_token challenge met by a code sent to their
    verified email address (methods [email], the factor named by the challenge's
    own id), or 403 auth.risk_verification_unavailable when they have no
    verified address. While the organization's address rules are on, a sign-in
    from an address they refuse is refused with 403 auth.address_not_allowed
    before any session is issued; the same holds on every other way of signing
    in to the organization (passkey, magic link, social, SAML, LDAP, invitation,
    organization switch, application authorization and the device flow). Each
    failed attempt is recorded in the audit trail of the organization the
    sign-in was for (or the account's own) as auth.sign_in_failed: the account,
    or no one for an address with no account, the reason (wrong_password,
    unknown_account, account_locked or source_throttled) and the source, never
    what was submitted. The records are bounded per source network and per
    organization (sign_in_failures_unrecorded_total counts the rest). A lock a
    failure sets is recorded as auth.account_locked with locked_until, when it
    lifts; a source throttle as auth.source_throttled. On a domain whose
    organization requires single sign-on, the sign-in is refused with 403
    auth.sso_required before any account is looked up or password checked, and
    nothing is counted against the lockout (see the SSORequired response).
  summary: Sign in
  tags:
    - Auth
  security: []
  requestBody:
    required: true
    content:
      application/json:
        example:
          email: ada@example.com
          password: corr3ct-h0rse-battery
        schema:
          $ref: ../../components/schemas/LoginRequest.yaml
  responses:
    "200":
      description: |
        Either a full token pair (no MFA) or an MFA challenge to complete at
        POST /v1/auth/mfa — when the user holds a second factor, or must have
        one (see MFAChallenge).
      headers:
        Cache-Control:
          $ref: ../../../shared/headers/NoStoreCacheControl.yaml
        Pragma:
          $ref: ../../../shared/headers/NoStorePragma.yaml
      content:
        application/json:
          examples:
            signedIn:
              summary: Signed in; the account holds no second factor
              value:
                access_token: eyJhbGciOiJFUzI1NiIsImtpZCI6ImsxIn0.eyJzdWIiOiIwMThmMmE3MCJ9.FAKE-signature
                token_type: Bearer
                expires_at: "2026-09-24T10:30:00Z"
                refresh_token: Jk3vQm9xT2pL0sWc8hYbR4nZaE6uFi1oPq7dGt5yHw0
                session_expires_at: "2026-10-24T10:15:00Z"
                idle_expires_at: "2026-10-01T10:15:00Z"
                session_id: "018f2a70-5b6c-7d8e-9f01-2a3b4c5d6e7f"
                user_id: "018f2a70-1a2b-7c3d-9e4f-5a6b7c8d9e0f"
                organization_id: "018f2a6c-9c3d-7e4a-b2f1-3a5c9d8e1f00"
            mfaRequired:
              summary: A second factor is needed; complete it at POST /v1/auth/mfa
              value:
                mfa_required: true
                mfa_token: eyJhbGciOiJFUzI1NiIsImtpZCI6ImsxIn0.eyJwdXJwb3NlIjoibWZhIn0.FAKE-signature
                methods:
                  - totp
                  - email
                  - recovery_code
                factors:
                  - type: totp
                  - type: email
                    id: "018f2a71-2c3d-7e4f-8a5b-6c7d8e9f0a1b"
                    destination: a**@example.com
                  - type: recovery_code
          schema:
            oneOf:
              - $ref: ../../../shared/schemas/TokenPair.yaml
              - $ref: ../../../shared/schemas/MFAChallenge.yaml
    "401":
      $ref: ../../../shared/responses/Unauthorized.yaml
    "403":
      $ref: ../../../shared/responses/Forbidden.yaml
    "422":
      $ref: ../../../shared/responses/Unprocessable.yaml
    "429":
      $ref: ../../../shared/responses/TooManyRequests.yaml
    "503":
      $ref: ../../components/responses/SignInUnavailable.yaml
