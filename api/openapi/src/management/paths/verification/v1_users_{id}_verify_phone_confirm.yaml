post:
  operationId: confirmPhoneVerification
  description: >-
    Confirms phone verification by validating the code delivered by the
    start-phone-verification call and marking the number verified. Codes are
    single-use, time-limited, and retired after a few incorrect attempts,
    requiring a fresh send; ten wrong codes in an hour, over every code asked
    for in between, refuse even the right one until the hour has passed (429
    verification.attempts_exceeded with retry_after, in seconds). Request the
    code with the start-phone-verification call before invoking this. Audited
    in the audit trail of the organization
    the session is in as phone.verified, or phone.verification_failed with the
    reason for a wrong, used, expired or retired code, with the number masked to
    its last three digits.
  summary: Confirm phone verification
  tags:
    - Verification
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  security:
    - bearerAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - code
          properties:
            code:
              type: string
  responses:
    "200":
      description: Phone verified; returns a confirmation message
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
    "400":
      $ref: ../../../shared/responses/BadRequest.yaml
    "401":
      $ref: ../../../shared/responses/Unauthorized.yaml
    "403":
      $ref: ../../../shared/responses/Forbidden.yaml
    "404":
      $ref: ../../../shared/responses/NotFound.yaml
    "422":
      $ref: ../../../shared/responses/Unprocessable.yaml
    "429":
      $ref: ../../../shared/responses/TooManyRequests.yaml
