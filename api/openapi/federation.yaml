            - string
            - "null"
        name_attribute:
          type:
            - string
            - "null"
        groups_attribute:
          type:
            - string
            - "null"
          description: The assertion attribute carrying a person's groups; empty reads the common ones.
        status:
          type:
            - string
            - "null"
    SAMLServiceProviderAssignments:
