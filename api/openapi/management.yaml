      operationId: post_v1_users_bulk
      summary: Bulk-create users
      description: Create many users in one call. Each row is attempted independently — a bad or duplicate row is reported in the response rather than failing the whole batch (partial success).
      tags:
        - Users
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserBulkImport'
      responses:
