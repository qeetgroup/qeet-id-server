get:
  operationId: listUserPushDevices
  summary: List a member's linked phones
  description: >-
    Lists the phones a member has linked for push approval. Requires the
    user.read permission; 404 for someone who is not a member of the caller's
    organization.
  tags:
    - Users
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              truncated:
                $ref: ../../../shared/schemas/Truncated.yaml
              items:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                    name:
                      type: string
                    platform:
                      type: string
                      enum:
                        - ios
                        - android
                    created_at:
                      type: string
                      format: date-time
                    last_seen_at:
                      type: string
                      format: date-time
    "401":
      $ref: ../../../shared/responses/Unauthorized.yaml
    "403":
      $ref: ../../../shared/responses/Forbidden.yaml
    "404":
      $ref: ../../../shared/responses/NotFound.yaml
