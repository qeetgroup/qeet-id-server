get:
  operationId: listMyPushDevices
  description: >-
    Lists the caller's registered push-approval devices used as a second factor,
    each with its label and platform, for management in account security
    settings. It never returns the secret device token, which is shown only once
    at registration. Add or rotate a device with the register-device call and
    remove one with the revoke-device call.
  summary: List registered push-MFA devices
  tags:
    - MFA
  security:
    - bearerAuth: []
  responses:
    "200":
      description: Registered devices
      content:
        application/json:
          schema:
            type: object
            required:
              - items
            properties:
              truncated:
                $ref: ../../../shared/schemas/Truncated.yaml
              items:
                type: array
                items:
                  $ref: ../../components/schemas/PushDevice.yaml
    "401":
      $ref: ../../../shared/responses/Unauthorized.yaml
post:
  operationId: registerPushDevice
  description: >-
    Registers a mobile device for push-based MFA, or rotates the credential of
    an existing one, from its platform push token. The resulting device token is
    returned only in this response and cannot be retrieved later, so the device
    must persist it to answer future challenges. That token is required when
    responding to a challenge; revoke the device with the corresponding delete
    call. The account holder is emailed that it happened, with what to do if it
    wasn't them.
  summary: Register or rotate a push-MFA device
  tags:
    - MFA
  security:
    - bearerAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - push_token
            - platform
          properties:
            name:
              type: string
            push_token:
              type: string
            platform:
              type: string
              enum:
                - ios
                - android
  responses:
    "201":
      description: Device registered; device_token is returned once
      headers:
        Cache-Control:
          $ref: ../../../shared/headers/NoStoreCacheControl.yaml
        Pragma:
          $ref: ../../../shared/headers/NoStorePragma.yaml
      content:
        application/json:
          schema:
            type: object
            required:
              - device
              - device_token
              - warning
            properties:
              device:
                $ref: ../../components/schemas/PushDevice.yaml
              device_token:
                type: string
              warning:
                type: string
    "401":
      $ref: ../../../shared/responses/Unauthorized.yaml
