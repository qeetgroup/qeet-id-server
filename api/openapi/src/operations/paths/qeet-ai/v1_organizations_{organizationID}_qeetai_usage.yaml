get:
  operationId: getQeetAiUsage
  summary: Qeet AI usage
  description: >-
    What the organization's Qeet AI used: this UTC month's messages (turns
    answered) and tokens as its provider reported them, the last use, and the
    twelve most recent months. Requires secret.read, as the provider
    configuration does.
  tags:
    - Qeet AI
  parameters:
    - $ref: ../../../shared/parameters/OrganizationID.yaml
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  responses:
    "200":
      description: Usage
      content:
        application/json:
          schema:
            type: object
            properties:
              this_month:
                type: object
                properties:
                  month:
                    type: string
                    example: 2026-10
                  messages:
                    type: integer
                  input_tokens:
                    type: integer
                    format: int64
                  output_tokens:
                    type: integer
                    format: int64
                  last_used_at:
                    type: string
                    format: date-time
              last_used_at:
                type:
                  - string
                  - "null"
                format: date-time
              months:
                type: array
                items:
                  type: object
                  properties:
                    month:
                      type: string
                      example: 2026-10
                    messages:
                      type: integer
                    input_tokens:
                      type: integer
                      format: int64
                    output_tokens:
                      type: integer
                      format: int64
                    last_used_at:
                      type: string
                      format: date-time
    "400":
      $ref: ../../../shared/responses/BadRequest.yaml
    "401":
      $ref: ../../../shared/responses/Unauthorized.yaml
    "403":
      $ref: ../../../shared/responses/Forbidden.yaml
    "429":
      $ref: ../../../shared/responses/TooManyRequests.yaml
