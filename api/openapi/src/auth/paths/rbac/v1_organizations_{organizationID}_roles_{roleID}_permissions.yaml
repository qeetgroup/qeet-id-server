put:
  operationId: setRolePermissions
  summary: Set a role's permissions
  description: >-
    Makes the listed permissions the whole of a custom role's permissions, in
    one transaction: the ones not listed are taken away, and the response lists
    the role's permissions as they now are. The caller must hold every
    permission added or taken away, unless they are an owner (403
    rbac.grant_exceeds_caller naming the first one; nothing changes). A built-in
    role (owner, admin, member, viewer) can't be changed (403
    rbac.system_role_fixed); a role of another organization, or a permission ID
    that doesn't exist, answers 404. Send [] to take every permission away.
    Audited as one role.permissions_set listing the permissions added and
    removed; a request that changes nothing records nothing. Needs role.write
    and a recent sign-in (step-up).
  tags:
    - RBAC
  parameters:
    - $ref: ../../../shared/parameters/OrganizationID.yaml
    - name: roleID
      in: path
      required: true
      schema:
        type: string
        format: uuid
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - permission_ids
          properties:
            permission_ids:
              type: array
              maxItems: 500
              items:
                type: string
                format: uuid
  responses:
    '200':
      description: The role's permissions as they now are
      content:
        application/json:
          schema:
            type: object
            properties:
              items:
                type: array
                items:
                  $ref: ../../components/schemas/Permission.yaml
    '400':
      $ref: ../../../shared/responses/BadRequest.yaml
    '401':
      $ref: ../../../shared/responses/Unauthorized.yaml
    '403':
      $ref: ../../../shared/responses/Forbidden.yaml
    '404':
      $ref: ../../../shared/responses/NotFound.yaml
