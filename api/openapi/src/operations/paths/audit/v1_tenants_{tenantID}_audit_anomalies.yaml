get:
  operationId: listAuditAnomalies
  summary: List audit anomalies
  description: >-
    Flagged deviations from a behavioral baseline built per (tenant, actor) over
    audit.events — a first-time action type, an unusual hour, or a new IP.
    Scored by a background sweep, not synchronously on write.
  tags:
    - Audit
  parameters:
    - $ref: ../../../shared/parameters/TenantID.yaml
    - name: status
      in: query
      required: false
      schema:
        type: string
        enum:
          - open
          - resolved
    - name: limit
      in: query
      required: false
      schema:
        type: integer
    - $ref: ../../../shared/parameters/Cursor.yaml
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  responses:
    '200':
      description: Anomalies
      content:
        application/json:
          schema:
            type: object
            properties:
              next_cursor:
                $ref: ../../../shared/schemas/NextCursor.yaml
              items:
                type: array
                items:
                  $ref: ../../components/schemas/AuditAnomaly.yaml
    '401':
      $ref: ../../../shared/responses/Unauthorized.yaml
    '403':
      $ref: ../../../shared/responses/Forbidden.yaml
