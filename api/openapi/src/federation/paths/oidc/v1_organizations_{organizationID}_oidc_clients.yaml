get:
  operationId: listOidcClients
  description: >-
    Lists the OIDC relying-party clients registered in the organization, confined to
    the organization in the path. Only client metadata is returned; secrets are never
    included. Manage an individual client with the get, update, delete and
    rotate-secret endpoints.
  summary: List OIDC clients
  tags:
    - OIDC
  parameters:
    - $ref: ../../../shared/parameters/OrganizationID.yaml
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  responses:
    "200":
      description: OIDC clients
      content:
        application/json:
          schema:
            type: object
            properties:
              truncated:
                $ref: ../../../shared/schemas/Truncated.yaml
              items:
                type: array
                items:
                  $ref: ../../components/schemas/OIDCClient.yaml
    "400":
      $ref: ../../../shared/responses/BadRequest.yaml
    "401":
      $ref: ../../../shared/responses/Unauthorized.yaml
    "403":
      $ref: ../../../shared/responses/Forbidden.yaml
    "404":
      $ref: ../../../shared/responses/NotFound.yaml
    "429":
      $ref: ../../../shared/responses/TooManyRequests.yaml
post:
  operationId: createOidcClient
  description: >-
    Registers an OIDC relying-party client under the organization in the path, the
    admin-UI counterpart to POST /v1/oidc/clients. A confidential client's
    secret is returned once at creation and is not recoverable afterward; roll
    it later with the rotate-secret endpoint. Creation is audited. A public
    client can't hold token exchange or CIBA (400 oidc.unsupported_flow).
  summary: Create OIDC client
  tags:
    - OIDC
  parameters:
    - $ref: ../../../shared/parameters/OrganizationID.yaml
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/OIDCClientCreate.yaml
  responses:
    "201":
      description: Client created (secret shown once)
      headers:
        Cache-Control:
          $ref: ../../../shared/headers/NoStoreCacheControl.yaml
        Pragma:
          $ref: ../../../shared/headers/NoStorePragma.yaml
      content:
        application/json:
          schema:
            type: object
            properties:
              client:
                $ref: ../../components/schemas/OIDCClient.yaml
              client_secret:
                type: string
              warning:
                type: string
    "400":
      $ref: ../../../shared/responses/BadRequest.yaml
    "401":
      $ref: ../../../shared/responses/Unauthorized.yaml
    "403":
      $ref: ../../../shared/responses/Forbidden.yaml
    "413":
      $ref: ../../../shared/responses/PayloadTooLarge.yaml
    "422":
      $ref: ../../../shared/responses/Unprocessable.yaml
    "429":
      $ref: ../../../shared/responses/TooManyRequests.yaml
