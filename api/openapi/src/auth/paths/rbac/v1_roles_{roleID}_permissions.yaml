get:
  operationId: listRolePermissions
  description: >-
    Lists the permissions currently granted to a role, resolving what any holder
    of that role can do. Use it to review a role before changing its grants. Add
    a permission with the grant-permission-to-role call and remove one with the
    revoke-permission-from-role call, or set them all at once with PUT
    /v1/organizations/{organizationID}/roles/{roleID}/permissions.
  summary: List permissions granted to a role
  tags:
    - RBAC
  parameters:
    - name: roleID
      in: path
      required: true
      schema:
        type: string
        format: uuid
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  responses:
    '200':
      description: Permissions granted to the role
      content:
        application/json:
          schema:
            type: object
            properties:
              truncated:
                $ref: ../../../shared/schemas/Truncated.yaml
              items:
                type: array
                items:
                  $ref: ../../components/schemas/Permission.yaml
    '400':
      $ref: ../../../shared/responses/BadRequest.yaml
    '401':
      $ref: ../../../shared/responses/Unauthorized.yaml
    '403':
      $ref: ../../../shared/responses/Forbidden.yaml
