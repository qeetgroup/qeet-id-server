  /v1/tenants/{tenantID}/oidc/clients/{id}:
    get:
      operationId: get_v1_tenants_ByTenantID_oidc_clients_ById
      description: 'Returns a single OIDC client''s configuration in the tenant, including redirect URIs, grant types, scopes and client type, scoped to the tenant in the path. The client secret is never returned. Update the record with PATCH or roll its credential with the rotate-secret endpoint.'
