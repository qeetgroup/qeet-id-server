post:
  operationId: completeSsoSessionMfa
  summary: Complete SSO session MFA
  description: >-
    Exchanges the mfa_token from POST /v1/auth/session, plus exactly one proof
    from the factors the challenge listed (a code, a passkey assertion, or an
    approved push — as for POST /v1/auth/mfa), for the SSO cookie (qe_ls). An
    enrolment challenge is completed by a code from the authenticator app set up
    for it, or skipped while its grace period runs, as for POST /v1/auth/mfa; a
    skipped setup never remembers the device. A body not sent as JSON is refused
    (415 unsupported_media_type). A wrong proof is recorded in the
    organisation's audit trail as auth.sign_in_failed (method mfa, reason
    code_invalid, with the proof kind and the attempts left). Fifty wrong proofs
    in a row, however far apart, lock the person's second-factor sign-in: that
    answer and every later one is 403 mfa.locked, even with the right proof, the
    lock is audited as auth.mfa_locked and the person is emailed. A right proof
    ends a shorter run; a password reset, a password change or set, or an
    administrator's reset of their factors lifts the lock.
  tags:
    - Auth
  security: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - mfa_token
          properties:
            mfa_token:
              type: string
            code:
              type: string
              description: >-
                An authenticator-app code, a one-time recovery code, or a code
                sent to an email or SMS factor (POST /v1/auth/mfa/send).
            passkey:
              type: object
              description: >-
                An assertion from the passkey ceremony begun for this challenge
                (POST /v1/auth/mfa/passkey/begin).
              properties:
                session_id:
                  type: string
                  format: uuid
                credential:
                  type: object
                  additionalProperties: true
            push:
              type: boolean
              description: >-
                true to complete with the push request sent for this challenge
                (POST /v1/auth/mfa/push). Answers 409 mfa.push_pending — not
                counted as a failed attempt — until it is approved on the
                device; a denied request counts as a wrong answer, an expired
                one answers mfa.push_challenge_expired.
            skip:
              type: boolean
              description: >-
                true to put off setting up a second factor, for an enrolment
                challenge that carries enrollment_due_at; a session is issued
                without one. Refused with 403 mfa.enrollment_required once the
                grace period has ended. Not counted as an attempt.
            remember:
              type: boolean
              description: >-
                Trust this device so future logins can skip the second factor
                (adaptive MFA). Honoured only when the tenant has enabled
                remember-device; sets the qe_td cookie.
  responses:
    '200':
      description: >-
        Second factor verified (or set up, or put off); SSO cookie set.
        recovery_codes are the account's new recovery codes when an
        authenticator app was just set up.
      headers:
        Cache-Control:
          $ref: ../../../shared/headers/NoStoreCacheControl.yaml
        Pragma:
          $ref: ../../../shared/headers/NoStorePragma.yaml
      content:
        application/json:
          schema:
            type: object
            properties:
              user_id:
                type: string
                format: uuid
              recovery_codes:
                type: array
                items:
                  type: string
    '400':
      $ref: ../../../shared/responses/BadRequest.yaml
    '401':
      $ref: ../../../shared/responses/Unauthorized.yaml
    '403':
      $ref: ../../../shared/responses/Forbidden.yaml
    '415':
      $ref: ../../components/responses/UnsupportedMediaType.yaml
    '422':
      $ref: ../../../shared/responses/Unprocessable.yaml
    '503':
      $ref: ../../../shared/responses/Overloaded.yaml
