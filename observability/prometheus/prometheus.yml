# Prometheus for the local observability stack (make obs-up). It scrapes the API that `make dev` /
# `make dev-observed` runs on the host; /metrics is open in development (METRICS_TOKEN unset).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml
  - /etc/prometheus/slos.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: qeet-id
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:4001"]
        labels:
          service: qeet-id
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
  # External probes of the public endpoints, as a customer's application reaches them.
  - job_name: blackbox
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://host.docker.internal:4001/healthz
          - http://host.docker.internal:4001/readyz
          - http://host.docker.internal:4001/.well-known/openid-configuration
          - http://host.docker.internal:4001/.well-known/jwks.json
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
