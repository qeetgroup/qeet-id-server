        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: A lockout setting is outside the documented bounds; nothing was stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
