name: ci

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Unit tests & architecture fitness
        run: go test -race -count=1 ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history so the diff-based lint can reach the base commit

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Installed from source so golangci-lint is compiled with this repo's Go
      # toolchain — a prebuilt binary built with an older Go refuses go.mod's
      # newer target ("go language version ... lower than the targeted version").
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2

      # Lint only the code this PR/push changes. This repo had no lint gate
      # before, so its existing tree carries pre-existing findings; grandfather
      # those and require new/changed code to be clean.
      - name: golangci-lint (new code only)
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          GOLANGCI="$(go env GOPATH)/bin/golangci-lint"
          if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BASE" 2>/dev/null; then
            echo "Linting changes since $BASE"
            "$GOLANGCI" run --new-from-rev="$BASE" ./...
          else
            echo "No base revision available ($BASE) — skipping diff-based lint."
          fi

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Integration tests
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: go test -tags integration -count=1 -timeout 10m ./tests/integration/...

  vuln:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      # Gate on what actually ships. The two findings this excludes are
      # x/crypto/ssh DoS issues (GO-2026-6354/6355) reachable only from
      # tests/fixtures/db.go via testcontainers; no production binary links
      # x/crypto/ssh. They are fixed in x/crypto v0.56.0, which requires
      # go1.26 — and the go1.26 line currently carries more open stdlib
      # advisories than go1.25.13 does, so taking it would be a net regression.
      # Revisit once go1.26 has matured.
      - name: govulncheck (shipped code)
        run: govulncheck ./cmd/... ./internal/...

      - name: govulncheck (full tree, advisory)
        continue-on-error: true
        run: govulncheck ./...

  sast:
    name: Security scan
    runs-on: ubuntu-latest
    # Advisory, not blocking. gosec currently reports 92 findings against this
    # tree; the four that are both HIGH severity and HIGH confidence were
    # checked by hand and are all scanner blind spots (the token-vault SSRF
    # hits go through the egress policy, the SAML one is xml.Unmarshal into a
    # typed struct, and cmd/migrate uses exec.Command with an arg slice, not a
    # shell). 42 of the 65 HIGH findings are G101 "hardcoded credentials" on
    # constant names. Promote this to blocking once those are triaged and the
    # genuine false positives carry #nosec justifications.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest

      # Generated sqlc code is excluded for the same reason golangci-lint
      # excludes it: it is not hand-authored. Findings surface as a warning
      # annotation rather than a red job, so the check list stays readable
      # while the report is still one click away in the log.
      - name: gosec
        run: |
          gosec -exclude-dir='.*dbgen' -exclude-generated ./... \
            || echo "::warning title=gosec::Findings reported - advisory only, see log. Not yet triaged."
