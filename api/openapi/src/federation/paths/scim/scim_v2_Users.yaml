get:
  operationId: listScimUsers
  description: >-
    Lists provisioned users for the organization identified by the SCIM bearer token,
    with optional SCIM filtering (for example userName eq) and pagination; a
    userName eq lookup finds any account at home in the organization, whoever created
    it, so an identity provider can match and link existing members, returning a
    SCIM 2.0 ListResponse, with Qeet acting as the SCIM server. Mounted at the
    root under /scim/v2, not under /v1. Errors use the RFC 7644 SCIM error
    envelope rather than the standard Qeet error shape.
  summary: "[scim] List users"
  tags:
    - SCIM
  parameters:
    - in: query
      name: filter
      schema:
        type: string
      description: SCIM filter, e.g. userName eq "a@b.com"
    - in: query
      name: startIndex
      schema:
        type: integer
        minimum: 1
    - in: query
      name: count
      schema:
        type: integer
        minimum: 0
  security:
    - scimBearer: []
  responses:
    "200":
      description: ListResponse
      content:
        application/scim+json:
          schema:
            $ref: ../../components/schemas/SCIMListResponse.yaml
    "400":
      $ref: ../../components/responses/SCIMBadRequest.yaml
    "401":
      $ref: ../../components/responses/SCIMUnauthorized.yaml
    "403":
      $ref: ../../components/responses/SCIMForbidden.yaml
    "429":
      $ref: ../../../shared/responses/TooManyRequests.yaml
post:
  operationId: createScimUser
  description: >-
    Provisions a new user in the organization identified by the SCIM bearer token,
    with Qeet acting as the SCIM 2.0 server for an external IdP. Mounted at the
    root under /scim/v2, not under /v1. Errors use the RFC 7644 SCIM error
    envelope, not the standard Qeet error shape. A userName belonging to an
    account already at home in the organization (invited, or signed in with single
    sign-on) adopts that account: it is tagged as provisioned with the
    externalId and updated, and answered 201. When nothing vouched for that
    account's address yet (its holder never proved it, and the directory didn't
    provision it), adoption also removes every credential and sign-in set up
    on it (recorded as auth.credentials_removed), so whoever registered the
    address first keeps no way in; the person signs in through the
    organization's identity provider, or resets the password. The response is
    unchanged. A userName taken elsewhere, or on
    a domain another organization has verified, is refused with 409.
  summary: "[scim] Create user"
  tags:
    - SCIM
  security:
    - scimBearer: []
  requestBody:
    required: true
    content:
      application/scim+json:
        example:
          schemas:
            - urn:ietf:params:scim:schemas:core:2.0:User
          userName: ada@example.com
          displayName: Ada Lovelace
          active: true
          name:
            givenName: Ada
            familyName: Lovelace
            formatted: Ada Lovelace
          emails:
            - value: ada@example.com
              primary: true
          externalId: okta-00u1a2b3c4
        schema:
          $ref: ../../components/schemas/SCIMUser.yaml
      application/json:
        schema:
          $ref: ../../components/schemas/SCIMUser.yaml
  responses:
    "201":
      description: User provisioned
      content:
        application/scim+json:
          example:
            schemas:
              - urn:ietf:params:scim:schemas:core:2.0:User
            id: 018f2a70-1a2b-7c3d-9e4f-5a6b7c8d9e0f
            userName: ada@example.com
            displayName: Ada Lovelace
            active: true
            name:
              givenName: Ada
              familyName: Lovelace
              formatted: Ada Lovelace
            emails:
              - value: ada@example.com
                primary: true
            externalId: okta-00u1a2b3c4
            meta:
              resourceType: User
              created: "2026-09-24T10:15:00Z"
              lastModified: "2026-09-24T10:15:00Z"
          schema:
            $ref: ../../components/schemas/SCIMUser.yaml
    "400":
      $ref: ../../components/responses/SCIMBadRequest.yaml
    "401":
      $ref: ../../components/responses/SCIMUnauthorized.yaml
    "403":
      $ref: ../../components/responses/SCIMForbidden.yaml
    "409":
      $ref: ../../components/responses/SCIMUserConflict.yaml
    "429":
      $ref: ../../../shared/responses/TooManyRequests.yaml
