get:
  operationId: listCriticalEvents
  summary: List critical events
  description: >-
    The short list an on-call administrator triages, from a phone or the
    console: the organization's open anomaly alerts and its critical audit
    events (suspensions, lockouts, the AI agent kill switch, second factors
    reset or turned off, roles given, sign-in risk settings changed) of the last
    hours, newest first, at most 100 (truncated when there are more), with how
    many of those are high. Read only; the
    full trail is the audit log. Needs audit.read.
  tags:
    - Audit
  parameters:
    - $ref: ../../../shared/parameters/OrganizationID.yaml
    - name: hours
      in: query
      required: false
      description: How far back, 1 to 168 hours (24 by default).
      schema:
        type: integer
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            required:
              - events
              - high
              - hours
            properties:
              truncated:
                $ref: ../../../shared/schemas/Truncated.yaml
              events:
                type: array
                items:
                  $ref: ../../components/schemas/CriticalEvent.yaml
              high:
                type: integer
              hours:
                type: integer
    '400':
      $ref: ../../../shared/responses/BadRequest.yaml
    '401':
      $ref: ../../../shared/responses/Unauthorized.yaml
    '403':
      $ref: ../../../shared/responses/Forbidden.yaml
