post:
  operationId: requestPasswordReset
  description: >-
    Sends a password-reset link to the supplied email when it belongs to an
    account. It always returns a neutral confirmation regardless of whether the
    address exists, so it cannot be used to enumerate accounts, and it is rate
    limited. The link is stored and emailed after the answer, so the answer is
    the same for any address, takes the same minimum time, and does not depend
    on whether the email could be delivered. Complete the flow with the
    reset-password call using the token from the emailed link. The link goes to
    the address as the account stores it, not as typed, and ends the account's
    earlier reset links. An address may ask three times, then once every five
    minutes (429 too_many_requests past that, whether or not it has an account).
    A completed reset, a password change or set, an email change and anything
    else that ends the person's sign-ins also ends their unused reset and magic
    links. A request for an account is recorded in its organization's audit
    trail as auth.password_reset_requested (at most ten per account, then one a
    minute). On a domain whose organization requires single sign-on, the request
    is refused with 403 auth.sso_required once counted against the per-address
    bound, before any account is looked up, and no link is sent (see the
    SSORequired response).
  summary: Forgot password
  tags:
    - Auth
  security: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - email
          properties:
            email:
              type: string
              format: email
            app:
              type: string
              enum:
                - hosted_login
                - console
              description: >-
                Where the reset was requested from. `hosted_login` makes the
                emailed link open the hosted login's own reset page. `console`,
                any other value, or omitting it opens the console's reset screen
                (the default).
            return_to:
              type: string
              format: uri
              description: >-
                Hosted login only: where to continue after the reset, carried in
                the emailed link. Kept only if it is this API's
                `/oauth/authorize` endpoint; anything else is ignored.
            organization_id:
              type: string
              format: uuid
              description: >-
                Accepted for compatibility with clients that send it, and not
                used: an email address is unique across the platform.
  responses:
    "200":
      description: >-
        Accepted (always, to avoid account enumeration); returns a neutral
        confirmation message
      headers:
        Cache-Control:
          $ref: ../../../shared/headers/NoStoreCacheControl.yaml
        Pragma:
          $ref: ../../../shared/headers/NoStorePragma.yaml
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
    "403":
      $ref: ../../components/responses/SSORequired.yaml
    "429":
      $ref: ../../../shared/responses/TooManyRequests.yaml
