post:
  operationId: receiveSesEvents
  summary: SES delivery events
  description: >-
    Receives Amazon SES delivery, bounce, complaint and reject events through
    Amazon SNS. Each message's SNS signature (SignatureVersion 2, SHA256withRSA;
    version 1 is refused) is verified against a signing certificate served by
    sns.<region>.amazonaws.com, a message older than an hour is refused, and
    only the topics in SES_EVENTS_TOPIC_ARN are accepted (anyone can create an
    SNS topic); with none configured the endpoint answers 404. A subscription
    confirmation is completed by visiting its SubscribeURL. A hard bounce or a
    complaint suppresses the address; a soft bounce is only recorded.
  tags:
    - Email Templates
  security: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: true
      text/plain:
        schema:
          type: string
  responses:
    "204":
      description: Accepted
    "400":
      $ref: ../../../shared/responses/BadRequest.yaml
    "401":
      $ref: ../../../shared/responses/Unauthorized.yaml
    "404":
      $ref: ../../../shared/responses/NotFound.yaml
    "413":
      $ref: ../../../shared/responses/PayloadTooLarge.yaml
    "429":
      $ref: ../../../shared/responses/TooManyRequests.yaml
