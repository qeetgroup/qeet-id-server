post:
  operationId: revokeAllUserSessions
  summary: Revoke all of a user's sessions
  description: >-
    Admin force sign-out — ends every way the user is signed in, in one
    all-or-nothing step: every live session, every hosted-login (browser)
    session and every refresh grant held by applications, and records it as an
    administrative force sign-out. The access tokens of the user's sessions stop
    working on this API at once; applications' access tokens, and any a service
    verifies offline, last until they expire (minutes). Requires
    `session.revoke`. The person must not outrank the caller: only an owner
    signs out an owner (403 rbac.target_is_owner), and the caller must hold
    every permission the person holds here (403 rbac.target_outranks_caller
    naming one); acting on yourself is allowed.
  tags:
    - Users
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  responses:
    '200':
      description: Sessions revoked
      content:
        application/json:
          schema:
            type: object
            required:
              - revoked
              - sessions
              - hosted_login_sessions
              - app_grants
              - trusted_devices
              - pending_authorizations
            properties:
              revoked:
                type: integer
                minimum: 0
                description: Number of sign-ins ended, all places together.
              sessions:
                type: integer
                minimum: 0
                description: Sessions ended.
              hosted_login_sessions:
                type: integer
                minimum: 0
                description: Hosted-login browser sessions ended.
              app_grants:
                type: integer
                minimum: 0
                description: Application refresh grants ended.
              trusted_devices:
                type: integer
                minimum: 0
                description: >-
                  Devices remembered to skip the second factor that were
                  forgotten; each is asked for the second factor at its next
                  sign-in.
              pending_authorizations:
                type: integer
                minimum: 0
                description: >-
                  Unredeemed authorisation codes spent, and device or
                  back-channel sign-in requests (pending, or approved but not
                  collected) denied.
    '401':
      $ref: ../../../shared/responses/Unauthorized.yaml
    '403':
      $ref: ../../../shared/responses/Forbidden.yaml
    '404':
      $ref: ../../../shared/responses/NotFound.yaml
