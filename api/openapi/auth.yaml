    delete:
      operationId: delete_v1_tenants_ByTenantID_relation_tuples_ById
      description: 'Removes a relationship tuple by its identifier, severing that edge in the ReBAC graph. Any access that depended solely on this tuple is revoked as soon as this returns, so re-verify affected grants with the relation-check call. This is the counterpart to the write-tuple call.'
      summary: Delete relation tuple
      tags:
        - ReBAC
      parameters:
        - name: tenantID
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/tenants/{tenantID}/relation-tuples/check:
    post:
      operationId: post_v1_tenants_ByTenantID_relation_tuples_check
      description: 'Evaluates whether a user holds a relation on an object, composing every model: an ABAC deny policy for the object''s type with the relation as action refuses and stops; otherwise a relationship tuple (following userset references transitively), a role granting type:relation or type.relation, or an ABAC allow policy permits. A role grant counts without a tuple. An engine error refuses. The response names the deciding model and rule in decided_by; pass explain=true to also receive the chain of tuples that granted access and the decision''s trace. This is a read-only decision; author the underlying tuples with the write-tuple call.'
      summary: Check relation
      tags:
        - ReBAC
      parameters:
        - name: tenantID
          in: path
          required: true
          schema:
            type: string
        - name: explain
          in: query
          required: false
          description: When "true", returns the root-to-leaf chain of relation tuples that granted (or would grant) access instead of just the boolean.
          schema:
            type: string
            enum: ['true', 'false']
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - object
                - relation
                - user_id
              properties:
                object:
                  type: string
                relation:
                  type: string
                user_id:
                  type: string
      responses:
        '200':
          description: '{ allowed, decided_by } by default; with explain=true also path, where each step is { object, relation, subject, depth }, and trace'
          content:
            application/json:
              schema:
                type: object
                properties:
                  allowed:
                    type: boolean
                  decided_by:
                    $ref: '#/components/schemas/AuthzDecidedBy'
                  trace:
                    type: array
                    items:
                      type: string
                  path:
                    type: array
                    items:
                      type: object
                      properties:
                        object:
                          type: string
                        relation:
                          type: string
                        subject:
                          type: string
                        depth:
                          type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /v1/tenants/{tenantID}/relation-tuples/graph:
    get:
      operationId: get_v1_tenants_ByTenantID_relation_tuples_graph
      summary: Expand identity graph
      description: |
        Builds a node+edge graph of all subject identities reachable from a
        given object+relation, up to `depth` hops. Answers the question:
        "who/what can reach this resource, and through which chain of
        relationships?"

        Each **node** is a `"type:id"` identity (user, group, agent, document,
        or any other modeled entity). Each **edge** is a named relation between
        two nodes, following userset references recursively. The result is
        suitable for graph visualization (e.g. a security-posture or privilege-path
        view) or as input to further investigation queries.

        This is the ReBAC analogue of a privilege-path graph: it is explicit about
        the boundaries of what Qeet ID's own relation-tuple store covers (only
        tuples modeled here, not external RBAC or cloud IAM), and never
        over-claims coverage.
      tags:
        - ReBAC
      parameters:
        - name: tenantID
          in: path
          required: true
          schema:
            type: string
        - name: object
          in: query
          required: true
          schema:
            type: string
          description: 'Root object ref "type:id", e.g. document:security-runbook'
        - name: relation
          in: query
          required: true
          schema:
            type: string
          description: 'Relation to expand from the root, e.g. viewer'
        - name: depth
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 10
            default: 10
          description: Maximum hops to follow (default and max 10)
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        '200':
          description: Graph of all nodes and directed edges reachable from the root
          content:
            application/json:
              schema:
                type: object
                properties:
                  nodes:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: '"type:id"'
                        type:
                          type: string
                        label:
                          type: string
                  edges:
                    type: array
                    items:
                      type: object
                      properties:
                        from:
                          type: string
                        to:
                          type: string
                        relation:
                          type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /v1/tenants/{tenantID}/access/v1/evaluation:
    post:
      operationId: post_v1_tenants_ByTenantID_access_v1_evaluation
      summary: AuthZEN evaluation
      description: OpenID AuthZEN core PDP evaluation request, answered by the same composed decision as the permission and relation checks (an ABAC deny refuses; then roles, relationships and ABAC allow policies are a union). When resource.type is "permission", action.name is the permission key; otherwise resource becomes "type:id" and action.name the relation. The response context always carries decided_by.
      tags:
        - AuthZEN
      parameters:
        - name: tenantID
          in: path
          required: true
          schema:
            type: string
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - subject
                - action
              properties:
                subject:
                  type: object
                  properties:
                    type:
                      type: string
                    id:
                      type: string
                resource:
                  type: object
                  properties:
                    type:
                      type: string
                    id:
                      type: string
                action:
                  type: object
                  properties:
                    name:
                      type: string
                context:
                  type: object
                  description: 'Optional. { explain: true } includes the grant path and the decision''s trace inline in the response context.'
      responses:
        '200':
          description: '{ decision: bool, context: { decided_by, paths | path, trace } }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  decision:
                    type: boolean
                  context:
                    type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
