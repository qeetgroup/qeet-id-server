get:
  operationId: readVaultSecret
  summary: Vault read by name
  description: >-
    Returns a secret's value to a caller holding a "vault:<name>" (or
    "vault:read") scope — e.g. an AI agent fetching a credential at runtime
    without embedding it. Tenant comes from the caller's token; every access is
    audited.
  tags:
    - Secrets
  parameters:
    - name: name
      in: path
      required: true
      schema:
        type: string
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  responses:
    '200':
      description: '{ name, value }'
      content:
        application/json:
          schema:
            type: object
            properties:
              name:
                type: string
              value:
                type: string
    '401':
      $ref: ../../../shared/responses/Unauthorized.yaml
    '403':
      $ref: ../../../shared/responses/Forbidden.yaml
    '404':
      $ref: ../../../shared/responses/NotFound.yaml
