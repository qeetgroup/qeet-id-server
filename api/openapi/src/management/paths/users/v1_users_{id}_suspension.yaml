put:
  operationId: reviewUserSuspension
  summary: Review a suspended owned user
  description: >-
    Requires user.suspend and ownership. Updates review facts and emits
    audit/outbox evidence without reactivating the account.
  tags:
    - Users
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - reason
            - risk
            - review
          properties:
            reason:
              type: string
              enum:
                - unspecified
                - provider
                - suspicious_activity
                - policy_violation
                - account_compromise
                - offboarding
                - inactive
                - other
            risk:
              type: string
              enum:
                - unknown
                - low
                - medium
                - high
            review:
              type: string
              enum:
                - pending
                - reviewed
  responses:
    "204":
      description: Review saved
    "400":
      description: Invalid review facts
    "401":
      description: Authentication required
    "403":
      description: Missing user.suspend
    "404":
      description: Account not owned by this organization
    "409":
      description: Account is no longer suspended
