get:
  operationId: listLdapConnections
  summary: List connections
  tags:
    - LDAP
  parameters:
    - $ref: ../../../shared/parameters/TenantID.yaml
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  description: >-
    Lists the organisation's LDAP connections, without their bind passwords.
    Requires connection.read.
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            required:
              - items
            properties:
              truncated:
                $ref: ../../../shared/schemas/Truncated.yaml
              items:
                type: array
                items:
                  $ref: ../../components/schemas/LdapConnection.yaml
    '401':
      $ref: ../../../shared/responses/Unauthorized.yaml
    '403':
      $ref: ../../../shared/responses/Forbidden.yaml
    '404':
      $ref: ../../../shared/responses/NotFound.yaml
    '422':
      $ref: ../../../shared/responses/Unprocessable.yaml
    '429':
      $ref: ../../../shared/responses/TooManyRequests.yaml
post:
  operationId: createLdapConnection
  summary: Create connection
  tags:
    - LDAP
  parameters:
    - $ref: ../../../shared/parameters/TenantID.yaml
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  requestBody:
    required: false
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/LdapCreateInput.yaml
  description: >-
    Creates a directory connection. A connection that turns off verification of
    the directory server's certificate (skip_tls_verify) is refused with 422
    ldap.tls_verify_required, and nothing is saved; only a development server
    (SERVICE_ENV=dev) allows it. Requires connection.write.
  responses:
    '201':
      description: Created
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/LdapConnection.yaml
    '401':
      $ref: ../../../shared/responses/Unauthorized.yaml
    '403':
      $ref: ../../../shared/responses/Forbidden.yaml
    '404':
      $ref: ../../../shared/responses/NotFound.yaml
    '422':
      $ref: ../../../shared/responses/Unprocessable.yaml
    '429':
      $ref: ../../../shared/responses/TooManyRequests.yaml
