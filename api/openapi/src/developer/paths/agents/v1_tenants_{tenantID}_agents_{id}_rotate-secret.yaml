post:
  operationId: rotateAgentSecret
  summary: Rotate agent secret
  description: >-
    Gives an agent that is not decommissioned a new secret, returned only now,
    and keeps the old secret minting tokens for overlap_hours (default 24, at
    most 168; 0 stops it at once). The new secret carries the agent's scopes,
    so the caller must hold every one of them, as for creating an agent (403
    rbac.grant_exceeds_caller, the secret unchanged). Requires apikey.write.
    Needs a recent step-up. Audited as agent.secret_rotated.
  tags:
    - Agents
  parameters:
    - $ref: ../../../shared/parameters/TenantID.yaml
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  requestBody:
    required: false
    content:
      application/json:
        schema:
          type: object
          properties:
            overlap_hours:
              type: integer
              minimum: 0
              maximum: 168
              description: >-
                How long the old secret goes on working beside the new one.
                Defaults to 24; 0 stops it at once.
  responses:
    '200':
      description: The new secret, shown once
      headers:
        Cache-Control:
          $ref: ../../../shared/headers/NoStoreCacheControl.yaml
        Pragma:
          $ref: ../../../shared/headers/NoStorePragma.yaml
      content:
        application/json:
          schema:
            type: object
            required:
              - id
              - secret
              - previous_secret_expires_at
            properties:
              id:
                type: string
                format: uuid
              secret:
                type: string
              previous_secret_expires_at:
                type: string
                format: date-time
                description: When the old secret stops working.
    '401':
      $ref: ../../../shared/responses/Unauthorized.yaml
    '403':
      $ref: ../../../shared/responses/Forbidden.yaml
    '404':
      $ref: ../../../shared/responses/NotFound.yaml
    '422':
      $ref: ../../../shared/responses/Unprocessable.yaml
