type: object
additionalProperties: false
required:
  - name
  - issuer
  - client_id
  - client_secret
properties:
  name:
    type: string
    minLength: 1
  issuer:
    type: string
    format: uri
  discovery_url:
    type:
      - string
      - "null"
  client_id:
    type: string
    minLength: 1
  client_secret:
    type: string
    minLength: 1
    writeOnly: true
  scopes:
    type:
      - array
      - "null"
    maxItems: 20
    items:
      type: string
  allowed_idp_tenant_ids:
    type:
      - array
      - "null"
    maxItems: 50
    items:
      type: string
      format: uuid
  claim_mapping:
    $ref: ./OIDCClaimMapping.yaml
  status:
    type:
      - string
      - "null"
    enum:
      - draft
      - active
      - disabled
      - null
    default: draft
