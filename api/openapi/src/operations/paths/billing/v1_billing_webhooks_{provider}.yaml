post:
  operationId: receivePaymentWebhook
  summary: Payment webhook
  description: >-
    Receives provider payment events. Authenticated by the provider's webhook
    signature (no user session); on a verified successful payment the referenced
    checkout is completed idempotently. A Stripe event is accepted when any v1
    signature in its Stripe-Signature header is right (Stripe sends one per
    secret while a webhook secret rotates) and its timestamp is within five
    minutes of now.
  tags:
    - Billing
  security: []
  parameters:
    - name: provider
      in: path
      required: true
      schema:
        type: string
        enum:
          - stripe
          - razorpay
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: true
  responses:
    "200":
      description: Event acknowledged
    "400":
      $ref: ../../../shared/responses/BadRequest.yaml
    "401":
      $ref: ../../../shared/responses/Unauthorized.yaml
    "404":
      $ref: ../../../shared/responses/NotFound.yaml
    "413":
      $ref: ../../../shared/responses/PayloadTooLarge.yaml
    "429":
      $ref: ../../../shared/responses/TooManyRequests.yaml
