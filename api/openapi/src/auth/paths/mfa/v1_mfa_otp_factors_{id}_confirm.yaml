post:
  operationId: confirmOtpFactor
  summary: Confirm OTP factor
  tags:
    - MFA
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  security:
    - bearerAuth: []
  requestBody:
    required: false
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/verifyInput.yaml
  description: >-
    Completes adding an SMS or email factor with the code sent to it. The
    account holder is emailed that it happened, with what to do if it wasn't
    them.
  responses:
    '201':
      description: Created
      content:
        application/json:
          schema:
            type: object
            required:
              - verified
            properties:
              verified:
                type: boolean
    '401':
      $ref: ../../../shared/responses/Unauthorized.yaml
    '403':
      $ref: ../../../shared/responses/Forbidden.yaml
    '404':
      $ref: ../../../shared/responses/NotFound.yaml
    '422':
      $ref: ../../../shared/responses/Unprocessable.yaml
    '429':
      $ref: ../../../shared/responses/TooManyRequests.yaml
