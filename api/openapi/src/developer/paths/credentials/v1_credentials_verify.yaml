post:
  operationId: verifyCredential
  summary: Verify credential (public)
  description: >-
    Any relying party can present a JWT-serialized W3C Verifiable Credential
    issued by this server; the response reports validity (signature, issuer,
    expiry, and revocation status) plus the credential subject + claims. No
    session required. A token that is not a verifiable credential, such as an
    access or ID token this server signed, answers valid false with reason "not
    a verifiable credential"; a failed signature, issuer or expiry check answers
    reason "signature or expiry invalid", a credential with no record in this
    server's registry "unknown credential", and a revoked credential "credential
    revoked".
  tags:
    - Credentials
  security: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: false
          required:
            - credential
          properties:
            credential:
              type: string
              minLength: 1
              description: The JWT-VC string.
  responses:
    "200":
      description: "{ valid, subject, issuer, vc, ... }"
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/VerifyResult.yaml
    "400":
      $ref: ../../../shared/responses/BadRequest.yaml
    "413":
      $ref: ../../../shared/responses/PayloadTooLarge.yaml
    "422":
      $ref: ../../../shared/responses/Unprocessable.yaml
    "429":
      $ref: ../../../shared/responses/TooManyRequests.yaml
