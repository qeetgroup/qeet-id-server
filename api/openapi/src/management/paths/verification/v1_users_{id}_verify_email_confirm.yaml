post:
  operationId: confirmEmailVerification
  description: >-
    Confirms email verification by validating the code delivered by the
    start-email-verification call and marking the address verified. Codes are
    single-use, expire after a short window, and are retired after a small
    number of wrong attempts, at which point a new code must be requested; ten
    wrong codes in an hour, over every code asked for in between, refuse even
    the right one until the hour has passed (429
    verification.attempts_exceeded with retry_after, in seconds).
    Request the code with the start-email-verification call before invoking
    this. Only a code sent by the start-email-verification call to the address
    now on the account counts; a code sent for an email change is the
    invalid-code error.
  summary: Confirm email verification
  tags:
    - Verification
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  security:
    - bearerAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - code
          properties:
            code:
              type: string
  responses:
    "200":
      description: Email verified; returns a confirmation message
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
    "400":
      $ref: ../../../shared/responses/BadRequest.yaml
    "401":
      $ref: ../../../shared/responses/Unauthorized.yaml
    "403":
      $ref: ../../../shared/responses/Forbidden.yaml
    "404":
      $ref: ../../../shared/responses/NotFound.yaml
    "422":
      $ref: ../../../shared/responses/Unprocessable.yaml
    "429":
      $ref: ../../../shared/responses/TooManyRequests.yaml
