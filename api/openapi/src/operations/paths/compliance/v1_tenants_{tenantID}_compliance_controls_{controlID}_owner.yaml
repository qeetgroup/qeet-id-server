put:
  operationId: setControlOwner
  summary: Set a control's owner
  description: >-
    Makes one of the organisation's people (its own, or holding a role there)
    answer for a control of either framework's catalog; another organisation's
    person is refused with 422, an unknown control with 404. Audited as
    compliance.control_owner_set. Requires audit.write.
  tags:
    - Compliance
  parameters:
    - $ref: ../../../shared/parameters/TenantID.yaml
    - name: controlID
      in: path
      required: true
      schema:
        type: string
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - user_id
          properties:
            user_id:
              type: string
              format: uuid
  responses:
    '204':
      description: Owner set
    '401':
      $ref: ../../../shared/responses/Unauthorized.yaml
    '403':
      $ref: ../../../shared/responses/Forbidden.yaml
    '404':
      $ref: ../../../shared/responses/NotFound.yaml
    '422':
      $ref: ../../../shared/responses/Unprocessable.yaml
delete:
  operationId: removeControlOwner
  summary: Remove a control's owner
  description: >-
    Leaves the control without an owner; 404 when it has none. Audited as
    compliance.control_owner_removed. Requires audit.write.
  tags:
    - Compliance
  parameters:
    - $ref: ../../../shared/parameters/TenantID.yaml
    - name: controlID
      in: path
      required: true
      schema:
        type: string
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  responses:
    '204':
      description: Owner removed
    '401':
      $ref: ../../../shared/responses/Unauthorized.yaml
    '403':
      $ref: ../../../shared/responses/Forbidden.yaml
    '404':
      $ref: ../../../shared/responses/NotFound.yaml
