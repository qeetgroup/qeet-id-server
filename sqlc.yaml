# sqlc for every package's dbgen/: one entry per package, each generating
# <package>/dbgen from <package>/queries.sql against the migrations. Options and
# type overrides are anchored on the first entry and shared by every other one;
# a NULL-able uuid, timestamptz or date is a *uuid.UUID or *time.Time (nil is
# NULL).
# Regenerate with `make sqlc`; `make sqlc-check` fails on drift or on a
# queries.sql missing here.
version: "2"
sql:
  - &package
    engine: postgresql
    schema: internal/platform/database/migrations
    queries: internal/access/authentication/queries.sql
    gen:
      go: &go
        package: dbgen
        out: internal/access/authentication/dbgen
        sql_package: pgx/v5
        emit_json_tags: false
        emit_interface: false
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        omit_unused_structs: true
        overrides:
          - &uuid { db_type: uuid, go_type: github.com/google/uuid.UUID }
          - &uuid_null {
              db_type: uuid,
              nullable: true,
              go_type: { import: github.com/google/uuid, type: UUID, pointer: true },
            }
          - &time { db_type: timestamptz, go_type: time.Time }
          - &time_null {
              db_type: timestamptz,
              nullable: true,
              go_type: { import: time, type: Time, pointer: true },
            }
          - &date { db_type: date, go_type: time.Time }
          - &date_null {
              db_type: date,
              nullable: true,
              go_type: { import: time, type: Time, pointer: true },
            }
  - <<: *package
    queries: internal/access/accountnotice/queries.sql
    gen: { go: { <<: *go, out: internal/access/accountnotice/dbgen } }
