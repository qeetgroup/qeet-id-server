      tags:
        - Token Vault
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            pattern: ^[^/\\]+$
      security:
        - bearerAuth: []
      responses:
        "204":
          description: No Content
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "User or service JWT: `Authorization: Bearer <token>`."
    apiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: "API key credential. Send `Authorization: ApiKey <key>` (note the `ApiKey ` prefix). Accepted on the same authenticated routes as bearerAuth. A key works only while its organization is active, not while it is suspended or deleted."
    scimBearer:
      type: http
      scheme: bearer
      description: "An organization's SCIM provisioning token, presented by its identity provider: `Authorization: Bearer <scim-token>`. Distinct from user JWTs. An organization can hold several, managed under /v1/organizations/{organizationID}/scim/tokens. A revoked or expired token, and every token of an organization that is suspended or due for deletion, is refused with 401."
    clientCredentials:
      type: oauth2
      description: OAuth 2.0 client credentials. Clients authenticate at the token endpoint via form params (`client_id`/`client_secret`) or HTTP Basic. Revocation/introspection use the same client auth.
      flows:
        clientCredentials:
          tokenUrl: /v1/oauth/token
          scopes: {}
    ssoCookie:
      type: apiKey
      in: cookie
      name: qe_ls
      description: Hosted-login SSO session cookie (HttpOnly). Set by POST /v1/auth/session and consumed by the OAuth authorize/consent flow, and by the few signed-in routes the hosted login calls itself (listing, renaming and adding passkeys). State-changing calls made with it need the CSRF token.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: A key of the client's choosing, 1 to 255 printable characters, that makes retrying the request safe. Kept for 24 hours.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    OrganizationID:
      name: organizationID
      in: path
      required: true
      description: "The organization's ID. On an authenticated route it must be the organization of the caller's credential: another is refused with 403, and a value that is not a UUID with 400."
      schema:
        type: string
        format: uuid
  schemas:
    ApiKeyCreate:
      type: object
      additionalProperties: false
      required:
        - organization_id
        - name
      properties:
        organization_id:
          type: string
          format: uuid
        user_id:
          type:
            - string
            - "null"
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 200
        scopes:
          type:
            - array
            - "null"
          items:
            type: string
        expires_at:
          type:
            - string
            - "null"
          format: date-time
    ApiKey:
      type: object
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        user_id:
          type:
            - string
            - "null"
          format: uuid
        name:
          type: string
        prefix:
          type: string
        scopes:
          type: array
          items:
            type: string
        expires_at:
          type:
            - string
            - "null"
          format: date-time
        last_used_at:
          type:
            - string
            - "null"
          format: date-time
        revoked_at:
          type:
            - string
            - "null"
          format: date-time
        created_at:
          type: string
          format: date-time
        created_by:
          type:
            - string
            - "null"
          format: uuid
          description: The person who created the key, or rotated it into being; null for a key made by a machine or before this was kept.
        rotated_from:
          type:
            - string
            - "null"
          format: uuid
          description: The key this one replaced at a rotation.
    Error:
      type: object
      required:
        - error
      description: Canonical error envelope (internal/platform/httpx.WriteError).
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              description: Stable machine code
              example: unauthorized
            message:
              type: string
              example: authentication required
            detail:
              type: string
              description: Optional human detail
            translation_key:
              type: string
              description: Optional i18n key the client can use to localize the message.
            retryable:
              type: boolean
              description: "Whether the person can try again, often by starting over (signing in again, asking for a new code, waiting). It is not a promise that resending the same request will succeed: auth.session_revoked is retryable and the session never comes back. Decide whether to resend a request from its status (429, 503 with Retry-After)."
            fields:
              type: array
              description: Per-field validation errors (typically on 422 responses).
              items:
                type: object
                properties:
                  field:
                    type: string
                  code:
                    type: string
                  message:
                    type: string
            metadata:
              type: object
              additionalProperties: true
              description: Optional structured, error-specific context.
            request_id:
              type: string
              description: Correlates with the X-Request-Id header
    Truncated:
      type: boolean
      description: "Present, and true, when the list was cut at its limit (1,000 items unless the operation says otherwise): there are more than were answered."
    Agent:
      type: object
      required:
        - created_at
        - disabled
        - id
        - name
        - scopes
        - status
        - token_ttl_seconds
      properties:
        created_at:
          type: string
          format: date-time
        disabled:
          type: boolean
        id:
          type: string
          format: uuid
        name:
          type: string
        scopes:
          type: array
          items:
            type: string
        secret:
          type: string
        sponsor_user_id:
          type: string
          format: uuid
        status:
          type: string
        token_ttl_seconds:
          type: integer
        last_used_at:
          type:
            - string
            - "null"
          format: date-time
          description: When the agent was last issued a token, to the minute.
        previous_secret_expires_at:
          type: string
          format: date-time
          description: Present while the secret replaced at its last rotation still works, until then.
    AgentStatus:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - active
            - suspended
            - decommissioned
    VerifyResult:
      type: object
      required:
        - valid
      properties:
        issuer:
          type: string
        reason:
          type: string
          description: Why an invalid credential is refused, in English. Show reason_code's meaning instead.
        reason_code:
          type: string
          enum:
            - vc.not_credential
            - vc.signature_invalid
            - vc.unknown
            - vc.revoked
          description: "Why an invalid credential is refused: not a JWT-VC, a bad signature or expired, not one this server issued, or revoked."
        subject:
          type: string
        valid:
          type: boolean
        vc:
          type: object
          additionalProperties: true
    VcCredential:
      type: object
      required:
        - id
        - issued_at
        - revoked
        - subject
        - type
        - user
      properties:
        expires_at:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        issued_at:
          type: string
          format: date-time
        revoked:
          type: boolean
        subject:
          type: string
        type:
          type: string
        user:
          description: The person the credential was issued to; null when the issuer named no one, or the account was deleted.
          oneOf:
            - type: "null"
            - type: object
              required:
                - display_name
                - email
                - id
              properties:
                id:
                  type: string
                  format: uuid
                email:
                  type: string
                display_name:
                  type: string
    IssueResult:
      type: object
      required:
        - credential_id
        - jwt
      properties:
        credential_id:
          type: string
          format: uuid
        expires_at:
          type: string
          format: date-time
        jwt:
          type: string
    Hook:
      type: object
      required:
        - created_at
        - enabled
        - fail_open
        - id
        - trigger
        - url
      properties:
        created_at:
          type: string
          format: date-time
        enabled:
          type: boolean
        fail_open:
          type: boolean
        id:
          type: string
          format: uuid
        trigger:
          type: string
        url:
          type: string
        last_called_at:
          type:
            - string
            - "null"
          format: date-time
          description: Its last call by a sign-in.
        last_outcome:
          type:
            - string
            - "null"
          enum:
            - allowed
            - denied
            - skipped
            - null
          description: How that call ended; skipped when the hook gave no answer.
        last_status_code:
          type:
            - integer
            - "null"
        calls:
          type: integer
          description: Sign-in calls since this release; test calls aren't counted.
        skips:
          type: integer
        denies:
          type: integer
        previous_secret_expires_at:
          type:
            - string
            - "null"
          format: date-time
          description: Until when the secret the last change of secret replaced also signs the hook's calls.
    WebhookSubscription:
      type: object
      required:
        - created_at
        - disabled_at
        - events
        - id
        - organization_id
        - url
      properties:
        created_at:
          type: string
          format: date-time
        disabled_at:
          type:
            - string
            - "null"
          format: date-time
        disabled_reason:
          type:
            - string
            - "null"
          enum:
            - disabled
            - failing
            - null
          description: Who disabled it, an administrator (disabled) or its failures (failing).
        events:
          type: array
          items:
            type: string
        failing_since:
          type:
            - string
            - "null"
          format: date-time
          description: When deliveries started failing, with no success since.
        id:
          type: string
          format: uuid
        previous_secret_expires_at:
          type:
            - string
            - "null"
          format: date-time
          description: Until when the secret replaced by the last rotation also signs deliveries.
        secret:
          type: string
        organization_id:
          type: string
          format: uuid
        url:
          type: string
        disabled_by:
          type: string
          format: uuid
          description: The administrator who disabled it.
        last_delivered_at:
          type:
            - string
            - "null"
          format: date-time
          description: Its latest delivery.
        last_status_code:
          type:
            - integer
            - "null"
          description: The status its endpoint answered last.
        counts:
          type: object
          description: Its deliveries not yet tried (held while it is disabled), retrying, and given up.
          properties:
            pending:
              type: integer
            retrying:
              type: integer
            gave_up:
              type: integer
    WebhookEventType:
      type: object
      required:
        - description
        - name
      properties:
        description:
          type: string
        name:
          type: string
    WebhookAttempt:
      type: object
      properties:
        attempted_at:
          type: string
          format: date-time
        status_code:
          type:
            - integer
            - "null"
          description: Null when the endpoint gave no answer.
        duration_ms:
          type: integer
        error:
          type:
            - string
            - "null"
    WebhookCreateInput:
      type: object
      additionalProperties: false
      required:
        - events
        - url
      properties:
        events:
          type: array
          minItems: 1
          description: Event names from the event catalogue.
          items:
            type: string
        organization_id:
          type:
            - string
            - "null"
          format: uuid
          description: Ignored; the organization is the caller's.
        url:
          type: string
          minLength: 1
    WebhookDelivery:
      type: object
      required:
        - attempt
        - created_at
        - event_type
        - id
        - payload
      properties:
        attempt:
          type: integer
        created_at:
          type: string
          format: date-time
        dead_at:
          type: string
          format: date-time
        delivered_at:
          type: string
          format: date-time
        error:
          type: string
        event_type:
          type: string
        id:
          type: string
          format: uuid
        next_attempt_at:
          type: string
          format: date-time
        payload:
          type: string
        response_body:
          type: string
        status_code:
          type: integer
    Secret:
      type: object
      required:
        - created_at
        - id
        - last4
        - last_revealed_at
        - last_revealed_by
        - name
        - rotation_due_at
        - rotation_interval_days
        - rotation_overdue
        - scope
        - updated_at
        - value_changed_at
      properties:
        created_at:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        last4:
          type: string
        name:
          type: string
        scope:
          type: string
        updated_at:
          type: string
          format: date-time
        value_changed_at:
          type: string
          format: date-time
          description: When the value was last set; a scope or interval change leaves it.
        last_revealed_at:
          type:
            - string
            - "null"
          format: date-time
        last_revealed_by:
          description: The person who last revealed the secret; null when no one has or a machine credential did. Email is empty once the person no longer exists.
          oneOf:
            - type: "null"
            - type: object
              required:
                - display_name
                - email
                - id
              properties:
                id:
                  type: string
                  format: uuid
                email:
                  type: string
                display_name:
                  type: string
        last_revealed_credential:
          type: string
          description: The id of the machine credential, such as an API key, that last revealed the secret; left out when a person did.
        rotation_interval_days:
          type:
            - integer
            - "null"
        rotation_due_at:
          type:
            - string
            - "null"
          format: date-time
          description: The rotation interval after the value last changed; null without an interval.
        rotation_overdue:
          type: boolean
    SecretUpdateInput:
      type: object
      additionalProperties: false
      properties:
        scope:
          type:
            - string
            - "null"
        value:
          type:
            - string
            - "null"
        rotation_interval_days:
          type:
            - integer
            - "null"
          minimum: 1
          maximum: 3650
          description: Left out keeps the interval; null removes it.
    TokenvaultProvider:
      type: object
      required:
        - authorize_url
        - client_id
        - created_at
        - id
        - provider
        - scopes
        - token_url
        - updated_at
      properties:
        authorize_url:
          type: string
        client_id:
          type: string
        created_at:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        provider:
          type: string
        scopes:
          type: string
        token_url:
          type: string
        updated_at:
          type: string
          format: date-time
    GrantMeta:
      type: object
      required:
        - created_at
        - provider
        - updated_at
      properties:
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        external_account_id:
          type: string
        provider:
          type: string
        scope:
          type: string
        updated_at:
          type: string
          format: date-time
  headers:
    NoStoreCacheControl:
      description: "no-store: the response carries a token, a secret or a sign-in session, so no cache may keep it."
      schema:
        type: string
        enum:
          - no-store
    NoStorePragma:
      description: no-cache, the same instruction for HTTP/1.0 caches.
      schema:
        type: string
        enum:
          - no-cache
    IdempotentReplayed:
      description: true when this is the stored answer to an earlier request with the same Idempotency-Key and body, sent again rather than run twice. Absent otherwise.
      schema:
        type: string
        enum:
          - "true"
    RequestId:
      description: The request's ID, sent on every response. Quote it when reporting a problem; an error body repeats it as error.request_id.
      schema:
        type: string
  responses:
    BadRequest:
      description: Malformed request
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          example:
            error:
              code: bad_request
              message: The request was invalid.
              translation_key: bad_request
              request_id: api-1/Kx9fQ2mW7a-000131
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing or invalid credentials
      headers:
        WWW-Authenticate:
          description: Sent when a route that needs a bearer token got none (`Bearer realm="qeet"`), or one that is invalid or expired (`Bearer realm="qeet", error="invalid_token"`).
          schema:
            type: string
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          example:
            error:
              code: unauthorized
              message: Please sign in to continue.
              translation_key: unauthorized
              request_id: api-1/Kx9fQ2mW7a-000131
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: "Authenticated but not permitted. auth.application_token: the access token was issued to an application (it carries client_id) and this route accepts only the user's own tokens; applications may call GET /v1/oauth/userinfo. auth.insufficient_scope: an application's token reached a route open to applications without the scope the route needs (named in the WWW-Authenticate challenge)."
      headers:
        WWW-Authenticate:
          description: 'With auth.insufficient_scope: `Bearer realm="qeet", error="insufficient_scope", scope="<the scope the route needs>"`.'
          schema:
            type: string
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          example:
            error:
              code: forbidden
              message: You don't have permission to do that.
              translation_key: forbidden
              request_id: api-1/Kx9fQ2mW7a-000131
          schema:
            $ref: "#/components/schemas/Error"
    PayloadTooLarge:
      description: The body is larger than this API accepts (`request_body_too_large`).
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unprocessable:
      description: Validation failed
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          example:
            error:
              code: validation_failed
              message: One or more fields are invalid.
              translation_key: validation_failed
              fields:
                - field: email
                  code: invalid_email
                  message: Must be a valid email address.
              request_id: api-1/Kx9fQ2mW7a-000131
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: Rate limit exceeded
      headers:
        Retry-After:
          description: Seconds to wait before trying again, sent when a rate limit refused the request; error.metadata.retry_after gives the same number.
          schema:
            type: integer
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          example:
            error:
              code: too_many_requests
              message: Too many attempts. Please wait and try again.
              translation_key: too_many_requests
              retryable: true
              metadata:
                retry_after: 30
              request_id: api-1/Kx9fQ2mW7a-000131
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          example:
            error:
              code: not_found
              message: We couldn't find what you're looking for.
              translation_key: not_found
              request_id: api-1/Kx9fQ2mW7a-000131
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Conflicts with the resource's current state, such as a duplicate or an invalid lifecycle transition
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          example:
            error:
              code: conflict
              message: That conflicts with something that already exists.
              translation_key: conflict
              request_id: api-1/Kx9fQ2mW7a-000131
          schema:
            $ref: "#/components/schemas/Error"
