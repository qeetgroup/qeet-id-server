post:
  operationId: testPortalSamlConnection
  summary: Test connection (portal)
  description: Same offline preflight as the admin endpoint — no network I/O.
  tags:
    - Admin Portal
  security:
    - adminPortalCookie: []
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    '200':
      description: Per-check preflight results
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/TestResult.yaml
    '401':
      $ref: ../../../shared/responses/Unauthorized.yaml
    '403':
      $ref: ../../../shared/responses/Forbidden.yaml
    '404':
      $ref: ../../../shared/responses/NotFound.yaml
