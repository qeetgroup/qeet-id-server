          schema:
            type: integer
            minimum: 1
            maximum: 90
            default: 7
        - name: connection_id
          in: query
          schema:
            type: string
            maxLength: 128
        - name: status
          in: query
          schema:
            type: string
            enum:
              - success
              - warning
              - failed
        - name: q
          in: query
          schema:
            type: string
            maxLength: 200
        - name: limit
          description: Page size, 1 to 100 (default 25). A larger value is lowered to 100; a smaller or malformed one gets the default.
          in: query
          schema:
            type: integer
            default: 25
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Operation page, filtered summary, and daily UTC volumes
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
