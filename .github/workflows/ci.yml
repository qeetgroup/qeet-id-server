name: ci

on:
  push:
    branches: [develop, "release/**"]
  pull_request:
    branches: [main, develop, "release/**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Unit tests & architecture fitness
        run: go test -race -count=1 ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history so the diff-based lint can reach the base commit

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Installed from source so golangci-lint is compiled with this repo's Go
      # toolchain — a prebuilt binary built with an older Go refuses go.mod's
      # newer target ("go language version ... lower than the targeted version").
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0

      # Lint only the code this PR/push changes. This repo had no lint gate
      # before, so its existing tree carries pre-existing findings; grandfather
      # those and require new/changed code to be clean.
      - name: golangci-lint (new code only)
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          GOLANGCI="$(go env GOPATH)/bin/golangci-lint"
          if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BASE" 2>/dev/null; then
            echo "Linting changes since $BASE"
            "$GOLANGCI" run --new-from-rev="$BASE" ./...
          else
            echo "No base revision available ($BASE) — skipping diff-based lint."
          fi

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Integration tests
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: go test -tags integration -count=1 -timeout 10m ./tests/integration/...

  vuln:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Pinned, not @latest; it needs go1.26 or newer. setup-go runs go.mod's
      # toolchain (the same Go the Dockerfile ships), so the scan covers the
      # standard library that is actually built in. Bump with go.mod.
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0

      # Gate on what actually ships (cmd/ and internal/). The full tree also
      # covers test fixtures and is reported as advice only.
      - name: govulncheck (shipped code)
        run: govulncheck ./cmd/... ./internal/...

      - name: govulncheck (full tree, advisory)
        continue-on-error: true
        run: govulncheck ./...

  sast:
    name: Security scan
    runs-on: ubuntu-latest
    # Advisory, not blocking. gosec currently reports 92 findings against this
    # tree; the four that are both HIGH severity and HIGH confidence were
    # checked by hand and are all scanner blind spots (the token-vault SSRF
    # hits go through the egress policy, the SAML one is xml.Unmarshal into a
    # typed struct, and cmd/migrate uses exec.Command with an arg slice, not a
    # shell). 42 of the 65 HIGH findings are G101 "hardcoded credentials" on
    # constant names. Promote this to blocking once those are triaged and the
    # genuine false positives carry #nosec justifications.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest

      # Generated sqlc code is excluded for the same reason golangci-lint
      # excludes it: it is not hand-authored. Findings surface as a warning
      # annotation rather than a red job, so the check list stays readable
      # while the report is still one click away in the log.
      - name: gosec
        run: |
          gosec -exclude-dir='.*dbgen' -exclude-generated ./... \
            || echo "::warning title=gosec::Findings reported - advisory only, see log. Not yet triaged."

  # Release branches only: publish one immutable, commit-addressed image
  # (ghcr.io/qeetgroup/qeet-id-server:sha-<commit>) after every gate above has
  # passed. No rc.N is computed here — qeet-id-deploy assembles the product
  # release candidate from these images (qeet-id-deploy:
  # docs/test-kit/application-contract.md). Production keeps deploying from
  # deploy.yml (ECR, main); this job does not touch it.
  image:
    name: Release image
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')
    needs: [test, lint, integration, vuln]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Release metadata
        id: meta
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          release="${REF_NAME#release/}"
          if ! [[ "$release" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release branches must be named release/x.y.z (got $REF_NAME)"
            exit 1
          fi
          schema=$(find internal/platform/database/migrations -name '*.up.sql' \
            | sed -E 's#.*/0*([0-9]+)_[^/]*$#\1#' | sort -n | tail -1)
          {
            echo "release=$release"
            echo "schema=$schema"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "image=ghcr.io/$GITHUB_REPOSITORY"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Build and push linux/amd64 + linux/arm64
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          RELEASE: ${{ steps.meta.outputs.release }}
          SCHEMA: ${{ steps.meta.outputs.schema }}
          CREATED: ${{ steps.meta.outputs.created }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          ref="$IMAGE:sha-$GITHUB_SHA"
          # sha-<commit> tags are immutable: a re-run must not move them.
          if out=$(docker buildx imagetools inspect "$ref" 2>&1); then
            echo "::notice::$ref already published; leaving it untouched."
            exit 0
          elif ! grep -qiE 'not found|manifest unknown' <<<"$out"; then
            echo "::error::cannot check $ref: $out"
            exit 1
          fi
          labels=(
            "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY"
            "org.opencontainers.image.revision=$GITHUB_SHA"
            "org.opencontainers.image.version=$RELEASE"
            "org.opencontainers.image.created=$CREATED"
            "in.qeet.release=$RELEASE"
            "in.qeet.source-branch=$REF_NAME"
            "in.qeet.id.schema-version=$SCHEMA"
          )
          args=()
          for l in "${labels[@]}"; do args+=(--label "$l" --annotation "index:$l"); done
          docker buildx build . \
            --platform linux/amd64,linux/arm64 \
            --build-arg VERSION="$RELEASE" \
            --build-arg COMMIT="$GITHUB_SHA" \
            --build-arg DATE="$CREATED" \
            "${args[@]}" \
            --tag "$ref" \
            --metadata-file "$RUNNER_TEMP/build.json" \
            --push
          digest=$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/build.json")
          {
            echo "### Release image"
            echo "| | |"
            echo "|---|---|"
            echo "| Image | \`$ref\` |"
            echo "| Digest | \`$digest\` |"
            echo "| Release | \`$RELEASE\` (schema $SCHEMA) |"
            echo
            echo "Assemble a product RC in qeet-id-deploy → Actions → **publish-candidate** with server = \`$GITHUB_SHA\`."
          } >> "$GITHUB_STEP_SUMMARY"
