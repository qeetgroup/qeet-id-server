    get:
      operationId: get_v1_tenants_ByTenantID_groups_ByGroupID_roles
      description: 'Lists the roles granted to a group within the tenant; every member of the group inherits these roles'' permissions. Use it to review a group''s authorization before changing it. Grant a role with the grant-role-to-group call and remove one with the revoke-role-from-group call.'
