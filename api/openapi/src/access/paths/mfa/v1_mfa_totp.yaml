get:
  operationId: getTotpStatus
  summary: TOTP status
  tags:
    - MFA
  security:
    - bearerAuth: []
  description: >-
    Reports whether the principal has a confirmed TOTP factor, so the account UI
    can show an active state instead of re-offering enrollment.
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              enrolled:
                type: boolean
            required:
              - enrolled
    "401":
      $ref: ../../../shared/responses/Unauthorized.yaml
    "403":
      $ref: ../../../shared/responses/Forbidden.yaml
    "404":
      $ref: ../../../shared/responses/NotFound.yaml
    "422":
      $ref: ../../../shared/responses/Unprocessable.yaml
    "429":
      $ref: ../../../shared/responses/TooManyRequests.yaml
delete:
  operationId: disableTotp
  summary: Disable TOTP
  tags:
    - MFA
  security:
    - bearerAuth: []
  description: >-
    Removes the caller's authenticator app and recovery codes. Needs a recent
    step-up. The account holder is emailed that it happened, with what to do if
    it wasn't them.
  responses:
    "204":
      description: No Content
    "401":
      $ref: ../../../shared/responses/Unauthorized.yaml
    "403":
      $ref: ../../../shared/responses/Forbidden.yaml
    "404":
      $ref: ../../../shared/responses/NotFound.yaml
    "422":
      $ref: ../../../shared/responses/Unprocessable.yaml
    "429":
      $ref: ../../../shared/responses/TooManyRequests.yaml
