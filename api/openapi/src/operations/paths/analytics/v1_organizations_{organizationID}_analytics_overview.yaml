get:
  operationId: getAnalyticsOverview
  summary: Organization analytics overview
  tags:
    - Analytics
  parameters:
    - $ref: ../../../shared/parameters/OrganizationID.yaml
    - name: from
      in: query
      required: false
      description: Start of a chosen range (RFC 3339), returned as range.
      schema:
        type: string
        format: date-time
    - name: to
      in: query
      required: false
      description: End of the range (RFC 3339); now by default.
      schema:
        type: string
        format: date-time
    - name: days
      in: query
      required: false
      description: The range as days back from to; 30 by default, at most 366.
      schema:
        type: integer
        minimum: 1
        maximum: 366
    - name: method
      in: query
      required: false
      description: >-
        Count only sign-ins of this first method (password, passkey, magic_link,
        social, saml, ...).
      schema:
        type: string
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  description: >-
    Returns the organization's dashboard figures: sign-ins, failures, active
    users and their trends. Sign-ins and active users are counted from the
    sign-in log, which outlives the sessions: a person who switched to the
    organization, created it or accepted an invitation to it is active in it,
    but only a sign-in that proved a factor counts as one. Requires
    analytics.read.
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/Overview.yaml
    '401':
      $ref: ../../../shared/responses/Unauthorized.yaml
    '403':
      $ref: ../../../shared/responses/Forbidden.yaml
    '404':
      $ref: ../../../shared/responses/NotFound.yaml
    '422':
      $ref: ../../../shared/responses/Unprocessable.yaml
    '429':
      $ref: ../../../shared/responses/TooManyRequests.yaml
