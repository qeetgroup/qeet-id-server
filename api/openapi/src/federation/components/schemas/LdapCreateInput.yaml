type: object
additionalProperties: false
required:
  - base_dn
  - bind_dn
  - bind_password
  - email_attribute
  - name
  - name_attribute
  - server_url
  - skip_tls_verify
  - start_tls
  - status
  - user_filter
properties:
  base_dn:
    type: string
    minLength: 1
  bind_dn:
    type: string
    minLength: 1
  bind_password:
    type: string
    minLength: 1
  email_attribute:
    type: string
    minLength: 1
  name:
    type: string
    minLength: 1
  name_attribute:
    type: string
    minLength: 1
  server_url:
    type: string
    minLength: 1
  skip_tls_verify:
    type: boolean
  start_tls:
    type: boolean
    description: >-
      Upgrade an ldap:// connection to TLS with StartTLS before anything is
      sent. Outside development an ldap:// server_url needs it (422
      ldap.tls_required otherwise); ldaps:// is encrypted from the start.
  status:
    type: string
    minLength: 1
  sync_interval_minutes:
    type:
      - integer
      - "null"
    minimum: 5
    maximum: 60
    default: 15
    description: >-
      How often, in minutes, the scheduled sync reads the directory with the
      service account (5 to 60; 422 ldap.sync_interval_invalid otherwise). It
      reads the people changed since its last run, and every person once a
      day; someone the directory disabled, deleted or no longer matches is
      suspended and signed out.
  user_filter:
    type: string
    minLength: 1
