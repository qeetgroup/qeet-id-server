name: deploy

on:
  push:
    branches: [main] # every merge to main builds, deploys, then tags
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write  # push the version tag after a successful deploy
  id-token: write  # required for GitHub OIDC → AWS role assumption

env:
  AWS_REGION: ${{ vars.AWS_REGION }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://api.id.qeet.in
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history to find latest tag

      - name: Determine next version
        id: version
        run: |
          latest=$(git tag --list 'v*' --sort=-version:refname | head -1)
          latest=${latest:-v0.0.0}
          IFS='.' read -r major minor patch <<< "${latest#v}"
          new_tag="v${major}.${minor}.$((patch + 1))"
          echo "Latest: $latest  →  new: $new_tag"
          echo "tag=$new_tag" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Fast gate: don't ship code that doesn't build/pass unit tests.
      - name: Build & unit test
        run: |
          go build ./...
          go test ./...

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push image
        env:
          REPO: ${{ vars.ECR_REPOSITORY_URL }}
          VERSION: ${{ steps.version.outputs.tag }}
        run: |
          docker build -t "${REPO}:${VERSION}" -t "${REPO}:${{ github.sha }}" -t "${REPO}:latest" .
          docker push "${REPO}:${VERSION}"
          docker push "${REPO}:${{ github.sha }}"
          docker push "${REPO}:latest"

      - name: Roll the host (SSM)
        env:
          SSM_PREFIX: /qeet-id/prod
          VERSION: ${{ steps.version.outputs.tag }}
        run: |
          INSTANCE_ID=$(aws ssm get-parameter --name "$SSM_PREFIX/INSTANCE_ID" --query Parameter.Value --output text)
          echo "Deploying $VERSION to $INSTANCE_ID"
          cmd_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${VERSION}" \
            --parameters commands='["/opt/qeet-id/redeploy.sh"]' \
            --query Command.CommandId --output text)
          echo "SSM command: $cmd_id"
          aws ssm wait command-executed --command-id "$cmd_id" --instance-id "$INSTANCE_ID" || true
          status=$(aws ssm get-command-invocation --command-id "$cmd_id" --instance-id "$INSTANCE_ID" --query Status --output text)
          echo "----- stdout -----"
          aws ssm get-command-invocation --command-id "$cmd_id" --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text
          echo "----- stderr -----"
          aws ssm get-command-invocation --command-id "$cmd_id" --instance-id "$INSTANCE_ID" --query StandardErrorContent --output text
          echo "status: $status"
          [ "$status" = "Success" ]

      # Tag + release AFTER a successful deploy so every tag == a live deployed version.
      - name: Push version tag and create GitHub release
        env:
          VERSION: ${{ steps.version.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$VERSION"
          git push origin "$VERSION"
          gh release create "$VERSION" \
            --title "$VERSION" \
            --generate-notes \
            --repo "${{ github.repository }}"
