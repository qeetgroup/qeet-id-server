get:
  operationId: getEntitlements
  summary: Get plan entitlements
  tags:
    - Entitlements
  description: >-
    Returns the organization's resolved entitlements: the effective plan code, the
    boolean feature flags, and the numeric limits (-1 = unlimited). Resolved
    from the active subscription (falling back to the organization's plan label), so
    an in-app upgrade is reflected immediately. A subscription grants its plan
    only until current_period_end (a trial until trial_end): nothing renews it,
    so after that the organization has the free plan's entitlements until it pays
    again. Readable by any authenticated member of the organization; scoped to the
    caller's own organization. audit_retention_days is enforced: once a day, the
    organization's audit events older than that are deleted (all but the newest, its
    chain kept verifiable) and the deletion is recorded as audit.events_purged;
    -1 keeps them all.
  parameters:
    - $ref: ../../../shared/parameters/OrganizationID.yaml
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            required:
              - plan
              - features
              - limits
            properties:
              plan:
                type: string
                enum:
                  - free
                  - starter
                  - pro
                  - enterprise
                description: >-
                  Effective plan tier (annual "_year" variants folded to the
                  base tier).
              features:
                type: object
                description: Boolean feature flags keyed by feature name.
                additionalProperties:
                  type: boolean
                example:
                  passkeys: true
                  password: true
                  magic_links: true
                  social: true
                  totp: true
                  email_otp: true
                  hosted_login: true
                  sms_mfa: false
                  custom_branding: false
                  custom_domain: false
                  sso: false
                  scim: false
                  ldap: false
                  webhooks: false
                  audit_export: false
                  ai_qeetai: false
                  abac: false
              limits:
                type: object
                description: >-
                  Numeric resource caps keyed by resource name; -1 means
                  unlimited.
                additionalProperties:
                  type: integer
                example:
                  seats: 5
                  apps: 3
                  api_keys: 2
                  custom_roles: 0
                  webhooks: 0
                  orgs: 1
                  mau: 10000
                  audit_retention_days: 7
    "400":
      $ref: ../../../shared/responses/BadRequest.yaml
    "401":
      $ref: ../../../shared/responses/Unauthorized.yaml
    "403":
      $ref: ../../../shared/responses/Forbidden.yaml
    "404":
      $ref: ../../../shared/responses/NotFound.yaml
    "429":
      $ref: ../../../shared/responses/TooManyRequests.yaml
