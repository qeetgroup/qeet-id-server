delete:
  operationId: unassignUserRole
  description: >-
    Removes a directly assigned role from a user within the tenant; the user
    loses that role's permissions unless a group still confers it. This is the
    counterpart to the assign-role-to-user call. Confirm the remaining grants
    with the effective-permissions call. Removing the owner role is refused with
    409 tenant.last_owner, and nothing changes, when it would leave an
    organization with no active owner: make someone else an owner first.
    Removing a role is held to the rule for giving it (403
    rbac.grant_exceeds_caller, or rbac.owner_only for the owner role), and the
    person must not outrank the caller (403 rbac.target_is_owner /
    rbac.target_outranks_caller).
  summary: Unassign role from user
  tags:
    - RBAC
  parameters:
    - name: userID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - $ref: ../../../shared/parameters/TenantID.yaml
    - name: roleID
      in: path
      required: true
      schema:
        type: string
        format: uuid
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  responses:
    '204':
      description: Unassigned
    '400':
      $ref: ../../../shared/responses/BadRequest.yaml
    '401':
      $ref: ../../../shared/responses/Unauthorized.yaml
    '403':
      $ref: ../../../shared/responses/Forbidden.yaml
    '404':
      $ref: ../../../shared/responses/NotFound.yaml
post:
  operationId: assignUserRole
  description: >-
    Assigns a role to a user within the tenant, adding the role's permissions to
    that user's effective permissions. The role must belong to the tenant and
    the user must already be a member of it, or have it as their home tenant;
    otherwise the call answers 404 rbac.user_or_role_not_found, the same for a
    missing id as for another tenant's. The assignment is idempotent. Reverse it
    with the unassign-role-from-user call, and verify the outcome with the
    effective-permissions call. The caller must hold every permission the role
    carries in this organization (403 rbac.grant_exceeds_caller, naming one it
    lacks), and only an owner gives the owner role (403 rbac.owner_only); an
    owner may give any role. A person's first role in the organization takes a
    seat (people holding a role, directly or through a group, plus pending
    invitations); when the plan's seats are all taken it is refused with 402
    billing.plan_limit (metadata resource seats, limit). Another role for
    someone who holds one takes no seat.
  summary: Assign role to user
  tags:
    - RBAC
  parameters:
    - name: userID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - $ref: ../../../shared/parameters/TenantID.yaml
    - name: roleID
      in: path
      required: true
      schema:
        type: string
        format: uuid
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  responses:
    '204':
      description: Assigned
    '400':
      $ref: ../../../shared/responses/BadRequest.yaml
    '401':
      $ref: ../../../shared/responses/Unauthorized.yaml
    '402':
      description: >-
        The plan has no seat left for a person's first role
        (billing.plan_limit).
    '403':
      $ref: ../../../shared/responses/Forbidden.yaml
    '404':
      $ref: ../../../shared/responses/NotFound.yaml
