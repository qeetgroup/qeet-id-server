delete:
  operationId: unregisterOidcClient
  description: >-
    Deletes an OIDC client addressed by id alone, with the owning tenant derived
    from the caller's JWT so the deletion can never cross tenants. This serves
    the admin UI's client list, which is not tenant-path scoped, and the
    deletion is audited. The tenant-path variant DELETE
    /v1/tenants/{tenantID}/oidc/clients/{id} performs the same operation for
    tenant-scoped callers.
  summary: Delete OIDC client (by scope)
  tags:
    - OIDC
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  responses:
    '204':
      description: Client deleted
    '401':
      $ref: ../../../shared/responses/Unauthorized.yaml
    '403':
      $ref: ../../../shared/responses/Forbidden.yaml
    '404':
      $ref: ../../../shared/responses/NotFound.yaml
