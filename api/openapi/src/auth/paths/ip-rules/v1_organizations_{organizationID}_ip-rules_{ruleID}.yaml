delete:
  operationId: deleteIpRule
  summary: Delete rule
  tags:
    - IP Rules
  parameters:
    - $ref: ../../../shared/parameters/OrganizationID.yaml
    - name: ruleID
      in: path
      required: true
      schema:
        type: string
        format: uuid
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  description: Deletes one of the organization's address rules. Requires policy.write.
  responses:
    '204':
      description: No Content
    '401':
      $ref: ../../../shared/responses/Unauthorized.yaml
    '403':
      $ref: ../../../shared/responses/Forbidden.yaml
    '404':
      $ref: ../../../shared/responses/NotFound.yaml
    '422':
      $ref: ../../../shared/responses/Unprocessable.yaml
    '429':
      $ref: ../../../shared/responses/TooManyRequests.yaml
