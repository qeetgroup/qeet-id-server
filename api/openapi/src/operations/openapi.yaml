openapi: 3.1.0
info:
  title: Qeet ID — Operations API (audit, billing, analytics)
  version: 0.2.0
  description: >-
    Observability, governance, and commercial operations for Qeet ID.


    ## Start here


    1. **Health** first — `GET /healthz` and `/readyz` need no authentication
    and are the easiest successful call for a new integrator.

    2. **Observe** — activity feed, usage analytics, and universal search.

    3. **Investigate & govern** — audit log, compliance evidence, data
    retention, GDPR erasure, and SIEM log sinks.

    4. **Commercial** — billing, plans, and entitlements.


    ## Authentication


    Auth modes: `bearerAuth` (user/service JWT), `apiKeyAuth` (`Authorization:
    ApiKey <key>` — legacy scheme), `scimBearer` (per-organization SCIM token),
    `clientCredentials` (OAuth M2M), and `ssoCookie` (hosted-login SSO session).
    CSRF protection applies only to cookie sessions (`ssoCookie`): requests
    authorised by `bearerAuth` or `apiKeyAuth` bypass it, as do the
    token endpoint (POST /v1/oauth/token) and the directory
    sign-in (POST /ldap/{id}/authenticate), which carry their credentials in the
    request. Basic credentials do not bypass it. A request that fails the check
    is refused with 403 `csrf_failed`.


    Responses that carry a token, a sign-in session or a newly created secret
    are sent with `Cache-Control: no-store` and `Pragma: no-cache`; no operation
    in this API returns one.


    Every response carries an `X-Request-Id` header naming the request; quote it
    when reporting a problem. An error body repeats it as `error.request_id`.
    A path with an encoded slash or backslash (`%2F`, `%5C`) is refused with
    400 `bad_request`.


    ## Related APIs


    - **Authentication & Access API** — login, passkeys, MFA, authorization

    - **Identity Management API** — organizations, users, groups, invitations

    - **Federation API** — OIDC/OAuth provider, SAML, SCIM, LDAP, social

    - **Developer API** — API keys, agents, webhooks, vaults


    ## Contract maintenance


    This document covers routes mounted by internal/bootstrap/router.go.
    internal/bootstrap/openapi_coverage_test.go walks the production mount
    helpers and fails when a mounted operation is undocumented, a documented
    operation is stale, or API-auth security declarations disagree with runtime
    classification.
servers:
  - url: https://api.id.qeet.in
    description: Production
  - url: http://localhost:4001
    description: Local (make dev)
tags:
  - name: Health
    description: Liveness, readiness, and Prometheus metrics.
  - name: Activity
    description: >-
      Live Activity feed — a real-time SSE event stream and cursor-paginated
      history, both sourced from the hash-chained audit log and the NATS outbox.
      Organization-scoped; requires audit.read. The SSE stream fans out domain events
      from the transactional outbox; reconnects replay missed events via
      Last-Event-ID.
  - name: Analytics
    description: >-
      Per-organization usage analytics, and the dashboard's overview of what is
      set up.
  - name: Search
    description: >-
      Universal organization-scoped fuzzy search across all resource types. Results
      are RBAC-gated per type — the caller only sees resources their role allows
      them to read.
  - name: Audit
    description: Append-only, hash-chained audit log query and integrity verification.
  - name: Compliance
    description: >-
      SOC 2 and ISO 27001 live evidence generation from real organization system
      state.
  - name: Data Retention
    description: Per-organization auto-purge of soft-deleted users.
  - name: GDPR
    description: Right-to-erasure purge requests.
  - name: Log Sinks
    description: >-
      SIEM log-sink connectors — forward audit and event streams to external
      SIEM destinations.
  - name: Notifications
    description: In-app notifications — list notifications and mark them read.
  - name: Rate Limits
    description: Per-organization rate-limit overrides (organization / user / API-key buckets).
  - name: Email Templates
    description: Per-organization transactional email template overrides.
  - name: Qeet AI
    description: >-
      AI qeetai inference service — streaming conversation turns, conversation
      management, and configuration status. Tool execution runs client-side
      under the user's own token (RBAC/RLS/audit inherited). API key is
      server-side only and never returned by any endpoint.
  - name: Billing
    description: Subscription plans, subscriptions, and invoices.
  - name: Entitlements
    description: >-
      An organization's resolved plan capability set — boolean feature flags and
      numeric limits. Read by the console to gate the UI off the same source of
      truth the backend enforces on. Gated create endpoints return 402 with a
      stable code (billing.plan_limit / billing.upgrade_required) when a plan
      cap is reached.
  - name: Sales
    description: Contact-sales lead capture (public marketing endpoint).
