get:
  operationId: getRetentionPolicy
  summary: Get retention policy
  tags:
    - Data Retention
  parameters:
    - $ref: ../../../shared/parameters/OrganizationID.yaml
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  description: Returns the organization's data-retention policy. Requires policy.read.
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/RetentionPolicy.yaml
    '401':
      $ref: ../../../shared/responses/Unauthorized.yaml
    '403':
      $ref: ../../../shared/responses/Forbidden.yaml
    '404':
      $ref: ../../../shared/responses/NotFound.yaml
    '422':
      $ref: ../../../shared/responses/Unprocessable.yaml
    '429':
      $ref: ../../../shared/responses/TooManyRequests.yaml
put:
  operationId: setRetentionPolicy
  summary: Update retention policy
  tags:
    - Data Retention
  parameters:
    - $ref: ../../../shared/parameters/OrganizationID.yaml
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  requestBody:
    required: false
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/RetentionPolicy.yaml
  description: Replaces the organization's data-retention policy. Requires policy.write.
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/RetentionPolicy.yaml
    '401':
      $ref: ../../../shared/responses/Unauthorized.yaml
    '403':
      $ref: ../../../shared/responses/Forbidden.yaml
    '404':
      $ref: ../../../shared/responses/NotFound.yaml
    '422':
      $ref: ../../../shared/responses/Unprocessable.yaml
    '429':
      $ref: ../../../shared/responses/TooManyRequests.yaml
