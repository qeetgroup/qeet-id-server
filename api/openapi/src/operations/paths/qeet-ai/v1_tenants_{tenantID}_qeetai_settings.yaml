get:
  operationId: getQeetAiSettings
  summary: Qeet AI settings
  description: >-
    How long the organisation keeps its Qeet AI conversations, and the last
    change. Requires secret.read.
  tags:
    - Qeet AI
  parameters:
    - $ref: ../../../shared/parameters/TenantID.yaml
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  responses:
    '200':
      description: Settings
      content:
        application/json:
          schema:
            type: object
            properties:
              conversation_retention_days:
                type:
                  - integer
                  - 'null'
                minimum: 1
                maximum: 3650
                description: >-
                  Days an untouched conversation is kept, with its messages;
                  null keeps them.
              updated_at:
                type: string
                format: date-time
              updated_by:
                type: string
                format: uuid
              updated_by_email:
                type: string
    '401':
      $ref: ../../../shared/responses/Unauthorized.yaml
    '403':
      $ref: ../../../shared/responses/Forbidden.yaml
put:
  operationId: setQeetAiSettings
  summary: Set Qeet AI settings
  description: >-
    Sets how many days (1 to 3,650) an untouched conversation is kept, or null
    to keep them. Every day a job deletes the conversations untouched for
    longer, with their messages, and audits each organisation's deletion as
    qeetai.conversations_purged. The change is audited as
    qeetai.settings_updated. Requires secret.write.
  tags:
    - Qeet AI
  parameters:
    - $ref: ../../../shared/parameters/TenantID.yaml
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            conversation_retention_days:
              type:
                - integer
                - 'null'
              minimum: 1
              maximum: 3650
  responses:
    '200':
      description: The settings
      content:
        application/json:
          schema:
            type: object
            properties:
              conversation_retention_days:
                type:
                  - integer
                  - 'null'
                minimum: 1
                maximum: 3650
                description: >-
                  Days an untouched conversation is kept, with its messages;
                  null keeps them.
              updated_at:
                type: string
                format: date-time
              updated_by:
                type: string
                format: uuid
              updated_by_email:
                type: string
    '401':
      $ref: ../../../shared/responses/Unauthorized.yaml
    '403':
      $ref: ../../../shared/responses/Forbidden.yaml
    '422':
      $ref: ../../../shared/responses/Unprocessable.yaml
