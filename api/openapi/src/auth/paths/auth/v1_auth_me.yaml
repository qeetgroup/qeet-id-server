get:
  operationId: getCurrentPrincipal
  description: >-
    Returns the principal resolved from the presented credential, including the
    user, organization, and session identifiers, the actor type, and granted scopes.
    Use it to confirm who the current credential authenticates as and which
    organization it is scoped to. An organization-less principal reports a null organization until
    one is selected with the switch-organization call. Also accepts the hosted-login
    session cookie (qe_ls) in place of a bearer token, so a browser app signed
    in through the hosted login can tell who is signed in.
  summary: Me
  tags:
    - Auth
  security:
    - bearerAuth: []
    - ssoCookie: []
  responses:
    '200':
      description: Current principal
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/CallerPrincipal.yaml
    '401':
      $ref: ../../../shared/responses/Unauthorized.yaml
