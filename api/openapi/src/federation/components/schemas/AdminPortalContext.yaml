type: object
properties:
  tenant_name:
    type: string
  capabilities:
    type: array
    items:
      type: string
      enum:
        - saml
        - scim
        - domain_verification
  expires_at:
    type: string
    format: date-time
  branding:
    type: object
    properties:
      logo_url:
        type: string
      primary_color:
        type: string
      secondary_color:
        type: string
      background_color:
        type: string
        description: Optional hosted-login page background from tenant branding settings.
  scim_base_url:
    type: string
    format: uri
    description: >-
      The SCIM 2.0 base URL the IT admin enters at their IdP. Present only when
      the link's capabilities include scim.
