type: object
required:
  - id
  - organization_id
  - capabilities
  - created_by
  - expires_at
  - revoked_at
  - last_used_at
  - created_at
properties:
  id:
    type: string
    format: uuid
  organization_id:
    type: string
    format: uuid
  capabilities:
    type: array
    items:
      type: string
      enum:
        - saml
        - scim
        - domain_verification
  created_by:
    type:
      - string
      - "null"
    format: uuid
  expires_at:
    type: string
    format: date-time
  revoked_at:
    type:
      - string
      - "null"
    format: date-time
  last_used_at:
    type:
      - string
      - "null"
    format: date-time
  created_at:
    type: string
    format: date-time
