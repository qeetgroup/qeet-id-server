delete:
  operationId: unregisterOidcClient
  description: >-
    Deletes an OIDC client addressed by id alone, with the owning organization derived
    from the caller's JWT so the deletion can never cross organizations. This serves
    the admin UI's client list, which is not organization-path scoped, and the
    deletion is audited. The organization-path variant DELETE
    /v1/organizations/{organizationID}/oidc/clients/{id} performs the same operation for
    organization-scoped callers.
  summary: Delete OIDC client (by scope)
  tags:
    - OIDC
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  responses:
    "204":
      description: Client deleted
    "400":
      $ref: ../../../shared/responses/BadRequest.yaml
    "401":
      $ref: ../../../shared/responses/Unauthorized.yaml
    "403":
      $ref: ../../../shared/responses/Forbidden.yaml
    "404":
      $ref: ../../../shared/responses/NotFound.yaml
    "429":
      $ref: ../../../shared/responses/TooManyRequests.yaml
