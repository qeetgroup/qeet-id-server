get:
  operationId: verifyAuditChain
  summary: Verify audit chain
  description: >-
    Walks the organization's hash chain from the seed and recomputes each row's hash,
    returning the first broken link (if any). No side effects. Once events older
    than the plan keeps them (audit_retention_days) have been deleted, the walk
    starts from the last one deleted, whose hash the first one kept links to.
  tags:
    - Audit
  parameters:
    - $ref: ../../../shared/parameters/OrganizationID.yaml
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  responses:
    "200":
      description: >-
        { ok: bool, rows_checked: int, last_verified_id?: uuid, broken_at_id?:
        uuid, broken_reason?: string, reason_code?: string }
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/AuditVerifyResult.yaml
    "400":
      $ref: ../../../shared/responses/BadRequest.yaml
    "401":
      $ref: ../../../shared/responses/Unauthorized.yaml
    "403":
      $ref: ../../../shared/responses/Forbidden.yaml
    "429":
      $ref: ../../../shared/responses/TooManyRequests.yaml
