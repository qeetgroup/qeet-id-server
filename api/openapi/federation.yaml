                code:
                  type: string
                  minLength: 1
      responses:
        "200":
          description: Token pair
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStoreCacheControl"
            Pragma:
              $ref: "#/components/headers/NoStorePragma"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "400":
