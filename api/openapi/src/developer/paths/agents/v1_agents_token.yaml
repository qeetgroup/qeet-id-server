post:
  operationId: mintAgentToken
  summary: Mint agent token
  description: >-
    An AI agent authenticates with its agent_id + secret (JSON body or HTTP
    Basic) and receives an ephemeral access token marked actor_type="agent" (+
    agent_id claim), verifiable on the standard JWKS path. No user session.
  tags:
    - Agents
  security: []
  requestBody:
    required: true
    content:
      application/json:
        example:
          agent_id: 018f2a80-4d5e-7f60-a1b2-c3d4e5f60718
          secret: as_9m8n7b6v5c4x3z2a1s0d9f8g7h6j5k4l
        schema:
          type: object
          required:
            - agent_id
            - secret
          properties:
            agent_id:
              type: string
            secret:
              type: string
  responses:
    '200':
      description: Short-lived agent access token
      headers:
        Cache-Control:
          $ref: ../../../shared/headers/NoStoreCacheControl.yaml
        Pragma:
          $ref: ../../../shared/headers/NoStorePragma.yaml
      content:
        application/json:
          example:
            access_token: eyJhbGciOiJFUzI1NiIsImtpZCI6ImZ2MSJ9.eyJzdWIiOiJhZ2VudCJ9.FAKE-signature
            token_type: Bearer
            expires_in: 300
            scope: agent:invoke
          schema:
            $ref: ../../components/schemas/TokenResponse.yaml
    '401':
      $ref: ../../../shared/responses/Unauthorized.yaml
