    post:
      operationId: resendInvite
      description: "Rotates the invitation token, extends its expiry, and re-sends the invitation email; the new link goes only to the invited address. Requires member.invite, and, as creating it does, every permission of the role the invitation grants (403 rbac.grant_exceeds_caller naming one the caller lacks; nothing changes). The response carries the invitation. Only pending or expired invites belonging to the caller's organization qualify; already-accepted or revoked invites are rejected. The recipient completes the flow through the accept-invite call, as with the original invitation. invite.delivery says whether the email went out (as on create): a suppressed address reports not_sent with email.suppressed rather than success."
      summary: Resend an invitation
      tags:
        - Invites
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        "200":
          description: Invitation resent
          content:
            application/json:
              schema:
                type: object
                required:
                  - invite
                properties:
                  invite:
                    $ref: "#/components/schemas/Invite"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/organizations/{organizationID}/users/{id}/sessions/{sessionID}:
    delete:
      operationId: revokeUserSession
      tags:
        - Users
      summary: End one of a user's sessions
      description: "Ends one of the user's live sessions, as GET /v1/users/{id}/sessions lists them: one in the caller's organization, or an account-level one when it is the user's home organization. Its refresh tokens stop working at once; access tokens it was issued are refused as the session's end is noticed. Requires session.revoke. The person must not outrank the caller: only an owner signs out an owner (403 rbac.target_is_owner), and the caller must hold every permission the person holds here (403 rbac.target_outranks_caller naming one). A session that isn't theirs there, or has already ended, answers 404. Audited as session.admin_revoked with the session's ID, and announced to session.revoked subscribers with reason admin_revoked."
      parameters:
        - $ref: "#/components/parameters/OrganizationID"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: sessionID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        "204":
          description: Ended
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/organizations/{organizationID}/users/{id}/passkeys:
    get:
      operationId: listUserPasskeys
      tags:
        - Users
      summary: List a user's passkeys
      description: "The passkeys on a member's account, oldest first: each one's name, when it was added and when it last signed them in. Requires user.read; someone who doesn't belong to the caller's organization answers 404."
      parameters:
        - $ref: "#/components/parameters/OrganizationID"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        "200":
          description: The user's passkeys
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  truncated:
                    $ref: "#/components/schemas/Truncated"
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        name:
                          type:
                            - string
                            - "null"
                        created_at:
                          type: string
                          format: date-time
                        last_used_at:
                          type:
                            - string
                            - "null"
                          format: date-time
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/organizations/{organizationID}/users/{id}/passkeys/{passkeyID}:
    delete:
      operationId: deleteUserPasskey
      tags:
        - Users
      summary: Remove a user's passkey
      description: "Removes a passkey from a user's account, for example a lost device's, so it no longer signs them in. Requires user.credentials and a recent sign-in (step-up). Like a second-factor reset it is for the account's home organization only (403 user.managed_elsewhere for a member from elsewhere), and is refused with 403 user.credentials_shared, nothing changing, while the account also belongs to another organization. The person must not outrank the caller: only an owner changes an owner (403 rbac.target_is_owner), and the caller must hold every permission the person holds here (403 rbac.target_outranks_caller naming one). The account's last way to sign in isn't removed (409 auth.last_sign_in_method). A passkey that isn't theirs answers 404. Audited as passkey.admin_deleted with the passkey's ID and name, and the person is emailed that an administrator of this organization removed it."
      parameters:
        - $ref: "#/components/parameters/OrganizationID"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: passkeyID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        "204":
          description: Removed
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/organizations/{organizationID}/users/{id}/sign-ins:
    get:
      operationId: getUserSignInSummary
      summary: A person's sign-in summary
      description: "How the member signed in to the organization over a period, from its audit log: sign-ins by first method, with how many met a second step (recorded as metadata.second_factor from this release, or a method ending _mfa); by address (the 20 most used, with the last time); by browser and platform, as the session list names them; and failed sign-ins by reason. The period is from and to (RFC 3339), or days back from to (or now); 30 days by default, at most 366. A person from another organization counts their sign-ins to this one. Requires audit.read."
      tags:
        - Users
      parameters:
        - $ref: "#/components/parameters/OrganizationID"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: days
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 366
            default: 30
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        "200":
          description: The summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  from:
                    type: string
                    format: date-time
                  to:
                    type: string
                    format: date-time
                  sign_ins:
                    type: integer
                  with_second_step:
                    type: integer
                  by_method:
                    type: array
                    items:
                      type: object
                      properties:
                        method:
                          type: string
                        count:
                          type: integer
                        with_second_step:
                          type: integer
                  by_address:
                    type: array
                    items:
                      type: object
                      properties:
                        ip:
                          type: string
                        count:
                          type: integer
                        last_at:
                          type: string
                          format: date-time
                  by_browser:
                    type: array
                    items:
                      type: object
                      properties:
                        device:
                          type: string
                        kind:
                          type: string
                        count:
                          type: integer
                  failures:
                    type: integer
                  failures_by_reason:
                    type: array
                    items:
                      type: object
                      properties:
                        reason:
                          type: string
                        count:
                          type: integer
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/organizations/{organizationID}/invites:
    get:
      operationId: listInvites
      summary: List invites
      tags:
        - Invites
      parameters:
        - $ref: "#/components/parameters/OrganizationID"
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      description: Lists the organization's invitations, without their tokens. Requires user.read.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  truncated:
                    $ref: "#/components/schemas/Truncated"
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Invite"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/branding/{organizationID}/logo:
    get:
      operationId: getBrandingLogo
      summary: An organization's uploaded logo (public)
      description: "The image an organization uploaded as its logo (a PNG, JPEG, WEBP or SVG data URL in its branding), served so its emails and hosted pages can link to it: those get this address, with ?v= a hash of the image, in place of the data URL. Needs no credential, like the logo it shows. 404 when the organization uploaded none, links its logo by URL instead, or its plan lacks custom_branding. Served with X-Content-Type-Options nosniff and a sandboxing Content-Security-Policy, so an SVG's scripts never run; cacheable for an hour."
      tags:
        - Branding
      security: []
      parameters:
        - $ref: "#/components/parameters/OrganizationID"
        - name: v
          in: query
          required: false
          description: The image's version, so a new upload isn't served from a cache; any value is accepted.
          schema:
            type: string
      responses:
        "200":
          description: The image
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
            image/svg+xml:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/organizations/{organizationID}/branding:
    get:
      operationId: getBranding
      summary: Get branding
      tags:
        - Branding
      parameters:
        - $ref: "#/components/parameters/OrganizationID"
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      description: Organization branding, including optional background_color and email_reply_to values in settings. Unknown settings are preserved by clients. Custom sender addresses are configuration preferences and do not activate a provider identity. The saved branding is returned whatever the plan, but the hosted login and emails show it only while the organization's plan includes custom_branding; after the plan lapses they use the default appearance.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationBranding"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    put:
      operationId: setBranding
      summary: Update branding
      tags:
        - Branding
      parameters:
        - $ref: "#/components/parameters/OrganizationID"
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationBranding"
        description: Complete editable branding fields and settings. Preserve unrelated settings when updating. The organization ID is enforced by the authenticated route scope.
      description: Requires custom_branding entitlement. Accepts at most 3 MiB of JSON, including an optional base64 PNG, JPEG, WEBP or SVG logo of at most 2 MiB decoded. settings.background_color is a six-digit hex color or empty for the default; settings.email_reply_to is a single mailbox or empty. Sender name and reply-to apply only to organization invitations and magic links. The provider-approved From address is retained.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationBranding"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "User or service JWT: `Authorization: Bearer <token>`."
    apiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: "API key credential. Send `Authorization: ApiKey <key>` (note the `ApiKey ` prefix). Accepted on the same authenticated routes as bearerAuth. A key works only while its organization is active, not while it is suspended or deleted."
    scimBearer:
      type: http
      scheme: bearer
      description: "An organization's SCIM provisioning token, presented by its identity provider: `Authorization: Bearer <scim-token>`. Distinct from user JWTs. An organization can hold several, managed under /v1/organizations/{organizationID}/scim/tokens. A revoked or expired token, and every token of an organization that is suspended or due for deletion, is refused with 401."
    clientCredentials:
      type: oauth2
      description: OAuth 2.0 client credentials. Clients authenticate at the token endpoint via form params (`client_id`/`client_secret`) or HTTP Basic. Revocation/introspection use the same client auth.
      flows:
        clientCredentials:
          tokenUrl: /v1/oauth/token
          scopes: {}
    ssoCookie:
      type: apiKey
      in: cookie
      name: qe_ls
      description: Hosted-login SSO session cookie (HttpOnly). Set by POST /v1/auth/session and consumed by the OAuth authorize/consent flow, and by the few signed-in routes the hosted login calls itself (listing, renaming and adding passkeys). State-changing calls made with it need the CSRF token.
  schemas:
    NextCursor:
      type: string
      description: "Present when there is another page: send it back as cursor to read that page. Absent on the last page."
    Error:
      type: object
      required:
        - error
      description: Canonical error envelope (internal/platform/httpx.WriteError).
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              description: Stable machine code
              example: unauthorized
            message:
              type: string
              example: authentication required
            detail:
              type: string
              description: Optional human detail
            translation_key:
              type: string
              description: Optional i18n key the client can use to localize the message.
            retryable:
              type: boolean
              description: "Whether the person can try again, often by starting over (signing in again, asking for a new code, waiting). It is not a promise that resending the same request will succeed: auth.session_revoked is retryable and the session never comes back. Decide whether to resend a request from its status (429, 503 with Retry-After)."
            fields:
              type: array
              description: Per-field validation errors (typically on 422 responses).
              items:
                type: object
                properties:
                  field:
                    type: string
                  code:
                    type: string
                  message:
                    type: string
            metadata:
              type: object
              additionalProperties: true
              description: Optional structured, error-specific context.
            request_id:
              type: string
              description: Correlates with the X-Request-Id header
    Page:
      type: object
      description: Cursor-paginated list wrapper.
      properties:
        items:
          type: array
          items: {}
        next_cursor:
          type:
            - string
            - "null"
          description: Cursor for the next page; empty/absent at the end.
    Organization:
      type: object
      required:
        - id
        - slug
        - name
        - status
        - plan
        - region
        - logo_url
        - metadata
        - created_at
        - updated_at
        - deletion_due_at
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        status:
          type: string
          enum:
            - active
            - suspended
        plan:
          type: string
          enum:
            - free
            - starter
            - pro
            - enterprise
        region:
          type: string
          description: The region this service is hosted in, where the organization's data is held. It is the same for every organization of a deployment and isn't a per-organization data-residency choice.
        logo_url:
          type: string
          description: The organization's logo, a hosted URL or a small inline data URL; empty when none is set, and the console shows the name's initials.
        metadata:
          type:
            - object
            - "null"
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deletion_due_at:
          type:
            - string
            - "null"
          format: date-time
          description: When a scheduled deletion takes effect; null when none is.
        member_count:
          type: integer
          description: List-only. Distinct members (rbac.user_roles holders) in this org.
        mfa_enabled_count:
          type: integer
          description: List-only. Members with at least one MFA factor enrolled.
    OrganizationPage:
      allOf:
        - $ref: "#/components/schemas/Page"
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Organization"
        next_cursor:
          $ref: "#/components/schemas/NextCursor"
    OrganizationCreate:
      type: object
      additionalProperties: false
      required:
        - slug
        - name
      properties:
        slug:
          type: string
          minLength: 2
          maxLength: 64
        name:
          type: string
          minLength: 1
          maxLength: 200
        plan:
          type:
            - string
            - "null"
          enum:
            - free
            - starter
            - pro
            - enterprise
            - null
        region:
          type:
            - string
            - "null"
          description: Optional. Only the region this service is hosted in is accepted (422 organization.region_unavailable, with metadata.available, otherwise); the organization is created there either way.
          maxLength: 64
        logo_url:
          type:
            - string
            - "null"
          maxLength: 3000000
          description: Optional logo, a hosted URL or a small inline data URL, up to 3,000,000 characters. Left out or empty, the console shows the name's initials.
        metadata:
          type:
            - object
            - "null"
          additionalProperties: true
    OrganizationCreateResponse:
      type: object
      required:
        - organization
        - organization_id
        - roles
      properties:
        organization:
          $ref: "#/components/schemas/Organization"
        organization_id:
          type: string
          format: uuid
        roles:
          type: array
          items:
            type: string
          example:
            - owner
        access_token:
          type: string
        token_type:
          type: string
        expires_at:
          type: string
          format: date-time
        refresh_token:
          type: string
        session_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
    OrganizationUpdate:
      type: object
      additionalProperties: false
      properties:
        name:
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 200
        status:
          type:
            - string
            - "null"
          enum:
            - active
            - suspended
            - null
        region:
          type:
            - string
            - "null"
          description: "Read-only: the same value is accepted, as a form sends every field back; another is refused with 422 organization.region_read_only."
          maxLength: 64
        logo_url:
          type:
            - string
            - "null"
          maxLength: 3000000
          description: The logo, a hosted URL or a small inline data URL, up to 3,000,000 characters; empty removes it.
        metadata:
          type:
            - object
            - "null"
          additionalProperties: true
    DNSRecord:
      type: object
      required:
        - name
        - type
        - value
      properties:
        name:
          type: string
        type:
          type: string
        value:
          type: string
    LoginDomainStatus:
      type: object
      required:
        - dns_detail
        - dns_verified
        - endpoint_state
        - login_domain
        - records
        - status
        - tls_detail
        - tls_state
      properties:
        checked_at:
          type:
            - string
            - "null"
          format: date-time
          description: When this result was found; null without a hostname.
        dns_checked_at:
          type: string
          format: date-time
        dns_detail:
          type: string
        dns_verified:
          type: boolean
        endpoint_state:
          type: string
        endpoint_url:
          type: string
        login_domain:
          type: string
        records:
          type: array
          items:
            $ref: "#/components/schemas/DNSRecord"
        status:
          type: string
        tls_detail:
          type: string
        tls_state:
          type: string
    Truncated:
      type: boolean
      description: "Present, and true, when the list was cut at its limit (1,000 items unless the operation says otherwise): there are more than were answered."
    Domain:
      type: object
      required:
        - created_at
        - dns_record_name
        - dns_record_type
        - dns_record_value
        - domain
        - id
        - jit_enabled
        - sso_enabled
        - status
        - verification_token
      properties:
        created_at:
          type: string
          format: date-time
        dns_record_name:
          type: string
        dns_record_type:
          type: string
        dns_record_value:
          type: string
        domain:
          type: string
        id:
          type: string
          format: uuid
        jit_enabled:
          type: boolean
          description: Single sign-on creates an account at sign-in for an address on the domain that has none.
        last_checked_at:
          type: string
          format: date-time
        last_error:
          type: string
        sso_enabled:
          type: boolean
          description: Addresses on the domain sign in only through the organization's active SAML, LDAP or OpenID Connect connection (break-glass members and administrators single sign-on can't sign in excepted).
        status:
          type: string
        verification_token:
          type: string
        verified_at:
          type: string
          format: date-time
    BreakGlassMember:
      type: object
      required:
        - user_id
        - email
        - created_at
      properties:
        user_id:
          type: string
          format: uuid
        email:
          type: string
        display_name:
          type: string
        created_by:
          type: string
          format: uuid
          description: The owner who named them, while that account exists.
        created_at:
          type: string
          format: date-time
    SuspendedDirectoryUser:
      type: object
      required:
        - id
        - email
        - display_name
        - avatar_url
        - team
        - reason
        - source
        - risk
        - review
        - suspended_at
        - last_sign_in
        - can_manage
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        display_name:
          type:
            - string
            - "null"
        avatar_url:
          type:
            - string
            - "null"
        team:
          type: string
        reason:
          type: string
        source:
          type: string
        risk:
          type: string
          enum:
            - unknown
            - low
            - medium
            - high
        review:
          type: string
          enum:
            - pending
            - reviewed
