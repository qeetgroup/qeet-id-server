name: ci

# Verify: the essential checks, kept short. The code compiles (build and vet),
# is formatted and linted (golangci-lint, the database tests included), its
# generated SQL is current, and what ships has no known vulnerability.
#
# Runs on pull requests, and before every candidate image (candidate.yml calls
# it). The unit and database tests and gosec run locally before every push
# (make ci, AGENTS.md "Before you finish"), not here.

on:
  pull_request:
    branches: [develop, main, "release/**"]
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Installed from source so each is compiled with this repo's Go toolchain
      # (a prebuilt golangci-lint built with an older Go refuses go.mod's newer
      # target). Pinned, not @latest; the same versions as the Makefile.
      - name: Install golangci-lint, sqlc and govulncheck
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0

      - name: Build and vet
        run: |
          go build ./...
          go vet ./...

      # The whole tree, including the integration-tagged database tests;
      # gofmt and goimports run as golangci-lint formatters.
      - name: Format and lint
        run: golangci-lint run --build-tags=integration ./...

      # dbgen/ must be what sqlc generates from each package's queries.sql.
      - name: Generated SQL is up to date
        run: |
          fail=0
          while IFS= read -r cfg; do
            (cd "$(dirname "$cfg")" && sqlc diff) \
              || { echo "::error::stale sqlc output in $(dirname "$cfg"); run make sqlc"; fail=1; }
          done < <(find internal -name sqlc.yaml)
          exit $fail

      # What actually ships (cmd/ and internal/), with go.mod's toolchain, so
      # the standard library that is built in is covered too.
      - name: Known vulnerabilities in what ships
        run: govulncheck ./cmd/... ./internal/...
