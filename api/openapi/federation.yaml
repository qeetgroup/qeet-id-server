        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        name:
          type: string
        entity_id:
          type: string
        acs_url:
          type: string
          format: uri
        name_id_format:
          type: string
          description: urn:oasis:names:tc:SAML:1.1:nameid-format:emailAddress, urn:oasis:names:tc:SAML:2.0:nameid-format:persistent or urn:oasis:names:tc:SAML:1.1:nameid-format:unspecified
        name_id_attribute:
          type: string
          description: Where the NameID comes from — email, user_id, persistent_id or metadata.<key>
        certificate:
          type: string
        status:
          type: string
        attributes:
          type: array
          description: The attributes each assertion carries beside the NameID, in this order; one the person has no value for is left out
          items:
            $ref: '#/components/schemas/SAMLAttributeMapping'
        assignment_required:
          type: boolean
          description: Only the people assigned to the SP, themselves or through a group, may sign in to it
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        last_login_at:
          type: string
          format: date-time
          nullable: true
    SAMLServiceProviderCreate:
      type: object
      required:
        - name
        - entity_id
        - acs_url
      properties:
        name:
          type: string
        entity_id:
          type: string
        acs_url:
          type: string
          format: uri
        name_id_format:
          type: string
          description: urn:oasis:names:tc:SAML:1.1:nameid-format:emailAddress (the default), urn:oasis:names:tc:SAML:2.0:nameid-format:persistent or urn:oasis:names:tc:SAML:1.1:nameid-format:unspecified
        name_id_attribute:
          type: string
          description: Where the NameID comes from — email, user_id, persistent_id or metadata.<key>; by default persistent_id for a persistent NameID and email otherwise
        certificate:
          type: string
        attributes:
          type: array
          maxItems: 50
          description: The attributes to send; absent sends the default email (from email) and name (from display_name), an empty list none
          items:
            $ref: '#/components/schemas/SAMLAttributeMapping'
        assignment_required:
          type: boolean
          description: Sign in only the people assigned to the SP; off by default
    SAMLAttributeMapping:
      type: object
      required:
        - name
        - source
      properties:
        name:
          type: string
          maxLength: 256
          description: The attribute's SAML Name, unique within the SP
        source:
          type: string
          description: >-
            email; user_id (the account ID, the same at every app); persistent_id (an opaque value made
            for this person at this SP, which never changes); display_name; given_name and family_name
            (the user-metadata key of that name, else the person's directory profile first_name or
            last_name); groups (the names of their groups in the organisation, one value each);
            roles (the names of their roles there, directly or through a group, one value each); or
            metadata.<key> (that user-metadata key: a string, number or boolean, or an array of them
            as one value each)
        name_format:
          type: string
          enum: [basic, uri, unspecified]
          description: The attribute's NameFormat; basic when absent
