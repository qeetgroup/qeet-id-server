  /v1/tenants/{tenantID}/saml-providers:
    get:
      operationId: get_v1_tenants_ByTenantID_saml_providers
      description: 'Lists the downstream Service Providers registered in the tenant that consume Qeet as their SAML Identity Provider. This is the IdP-side registry, distinct from the inbound SAML connections where Qeet is the Service Provider. Register a new SP with POST to this path.'
      summary: List SAML SPs (IdP side)
      tags:
        - SAML
      parameters:
        - name: tenantID
          in: path
          required: true
          schema:
            type: string
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        '200':
          description: Service providers
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/SAMLServiceProvider'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: post_v1_tenants_ByTenantID_saml_providers
      description: 'Registers a downstream Service Provider in the tenant, including its entity id, ACS URL and NameID format, so it can obtain signed assertions from Qeet acting as the Identity Provider. Registered SPs are matched by AuthnRequest issuer or SP reference at the tenant''s IdP SSO endpoint, /saml/idp/{tenantID}/sso; the entity id need be unique only within the tenant. Give the SP administrator the tenant''s IdP metadata from /saml/idp/{tenantID}/metadata to complete the trust. The ACS URL, where signed assertions are posted, must be an absolute https URL without user information (plain http only to localhost), or the answer is 422 saml.acs_url_invalid. A status, when given, must be draft, active or disabled (422 saml.status_invalid), and an entity id already registered in the tenant is refused with 409 saml.sp_entity_id_taken. The NameID format is emailAddress (the default), persistent or unspecified (422 saml.name_id_format_invalid otherwise), and name_id_attribute names where its value comes from: email, user_id, persistent_id (an opaque value made for each person at this SP, which never changes) or metadata.<key>. An emailAddress NameID is always the email and a persistent one persistent_id (its default) or user_id; another combination is refused with 422 saml.name_id_attribute_invalid. attributes, when given, replaces the default email and name attributes; an empty list sends none, and an invalid one is refused with 422 saml.attributes_invalid naming each field at fault. assignment_required limits sign-in to the people and groups assigned to the SP. The registration is audited as saml.sp_created with these settings.'
      summary: Register SAML SP (IdP side)
      tags:
        - SAML
      parameters:
        - name: tenantID
          in: path
          required: true
          schema:
            type: string
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SAMLServiceProviderCreate'
      responses:
        '201':
          description: SP registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SAMLServiceProvider'
        '400':
