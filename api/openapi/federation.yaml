        description: Adds a provider to the caller's organisation, or replaces the settings of one it has.
      description: >-
        Adds a social provider, or replaces the settings of one the organisation
        already has. Replacing keeps whether the provider is switched on, and an
        empty client_secret keeps the stored one. The secret is stored encrypted
        and never returned. Audited as social_provider.created or
