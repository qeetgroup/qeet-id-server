post:
  operationId: startBackchannelAuthentication
  summary: Backchannel authentication (CIBA, poll mode)
  description: >-
    OpenID CIBA §7. Client-authenticated endpoint for a client that already
    knows who the user is (login_hint, an email scoped to the client's organization) —
    no browser redirect. Best-effort notifies the user (in-app), then returns
    auth_req_id; the client polls /v1/oauth/token with
    grant_type=urn:openid:params:grant-type:ciba while the user approves/denies
    via GET/POST /v1/oauth/bc-authorize/{pending,decision}. Only a confidential
    client may call it; a public client is refused with 401
    oidc.client_auth_failed and can't be registered with the CIBA grant.
  tags:
    - OIDC
  security:
    - clientCredentials: []
  requestBody:
    required: true
    content:
      application/x-www-form-urlencoded:
        schema:
          type: object
          required:
            - client_id
            - login_hint
          properties:
            client_id:
              type: string
            client_secret:
              type: string
            login_hint:
              type: string
              format: email
            scope:
              type: string
            binding_message:
              type: string
              description: >-
                Shown to the user in the consent notification (e.g. a
                transaction reference).
  responses:
    "200":
      description: Backchannel authentication response
      headers:
        Cache-Control:
          $ref: ../../../shared/headers/NoStoreCacheControl.yaml
        Pragma:
          $ref: ../../../shared/headers/NoStorePragma.yaml
      content:
        application/json:
          schema:
            type: object
            properties:
              auth_req_id:
                type: string
              expires_in:
                type: integer
              interval:
                type: integer
    "400":
      $ref: ../../../shared/responses/BadRequest.yaml
    "401":
      $ref: ../../../shared/responses/Unauthorized.yaml
