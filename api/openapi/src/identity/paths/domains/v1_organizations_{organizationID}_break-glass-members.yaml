get:
  operationId: listBreakGlassMembers
  summary: List break-glass members
  tags:
    - Domains
  description: >-
    Lists the members who keep their own sign-in methods (password, magic links,
    passkeys, password resets) on a domain where the organization requires
    single sign-on, so an outage of its identity provider can't lock everyone
    out. Requires connection.read.
  parameters:
    - $ref: ../../../shared/parameters/OrganizationID.yaml
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  responses:
    "200":
      description: The organization's break-glass members
      content:
        application/json:
          schema:
            type: object
            required:
              - items
            properties:
              truncated:
                $ref: ../../../shared/schemas/Truncated.yaml
              items:
                type: array
                items:
                  $ref: ../../components/schemas/BreakGlassMember.yaml
    "400":
      $ref: ../../../shared/responses/BadRequest.yaml
    "401":
      $ref: ../../../shared/responses/Unauthorized.yaml
    "403":
      $ref: ../../../shared/responses/Forbidden.yaml
    "429":
      $ref: ../../../shared/responses/TooManyRequests.yaml
