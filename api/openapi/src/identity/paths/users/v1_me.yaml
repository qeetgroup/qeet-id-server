get:
  operationId: getMyProfile
  description: >-
    Returns the profile of the authenticated caller, resolved from the presented
    token rather than any path parameter. Use it to render the signed-in user's
    own account details. Also accepts the hosted-login session cookie (qe_ls) in
    place of a bearer token.
  summary: Get the authenticated user's profile
  tags:
    - Users
  security:
    - bearerAuth: []
    - ssoCookie: []
  responses:
    "200":
      description: User profile
      content:
        application/json:
          schema:
            $ref: ../../../shared/schemas/User.yaml
    "401":
      $ref: ../../../shared/responses/Unauthorized.yaml
    "429":
      $ref: ../../../shared/responses/TooManyRequests.yaml
patch:
  operationId: updateMyProfile
  description: >-
    Updates the authenticated caller's own profile. Only the supplied fields are
    changed, and the account is always resolved from the token, so a caller can
    never edit another user's profile through this route.
  summary: Update the authenticated user's profile
  tags:
    - Users
  security:
    - bearerAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type:
            - object
            - "null"
          additionalProperties: false
          properties:
            display_name:
              type:
                - string
                - "null"
              maxLength: 200
            avatar_url:
              type:
                - string
                - "null"
              maxLength: 300000
              description: A small image data URL (data:image/…); an empty string clears it.
            locale:
              type:
                - string
                - "null"
              enum: [en, de, es, fr, hi, ja, pt, zh, null]
              description: The console language.
            phone:
              description: Accepted and ignored here; an administrator changes it at PATCH /v1/users/{id}.
            status:
              description: Accepted and ignored here; an administrator changes it at PATCH /v1/users/{id}.
            metadata:
              description: Accepted and ignored here; an administrator changes it at PATCH /v1/users/{id}.
  responses:
    "200":
      description: Updated profile
      content:
        application/json:
          schema:
            $ref: ../../../shared/schemas/User.yaml
    "400":
      $ref: ../../../shared/responses/BadRequest.yaml
    "401":
      $ref: ../../../shared/responses/Unauthorized.yaml
    "413":
      $ref: ../../../shared/responses/PayloadTooLarge.yaml
    "422":
      $ref: ../../../shared/responses/Unprocessable.yaml
    "429":
      $ref: ../../../shared/responses/TooManyRequests.yaml
