put:
  operationId: setProfileMapping
  summary: Update a versioned profile mapping
  description: >-
    Requires connection.write. The current version is required to prevent lost
    updates. Audited in the same transaction.
  tags:
    - Directory
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  parameters:
    - $ref: ../../../shared/parameters/OrganizationID.yaml
    - name: connectionID
      in: path
      required: true
      schema:
        type: string
    - name: mappingID
      in: path
      required: true
      schema:
        type: string
        format: uuid
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/DirectoryMapping.yaml
  responses:
    "200":
      description: Updated mapping and incremented version
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/DirectoryMapping.yaml
    "400":
      description: Invalid id, version or body
    "401":
      description: Authentication required
    "403":
      description: Organization mismatch or missing connection.write
    "404":
      description: Connection not found
    "409":
      description: Stale version, missing mapping or duplicate enabled target
    "422":
      description: >-
        Mapping refused: validation_failed, with error.fields[0].field naming
        the property at fault (source_attribute, target_field, value_type,
        transform or pattern) and error.fields[0].code the reason:
        directory.mapping_source_invalid, directory.mapping_source_credential,
        directory.mapping_target_unsupported,
        directory.mapping_value_type_mismatch,
        directory.mapping_transform_unsupported,
        directory.mapping_pattern_unexpected or
        directory.mapping_pattern_invalid.
delete:
  operationId: deleteProfileMapping
  description: >-
    Deletes a single profile attribute-mapping rule from a directory connection,
    scoped to the organization and connection in the path and requiring
    connection.write. The removal is audited in the same transaction, and
    subsequent SCIM writes and LDAP provisioning no longer apply the rule.
    Returns 404 when the mapping does not exist in this organization and connection.
  summary: Delete a profile mapping
  tags:
    - Directory
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  parameters:
    - $ref: ../../../shared/parameters/OrganizationID.yaml
    - name: connectionID
      in: path
      required: true
      schema:
        type: string
    - name: mappingID
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    "204":
      description: Mapping removed and audited
    "401":
      description: Authentication required
    "403":
      description: Organization mismatch or missing connection.write
    "404":
      description: Mapping not found in this organization and connection
