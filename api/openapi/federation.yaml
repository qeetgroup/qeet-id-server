            - string
            - "null"
        name:
          type:
            - string
            - "null"
        name_attribute:
          type:
            - string
            - "null"
        server_url:
          type:
            - string
            - "null"
        skip_tls_verify:
          type:
            - boolean
            - "null"
        start_tls:
          type:
            - boolean
            - "null"
        status:
          type:
            - string
            - "null"
        user_filter:
          type:
            - string
            - "null"
    DirectoryMapping:
      type: object
