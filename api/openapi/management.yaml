              type: string
          application/json:
            schema:
              type: string
        description: The raw export file content, in the format documented for the chosen source.
      responses:
        '200':
          description: Per-row import summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserBulkImportResult'
        '400':
