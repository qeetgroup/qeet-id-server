openapi: 3.1.0
info:
  title: Qeet ID — Authentication & Access API
  version: 0.2.0
  description: |-
    Human authentication, passkeys, MFA, and authorization for Qeet ID.

    ## Start here

    1. Authenticate a user — password login, or passwordless **passkey** login. Passkeys are first-class: a user can exist with no password at all.
    2. Satisfy **MFA** if tenant policy or adaptive risk requires it. A registered passkey satisfies MFA on its own.
    3. Use the returned `Bearer` access token for authenticated calls.
    4. **Signup creates a tenant-less user.** Create a tenant via the Identity Management API before any tenant-scoped call — the creator becomes the tenant owner.
    5. Configure authorization: RBAC is the baseline; layer in ABAC, ReBAC, or AuthZEN as needed.

    ## Authentication

    Auth modes: `bearerAuth` (user/service JWT), `apiKeyAuth` (`Authorization: ApiKey <key>` — legacy scheme), `scimBearer` (per-tenant SCIM token), `clientCredentials` (OAuth M2M), and `ssoCookie` (hosted-login SSO session). CSRF protection applies only to `ssoCookie` sessions; `bearerAuth` requests bypass it.

    ## Related APIs

    - **Identity Management API** — tenants, users, groups, invitations
    - **Federation API** — OIDC/OAuth provider, SAML, SCIM, LDAP, social
    - **Developer API** — API keys, agents, webhooks, vaults
    - **Operations API** — audit, analytics, billing

    ## Contract maintenance

    This document covers routes mounted by internal/bootstrap/router.go. internal/bootstrap/openapi_coverage_test.go walks the production mount helpers and fails when a mounted operation is undocumented, a documented operation is stale, or API-auth security declarations disagree with runtime classification.
servers:
  - url: https://api.id.qeet.in
    description: Production
  - url: http://localhost:4001
    description: Local (make dev)
tags:
  - name: Auth
    description: Login, signup, refresh, sessions, hosted-login SSO cookie.
    externalDocs:
      description: Authentication guide
      url: https://docs.qeet.in/id/authentication
  - name: Passkeys
    description: 'WebAuthn passkey registration and passwordless login. A registered passkey also satisfies MFA on its own.'
  - name: MFA
    description: TOTP and OTP (email/SMS) second factors plus recovery codes.
    externalDocs:
      description: MFA guide
      url: https://docs.qeet.in/id/mfa
  - name: RBAC
    description: Roles, permissions, assignments, and authorization checks.
  - name: ABAC
    description: Attribute-based access control — policy store (CRUD) and the PDP evaluate endpoint.
  - name: ReBAC
    description: 'Relationship-based access control — relationship tuples and graph-based permission checks.'
  - name: AuthZEN
    description: OpenID AuthZEN core evaluation API — a spec-shaped facade over RBAC/ReBAC for external policy-enforcement points.
  - name: Auth Policy
    description: Per-tenant password rules and allowed login methods.
  - name: Policy
    description: Per-tenant security policy.
  - name: IP Rules
    description: Per-tenant IP allow/deny CIDR rules.
  - name: Threats
    description: 'Adaptive threat detection — bot telemetry, risk and bot settings, and login-anomaly review and resolution.'
paths:
  /v1/auth/forgot-password:
    post:
      operationId: post_v1_auth_forgot_password
      description: 'Sends a password-reset link to the supplied email when it belongs to an account. It always returns a neutral confirmation regardless of whether the address exists, so it cannot be used to enumerate accounts, and it is rate limited. Complete the flow with the reset-password call using the token from the emailed link.'
      summary: Forgot password
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                app:
                  type: string
                  enum:
                    - hosted_login
                    - console
                  description: 'Where the reset was requested from. `hosted_login` makes the emailed link open the hosted login''s own reset page. `console`, any other value, or omitting it opens the console''s reset screen (the default).'
                return_to:
                  type: string
                  format: uri
                  description: 'Hosted login only: where to continue after the reset, carried in the emailed link. Kept only if it is this API''s `/oauth/authorize` endpoint; anything else is ignored.'
                tenant_id:
                  type: string
                  format: uuid
                  description: 'Accepted for compatibility with clients that send it, and not used: an email address is unique across the platform.'
      responses:
        '200':
          description: Accepted (always, to avoid account enumeration); returns a neutral confirmation message
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/auth/login:
    post:
      operationId: post_v1_auth_login
      description: 'Authenticates a user by email and password and, on success, returns an access and refresh token pair. If the account has a second factor enrolled, tokens are withheld and a short-lived mfa_token with the available methods is returned instead; exchange it for tokens at the complete-MFA call. Passwordless accounts authenticate through passkey login rather than this endpoint, and a registered passkey satisfies MFA on its own. Requests are rate limited to slow credential stuffing. Failed sign-ins are counted per account and source network, per account across networks, and per source network across accounts (see the sign-in lockout on the create-SSO-session call); a locked account answers 429 auth.account_locked whatever the password, a throttled source 429 too_many_requests, and an address with no account answers exactly like a wrong password. When the account''s own organisation has switched password sign-in off, a correct password is refused with 403 auth.method_disabled. Every sign-in is assessed for risk (bot-like clients, and impossible travel and new devices where the organisation turns them on), and its country and device are kept 90 days for later sign-ins to be compared against. A risky sign-in by someone with no second factor answers an mfa_token challenge met by a code sent to their verified email address (methods [email], the factor named by the challenge''s own id), or 403 auth.risk_verification_unavailable when they have no verified address. While the organisation''s address rules are on, a sign-in from an address they refuse is refused with 403 auth.address_not_allowed before any session is issued; the same holds on every other way of signing in to the organisation (passkey, magic link, social, SAML, LDAP, invitation, organisation switch, application authorization and the device flow).'
      summary: Sign in
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            example:
              email: ada@example.com
              password: corr3ct-h0rse-battery
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: |
            Either a full token pair (no MFA) or an MFA challenge to complete at
            POST /v1/auth/mfa — when the user holds a second factor, or must have
            one (see MFAChallenge).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/TokenPair'
                  - $ref: '#/components/schemas/MFAChallenge'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/SignInUnavailable'
  /v1/auth/mfa:
    post:
      operationId: post_v1_auth_mfa
      summary: Complete MFA login
      description: >-
        Exchanges the mfa_token from /v1/auth/login, plus exactly one proof from the factors the
        challenge listed, for a token pair: a code, a passkey assertion, or an approved push.
        An enrolment challenge is completed instead by a code from the authenticator app set
        up for it (POST /v1/auth/mfa/enroll) — the response then carries the account's new
        recovery codes, shown once — or skipped while its grace period runs. A wrong proof
        counts against the challenge's and the account's attempt budgets.
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - mfa_token
              properties:
                mfa_token:
                  type: string
                code:
                  type: string
                  description: An authenticator-app code, a one-time recovery code, or a code sent to an email or SMS factor (POST /v1/auth/mfa/send).
                passkey:
                  type: object
                  description: An assertion from the passkey ceremony begun for this challenge (POST /v1/auth/mfa/passkey/begin).
                  properties:
                    session_id:
                      type: string
                      format: uuid
                    credential:
                      type: object
                      additionalProperties: true
                push:
                  type: boolean
                  description: >-
                    true to complete with the push request sent for this challenge (POST
                    /v1/auth/mfa/push). Answers 409 mfa.push_pending — not counted as a failed
                    attempt — until it is approved on the device; a denied request counts as a
                    wrong answer, an expired one answers mfa.push_challenge_expired.
                skip:
                  type: boolean
                  description: >-
                    true to put off setting up a second factor, for an enrolment challenge that
                    carries enrollment_due_at; a session is issued without one. Refused with 403
                    mfa.enrollment_required once the grace period has ended. Not counted as an
                    attempt.
      responses:
        '200':
          description: >-
            Second factor verified (or, for an enrolment challenge, set up or put off); token
            pair issued, with recovery_codes when an authenticator app was just set up.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/TokenPair'
                  - type: object
                    properties:
                      recovery_codes:
                        type: array
                        items:
                          type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /v1/auth/mfa/send:
    post:
      operationId: post_v1_auth_mfa_send
      summary: Send a sign-in code
      description: >-
        Sends a code to one of the challenged person's email or SMS factors (factor_id, from the
        challenge's factors), to complete the challenge with. At most five per challenge (429).
        Used by both sign-in flows. For a risky sign-in by someone with no second factor, the challenge's
        one factor is their verified email address, named by the challenge's own id: send its code here
        with factor_id set to the mfa_token, then submit it to complete the challenge. A code to one factor can be sent at most every 30 seconds, ten an hour to one person and five an hour to one address or number over every account; past that the call answers 429 mfa.code_send_limited with retry_after (seconds). A new code makes the factor's earlier unused code stop working. An SMS code needs an organisation whose plan includes SMS (403 upgrade_required). Each code sent is audited as mfa.otp_sent.
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - mfa_token
              properties:
                mfa_token:
                  type: string
                factor_id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  sent:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/auth/mfa/passkey/begin:
    post:
      operationId: post_v1_auth_mfa_passkey_begin
      summary: Begin a passkey second factor
      description: >-
        Starts a passkey assertion for the challenged person's own passkeys; only an assertion
        from this ceremony completes the challenge. Used by both sign-in flows.
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - mfa_token
              properties:
                mfa_token:
                  type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_id:
                    type: string
                    format: uuid
                  publicKey:
                    type: object
                    additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/auth/mfa/push:
    post:
      operationId: post_v1_auth_mfa_push
      summary: Send a push approval request
      description: >-
        Sends a sign-in approval request to the challenged person's push devices; only its
        approval completes the challenge, and only once. Complete with push: true. Used by both
        sign-in flows. Each phone is sent a high-priority push that lives as long as the request can
        be answered (two minutes); a phone the push service reports as no longer having the app is
        retired. When the request reaches none of the person's phones it is closed and the call
        answers 502 mfa.push_delivery_failed, so the person can use another way to verify.
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - mfa_token
              properties:
                mfa_token:
                  type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  expires_at:
                    type: string
                    format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '502':
          description: The request reached none of the person's phones (mfa.push_delivery_failed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/auth/mfa/enroll:
    post:
      operationId: post_v1_auth_mfa_enroll
      summary: Set up an authenticator app to sign in
      description: >-
        For an enrolment challenge — the account must have a second factor and holds none —
        starts an authenticator app and returns its secret and otpauth:// provisioning URL.
        A code from the app then completes the challenge (POST /v1/auth/mfa or
        /v1/auth/session/mfa). Calling again replaces the app not yet confirmed. Refused (400)
        for a challenge that is not an enrolment one; answers mfa challenge expired once the
        account holds a factor. Used by both sign-in flows.
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - mfa_token
              properties:
                mfa_token:
                  type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret:
                    type: string
                  provisioning_url:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/auth/logout:
    post:
      operationId: post_v1_auth_logout
      description: 'Signs the caller out and revokes the session behind the presented credential. The associated refresh token stops working as soon as this returns, so any subsequent authenticated call must start a fresh sign-in. Other active sessions for the same user are unaffected; remove those individually with the session-revocation call, or all at once with the revoke-other-sessions call.'
      summary: Logout
      tags:
        - Auth
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
        description: Request body summarized; see the handler for exact fields.
      responses:
        '200':
          description: Signed out
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/auth/magic-link/consume:
    post:
      operationId: post_v1_auth_magic_link_consume
      description: 'Completes passwordless email sign-in by redeeming the single-use token delivered by the magic-link start call. On success it returns an access and refresh token pair; the token is invalidated once consumed and cannot be replayed. Tokens are short-lived, so an expired or already-used link must be re-requested from the start call. A link from an organisation that has since switched magic links off is refused with 403 auth.method_disabled and stays unused. The link proves the first factor only: when the account holds a second factor, or must have one, the answer is an MFA challenge instead of tokens, completed at POST /v1/auth/mfa (the session then records the method magic_link_mfa). The link is spent either way, so an abandoned or failed challenge leaves no tokens and no link to use again; an expired or used link is refused before any challenge is raised.'
      summary: Magic link consume
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
              properties:
                token:
                  type: string
      responses:
        '200':
          description: A token pair, or an MFA challenge to complete at POST /v1/auth/mfa
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/TokenPair'
                  - $ref: '#/components/schemas/MFAChallenge'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /v1/auth/magic-link/start:
    post:
      operationId: post_v1_auth_magic_link_start
      description: 'Begins passwordless email sign-in by emailing a single-use link to the account holding the address. It answers the same whether or not the address has an account, takes the same minimum time, and sends nothing when it has none. Asked for from an organisation''s sign-in page (tenant_id), it is refused with 403 auth.method_disabled when that organisation has magic links off; from the console (no tenant_id) the account''s own organisation decides, and nothing is sent when it has them off. A link lives for the organisation''s magic_link_ttl_minutes and works once. With app hosted_login the link opens the hosted login''s magic page and, once exchanged at the magic-link session call, continues the sign-in journey at return_to (kept only if it is this service''s authorize endpoint); otherwise it opens the console''s, exchanged at the consume call. Requests are bounded to three per address (then one every five minutes) and ten per caller (then one a minute), counted whether or not the address has an account: 429 past either.'
      summary: Magic link start
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                tenant_id:
                  type: string
                  format: uuid
                  description: The organisation whose sign-in page asks; omitted from the console.
                app:
                  type: string
                  enum: [hosted_login]
                  description: hosted_login opens the link in the hosted login; omitted for the console.
                return_to:
                  type: string
                  description: Hosted login only — where the sign-in journey continues.
      responses:
        '200':
          description: Accepted (always, to avoid account enumeration); returns a neutral confirmation message
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/auth/magic-link/session:
    post:
      operationId: post_v1_auth_magic_link_session
      summary: Magic link — hosted-login session
      description: >-
        Exchanges a magic link issued for the hosted login (app hosted_login)
        for the hosted-login session cookie, and returns where the sign-in
        journey continues (return_to, empty for none). The link works once:
        used, expired or unknown links, and console links, are refused
        (recovery.link_used, recovery.link_expired,
        recovery.magic_link_invalid), and so are links of an organisation that
        has since switched magic links off. When the account holds a second
        factor, or must have one, no cookie is set: the answer is an MFA
        challenge (with return_to) completed at POST /v1/auth/session/mfa — on
        the same terms as the hosted password sign-in, including a trusted
        device (qe_td) skipping it where the organisation allows. The link is
        spent either way.
        A link for an organisation whose address rules refuse the browser's
        address answers 403 auth.address_not_allowed and opens no session.
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
              properties:
                token:
                  type: string
      responses:
        '200':
          description: Signed in to the hosted login (the cookie is set), or an MFA challenge to complete first
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      user_id:
                        type: string
                        format: uuid
                      return_to:
                        type: string
                  - allOf:
                      - $ref: '#/components/schemas/MFAChallenge'
                      - type: object
                        properties:
                          return_to:
                            type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/auth/magic-link/resend:
    post:
      operationId: post_v1_auth_magic_link_resend
      summary: Magic link — send a new one
      description: >-
        Sends a new sign-in link in place of the one a token names — used,
        expired or not — to the same address, opening in the same place and
        continuing the same journey, so the user need not type the address
        again. Answers the same whatever the token names, and is bounded like
        the start call (429).
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
              properties:
                token:
                  type: string
      responses:
        '200':
          description: A neutral confirmation message
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/auth/me:
    get:
      operationId: get_v1_auth_me
      description: 'Returns the principal resolved from the presented credential, including the user, tenant, and session identifiers, the actor type, and granted scopes. Use it to confirm who the current credential authenticates as and which tenant it is scoped to. A tenant-less principal reports a null tenant until one is selected with the switch-tenant call.'
      summary: Me
      tags:
        - Auth
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        '200':
          description: Current principal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Principal'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/auth/refresh:
    post:
      operationId: post_v1_auth_refresh
      description: 'Exchanges a valid refresh token for a new access and refresh token pair. The presented refresh token is rotated and invalidated, so each token may be redeemed only once; persist the returned refresh token for the next rotation. A revoked or already-rotated token is rejected and forces a fresh sign-in. A session ends by itself at its maximum age however active it is, and once it goes longer than its idle timeout without a renewal; each renewal restarts the idle timeout, and the response says when the session ends either way (session_expires_at, idle_expires_at). A renewal after either is refused with 401 auth.session_timed_out and the session ends, recorded as an expiry and announced to session.revoked subscribers with the reason expired. A renewal from an address the organisation''s address rules refuse answers 403 auth.address_not_allowed; the session stays, and renews again from an allowed address.'
      summary: Refresh
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Rotated token pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /v1/auth/reset-password:
    post:
      operationId: post_v1_auth_reset_password
      description: 'Completes the password-reset flow started by the forgot-password call by consuming the emailed token and setting the new password. The token is single-use and time-limited, so an expired or already-redeemed token is rejected. The new password is checked against the rules of the organisation the account belongs to (the platform baseline of 8 characters for an account with no organisation), the offline strength baseline and, when enabled, the breached-password check; a refusal is a 422 naming the rule that failed and leaves the password and the token unchanged. On success the password is updated and the user can sign in with the new credentials.'
      summary: Reset password
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
                - new_password
              properties:
                token:
                  type: string
                new_password:
                  type: string
                  minLength: 8
                  maxLength: 256
      responses:
        '200':
          description: Password reset; returns a confirmation message
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /v1/auth/session:
    delete:
      operationId: delete_v1_auth_session
      description: 'Signs the browser out of the hosted login: ends the hosted-login SSO session behind the qe_ls cookie and what it started — the refresh grants applications received through it are revoked and its unredeemed authorization codes can no longer be redeemed — then clears the cookie. The sign-out is recorded in the audit log (auth.signed_out). Other browsers, bearer-token API sessions and grants started elsewhere are unaffected; sign API sessions out with the logout call, or everything with sign out everywhere. Without a session cookie nothing is ended and the response is the same. If the sign-out cannot be completed an error is returned and the cookie kept, so it can be retried. Access tokens already issued stay valid until they expire.'
      summary: Destroy SSO session (logout)
      tags:
        - Auth
      security: []
      responses:
        '204':
          description: Signed out (or there was no session to end), cookie cleared
    post:
      operationId: post_v1_auth_session
      description: 'Establishes a hosted-login SSO session and sets the HttpOnly qe_ls cookie so the browser can continue into the OAuth authorize and consent flow. When the account has a second factor enrolled, no cookie is set yet and a short-lived mfa_token is returned; complete it at the session-MFA call before the cookie is issued. Because this is a cookie session, later state-changing calls made with it are subject to CSRF protection. End the session with the corresponding destroy-session call.


        Sign-in lockout: failed password sign-ins are counted per account and source network (the client IP behind the trusted proxies; an IPv4 address or an IPv6 /64). Reaching the threshold within the window locks the account for that network for the lock duration, so a stranger on another network cannot lock the owner out. The threshold, window and duration are those of the tenant of the OAuth client named by `client_id` (its authentication policy), or the platform defaults when no client is named. Failures from any mix of networks also lock the account everywhere at a looser cap (the threshold times LOGIN_LOCKOUT_ACCOUNT_MULTIPLIER), and a source network that fails against too many distinct accounts (LOGIN_SPRAY_ACCOUNTS within LOGIN_SPRAY_WINDOW) is refused password sign-in for LOGIN_SPRAY_BLOCK. An address with no account is counted and answered exactly like a wrong password. When the counters cannot be read or written the sign-in is refused with 503 auth.sign_in_unavailable (fail closed). When the organisation of the named client_id has switched password sign-in off, the request is refused with 403 auth.method_disabled before any password is checked (the same answer for any account or none); without a client_id, the account''s own organisation decides once the password is verified. While the address rules of that client''s organisation are on, an address they refuse is answered 403 auth.address_not_allowed before any password is checked, and no cookie is set.'
      summary: Create SSO session
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionRequest'
      responses:
        '200':
          description: |
            Either the SSO cookie was set (`{user_id}`) or an MFA challenge to
            complete at POST /v1/auth/session/mfa — when the user holds a second
            factor, or must have one (see MFAChallenge). No cookie is set until
            then.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      user_id:
                        type: string
                        format: uuid
                  - $ref: '#/components/schemas/MFAChallenge'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          description: The account is locked for this network or everywhere (`auth.account_locked`), or the source network is throttled for spraying (`too_many_requests`). The same answer whatever the password and whether the address has an account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/SignInUnavailable'
  /v1/auth/session/mfa:
    post:
      operationId: post_v1_auth_session_mfa
      summary: Complete SSO session MFA
      description: >-
        Exchanges the mfa_token from POST /v1/auth/session, plus exactly one proof from the
        factors the challenge listed (a code, a passkey assertion, or an approved push — as for
        POST /v1/auth/mfa), for the SSO cookie (qe_ls). An enrolment challenge is completed by
        a code from the authenticator app set up for it, or skipped while its grace period
        runs, as for POST /v1/auth/mfa; a skipped setup never remembers the device.
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - mfa_token
              properties:
                mfa_token:
                  type: string
                code:
                  type: string
                  description: An authenticator-app code, a one-time recovery code, or a code sent to an email or SMS factor (POST /v1/auth/mfa/send).
                passkey:
                  type: object
                  description: An assertion from the passkey ceremony begun for this challenge (POST /v1/auth/mfa/passkey/begin).
                  properties:
                    session_id:
                      type: string
                      format: uuid
                    credential:
                      type: object
                      additionalProperties: true
                push:
                  type: boolean
                  description: >-
                    true to complete with the push request sent for this challenge (POST
                    /v1/auth/mfa/push). Answers 409 mfa.push_pending — not counted as a failed
                    attempt — until it is approved on the device; a denied request counts as a
                    wrong answer, an expired one answers mfa.push_challenge_expired.
                skip:
                  type: boolean
                  description: >-
                    true to put off setting up a second factor, for an enrolment challenge that
                    carries enrollment_due_at; a session is issued without one. Refused with 403
                    mfa.enrollment_required once the grace period has ended. Not counted as an
                    attempt.
                remember:
                  type: boolean
                  description: >-
                    Trust this device so future logins can skip the second factor (adaptive MFA). Honoured only when the tenant has enabled remember-device; sets the qe_td cookie.
      responses:
        '200':
          description: >-
            Second factor verified (or set up, or put off); SSO cookie set. recovery_codes are
            the account's new recovery codes when an authenticator app was just set up.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id:
                    type: string
                    format: uuid
                  recovery_codes:
                    type: array
                    items:
                      type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /v1/auth/register:
    post:
      operationId: post_v1_auth_register
      summary: Register (hosted, B2C)
      description: |
        Creates a new end-user in the client's tenant and sets the SSO cookie
        (qe_ls) so they continue into the OAuth authorize flow. Where the tenant
        requires MFA, no cookie is set: the response is an enrolment challenge
        (with user_id) to complete at POST /v1/auth/session/mfa once an
        authenticator app is set up. Gated by the
        tenant's self_registration_enabled policy (403 when disabled). The
        password must meet that tenant's password rules (422 naming the rule
        that failed). Enumeration-safe: an existing email returns a neutral 422.

        An address the organisation's address rules refuse answers 403
        auth.address_not_allowed, and no account is created.
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - tenant_id
                - email
                - password
              properties:
                tenant_id:
                  type: string
                  format: uuid
                email:
                  type: string
                  format: email
                password:
                  type: string
                display_name:
                  type: string
      responses:
        '201':
          description: User created; SSO cookie set, or an enrolment challenge returned
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      user_id:
                        type: string
                        format: uuid
                  - allOf:
                      - $ref: '#/components/schemas/MFAChallenge'
                      - type: object
                        properties:
                          user_id:
                            type: string
                            format: uuid
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/auth/sign-in-methods:
    get:
      operationId: get_v1_auth_sign_in_methods
      summary: My ways to sign in
      tags:
        - Auth
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      description: >-
        How many ways the caller's account can sign in: its password, each
        passkey, and each linked identity that can still sign in (a SAML or
        directory link, a social provider its organisation has switched on, or
        a social account connected to the console account). Resetting a
        password by email is recovery and is not counted. Removing the last
        way — a passkey, a connected account, or an administrator unlinking an
        identity — is refused with 409 auth.last_sign_in_method and recorded
        (auth.sign_in_method_removal_refused); use total to disable or explain
        that action first.
      responses:
        '200':
          description: The counts
          content:
            application/json:
              schema:
                type: object
                properties:
                  password:
                    type: boolean
                  passkeys:
                    type: integer
                  linked_identities:
                    type: integer
                  total:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/auth/password:
    get:
      operationId: get_v1_auth_password
      summary: Password status
      description: Reports whether the caller has a password set, so the account UI can offer "set a password" (social/passkey accounts) vs "change password".
      tags:
        - Auth
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  has_password:
                    type: boolean
                required:
                  - has_password
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: post_v1_auth_password
      summary: Change or set my password
      description: Rotates (or sets) the signed-in user's password. current_password is required only when one is already set; a social/passkey account may set one by omitting it. Other sessions are revoked. The new password must meet the rules of the organisation the account belongs to (not the session's tenant; the platform baseline of 8 characters for an account with no organisation), the offline strength baseline and, when enabled, the breached-password check; a refusal is a 422 naming the rule that failed. Self-service.
      tags:
        - Auth
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                current_password:
                  type: string
                new_password:
                  type: string
                  minLength: 8
                  maxLength: 256
              required:
                - current_password
                - new_password
      responses:
        '200':
          description: Password updated
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/auth/trusted-devices:
    get:
      operationId: get_v1_auth_trusted_devices
      summary: List my remembered devices
      description: >-
        Lists the caller's own remembered devices, in every organisation, newest first: each device skips the second factor at sign-in until it expires or is forgotten. A device is remembered for its organisation's remember_device_days after the sign-in that remembered it, and is forgotten when its owner changes their password, signs out everywhere, or has their factors reset.
      tags:
        - Auth
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        tenant_id:
                          type: string
                          format: uuid
                          nullable: true
                          description: The organisation the device was remembered in.
                        device:
                          type: string
                          description: The device and browser in words, such as "Chrome on macOS".
                        device_kind:
                          type: string
                          enum: [desktop, mobile, tablet, unknown]
                        user_agent:
                          type: string
                        created_at:
                          type: string
                          format: date-time
                        last_used_at:
                          type: string
                          format: date-time
                          nullable: true
                          description: When the device last skipped the second factor.
                        expires_at:
                          type: string
                          format: date-time
                        current:
                          type: boolean
                          description: The request came from this device.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      operationId: delete_v1_auth_trusted_devices
      summary: Forget all my remembered devices
      description: >-
        Forgets every device the caller has remembered, so each is asked for the second factor at its next sign-in. Each is audited as auth.trusted_device_revoked.
      tags:
        - Auth
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  forgotten:
                    type: integer
                    description: How many devices were forgotten.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/auth/trusted-devices/{id}:
    delete:
      operationId: delete_v1_auth_trusted_devices_ById
      summary: Forget one of my remembered devices
      description: >-
        Forgets one of the caller's remembered devices, so it is asked for the second factor at its next sign-in. 404 for a device that is not the caller's. Audited as auth.trusted_device_revoked.
      tags:
        - Auth
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  forgotten:
                    type: integer
                    description: How many devices were forgotten.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/auth/trusted-devices/count:
    get:
      operationId: get_v1_auth_trusted_devices_count
      summary: Count trusted devices
      tags:
        - Auth
      description: >-
        Number of live trusted devices in the caller's tenant, as used by the
        Authentication overview. Counts devices, not users, and excludes expired
        rows — an expired device is no longer trusted. Tenant scope comes from
        the principal, never a parameter. Returns 0 for tenants that have not
        enabled adaptive MFA (`remember_device_enabled`), since nothing writes a
        trusted device until then.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        '200':
          description: Live trusted-device count
          content:
            application/json:
              schema:
                type: object
                required: [devices, users]
                properties:
                  devices:
                    type: integer
                    minimum: 0
                    description: Live trusted devices (one browser cookie = one device).
                  users:
                    type: integer
                    minimum: 0
                    description: Distinct people those devices belong to.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/auth/sessions:
    get:
      operationId: get_v1_auth_sessions
      description: 'Lists the caller''s own active sessions, each with its device, address, and timestamp metadata, for review in account security settings. Results are cursor-paginated: pass the returned next_cursor to fetch the following page until has_more is false. Terminate any listed session individually with the session-revocation call, or every session except the current one with the revoke-other-sessions call.'
      summary: List sessions
      tags:
        - Auth
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Opaque owner-scoped cursor returned by the previous page.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        '200':
          description: Active sessions
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Session'
                  next_cursor:
                    type: string
                    description: Opaque owner-scoped cursor for the next page; omitted on the final page.
                  has_more:
                    type: boolean
                  total:
                    type: integer
                    minimum: 0
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/auth/sessions/revoke-others:
    post:
      operationId: post_v1_auth_sessions_revokeOthers
      summary: Revoke all other sessions
      description: >-
        Ends every one of the caller's sessions except the one they are using,
        in a single all-or-nothing step, and returns how many were ended. The
        session that is kept is the one behind the presented access token; the
        request takes no body and no session identifiers. Refresh tokens of the
        ended sessions stop working as soon as this returns, but access tokens
        already issued to them stay valid until they expire (minutes), so do not
        present this as an instant cut-off. Succeeds with `revoked: 0` when
        there is no other session. If any session cannot be ended the call fails
        and none are ended. Returns 401 `auth.session_revoked` when the caller's
        own session has already ended. Sessions in hosted login and tokens held
        by applications are not affected; the sign-out-everywhere call ends
        those too.
      tags:
        - Auth
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        '200':
          description: The other sessions were ended
          content:
            application/json:
              schema:
                type: object
                required: [revoked]
                properties:
                  revoked:
                    type: integer
                    minimum: 0
                    description: Number of sessions ended by this call; 0 when there were none.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/auth/sessions/revoke-all:
    post:
      operationId: post_v1_auth_sessions_revokeAll
      summary: Sign out everywhere
      description: >-
        Signs the caller out everywhere in a single all-or-nothing step and
        reports how many sign-ins ended. It ends every one of the caller's
        sessions, including the one behind the presented access token; every
        hosted-login (browser) session, so the next authorization asks the
        person to sign in again; and every refresh grant held by applications
        the person signed in to. The response also clears the hosted-login
        cookie for a browser that calls directly. The request takes no body.
        Refresh tokens and application grants stop working as soon as this
        returns, but access tokens already issued stay valid until they expire
        (minutes), so do not present this as an instant cut-off everywhere. The
        presented access token must belong to one of the caller's own sessions
        (an application's access token is refused with 401). Repeating the call
        succeeds with every count at 0 and changes nothing. If anything cannot
        be ended the call fails and nothing is ended. To keep the current
        session, use the revoke-other-sessions call instead.
      tags:
        - Auth
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        '200':
          description: The caller was signed out everywhere
          headers:
            Set-Cookie:
              description: Clears the hosted-login cookie (`qe_ls`).
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [revoked, sessions, hosted_login_sessions, app_grants, trusted_devices, pending_authorizations]
                properties:
                  revoked:
                    type: integer
                    minimum: 0
                    description: Number of sign-ins ended by this call, all places together; 0 when there were none.
                  sessions:
                    type: integer
                    minimum: 0
                    description: Sessions ended, the current one included.
                  hosted_login_sessions:
                    type: integer
                    minimum: 0
                    description: Hosted-login browser sessions ended.
                  app_grants:
                    type: integer
                    minimum: 0
                    description: Application refresh grants ended.
                  trusted_devices:
                    type: integer
                    minimum: 0
                    description: Devices remembered to skip the second factor that were forgotten; each is asked for the second factor at its next sign-in.
                  pending_authorizations:
                    type: integer
                    minimum: 0
                    description: Unredeemed authorisation codes spent, and device or back-channel sign-in requests (pending, or approved but not collected) denied.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/auth/sessions/{id}:
    delete:
      operationId: delete_v1_auth_sessions_ById
      description: 'Revokes a single session belonging to the caller by its identifier. The session''s refresh token stops working as soon as this returns, forcing that device to sign in again, while the caller''s other sessions are left intact. Enumerate session identifiers first with the list-sessions call.'
      summary: Revoke session
      tags:
        - Auth
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        '200':
          description: Session revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/auth/signup:
    post:
      operationId: post_v1_auth_signup
      description: 'Registers a new user from an email and password and returns a token pair alongside the created user record. The password must meet the platform baseline (8 characters), the offline strength baseline and, when enabled, the breached-password check (422 naming the rule that failed). The new user is tenant-less: no tenant is created here, so the returned token carries no tenant scope. Create a tenant through the Identity Management API before any tenant-scoped call, after which the creator becomes the tenant owner. A duplicate email is rejected, and the endpoint is rate limited.'
      summary: Sign up
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            example:
              email: ada@example.com
              password: corr3ct-h0rse-battery
              display_name: Ada Lovelace
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '201':
          description: Created; token pair + user
          content:
            application/json:
              example:
                access_token: eyJhbGciOiJFUzI1NiIsImtpZCI6ImsxIn0.eyJzdWIiOiIwMThmMmE3MCJ9.FAKE-signature
                token_type: Bearer
                expires_at: '2026-09-24T11:15:00Z'
                refresh_token: rt_2b9f4c7a1e6d8035b4c2a1908f7e6d5c
                session_id: 018f2a70-5b6c-7d8e-9f01-2a3b4c5d6e7f
                user_id: 018f2a70-1a2b-7c3d-9e4f-5a6b7c8d9e0f
              schema:
                $ref: '#/components/schemas/SignupResponse'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/auth/switch-tenant:
    post:
      operationId: post_v1_auth_switch_tenant
      description: 'Replaces the caller''s session with one scoped to another tenant they belong to and returns its token pair. The new access token carries the claims the target tenant''s authentication hook adds, and renewals keep them; the hook may also refuse the switch. The session the presented access token belongs to ends: its refresh token is refused from now on, its access token stays valid only until it expires, and the tenant''s session.revoked subscribers are notified with reason tenant_switch. Use the returned pair from now on. The caller''s session list shows the one sign-in, not one entry per switch. Refused, with nothing changed: a tenant the caller does not belong to (403), a refusal by the tenant''s hook, an address the tenant''s address rules refuse (403 auth.address_not_allowed), or an access token whose session has already ended (401). Confirm the active scope afterward with the current-principal call.'
      summary: Switch tenant
      tags:
        - Auth
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - tenant_id
              properties:
                tenant_id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Token pair scoped to the target tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
