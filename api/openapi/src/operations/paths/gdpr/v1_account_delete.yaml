post:
  operationId: deleteMyAccount
  description: >-
    Immediately erases the authenticated user's account and revokes all of their
    sessions, exercising the right to erasure: the account is redacted and
    everything else it left is deleted, as POST /v1/gdpr/purge describes. When
    the account has a password, the current password must be supplied in the
    body to re-prove identity before this irreversible action; password-less
    accounts are authorized by the session alone. Audit references are retained
    in redacted form so the hash-chained log stays verifiable, and the client
    should sign the user out afterward.
  summary: Delete the authenticated user's account
  tags:
    - GDPR
  security:
    - bearerAuth: []
  requestBody:
    required: false
    content:
      application/json:
        schema:
          type: object
          additionalProperties: false
          properties:
            password:
              type:
                - string
                - "null"
              description: The account password, required when the account has one; a password-less account sends none.
  responses:
    "204":
      description: Account data erased and sessions revoked
    "400":
      $ref: ../../../shared/responses/BadRequest.yaml
    "401":
      $ref: ../../../shared/responses/Unauthorized.yaml
    "403":
      $ref: ../../../shared/responses/Forbidden.yaml
    "413":
      $ref: ../../../shared/responses/PayloadTooLarge.yaml
    "429":
      $ref: ../../../shared/responses/TooManyRequests.yaml
    "503":
      $ref: ../../../shared/responses/Overloaded.yaml
