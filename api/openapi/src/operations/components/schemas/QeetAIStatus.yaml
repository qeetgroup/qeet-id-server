type: object
description: The organization's Qeet AI state. Never contains key material.
required:
  - configured
  - available
  - source
properties:
  configured:
    type: boolean
    description: >-
      True when a provider key applies: the organization's own, or the
      platform's.
  available:
    type: boolean
    description: >-
      True when the assistant may be used: always with the organization's own
      key, and with the platform's only while the organization's plan includes
      Qeet AI.
  source:
    type: string
    enum:
      - organization
      - platform
      - none
    description: >-
      Whose key applies: organization (the organization's own provider key),
      platform (the deployment's), or none.
  provider:
    type: string
    description: >-
      Provider name (e.g. "anthropic"); empty when not configured, and absent
      when the caller has no organization or its settings can't be read.
  model:
    type: string
    description: >-
      Model identifier (e.g. "claude-sonnet-5"); empty when not configured, and
      absent as provider is.
