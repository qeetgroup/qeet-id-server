type: object
required:
  - base_dn
  - bind_dn
  - created_at
  - email_attribute
  - id
  - last_login_at
  - name
  - name_attribute
  - server_url
  - skip_tls_verify
  - start_tls
  - status
  - sync_interval_minutes
  - organization_id
  - updated_at
  - user_filter
properties:
  base_dn:
    type: string
  bind_dn:
    type: string
  created_at:
    type: string
    format: date-time
  email_attribute:
    type: string
  id:
    type: string
    format: uuid
  last_login_at:
    type:
      - string
      - "null"
    format: date-time
  name:
    type: string
  name_attribute:
    type: string
  server_url:
    type: string
  skip_tls_verify:
    type: boolean
  start_tls:
    type: boolean
  status:
    type: string
  sync_interval_minutes:
    type: integer
    minimum: 5
    maximum: 60
    description: >-
      How often, in minutes, the scheduled sync reads the directory (15 unless
      set). Each run reads the people changed since the last (uSNChanged in
      Active Directory, modifyTimestamp elsewhere), and once a day every
      person. Someone the directory disabled, deleted or no longer matches by
      the user filter is suspended and every way they sign in ends; group
      changes reach their groups through the connection's group mappings. A
      run that fails, or whose answer looks incomplete, changes nothing and is
      reported to the people who manage directory connections.
  organization_id:
    type: string
    format: uuid
  updated_at:
    type: string
    format: date-time
  user_filter:
    type: string
