get:
  operationId: listRelationObjects
  summary: List relationship objects
  description: >-
    Lists, a page at a time by id, the objects of one type the organization's
    relationship tuples name, each with how many tuples it has; next_cursor
    fetches the next page and total counts them all. Requires role.read.
  tags:
    - ReBAC
  parameters:
    - $ref: ../../../shared/parameters/OrganizationID.yaml
    - name: type
      in: query
      required: true
      description: The type of object, such as document.
      schema:
        type: string
    - name: limit
      in: query
      required: false
      description: Page size, 1 to 500; 100 by default.
      schema:
        type: integer
        minimum: 1
        maximum: 500
    - name: cursor
      in: query
      required: false
      description: The next_cursor of the previous page.
      schema:
        type: string
  security:
    - bearerAuth: []
    - apiKeyAuth: []
  responses:
    '200':
      description: Objects
      content:
        application/json:
          schema:
            type: object
            required:
              - items
              - total
            properties:
              items:
                type: array
                items:
                  type: object
                  required:
                    - object
                    - id
                    - tuples
                  properties:
                    object:
                      type: string
                      description: '"type:id"'
                    id:
                      type: string
                    tuples:
                      type: integer
              next_cursor:
                type: string
                description: Present when there is another page.
              total:
                type: integer
    '400':
      $ref: ../../../shared/responses/BadRequest.yaml
    '401':
      $ref: ../../../shared/responses/Unauthorized.yaml
    '403':
      $ref: ../../../shared/responses/Forbidden.yaml
